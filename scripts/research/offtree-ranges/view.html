<style>
/* Layout: the study dashboard's chrome (sticky bar, cards) and the Stress 500 replayer's node view — a node list on
   the left, the exact node on the right with one 13x13 grid per belief. Tokens copied from dashboard.css. */
:root {
  color-scheme: light;
  --bg: #F2F4F1; --surface: #FFFFFF; --surface2: #E9EDE9; --surface3: #DEE4DF;
  --line: #D6DDD7; --grid: #E3E8E3; --ink: #1A2320; --muted: #5F6D65; --faint: #8A968E;
  --win: #1F7A4D; --win-soft: rgba(31,122,77,.12);
  --ev: #C4861A; --ev-soft: rgba(196,134,26,.14);
  --loss: #B8433A; --loss-soft: rgba(184,67,58,.12);
  --info: #2F6FB3; --info-soft: rgba(47,111,179,.12);
  --chip: #E4EAE5;
  --shadow: 0 1px 2px rgba(20,30,25,.06), 0 8px 20px rgba(20,30,25,.06);
  --s-soft: #2a78d6; --s-qre: #eb6834; --s-pool: #1baf7a; --s-hyb: #9a7a00; --s-pre: #8A968E;
  --cat0: #d7e5f6; --cat1: #a9c8ee; --cat2: #6a9fe0; --cat3: #2a78d6; --cat4: #17488a;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-head: Sora, "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  color-scheme: dark;
  --bg: #121715; --surface: #1B211E; --surface2: #242B27; --surface3: #2B3330;
  --line: #2E3733; --grid: #273029; --ink: #E7ECE8; --muted: #9AA69E; --faint: #6E7A72;
  --win: #4CC382; --win-soft: rgba(76,195,130,.14); --ev: #E5AE4A; --ev-soft: rgba(229,174,74,.16);
  --loss: #E0675C; --loss-soft: rgba(224,103,92,.16); --info: #6FA8E6; --info-soft: rgba(111,168,230,.16);
  --chip: #262E29; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 20px rgba(0,0,0,.35);
  --s-soft: #3987e5; --s-qre: #d95926; --s-pool: #199e70; --s-hyb: #c98500; --s-pre: #6E7A72;
  --cat0: #22344d; --cat1: #2c5287; --cat2: #3987e5; --cat3: #7aaff0; --cat4: #c4dbf8;
} }
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121715; --surface: #1B211E; --surface2: #242B27; --surface3: #2B3330;
  --line: #2E3733; --grid: #273029; --ink: #E7ECE8; --muted: #9AA69E; --faint: #6E7A72;
  --win: #4CC382; --win-soft: rgba(76,195,130,.14); --ev: #E5AE4A; --ev-soft: rgba(229,174,74,.16);
  --loss: #E0675C; --loss-soft: rgba(224,103,92,.16); --info: #6FA8E6; --info-soft: rgba(111,168,230,.16);
  --chip: #262E29; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 20px rgba(0,0,0,.35);
  --s-soft: #3987e5; --s-qre: #d95926; --s-pool: #199e70; --s-hyb: #c98500; --s-pre: #6E7A72;
  --cat0: #22344d; --cat1: #2c5287; --cat2: #3987e5; --cat3: #7aaff0; --cat4: #c4dbf8;
}
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font: 14px/1.45 var(--font-body); background: var(--bg); color: var(--ink); }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-block: 10px; padding-inline: 16px; }
header h1 { font-family: var(--font-head); font-weight: 600; font-size: 16px; margin: 0; white-space: nowrap; }
.sub { color: var(--muted); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
nav.tabs { display: flex; flex-wrap: wrap; gap: 4px; flex: 1 1 auto; }
nav.tabs a { padding: 5px 11px; border-radius: 8px; color: var(--muted); text-decoration: none; font-size: 13.5px; }
nav.tabs a.on { background: var(--ink); color: var(--bg); }
nav.tabs a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
.seg { display: inline-flex; background: var(--surface2); border-radius: 8px; padding: 2px; }
.seg button { font: inherit; font-size: 12.5px; border: 0; background: none; color: var(--muted); padding: 4px 9px; border-radius: 6px; cursor: pointer; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
main { padding-block: 16px 48px; padding-inline: 16px; max-width: 1480px; margin: 0 auto; }
section[hidden] { display: none; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; box-shadow: var(--shadow); min-width: 0; }
h2 { font-family: var(--font-head); font-weight: 600; font-size: 15px; margin: 0 0 8px; text-wrap: balance; }
h3 { font-family: var(--font-head); font-weight: 600; font-size: 13.5px; margin: 14px 0 6px; }
p { margin: 6px 0; max-width: 78ch; }
.lead { font-size: 15.5px; max-width: 82ch; }
.stack { display: grid; gap: 14px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.stat { background: var(--surface2); border-radius: 10px; padding: 10px 12px; }
.stat b { display: block; font-family: var(--font-head); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12.5px; color: var(--muted); }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; letter-spacing: .02em; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 6px 8px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.best { font-weight: 700; }
.ci { display: block; font-size: 11px; color: var(--faint); }
.pill { display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 99px; background: var(--chip); color: var(--ink); white-space: nowrap; }
.pill.good { background: var(--win-soft); color: var(--win); }
.pill.bad { background: var(--loss-soft); color: var(--loss); }
.pill.warn { background: var(--ev-soft); color: var(--ev); }
.pill.info { background: var(--info-soft); color: var(--info); }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 14px; }
@media (max-width: 520px) { .two { grid-template-columns: 1fr; } }
/* composition bars */
.comp-row { display: grid; grid-template-columns: 104px 1fr; gap: 8px; align-items: center; margin: 3px 0; font-size: 12.5px; }
.comp-bar { display: flex; height: 16px; gap: 2px; }
.comp-bar i { display: block; height: 100%; min-width: 0; }
.comp-bar i:first-child { border-radius: 4px 0 0 4px; } .comp-bar i:last-child { border-radius: 0 4px 4px 0; }
.comp-row.real span { font-weight: 700; }
/* nodes */
.replay { display: grid; grid-template-columns: minmax(320px, .8fr) minmax(0, 1.6fr); gap: 14px; align-items: start; }
@media (max-width: 1100px) { .replay { grid-template-columns: 1fr; } }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.filters select, .filters input { font: inherit; font-size: 13px; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface2); color: var(--ink); min-width: 0; }
.filters input { flex: 1 1 140px; }
.nl { max-height: 78vh; overflow: auto; }
.nl-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 7px 8px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
.nl-row:hover { background: var(--surface2); }
.nl-row.on { border-color: var(--ink); background: var(--surface2); }
.nl-row .t { font-weight: 600; font-size: 13px; }
.nl-row .m { font-size: 12px; color: var(--muted); grid-column: 1 / -1; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; min-width: 0; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.act { font-size: 12px; padding: 3px 8px; border-radius: 6px; background: var(--surface2); font-family: var(--font-mono); }
.act.taken { background: var(--loss-soft); color: var(--loss); outline: 1px solid var(--loss); }
.grids { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; margin-top: 10px; }
.gcard { border: 1px solid var(--line); border-radius: 10px; padding: 10px; min-width: 0; }
.gcard.today { border-color: var(--s-qre); }
.gcard h4 { margin: 0; font-size: 13px; font-family: var(--font-head); font-weight: 600; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.gcard .cmb { font-family: var(--font-mono); font-size: 13px; }
.gcard .note { font-size: 11.5px; color: var(--muted); margin: 2px 0 6px; min-height: 2.6em; }
.grid169 { display: grid; grid-template-columns: repeat(13, 20px); gap: 2px; margin-top: 6px; }
.grid169 div { width: 20px; height: 17px; font-size: 8px; display: flex; align-items: center; justify-content: center; border-radius: 3px; font-family: var(--font-mono);
  color: #fff; text-shadow: 0 0 2px rgba(0,0,0,.6); }
.grid169 div.off { color: rgba(255,255,255,.28); text-shadow: none; }
.grid169 div.real { outline: 2px solid var(--ev); z-index: 1; }
.cards { font-family: var(--font-mono); font-weight: 600; letter-spacing: .5px; }
.suit-h, .suit-d { color: var(--loss); }
#tip { position: fixed; z-index: 50; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font-size: 12px; box-shadow: var(--shadow); max-width: 260px; }
.chart svg text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.chart svg .ax { stroke: var(--line); }
.chart svg .gl { stroke: var(--grid); }
.callout { border-left: 3px solid var(--info); padding: 6px 12px; background: var(--info-soft); border-radius: 0 8px 8px 0; }
ol, ul { padding-left: 20px; margin: 6px 0; } li { margin: 3px 0; max-width: 80ch; }
code { font-family: var(--font-mono); font-size: 12.5px; background: var(--surface2); padding: 0 4px; border-radius: 4px; }
@media (max-width: 520px) { .grid169 { grid-template-columns: repeat(13, 19px); } .grid169 div { width: 19px; height: 16px; font-size: 7px; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<header>
  <h1>Off-tree villain ranges <span class="sub" style="font-weight:400;font-family:var(--font-body)">· option 3 measurement · 2026-10-06</span></h1>
  <nav class="tabs" id="tabs">
    <a href="#findings" data-t="findings">Findings</a>
    <a href="#nodes" data-t="nodes">Nodes</a>
    <a href="#thin" data-t="thin">Thin states</a>
    <a href="#method" data-t="method">Method &amp; proposal</a>
  </nav>
  <div class="seg" id="themeSeg" role="group" aria-label="Theme"><button data-t="">Auto</button><button data-t="light">Light</button><button data-t="dark">Dark</button></div>
</header>
<main>
<section id="s-findings" class="stack"></section>
<section id="s-nodes" hidden></section>
<section id="s-thin" class="stack" hidden></section>
<section id="s-method" class="stack" hidden></section>
</main>
<div id="tip" hidden></div>
<script type="application/json" id="data">/*DATA*/</script>
<script>
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (x) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[x]));
const fmt = (x, d = 2) => x == null || !isFinite(x) ? "–" : (x >= 0 ? "+" : "−") + Math.abs(x).toFixed(d);
const pct = (x, d = 1) => x == null ? "–" : (100 * x).toFixed(x < 0.001 ? 3 : x < 0.01 ? 2 : d) + "%";
const cmb = (x) => x == null ? "–" : x >= 100 ? x.toFixed(0) : x >= 10 ? x.toFixed(1) : x >= 0.1 ? x.toFixed(2) : x >= 0.001 ? x.toFixed(3) : x.toExponential(1);
const cardsHtml = (s) => (String(s || "").match(/[2-9TJQKA][cdhs]/gi) || []).map((c) => `<span class="suit-${c[1].toLowerCase()}">${c[0].toUpperCase()}${{ c: "♣", d: "♦", h: "♥", s: "♠" }[c[1].toLowerCase()]}</span>`).join("");
const MODELS = [
  { k: "qre", name: "QRE (today)", col: "var(--s-qre)" },
  { k: "pre", name: "Pre-action", col: "var(--s-pre)" },
  { k: "soft", name: "Soft (option 3)", col: "var(--s-soft)" },
  { k: "pool", name: "Pool (option 2)", col: "var(--s-pool)" },
  { k: "hybrid", name: "Pool × soft", col: "var(--s-hyb)" },
];
const CATS = D.catNames;
const CATCOL = ["var(--cat0)", "var(--cat1)", "var(--cat2)", "var(--cat3)", "var(--cat4)"];

/* ---------- theme + tabs ---------- */
(function () {
  let t = ""; try { t = localStorage.getItem("ot-theme") || ""; } catch (e) {}
  const apply = (v) => { if (v) document.documentElement.dataset.theme = v; else delete document.documentElement.dataset.theme;
    document.querySelectorAll("#themeSeg button").forEach((b) => b.classList.toggle("on", b.dataset.t === v)); };
  apply(t);
  $("themeSeg").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; apply(b.dataset.t); try { localStorage.setItem("ot-theme", b.dataset.t); } catch (e) {} });
})();
function showTab() {
  const t = (location.hash || "#findings").slice(1);
  const known = ["findings", "nodes", "thin", "method"];
  const tab = known.includes(t) ? t : "findings";
  for (const k of known) $("s-" + k).hidden = k !== tab;
  document.querySelectorAll("#tabs a").forEach((a) => a.classList.toggle("on", a.dataset.t === tab));
}
window.addEventListener("hashchange", showTab);

/* ---------- tooltip ---------- */
const tip = $("tip");
document.addEventListener("mouseover", (e) => { const el = e.target.closest("[data-tip]"); if (!el) return; tip.innerHTML = el.dataset.tip; tip.hidden = false; });
document.addEventListener("mousemove", (e) => { if (tip.hidden) return; const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8); const y = Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 8); tip.style.left = x + "px"; tip.style.top = y + "px"; });
document.addEventListener("mouseout", (e) => { const el = e.target.closest("[data-tip]"); if (el && !(e.relatedTarget && el.contains(e.relatedTarget))) tip.hidden = true; });

/* ---------- findings ---------- */
function bandRows() {
  const F = D.fit2, S = D.score;
  const rows = [
    ["Off-tree actions (the trigger)", F["off-tree"], "The lines option 3 changes. Too few to separate the models."],
    ["Node share < 5%", F["node < 5%"], ""],
    ["Node share < 20%", F["node < 20%"], "The band T is fitted on."],
    ["  … aggressive (bet / raise)", F["node < 20% aggressive"], ""],
    ["  … passive (check / call)", F["node < 20% passive"], ""],
    ["  … flop bet OOP, no bet faced", F["node < 20% flop wager OOP no bet faced"], "Donks: 27 of the 37 live off-tree lines."],
    ["Common actions (node share ≥ 20%)", F["node >= 20%"], "For scale: on-tree play."],
  ];
  return rows;
}
function cell(v, ci, best) {
  if (v == null) return `<td class="num">–</td>`;
  return `<td class="num${best ? " best" : ""}">${fmt(v)}${ci ? `<span class="ci">${fmt(ci[0])} … ${fmt(ci[1])}</span>` : ""}</td>`;
}
function bandTable(lvl) {
  let h = `<div class="tbl-wrap"><table><thead><tr><th>Actions</th><th>n</th><th style="color:var(--s-qre)">QRE (today)</th><th>Pre-action</th><th style="color:var(--s-soft)">Soft, fitted t</th><th style="color:var(--s-pool)">Pool</th><th style="color:var(--s-hyb)">Pool × soft</th><th></th></tr></thead><tbody>`;
  for (const [name, r, note] of bandRows()) {
    const b = r?.[lvl];
    const n = lvl === "combo" ? r?.in_range : r?.n;
    if (!b) { h += `<tr><td>${esc(name)}</td><td class="num">${n ?? 0}</td><td colspan="6" class="sub">no sample</td></tr>`; continue; }
    const vals = [b.qre, 0, b.soft, b.pool, b.hyb];
    const mx = Math.max(...vals);
    h += `<tr><td>${esc(name).replace(/^ +/, (m) => "&nbsp;".repeat(m.length * 2))}</td><td class="num">${n}</td>` +
      cell(b.qre, b.qre_ci, b.qre === mx) + `<td class="num${mx === 0 ? " best" : ""}">0 <span class="ci">baseline</span></td>` +
      cell(b.soft, b.soft_ci, b.soft === mx).replace("</td>", `<span class="ci">t = ${b.soft_t >= 1e8 ? "∞" : (100 * b.soft_t).toFixed(1) + "% pot"}</span></td>`) +
      cell(b.pool, b.pool_ci, b.pool === mx) +
      cell(b.hyb, b.hyb_ci, b.hyb === mx).replace("</td>", `<span class="ci">t = ${b.hyb_t >= 1e8 ? "∞" : (100 * b.hyb_t).toFixed(1) + "% pot"}</span></td>`) +
      `<td class="sub" style="font-size:12px;min-width:160px">${esc(note)}</td></tr>`;
  }
  return h + `</tbody></table></div>`;
}
function curveChart() {
  // gain vs t for the soft model, combo level, three bands
  const F = D.fit2;
  const series = [
    { name: "Node share < 20% (n=" + F["node < 20%"].in_range + ")", col: "var(--s-soft)", c: F["node < 20%"].combo.soft_curve },
    { name: "Off-tree (n=" + F["off-tree"].in_range + ")", col: "var(--s-qre)", c: F["off-tree"].combo.soft_curve },
    { name: "Common actions (n=" + F["node >= 20%"].in_range + ")", col: "var(--s-pre)", c: F["node >= 20%"].combo.soft_curve },
  ];
  const W = 560, H = 230, L = 44, R = 12, T = 12, B = 34;
  const ts = series[0].c.map((p) => p[0]).filter((t) => t < 1e8);
  const xs = (t) => L + (Math.log10(t) - Math.log10(ts[0])) / (Math.log10(ts[ts.length - 1]) - Math.log10(ts[0])) * (W - L - R);
  let ymin = 0, ymax = 0;
  for (const s of series) for (const [t, g] of s.c) if (t < 1e8) { ymin = Math.min(ymin, g); ymax = Math.max(ymax, g); }
  ymin = Math.max(ymin, -0.6); ymax = Math.max(ymax, 0.1);
  const ys = (g) => T + (ymax - Math.max(ymin, g)) / (ymax - ymin) * (H - T - B);
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Soft model gain against T">`;
  const yt = []; for (let v = Math.ceil(ymin * 10) / 10; v <= ymax + 1e-9; v += 0.1) yt.push(+v.toFixed(1));
  for (const v of yt) svg += `<line class="${v === 0 ? "ax" : "gl"}" x1="${L}" x2="${W - R}" y1="${ys(v)}" y2="${ys(v)}"/><text x="${L - 6}" y="${ys(v) + 4}" text-anchor="end">${v === 0 ? "0" : fmt(v, 1)}</text>`;
  for (const t of [0.005, 0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1, 5]) if (t >= ts[0] && t <= ts[ts.length - 1]) svg += `<text x="${xs(t)}" y="${H - B + 16}" text-anchor="middle">${t * 100 >= 1 ? (t * 100).toFixed(0) : (t * 100).toFixed(1)}%</text>`;
  svg += `<text x="${(L + W - R) / 2}" y="${H - 4}" text-anchor="middle">T as a share of the pot (log scale) · y = bits per action vs pre-action</text>`;
  svg += `<line x1="${xs(0.1)}" x2="${xs(0.1)}" y1="${T}" y2="${H - B}" stroke="var(--s-soft)" stroke-dasharray="3 3" stroke-width="1"/>`;
  for (const s of series) {
    const pts = s.c.filter((p) => p[0] < 1e8);
    svg += `<path d="${pts.map((p, i) => (i ? "L" : "M") + xs(p[0]).toFixed(1) + "," + ys(p[1]).toFixed(1)).join("")}" fill="none" stroke="${s.col}" stroke-width="2"/>`;
    for (const p of pts) svg += `<circle cx="${xs(p[0])}" cy="${ys(p[1])}" r="9" fill="transparent" data-tip="<b>${esc(s.name)}</b><br>t = ${(100 * p[0]).toFixed(1)}% pot · ${fmt(p[1])} bits"/><circle cx="${xs(p[0])}" cy="${ys(p[1])}" r="2.5" fill="${s.col}" stroke="var(--surface)" stroke-width="1" pointer-events="none"/>`;
  }
  svg += `</svg>`;
  return `<div class="chart">${svg}</div><div class="legend">${series.map((s) => `<span><span class="sw" style="background:${s.col}"></span>${esc(s.name)}</span>`).join("")}<span><span class="sw" style="background:none;border:1px dashed var(--s-soft)"></span>t = 10% (fitted)</span></div>`;
}
function compBlock(name) {
  const c = D.composition[name];
  if (!c) return "";

    <li><b>QRE (today):</b> R(h) × strategy<sub>a</sub>(h). <b>Pre-action:</b> R(h). <b>Soft:</b> R(h) × exp(−ΔEV<sub>h</sub> / T), ΔEV = best action's EV − the taken action's EV for that combo; T in bb or as a share of the pot (pot-relative won in every band). <b>Pool:</b> R(h) × P<sub>pool</sub>(action kind | category(h), spot). <b>Pool × soft:</b> both factors.</li>
    <li><b>Score:</b> log-likelihood of villain's real combo (belief mixed 1% with uniform, so ruling out the real hand costs about 10–17 bits, not infinity), minus the pre-action score, in bits; 90% bootstrap intervals. The category score uses the real hand's category instead of its combo.</li></ul>
    <h3>Limits</h3><ul>
    <li>Off-tree sample: 43 actions (13 with the real combo in range). The fitted T comes from the 1–20% band and is assumed to carry over.</li>
    <li>A third of real villain hands were already outside the range entering the node: the chain's preflop ranges miss hands real callers flat (as the caller-read research found). No postflop update can recover those; they cap every model's score equally.</li>
    <li>82% of scored actions come from the Sep 21 backtest (Brady's own hands from June to September replayed through the chain); downloaded histories stop at 2026-10-02, so the 1,250 live traces from Oct 3–5 have no cards. Downloading Ignition's histories for Oct 3 onward would add them.</li>
    <li>Hero's answer under each belief needs new solves (one tree per changed street, or a node-lock mid-street); not run. Each node shows what hero did against today's range.</li>
    <li>Later-street numbers in a hand rest on trees solved against the collapsed range; the page marks nodes whose entering range was already collapsed by an earlier off-tree action.</li></ul></div>
  <div class="card"><h2>Proposed build (not built — waiting for your go)</h2>
