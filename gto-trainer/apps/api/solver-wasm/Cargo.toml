[package]
name = "solver-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM bindings around postflop-solver for live GTO river solving"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"

# Pinned to a known-good commit. default-features=false drops rayon (threads)
# and bincode/zstd, leaving a clean single-threaded build for WASM.
[dependencies.postflop-solver]
git = "https://github.com/b-inary/postflop-solver"
rev = "9d1509fe5077d019825f833eed04b16d342dfda1"
default-features = false

[profile.release]
opt-level = 3
lto = true
