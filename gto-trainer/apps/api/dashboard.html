      <p class="sub">A source is a file or service that produces answers; a piece is the role it plays in a strategy. The same source can serve two pieces
        (the HRC 3-max grid is both the GTO preflop piece and the equilibrium opponent model). Every MES piece is a best-response to one specific
        opponent model, which is why the Strategies page refuses to pair them with any other. Cards show what each source is routing for right now,
        its freshness, and its live answers over 30 days; click one for its page.</p>
    </div>
    ${pieces.map((p) => section(p, byPiece(p.id))).join("")}
    ${orphan.length ? section({ label: "Unassigned", what: "sources not mapped to a piece" }, orphan) : ""}`;
  el.querySelectorAll(".src").forEach((d) => d.onclick = () => go(`/sources/pieces/${d.dataset.id}`));
}

/* ---- strategy matrix ---- */
async function loadMatrix() {
  const el = $("src-matrix");
  let j;
  try { j = await (await fetch("/api/dashboard/sources/matrix")).json(); } catch (e) { el.innerHTML = '<div class="card warn">matrix unavailable</div>'; return; }
  srcLoaded.matrix = true;
  const m = j.matrix;
  const realized = j.realized || {};
  const rl = (mode) => { const r = realized[mode]; return r && r.bb100 != null ? `<td class="ev ${r.bb100 > 0 ? "p" : "n"}">${r.bb100 > 0 ? "+" : ""}${r.bb100} <span class="se">${r.knownHands} h</span></td>` : '<td class="ev z">no sessions yet</td>'; };
  const missing = (j.missing || []).length ? `<div class="card warn">${j.missing.map(esc).join("<br>")}</div>` : "";
  if (!m) { el.innerHTML = missing + '<div class="card sub">The matrix artifact has not been built. Run <code>analysis/pipeline/limp_study/strategy_matrix.py</code>.</div>'; return; }
  const modeTag = (k) => k === "exploit" ? '<span class="mode mes">MES</span> exploit' : k === "mes" ? '<span class="mode mes">MES</span>' : k === "chart" ? '<span class="mode gto">GTO</span> charts' : k === "gto" ? '<span class="mode gto">GTO</span> AI chain' : esc(k);
  const cell = (c, key) => {
    if (!c) return evCell(null, { why: "—" });
    if (c.kind === "legs") return `<td class="ev ${c.pre > 0 ? "p" : "n"}">${c.pre > 0 ? "+" : ""}${c.pre} <span class="se">pre</span> ⊕ ${c.post > 0 ? "+" : ""}${c.post} <span class="se">${esc(c.postTag || "raw")}</span></td>`;
    if (c.v == null) return evCell(null, { why: c.why || "pending", reuse: c.reuse });
    return evCell(c.v, { reuse: c.reuse, se: c.se, tag: c.tag });
  };
  const rows = (m.groups || []).map((g) => `<tr class="row-group"><td colspan="10">${esc(g.title)}</td></tr>` +
    g.rows.map((r) => `<tr class="src-static">
      <td>${r.indent ? `<span class="sub" style="padding-left:24px">${esc(r.label || "")}</span>` : modeTag(r.preflop)}</td>
      <td class="sub">${r.indent ? "" : "→"}</td>
      <td>${r.indent ? "" : modeTag(r.postflop) + (r.mesGen ? ` ${esc(r.mesGen)}` : "")}</td>
      <td>${esc(r.family || "")}</td>
      ${cell(r.cells?.norake)}${cell(r.cells?.nl200)}${cell(r.cells?.nl25)}
      ${r.haircut ? evCell(-Math.abs(r.haircut.v), { tag: r.haircut.tag }) : evCell(null, { why: r.haircutWhy || "n/a" })}
      ${r.realizedMode ? rl(r.realizedMode) : '<td class="ev z">—</td>'}
      <td>${(r.evidence || []).map((e) => `<a class="ev-link" href="#" title="${esc(e.path || "")}" onclick="return false">${esc(e.label)}${e.date ? ` · ${esc(e.date)}` : ""}</a>`).join(" · ")}${(r.flags || []).map((f) => ` <span class="chip ${f.kind || ""}">${esc(f.text)}</span>`).join("")}${r.note ? `<div class="sub">${esc(r.note)}</div>` : ""}</td>
    </tr>`).join("")).join("");
  const chain = (m.evidenceChain || []);
  el.innerHTML = `${missing}
    <div class="banner">📐 Each row is one way to play the whole hand. Columns are the same corpus priced under three rake models. A <b>combined</b> cell is one corpus walk that plays both legs; a <b>legs</b> cell (⊕) is two separate numbers that must not be added.</div>
    <div class="card"><h2>Strategy matrix <span class="sub">— bb/100 · 3-max Zone · ${esc(m.inputs?.corpusNote || "")} · built ${esc(m.generatedAt || "?")}</span></h2>
      <div class="scroll"><table><thead><tr><th>preflop</th><th></th><th>postflop</th><th>family</th><th class="num">no rake</th><th class="num">NL200 cap 1bb</th><th class="num">NL25 cap 4bb</th><th class="num">coverage haircut</th><th class="num">realized bb/100</th><th>evidence</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="legend"><span><span class="sw" style="background:rgba(97,208,149,.14);border:1px solid #61d095"></span> positive</span><span><span class="sw" style="background:rgba(255,115,115,.14);border:1px solid #ff7373"></span> negative</span><span><span class="sw" style="background:rgba(143,161,182,.10);border:1px solid #8fa1b6"></span> no number yet, and why</span><span><span class="sw" style="border-left:2px dashed #2c3a4d"></span> reused from the 100bb ign200 state</span><span>⊕ two legs, do not sum</span><span>realized = hero's own sessions, by the strategy mode logged in them</span></div>
    </div>
    ${chain.length ? `<div class="card"><h2>What moves a cell <span class="sub">— the evidence chain, oldest to newest</span></h2><div class="scroll"><table class="src-static"><thead><tr><th>step</th><th>artifact</th><th>date</th><th>what it changed</th></tr></thead><tbody>${chain.map((e) => `<tr><td>${esc(e.step)}</td><td class="mono">${esc(e.artifact)}</td><td>${esc(e.date || "")}</td><td>${esc(e.what)}</td></tr>`).join("")}</tbody></table></div></div>` : ""}`;
}

/* ---- live grading ---- */
async function loadGrading() {
  const el = $("src-grading");
  let j;
  try { j = await (await fetch("/api/dashboard/sources/grading?days=60")).json(); } catch (e) { el.innerHTML = '<div class="card warn">grading unavailable</div>'; return; }
  srcLoaded.grading = true;
  const s = j.summary;
  const tile = (k, val, sub) => `<div class="tile"><div class="v num">${val}</div><div class="k">${k}</div>${sub ? `<div class="s">${sub}</div>` : ""}</div>`;
  const pct = (x) => x == null ? "—" : `${x}%`;
  const rb = s.realizedByMode || {};
  const modeLine = ["exploit", "chart"].map((m) => rb[m] ? `${m === "exploit" ? "MES" : "GTO"} ${rb[m].bb100 > 0 ? "+" : ""}${rb[m].bb100 ?? "—"} (${rb[m].knownHands} h)` : null).filter(Boolean).join(" · ");
  const famRows = Object.entries(j.byFamily).sort((a, b) => b[1].answers - a[1].answers).map(([f, x]) => {
    const n = x.answers; const w = (k) => Math.round(100 * x[k] / n);
    return `<tr class="src-static"><td>${esc(f)}</td><td class="num">${n}</td><td><div class="bar"><i class="agree" style="width:${w("agree")}%"></i><i class="mes" style="width:${w("mesOnly")}%"></i><i class="gto" style="width:${w("gtoOnly")}%"></i><i class="unk" style="width:${w("unknown")}%"></i></div></td>${x.atStakeN ? evCell(x.atStakeBb / x.atStakeN) : evCell(null, { why: "—" })}<td class="num">${x.graded ? `${x.followedMes} / ${x.graded}` : '<span class="sub">no archived hand to grade</span>'}</td></tr>`;
  }).join("");
  const sessRows = (j.sessions || []).slice(0, 12).map((x) => `<tr class="src-static"><td>${fmtT(x.start)} · ${esc(x.stakes ?? "?")}</td><td>${x.mode === "exploit" ? '<span class="mode mes">MES</span>' : x.mode === "chart" ? '<span class="mode gto">GTO</span>' : '<span class="chip dim">unknown</span>'}</td><td class="num">${x.hands}</td><td class="num">${x.answered}</td>${evCell(x.netBb, {})}${evCell(x.bb100, {})}</tr>`).join("");
  const trail = (j.trail || []).slice(0, 80).map((g) => `<tr data-id="${g.dbId ?? ""}" ${g.dbId ? "" : 'class="src-static"'}>
      <td>${fmtT(g.ts)}</td><td>${esc(g.heroPos ?? "?")} ${cardsHtml(g.heroCards ? g.heroCards.match(/.{2}/g) : [])} · ${esc(g.stakes ?? "")}</td><td class="mono">${esc(g.node)}</td>
      <td><span class="chip${g.source === "gtow-api-postflop" ? " dim" : ""}">${esc(g.tier ?? "?")}</span></td>
      <td>${g.mesPick ? `<span class="mode mes">${esc(g.mesPick)}</span>` : '<span class="sub">no MES</span>'}</td>
      <td>${g.gtoPick ? `<span class="mode gto">${esc(g.gtoPick)}</span>` : '<span class="sub">—</span>'}</td>
      ${g.disagreed === false ? '<td class="ev z">agree</td>' : g.disagreed ? evCell(g.atStakeBb, { why: "?" }) : '<td class="ev z">—</td>'}
      <td>${g.heroDid ? `${esc(g.heroDid)} ${g.followed === "neither" ? "✗" : g.followed ? "✓" : ""}` : '<span class="sub">—</span>'}</td>
      <td class="sub">${g.band ? `${g.band[0]}–${g.band[1]}` : ""}</td></tr>`).join("");
  const none = j.provenanceRows === 0 ? `<div class="banner">🎯 No answers with provenance yet — MES vs GTO picks, EV at stake and strategy mode are logged from 2026-09-03 on. Play a session with Study Answers on and this pane fills itself in.</div>` : "";
  el.innerHTML = `${none}
    <div class="tiles">
      ${tile("answers", s.answers, `${j.days} days`)}
      ${tile("MES ≠ GTO", pct(s.disagreementRate), `${s.disagreements} of ${s.withBothPicks} with both picks`)}
      ${tile("bb at stake / disagreement", s.meanAtStakeBb == null ? "—" : (s.meanAtStakeBb > 0 ? "+" : "") + s.meanAtStakeBb, "mean MES ev_gain")}
      ${tile("you followed MES", pct(s.followedMesWhenDisagreed), "when they disagreed")}
      ${tile("realized by mode", modeLine || "—", "bb/100 of your sessions")}
    </div>
    <div class="g2">
      <div class="card"><h2>Disagreement by family</h2><div class="scroll"><table><thead><tr><th>family</th><th class="num">answers</th><th>agree / MES-only / GTO-only / unknown</th><th class="num">bb at stake</th><th class="num">followed MES</th></tr></thead><tbody>${famRows || '<tr class="src-static"><td colspan="5" class="sub">nothing logged in this window</td></tr>'}</tbody></table></div>
        <div class="legend"><span><span class="sw" style="background:#3a4453"></span> same action</span><span><span class="sw" style="background:#cf6a24"></span> disagreed, MES was primary</span><span><span class="sw" style="background:#2f78bd"></span> disagreed, GTO was primary</span><span><span class="sw" style="background:#1a212c"></span> one pick only</span></div></div>
      <div class="card"><h2>Realized by session &amp; mode</h2><div class="scroll"><table><thead><tr><th>session</th><th>mode</th><th class="num">hands</th><th class="num">answered</th><th class="num">net bb</th><th class="num">bb/100</th></tr></thead><tbody>${sessRows}</tbody></table></div>
        <p class="sub" style="margin:8px 0 0">Mode per session = the strategy mode logged on the majority of its answers. Sessions before the provenance logging show as unknown.</p></div>
    </div>
    <div class="card"><h2>Decision trail <span class="sub">— newest first · click a row to open the hand</span></h2><div class="scroll"><table><thead><tr><th>when</th><th>hand</th><th>node</th><th>tier</th><th>MES</th><th>GTO</th><th class="num">at stake</th><th>you did</th><th>band</th></tr></thead><tbody>${trail || '<tr class="src-static"><td colspan="9" class="sub">no answers logged</td></tr>'}</tbody></table></div></div>`;
  el.querySelectorAll("tr[data-id]").forEach((tr) => { if (tr.dataset.id) tr.onclick = () => go(`/hands/${tr.dataset.id}`); });
}

/* ---- roadmap ---- */
async function loadRoadmap() {
  const el = $("src-roadmap");
  let j;
  try { j = await (await fetch("/api/dashboard/sources/roadmap")).json(); } catch (e) { el.innerHTML = '<div class="card warn">roadmap unavailable</div>'; return; }
  srcLoaded.roadmap = true;
  const st = (s) => s === "built" ? '<span class="st"><span class="dot good"></span>built</span>' : s === "partial" ? '<span class="st"><span class="dot warn"></span>flop only</span>' : '<span class="st"><span class="dot off"></span>not built</span>';
  const gen = (g) => Object.entries(g || {}).map(([k, n]) => `<span class="chip ${k === "refit" ? "good" : k === "v2" ? "warn" : k === "unknown" ? "dim" : ""}">${esc(k)} ×${n}</span>`).join("") || "—";
  const fam = (j.families || []).map((f) => `<tr class="src-static"><td><b>${esc(f.label)}</b><div class="sub">${esc(f.shape)}</div></td>
      <td><span class="reach"><i class="${f.built ? "built" : ""}" style="width:${Math.round(4 * f.reachPct)}px"></i><span class="num">${f.reachPct}%</span></span></td>
      <td>${st(f.status)}</td><td>${f.built ? `${f.boards} boards · ${gen(f.generations)}` : "—"}</td>
      ${f.meanEvGainPerArrival != null ? evCell(f.meanEvGainPerArrival, { tag: f.upliftBb100 != null ? `${f.upliftBb100 > 0 ? "+" : ""}${f.upliftBb100} bb/100` : null }) : evCell(null, { why: f.status === "partial" ? "inside the flop number" : "no solve yet" })}
      <td>${esc(f.whatItTakes)}${f.note ? `<div class="sub">${esc(f.note)}</div>` : ""}</td><td class="sub">${esc(f.cost)}</td></tr>`).join("");
  const pre = (j.preflop || []).map((p) => `<tr class="src-static"><td><b>${esc(p.label)}</b></td><td>${esc(p.reach)}</td><td><span class="st"><span class="dot ${p.status}"></span>${esc(p.statusText)}</span></td><td>${esc(p.why)}</td><td>${esc(p.whatItTakes)}</td></tr>`).join("");
  el.innerHTML = `
    <div class="banner">🗺 Where the next bb/100 is. Reach is the share of hero's flops (or hands) each item covers, from the same corpus the matrix uses, so an unbuilt row already says what it would be worth to build.</div>
    <div class="card"><h2>Postflop families</h2><div class="scroll"><table><thead><tr><th>family</th><th>reach</th><th>status</th><th>served</th><th class="num">edge / arrival</th><th>what it takes</th><th>cost</th></tr></thead><tbody>${fam}</tbody></table></div></div>
    <div class="card"><h2>Preflop &amp; coverage</h2><div class="scroll"><table><thead><tr><th>item</th><th>reach</th><th>status</th><th>why it matters</th><th>what it takes</th></tr></thead><tbody>${pre}</tbody></table></div></div>`;
}

/* ================= routing =================
   Real paths, served by the API for every one of them (index.ts):
     /hands            the table            /hands/:dbId              one hand
     /analytics                             /review                   Replay Review (embeds /replay)
     /sources          → /sources/strategies  /sources/:pane          strategies | pieces | matrix | grading | roadmap
     /sources/pieces/:id                    one source's page   (/sources/registry/… still accepted)
     /sources/strategies/:id                one whole-hand strategy's page
   Old #hand/N links still resolve. */
let PATH = { view: "hands", pane: null, id: null };
const TABS = { hands: "tab-hands", sessions: "tab-sessions", analytics: "tab-analytics", sources: "tab-sources", review: "tab-replay", playthrough: "tab-play", ledger: "tab-ledger" };
$("tab-ledger").onclick = () => go("/proposals");
const SRC_PANES = ["strategies", "pieces", "matrix", "grading", "roadmap"];
$("tab-play").onclick = () => go("/playthrough");

function parsePath() {
  const legacy = location.hash.match(/^#hand\/(\d+)/);
  if (legacy) return { view: "hands", pane: null, id: legacy[1] };
  const seg = location.pathname.split("/").filter(Boolean);
  const view = seg[0] || "hands";
  if (view === "hands") return { view, pane: null, id: seg[1] && /^\d+$/.test(seg[1]) ? seg[1] : null, node: seg[2] === "node" && /^\d+$/.test(seg[3] ?? "") ? Number(seg[3]) : null };
  if (view === "sources") {
    const seg1 = seg[1] === "registry" ? "pieces" : seg[1];
    const pane = SRC_PANES.includes(seg1) ? seg1 : "strategies";
    return { view, pane, id: (pane === "pieces" || pane === "strategies") && seg[2] ? decodeURIComponent(seg[2]) : null };
  }
  if (view === "sessions") return { view, pane: null, id: seg[1] ? decodeURIComponent(seg[1]) : null, show: new URLSearchParams(location.search).get("show") || null };
  if (view === "playthrough") return { view, pane: null, id: seg[1] === "spot" && seg[2] && seg[3] ? `spot/${decodeURIComponent(seg[2])}/${seg[3]}` : null };
  if (view === "ledger" || view === "runbook" || view === "proposals") return { view: "ledger", pane: seg[1] || null, id: seg[2] ? decodeURIComponent(seg[2]) : null };
  if (view === "analytics") { const q = new URLSearchParams(location.search); return { view, pane: null, id: null, scope: q.get("scope") || "all", vs: q.get("vs") || null }; }
  if (view === "review") return { view, pane: null, id: null };
  return { view: "hands", pane: null, id: null };
}
function canonical(p) {
  if (p.view === "hands") return p.id ? (p.node != null ? `/hands/${p.id}/node/${p.node}` : `/hands/${p.id}`) : "/hands";
  if (p.view === "sources") return p.id ? `/sources/${p.pane === "strategies" ? "strategies" : "pieces"}/${encodeURIComponent(p.id)}` : `/sources/${p.pane}`;
  if (p.view === "sessions") return p.id ? `/sessions/${encodeURIComponent(p.id)}${p.show ? `?show=${encodeURIComponent(p.show)}` : ""}` : "/sessions";
  if (p.view === "playthrough") return p.id ? `/playthrough/${p.id}` : "/playthrough";
  if (p.view === "ledger") return p.pane ? `/proposals/${p.pane}${p.id ? `/${encodeURIComponent(p.id)}` : ""}` : "/proposals";
  if (p.view === "analytics") return "/analytics" + anQuery(p.scope, p.vs);
  return `/${p.view}`;
}
function go(path) {
  if (location.pathname + location.search + location.hash === path) { route(); return; }
  history.pushState({}, "", path);
  route();
}
function route() {
  if (PLAY) { clearInterval(PLAY); PLAY = null; }
  PATH = parsePath();
  const want = canonical(PATH);
  if (location.pathname + location.search + location.hash !== want) history.replaceState({}, "", want);
  for (const [v, tab] of Object.entries(TABS)) $(tab).classList.toggle("on", v === PATH.view);
  $("view-hands").style.display = PATH.view === "hands" && !PATH.id ? "" : "none";
  for (const el of [$("filter"), $("sess-filter"), $("only-flop").parentElement, $("only-disc").parentElement, $("only-unanswered").parentElement]) el.style.display = PATH.view === "hands" && !PATH.id ? "" : "none";
  $("view-detail").style.display = PATH.view === "hands" && PATH.id ? "" : "none";
  $("view-analytics").style.display = PATH.view === "analytics" ? "" : "none";
  $("view-sessions").style.display = PATH.view === "sessions" ? "" : "none";
  $("view-sources").style.display = PATH.view === "sources" ? "" : "none";
  $("view-replay").style.display = PATH.view === "review" ? "" : "none";
  $("view-play").style.display = PATH.view === "playthrough" ? "" : "none";
  $("view-ledger").style.display = PATH.view === "ledger" ? "" : "none";
  if (PATH.view === "ledger") loadLedger();
  if (PATH.view === "playthrough") loadPlay();
  document.title = PATH.view === "hands" && PATH.id ? `Hand #${PATH.id} · Study Dashboard`
    : PATH.view === "sources" ? `Sources · ${PATH.id ?? PATH.pane} · Study Dashboard`
    : PATH.view === "ledger" ? "Solve Proposals · Study Dashboard"
    : PATH.view === "sessions" ? `${PATH.id ? `Session ${PATH.id}` : "Sessions"} · Study Dashboard`
    : `${PATH.view[0].toUpperCase()}${PATH.view.slice(1)} · Study Dashboard`;
  if (PATH.view === "hands") {
    if (PATH.id) {
      const id = Number(PATH.id), node = PATH.node;
      // same hand already on screen: only the node panel changes
      if (DETAIL && DETAIL.dbId === id && $("view-detail").innerHTML.length > 200) { if (node != null) openAnswerNode(node); }
      else showDetail(id).then(() => { if (node != null && DETAIL?.dbId === id) openAnswerNode(node); });
    } else if (!HANDS.length) loadHands();
  }
  if (PATH.view === "analytics") loadAnalytics();
  if (PATH.view === "sessions") { if (PATH.id) loadSession(PATH.id); else loadSessions(); }
  if (PATH.view === "sources") { srcPane = PATH.pane; if (SRC) showSrcPane(PATH.pane, PATH.id); else loadSources(); }
  if (PATH.view === "review" && !$("replay-frame").src) $("replay-frame").src = "/replay"; // lazy, same origin
}
window.onpopstate = route;
// hand walkthrough: ← / → move through the session from a hand page (buttons are wired in showDetail's render)
document.addEventListener("keydown", (ev) => {
  if (PATH.view !== "hands" || !PATH.id || !DETAIL?.nav) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName ?? "")) return;
  if (ev.key === "ArrowLeft" && DETAIL.nav.prev != null) { ev.preventDefault(); go(`/hands/${DETAIL.nav.prev}`); }
  if (ev.key === "ArrowRight" && DETAIL.nav.next != null) { ev.preventDefault(); go(`/hands/${DETAIL.nav.next}`); }
});
document.addEventListener("click", (ev) => {
  const b = ev.target.closest("#nav-prev, #nav-next");
  if (!b || !DETAIL?.nav) return;
  const to = b.id === "nav-prev" ? DETAIL.nav.prev : DETAIL.nav.next;
  if (to != null) go(`/hands/${to}`);
});
window.onhashchange = route; // legacy #hand/N
for (const [v, tab] of Object.entries(TABS)) $(tab).onclick = () => go(v === "sources" ? "/sources/strategies" : `/${v}`);

route();
setInterval(() => {
  if (PATH.view === "hands" && !PATH.id) loadHands();
  if (PATH.view === "sources" && PATH.pane === "pieces" && !PATH.id) loadSources();
}, 15000);
</script>
