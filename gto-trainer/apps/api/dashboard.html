/** Money in the account right now.
 *
 *  A READING, never a running total: scraped from the open client on every load,
 *  with the last stored snapshot as the fallback for when the client is shut —
 *  and labelled either way, so a figure hours old never passes for a live one.
 *  Unlike every other tile it is a point in time and does not move with the
 *  window. ⚠ means the reading disagrees with what the hands say it should be by
 *  more than rake and tolerance explain; the Profiles tab has the arithmetic. */
function hmBalanceTile(profs, tile) {
  const money = (cents) => `$${(cents / 100).toFixed(2)}`;
  const wide = "hm-wide"; // seventh tile: it takes the last row to itself
  const L = HOME.liveBal;
  if (HOME.profile === "none") return tile("Balance", "—", "unattributed hands belong to no account", "", "these hands were played before the wrapper declared a profile at Start", wide);

  // a live read is one account's — the client knows one at a time. It stands for
  // "All" only when that account is the only seeded one.
  const seeded = profs.filter((p) => p.balance);
  const liveFor = L?.live && L.signedInAs && (HOME.profile === L.signedInAs || (HOME.profile === "all" && seeded.length <= 1 && (!seeded.length || seeded[0].id === L.signedInAs)));
  if (liveFor) {
    const k = L.check, off = k && !k.agrees;
    const warn = off ? `<span class="hm-warn" title="${esc(`the client reads ${money(k.liveCents)} where the last reading plus the hands say ${money(k.expectedCents)} — off by ${money(Math.abs(k.unexplainedCents))}, outside the ±${money(k.toleranceCents)} tolerance. Review it on the Profiles tab.`)}">⚠</span>` : "";
    const sub = `${L.live.inPlayCents ? `${money(L.live.inPlayCents)} in play · ` : L.live.seated ? "seated · " : ""}live read ${fmtAgo(L.at)}${off ? ` · <b class="neg">off by ${money(Math.abs(k.unexplainedCents))}</b>` : k ? " · matches the hands" : ""}`;
    return tile(`Balance ${warn}`, money(L.live.equityCents), sub, off ? "neg" : "",
      `scraped from the client just now (${esc(L.live.how ?? "")}) — cash plus whatever is sat on a table`, wide);
  }

  // no live read: say why, and fall back to the stored reading
  const why = L?.reason ? L.reason : "the client is not open";
  const picked = HOME.profile === "all" ? seeded : seeded.filter((p) => p.id === HOME.profile);
  if (!picked.length) return tile("Balance", "—", HOME.profile === "all" ? "no account has a reading yet" : "not seeded — no reading yet", "", `${why}. The Profiles tab takes an account's first reading; every later check hangs off that anchor.`, wide);
  const eq = picked.reduce((t, p) => t + (p.balance.equityCents ?? 0), 0);
  const inPlay = picked.reduce((t, p) => t + (p.balance.inPlayCents ?? 0), 0);
  const at = Math.max(...picked.map((p) => p.balance.ts ?? 0));
  const who = picked.length > 1 ? `${picked.length} accounts · ` : "";
  return tile(`Balance <span class="hm-stale" title="${esc(why)}">stored</span>`, money(eq),
    `${who}${inPlay ? `${money(inPlay)} in play · ` : ""}last reading ${fmtAgo(at)}`, "",
    `no live read — ${why}. This is the account's last stored reading (${fmtT(at)}): cash plus whatever was sat on a table then.`, wide);
}

/* ---- the system strip: can a spot be answered right now, and what is queued --
   One card per thing that can break on its own, in the order it bites at the
   table. Red means a spot asked for NOW would go unanswered; amber means it
   still works but something is piling up or degraded. */
function hmCard(state, name, val, sub, href, title) {
  const inner = `<div class="k"><span class="dot ${state}"></span>${esc(name)}</div><div class="v">${val}</div><div class="s">${sub}</div>`;
  return href
    ? `<a class="hm-card ${state}" href="${href}" onclick="go('${href}');return false"${title ? ` title="${esc(title)}"` : ""}>${inner}</a>`
    : `<div class="hm-card ${state}"${title ? ` title="${esc(title)}"` : ""}>${inner}</div>`;
}
function hmSystem(h) {
  if (!h) return '<section class="hm-sys"><div class="hm-card dim"><div class="k"><span class="dot dim"></span>System</div><div class="v">unknown</div><div class="s">/api/dashboard/health did not answer</div></div></section>';
  const cards = [];

  // 1 — the poller: nothing else matters if the table is not being watched
  const p = h.poller;
  cards.push(!p ? hmCard("dim", "Study poller", "unknown", "no status from the API", null, "")
    : hmCard(p.running ? (p.lastError ? "warn" : "good") : "dim",
        "Study poller",
        p.running ? `running · ${p.tables} table${p.tables === 1 ? "" : "s"}` : "stopped",
        p.running ? `tick ${hmAgo(p.lastTickAt)} · pushed ${hmAgo(p.lastPushAt)}` : "start it from the wrapper's setup page",
        null,
        p.lastError ? `last error: ${p.lastError}` : "the loop that reads the table and asks for an answer"));

  // 2 — GTO Wizard AI: the fallback the WHOLE of postflop rests on
  const g = h.gtow;
  const mins = g?.expiresInMs != null ? Math.max(0, Math.round(g.expiresInMs / 60000)) : null;
  cards.push(hmCard(g?.state === "up" ? "good" : g?.state === "no-token" ? "warn" : "crit",
    "GTO Wizard AI",
    g?.state === "up" ? "connected" : g?.state === "no-token" ? "no token" : "down",
    g?.state === "up" ? `token ${mins == null ? "—" : `${mins} min`} · ${esc(g.cdpHost ?? "")}` : esc(g?.text ?? "unreachable"),
    null,
    "every postflop spot the MES overlay does not cover is answered by this client"));

  // 3 — what those two actually produced, last 7 days
  const t = h.answers?.tiers ?? {};
  const slowest = Object.entries(t).sort((x, y) => (y[1]?.p90 ?? 0) - (x[1]?.p90 ?? 0))[0];
  const seen = (h.answers?.answered ?? 0) + (h.answers?.failed ?? 0);
  const failRate = seen ? (100 * h.answers.failed) / seen : 0;
  cards.push(hmCard(!seen ? "dim" : failRate > 10 ? "warn" : "good",
    "Answers (7d)",
    `${h.answers?.answered ?? 0}`,
    `${h.answers?.failed ?? 0} failed${slowest ? ` · ${esc(slowest[0])} p90 ${slowest[1].p90} ms` : ""}`,
    null,
    "answered and failed study answers over the last seven days, with the slowest tier's p90 latency"));

  // player mode (the packaged install): no solve fleet, so no miss queue / boxes / jobs cards
  if (window.PLAYER_MODE) return `<section class="hm-sys">${cards.join("")}</section>`;

  // 4 — preflop has no live solver: every miss is written down instead
  const mq = h.missQueue;
  const topKind = mq ? Object.entries(mq.byKind || {}).sort((x, y) => y[1] - x[1])[0] : null;
  cards.push(hmCard(!mq ? "dim" : mq.open > 0 ? "warn" : "good",
    "Preflop miss queue",
    mq ? `${mq.open} open` : "unknown",
    mq ? `${mq.total} recorded${topKind ? ` · mostly ${esc(topKind[0])} (${topKind[1]})` : ""}` : "not reachable",
    "/analytics",
    "preflop has no on-demand solver, so every chart miss is written down with the state to solve it — the HRC runner works the queue between sessions"));

  // 5 — the boxes that work that queue off
  const k = h.keeper;
  cards.push(hmCard(!k || !k.total ? "dim" : k.up < k.total ? "warn" : "good",
    "Solve boxes",
    !k ? "unknown" : !k.total ? (k.running ? "probing…" : "none") : `${k.up}/${k.total} up`,
    !k ? "keeper not reachable" : !k.total ? (k.running ? "the keeper has not finished its first pass" : "no boxes in the ledger") : `${k.working} running a job · keeper ${k.running ? "on" : "off"}`,
    "/proposals",
    k ? (k.boxes || []).map((b) => `${b.name}: ${b.ok ? (b.job === "Running" ? (b.phase || "running") : "idle") : "unreachable"}`).join("\n") : ""));

  // 6 — anything the dispatcher is running right now
  const jobs = h.jobs || [];
  cards.push(hmCard(jobs.length ? "good" : "dim",
    "Jobs",
    jobs.length ? `${jobs.length} running` : "idle",
    jobs.length ? jobs.map((x) => esc(x.config || x.recipe || `#${x.id}`)).join(", ") : "nothing in flight",
    "/proposals",
    "the solve dispatcher's own jobs"));

  return `<section class="hm-sys">${cards.join("")}</section>`;
}

/** The last eight sessions in the window, newest first — the same numbers the
 *  Analytics "By session" table carries, with the columns that fit a half-width
 *  panel. */
function hmSessions(P) {
  if (!P.sessions.length) return '<div class="ig-note" style="margin:0">no sessions in this window</div>';
  const rows = P.sessions.slice().reverse().slice(0, 8).map((s) => `<tr class="pick" data-sess="${esc(s.id)}" title="open this session's page">
      <td>${fmtT(s.startedAt)}</td>
      <td class="ig-dim">${esc(s.declared ? presetLabel(s.preset, s) : "undeclared")}</td>
      <td class="num">${s.hands}</td><td class="num ${anCls(s.netBb)}">${sgn(s.netBb, 0)}</td><td class="num ${anCls(s.bb100)}">${sgn(s.bb100, 1)}</td>
      <td class="num">${pctS(s.answers.decisionsCoveredPct)}</td></tr>`).join("");
  return `<table><thead><tr><th>Started</th><th>Strategy</th><th>Hands</th><th>Net bb</th><th>bb/100</th><th>Answered</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function hmWire(v) {
  v.querySelectorAll("#hm-profile button[data-prof]").forEach((b) => b.onclick = () => hmGo(b.dataset.prof, HOME.window));
  v.querySelectorAll("#hm-window button[data-win]").forEach((b) => b.onclick = () => hmGo(HOME.profile, b.dataset.win));
  v.querySelectorAll("tr[data-sess]").forEach((tr) => tr.onclick = () => go(`/sessions/${encodeURIComponent(tr.dataset.sess)}`));
}

/* ================= Analytics =================
   Design follows the "Ignition Cash Results" artifact: one cumulative-result
   chart (Chart.js), a row of tiles, and plain tables in panels — no small
   multiples. SCOPE is a set of hands (all · sessions · months · stakes · a date
   range) picked with a segmented control and chips; a second scope can be laid
   over the chart as a dashed line, with its difference shown on the tiles. The
   scope lives in the URL (/analytics?scope=…&vs=…) so a view can be linked to.
   The Solver & model block underneath is corpus-level and ignores the scope. */
let AN = { options: null, chart: null, sess: null };
/* The Analytics URL carries four things: the scope, an optional comparison
   scope, and the account + window Home hands over when you click through to the
   full page. Profile and window are NOT part of the scope grammar — they narrow
   the hand set before the scope is applied, so the three compose. */
const anQuery = (scope, vs, profile, win) => {
  const q = new URLSearchParams();
  if (scope && scope !== "all") q.set("scope", scope);
  if (vs) q.set("vs", vs);
  if (profile && profile !== "all") q.set("profile", profile);
  if (win && win !== "all") q.set("window", win);
  const s = q.toString(); return s ? `?${s}` : "";
};
const anGo = (scope, vs) => go("/analytics" + anQuery(scope, vs, PATH.profile, PATH.window));
/* changing the account or the window drops the scope: a session or a month
   picked under one account is meaningless under another, and an empty scope is
   a worse surprise than starting from "all" */
const anGoPW = (profile, win) => go("/analytics" + anQuery("all", null, profile, win));
const anParse = (spec) => { const m = String(spec || "all").match(/^(sessions|months|stakes|range):(.*)$/); return m ? { kind: m[1], items: m[1] === "range" ? [] : m[2].split(",").filter(Boolean), raw: m[2] } : { kind: "all", items: [], raw: "" }; };
const fmtD = (ms) => ms == null ? "?" : new Date(ms).toLocaleDateString([], { month: "short", day: "numeric" });
const sgn = (x, d = 1) => x == null ? "–" : (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(Number(x)).toFixed(d);
const pctS = (x) => x == null ? "–" : x.toFixed(1) + "%";
const anCls = (x) => x > 0 ? "pos" : x < 0 ? "neg" : "";
const anCss = (v) => getComputedStyle($("view-analytics")).getPropertyValue(v).trim();
const AN_KINDS = [["all", "All"], ["sessions", "Sessions"], ["months", "Months"], ["stakes", "Stakes"], ["range", "Range"]];

async function loadAnalytics() {
  const v = $("view-analytics");
  const scope = PATH.scope || "all", vs = PATH.vs || null;
  const profile = PATH.profile || "all", win = PATH.window || "all";
  if (!v.querySelector(".ig-head")) v.innerHTML = '<div class="card sub">loading…</div>';
  let j;
  try { j = await (await fetch(`/api/dashboard/analytics${anQuery(scope, vs, profile, win)}`)).json(); } catch (e) { v.innerHTML = '<div class="card warn">analytics unavailable</div>'; return; }
  if (!j.ok) { v.innerHTML = '<div class="card warn">analytics unavailable</div>'; return; }
  if (PATH.view !== "analytics") return; // navigated away while the fetch was in flight
  AN.options = j.options;
  // disc counts fill in as the background audits land — refresh quietly
  pollWhilePending(j, "analytics", loadAnalytics);
  v.innerHTML = anRender(j, scope, vs) + `<div class="ig-global"><div class="an-h">Solver &amp; model <span class="sub">— the corpus and the solvers, not hero's hands: this block does not change with the scope</span></div>${await anGlobal(j.global)}</div>`;
  anWire(v, scope, vs);
  anDrawChart(j.primary, j.compare);
  loadMissQueue();
}

/* ---- scope controls: a segmented control for the kind, chips for the items */
function anItems(kind) {
  const o = AN.options;
  if (kind === "sessions") return o.sessions.map((s) => ({ id: s.id, label: `${fmtD(s.startedAt)} · ${s.declared ? presetLabel(s.preset, s) : (s.stakes ?? "?")} · ${s.hands}h` }));
  if (kind === "months") return o.months.map((m) => ({ id: m.key, label: `${m.label} · ${m.hands}h` }));
  if (kind === "stakes") return o.stakes.map((s) => ({ id: s.key, label: `${s.key} · ${s.hands}h` }));
  return [];
}
const anKindSeg = (which, spec) => `<div class="ig-seg" data-which="${which}">${AN_KINDS.map(([k, l]) => `<button aria-pressed="${anParse(spec).kind === k}" data-kind="${k}">${l}</button>`).join("")}</div>`;
const dv = (ms) => { if (!ms) return ""; const d = new Date(ms); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
function anChips(which, spec) {
  const cur = anParse(spec), isVs = which === "vs";
  const lead = isVs ? `<span class="lab">Compare to</span>${anKindSeg("vs", spec)}` : "";
  const off = isVs ? `<button class="ig-chip" data-act="uncompare" title="stop comparing">✕</button>` : "";
  if (cur.kind === "all") return isVs ? `<div class="ig-chips">${lead}<span class="lab">every hand</span>${off}</div>` : "";
  if (cur.kind === "range") {
    const [f, t] = cur.raw.split("-").map(Number);
    return `<div class="ig-chips" data-which="${which}">${lead}<input type="date" class="an-from" value="${dv(f)}"><span class="lab">to</span><input type="date" class="an-to" value="${dv(t)}"><button class="ig-chip" data-act="range">Apply</button>${off}</div>`;
  }
  return `<div class="ig-chips" data-which="${which}" data-kind="${cur.kind}">${lead}${anItems(cur.kind).map((it) => `<button class="ig-chip" aria-pressed="${cur.items.includes(it.id)}" data-item="${esc(it.id)}">${esc(it.label)}</button>`).join("")}${off}</div>`;
}
/** The account and window in words, for the header line — only when they are
 *  actually narrowing anything, so the default page reads as it always did. */
function anNarrowLabel() {
  const p = PATH.profile || "all", w = PATH.window || "all";
  const bits = [];
  if (p !== "all") bits.push(p === "none" ? "unattributed hands" : p);
  if (w !== "all") bits.push((HM_WINDOWS.find(([id]) => id === w) ?? [w, w])[1].toLowerCase());
  return bits.length ? ` · <b>${esc(bits.join(" · "))}</b>` : "";
}

/** Account and window, the two controls Home leads with — same markup here, so
 *  clicking through from Home lands on the same hands. */
function anProfileWindow(j) {
  const cur = PATH.profile || "all", curW = PATH.window || "all";
  const profs = j.options.profiles || [], wins = j.options.windows || [];
  const all = profs.reduce((t, p) => t + (p.hands ?? 0), 0);
  const btn = (attr, id, label, n, on) => `<button aria-pressed="${on}" data-${attr}="${esc(id)}" title="${esc(label)} — ${n} hands">${esc(label)}${n == null ? "" : ` <span class="n">${n}</span>`}</button>`;
  const p = `<div class="ig-seg hm-seg" data-an="profile">${btn("prof", "all", "All", all, cur === "all")}${profs.filter((x) => x.id !== "none" || x.hands > 0).map((x) => btn("prof", x.id, x.label, x.hands, cur === x.id)).join("")}</div>`;
  const w = `<div class="ig-seg hm-seg" data-an="window">${(wins.length ? wins : []).map((x) => btn("win", x.id, x.label, x.hands, curW === x.id)).join("")}</div>`;
  return `<div class="hm-ctl"><span class="lab">Account</span>${p}</div><div class="hm-ctl"><span class="lab">Window</span>${w}</div>`;
}

function anWire(v, scope, vs) {
  v.querySelectorAll("[data-an=profile] button[data-prof]").forEach((b) => b.onclick = () => anGoPW(b.dataset.prof, PATH.window));
  v.querySelectorAll("[data-an=window] button[data-win]").forEach((b) => b.onclick = () => anGoPW(PATH.profile, b.dataset.win));
  const set = (which, spec) => which === "scope" ? anGo(spec, vs) : anGo(scope, spec);
  const allOf = (kind) => kind === "all" ? "all" : kind === "range" ? `range:${AN.options.range.from}-${AN.options.range.to}` : `${kind}:${anItems(kind).map((x) => x.id).join(",")}`;
  v.querySelectorAll(".ig-seg[data-which] button").forEach((b) => b.onclick = () => set(b.closest(".ig-seg").dataset.which, allOf(b.dataset.kind)));
  v.querySelectorAll(".ig-chips[data-kind] .ig-chip[data-item]").forEach((b) => b.onclick = () => {
    const row = b.closest(".ig-chips"), which = row.dataset.which, cur = anParse(which === "scope" ? scope : vs);
    const on = new Set(cur.items);
    if (on.has(b.dataset.item)) { if (on.size === 1) return; on.delete(b.dataset.item); } else on.add(b.dataset.item);
    set(which, `${cur.kind}:${anItems(cur.kind).map((x) => x.id).filter((id) => on.has(id)).join(",")}`);
  });
  v.querySelectorAll("[data-act=range]").forEach((b) => b.onclick = () => {
    const row = b.closest(".ig-chips"), f = row.querySelector(".an-from").valueAsNumber, t = row.querySelector(".an-to").valueAsNumber;
    if (!Number.isFinite(f) || !Number.isFinite(t)) return;
    // date inputs give UTC midnight; the scope wants the local day's bounds
    const day = (ms, end) => { const d = new Date(ms); return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), end ? 23 : 0, end ? 59 : 0, end ? 59 : 0, end ? 999 : 0).getTime(); };
    set(row.dataset.which, `range:${day(f)}-${day(t, true)}`);
  });
  const cmp = v.querySelector("[data-act=compare]"); if (cmp) cmp.onclick = () => anGo(scope, vs ? null : "all");
  v.querySelectorAll("[data-act=uncompare]").forEach((b) => b.onclick = () => anGo(scope, null));
  v.querySelectorAll("tr[data-scope]").forEach((tr) => tr.onclick = () => set("scope", tr.dataset.scope));
  v.querySelectorAll("tr[data-review]").forEach((tr) => tr.onclick = () => go(`/sessions/${encodeURIComponent(tr.dataset.review)}?show=unanswered`));
}

/* ---- the page ---------------------------------------------------------------- */
function anRender(j, scope, vs) {
  const P = j.primary, C = j.compare, a = P.hands, o = C ? C.hands : null, ans = P.answers;
  const first = P.series[0]?.t, last = P.series[P.series.length - 1]?.t;
  const delta = (k, d = 1, suf = "") => o && a[k] != null && o[k] != null ? `<div class="sub ${anCls(a[k] - o[k])}">${sgn(a[k] - o[k], d)}${suf} vs ${esc(C.label)}</div>` : "";
  const tile = (lab, val, sub, c = "", d = "") => `<div class="ig-tile"><div class="lab">${lab}</div><div class="val ${c}">${val}</div>${sub ? `<div class="sub">${sub}</div>` : ""}${d}</div>`;
  return `<header class="ig-head">
    <div><h1>Analytics</h1><p>${a.hands} hands${first ? `, ${fmtD(first)} to ${fmtD(last)}` : ""}${anNarrowLabel()} · <b>${esc(P.label)}</b>${C ? ` · compared with <b>${esc(C.label)}</b> (${o.hands} hands, dashed on the chart)` : ""}</p></div>
    <div class="ig-controls">${anProfileWindow(j)}<div class="ig-sep"></div>${anKindSeg("scope", scope)}<div class="ig-sep"></div><div class="ig-seg"><button aria-pressed="${!!C}" data-act="compare">Compare</button></div></div>
  </header>
  ${anChips("scope", scope)}${C ? anChips("vs", vs) : ""}
  ${a.hands ? "" : '<div class="ig-note">No hands in this scope.</div>'}
  <div class="ig-tiles">
    ${tile("Hands", a.hands, `${P.sessions.length} session${P.sessions.length === 1 ? "" : "s"}`, "", delta("hands", 0))}
    ${tile("Net won", `${sgn(a.netBb, 0)} bb`, `${a.netKnownHands} of ${a.hands} hands with a known net`, anCls(a.netBb), delta("netBb", 0, " bb"))}
    ${tile("bb/100", sgn(a.bb100, 1), a.bb100Se != null ? `±${a.bb100Se.toFixed(1)} standard error` : "over hands with a known net", anCls(a.bb100), delta("bb100"))}
    ${tile("Rake paid", `${(a.rakePaidBb ?? 0).toFixed(1)} bb`, `$${((a.rakePaidCents ?? 0) / 100).toFixed(2)} on ${a.rakedHands ?? 0} won pots · ${a.rakePer100 == null ? "–" : a.rakePer100.toFixed(1)} bb/100`, "", delta("rakePaidBb", 1, " bb"))}
    ${tile("bb/100 after rake", sgn(a.bb100AfterRake, 1), `${(a.rakeUnseenBb ?? 0).toFixed(1)} bb of rake the recorded net had not seen`, anCls(a.bb100AfterRake), delta("bb100AfterRake"))}
    ${tile("VPIP", pctS(a.vpip), "voluntarily put money in preflop", "", delta("vpip", 1, " pp"))}
    ${tile("PFR", pctS(a.pfr), "raised preflop", "", delta("pfr", 1, " pp"))}
    ${tile("3-bet", pctS(a.threeBet), "re-raised when facing a raise", "", delta("threeBet", 1, " pp"))}
    ${tile("WTSD", pctS(a.wtsd), "went to showdown after seeing the flop", "", delta("wtsd", 1, " pp"))}
    ${tile("Discrepancies", a.discPer100 == null ? "–" : a.discPer100.toFixed(0), `per 100 hands · ${a.discrepancies.major} major`, "", delta("discPer100", 0))}
    ${tile("Answered", P.kind === "sessions" && P.sessions.length === 1 ? `<a class="ig-link" href="/sessions/${encodeURIComponent(P.sessions[0].id)}?show=unanswered" onclick="go('/sessions/${encodeURIComponent(P.sessions[0].id)}?show=unanswered');return false" title="review the unanswered decisions">${pctS(ans.decisionsCoveredPct)}</a>` : pctS(ans.decisionsCoveredPct), `of ${ans.decisions} decisions${ans.unansweredNodes ? ` · ${ans.unansweredNodes} unanswered` : ""}${P.kind === "sessions" && P.sessions.length === 1 ? " · click to review" : ""}`)}
    ${tile("Followed", pctS(ans.followedPct), `${ans.followed} of ${ans.graded} graded decisions`)}
  </div>
  <section class="ig-panel"><h2>Cumulative result by hand</h2><div class="ig-chart"><canvas id="an-canvas"></canvas></div><div class="ig-legend" id="an-legend"></div></section>
  <div class="ig-grid2">
    <section class="ig-panel"><h2>By session <span class="ig-dim">— ${P.kind === "sessions" && P.sessions.length === 1 ? "click the session again to open its page, with the unanswered hands on top" : "click a session to scope the analytics to it"}</span></h2><div class="tbl">${anSessionsTable(P)}</div></section>
    <section class="ig-panel"><h2>Preflop and postflop stats</h2><div class="tbl">${anStatsTable(P)}</div></section>
  </div>
  <div class="ig-grid2">
    <section class="ig-panel"><h2>By position</h2><div class="tbl">${anBreakdownTable(P.byPosition, "Seat", null)}</div></section>
    <section class="ig-panel"><h2>By stakes</h2><div class="tbl">${anBreakdownTable(P.byStakes, "Stakes", "stakes")}</div></section>
  </div>
  <div class="ig-grid2">
    <section class="ig-panel"><h2>By month</h2><div class="tbl">${anBreakdownTable(P.byMonth, "Month", "months")}</div></section>
    <section class="ig-panel"><h2>Study answers</h2><div class="tbl">${anAnswersTable(P)}</div></section>
  </div>
  <p class="ig-note"><b>How the numbers are made.</b> Net per hand is exact when the pot was uncontested or you folded (pot minus what you put in, or minus what you put in); a showdown hand takes the change in your stack to the next hand at the same stakes, when that is plausible for the pot, and is otherwise unknown. Unknown hands are drawn flat and dashed on the chart and left out of net, bb/100 and its standard error (100 × the standard deviation of the per-hand net over √n). Sessions are the ones declared on the wrapper's setup page; hands played before that are grouped by 45-minute gaps. Study answers are counted per distinct decision, not per row: an answer is joined to the decision it answered by hero's action index, so the panel's repeats collapse and a hand with three answers and an unanswered river counts as three of four. A decision exists if the archive holds the hero action OR an answer succeeded there — the archive sometimes stops before your own last action, and only decisions whose action was captured can be graded told-versus-did. Answers keyed to a node you never acted on (a stale read of the table) are counted apart as stray captures and are never treated as decisions. Discrepancies are the audit of what the panel showed against what the archive recorded.</p>`;
}

const AN_POS = ["BTN", "SB", "BB", "CO", "HJ", "MP", "UTG"];
function anBreakdownTable(map, first, kind) {
  const keys = Object.keys(map || {});
  if (!keys.length) return '<div class="ig-note" style="margin:0">nothing in this scope</div>';
  const pos = (k) => { const i = AN_POS.indexOf(k); return i < 0 ? 99 : i; };
  keys.sort((x, y) => kind === "months" ? y.localeCompare(x) : kind ? map[y].hands - map[x].hands : pos(x) - pos(y));
  const maxAbs = Math.max(1, ...keys.map((k) => Math.abs(map[k].bb100 ?? 0)));
  const rows = keys.map((k) => {
    const x = map[k], b = x.bb100, w = b == null ? 0 : Math.round((60 * Math.abs(b)) / maxAbs);
    return `<tr${kind ? ` class="pick" data-scope="${esc(kind)}:${esc(k)}" title="scope to this"` : ""}><td>${esc(x.label ?? k)}</td><td class="num">${x.hands}</td><td class="num ${anCls(x.netBb)}">${sgn(x.netBb, 0)}</td><td class="num ${anCls(b)}">${sgn(b, 1)}</td><td class="num">${pctS(x.vpip)}</td><td class="num">${pctS(x.pfr)}</td><td style="text-align:left"><span class="ig-bar" style="width:${w}px;background:${b >= 0 ? "var(--win)" : "var(--loss)"}"></span></td></tr>`;
  }).join("");
  return `<table><thead><tr><th>${first}</th><th>Hands</th><th>Net bb</th><th>bb/100</th><th>VPIP</th><th>PFR</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
}
function anSessionsTable(P) {
  if (!P.sessions.length) return '<div class="ig-note" style="margin:0">no sessions in this scope</div>';
  // first click scopes the analytics to the session; once it IS the scope, the click goes on to the session page
  const scopedTo = P.kind === "sessions" && P.sessions.length === 1 ? P.sessions[0].id : null;
  const rows = P.sessions.slice().reverse().map((s) => `<tr class="pick" ${s.id === scopedTo ? `data-review="${esc(s.id)}" title="open this session's page — its hands, the unanswered ones on top"` : `data-scope="sessions:${esc(s.id)}" title="scope the analytics to this session"`}>
      <td>${fmtT(s.startedAt)} <span class="ig-dim">· ${s.declared ? esc(presetLabel(s.preset, s)) : "undeclared"}</span> <a class="ig-dim" href="/sessions/${encodeURIComponent(s.id)}" onclick="event.stopPropagation();go('/sessions/${encodeURIComponent(s.id)}');return false">page ↗</a></td>
      <td class="num">${s.hands}</td><td class="num ${anCls(s.netBb)}">${sgn(s.netBb, 0)}</td><td class="num ${anCls(s.bb100)}">${sgn(s.bb100, 1)}</td><td class="num">${(s.rakePaidBb ?? 0).toFixed(1)}</td>
      <td class="num">${pctS(s.vpip)}</td><td class="num">${pctS(s.pfr)}</td><td class="num">${s.discPer100 == null ? "–" : s.discPer100.toFixed(0)}</td>
      <td class="num"><a class="ig-link" href="/sessions/${encodeURIComponent(s.id)}?show=unanswered" onclick="event.stopPropagation();go('/sessions/${encodeURIComponent(s.id)}?show=unanswered');return false" title="review this session's hands with the unanswered ones on top">${pctS(s.answers.decisionsCoveredPct)}</a></td><td class="num">${pctS(s.answers.followedPct)}</td></tr>`).join("");
  const a = P.hands;
  return `<table><thead><tr><th>Session</th><th>Hands</th><th>Net bb</th><th>bb/100</th><th>Rake bb</th><th>VPIP</th><th>PFR</th><th>Disc/100</th><th>Answered</th><th>Followed</th></tr></thead><tbody>${rows}</tbody>
    <tfoot><tr><td>Selected</td><td class="num">${a.hands}</td><td class="num ${anCls(a.netBb)}">${sgn(a.netBb, 0)}</td><td class="num ${anCls(a.bb100)}">${sgn(a.bb100, 1)}</td><td class="num">${(a.rakePaidBb ?? 0).toFixed(1)}</td><td class="num">${pctS(a.vpip)}</td><td class="num">${pctS(a.pfr)}</td><td class="num">${a.discPer100 == null ? "–" : a.discPer100.toFixed(0)}</td><td class="num">${pctS(P.answers.decisionsCoveredPct)}</td><td class="num">${pctS(P.answers.followedPct)}</td></tr></tfoot></table>`;
}
/* services/answerLog.ts FAIL_KINDS, in the words the tables use. */
const WHY_MEANS = {
  "no-solution": "the solve chain had nothing for this spot",
  "off-tree": "the line contains a size the tree does not offer",
  "not-in-range": "hero's combo has no weight in the chart at this node",
  "not-heros-turn": "the solver re-read the table and hero was not on the clock",
  "hand-over": "the hand had ended by the time the solve ran",
  "solver-timeout": "the fast-solver request passed its deadline",
  "solver-unreachable": "the fast-solver could not be reached at all",
  "solver-bad-response": "it answered, but not with JSON",
  "gtow-down": "GTO Wizard was not connected while hero was on the clock",
  "abandoned-stale": "the verdict arrived after hero had already acted",
  "no-probe": "hero acted and the decision was never asked about",
  unexplained: "no trace of this decision anywhere — from before the reasons were logged",
  unknown: "logged, but the reason did not match a known kind",
};
const anStatRows = (rows) => `<table><thead><tr><th>Stat</th><th>Value</th><th style="text-align:left">Meaning</th></tr></thead><tbody>${rows.map((r) => `<tr><td>${r[0]}</td><td class="num">${r[1]}</td><td class="ig-meaning">${r[2]}</td></tr>`).join("")}</tbody></table>`;
function anStatsTable(P) {
  const a = P.hands;
  return anStatRows([
    ["VPIP", pctS(a.vpip), "voluntarily put money in preflop"],
    ["PFR", pctS(a.pfr), "raised preflop"],
    ["3-bet", pctS(a.threeBet), "re-raised when facing a raise"],
    ["WTSD", pctS(a.wtsd), "went to showdown after seeing the flop"],
    ["Flops seen", pctS(a.sawFlop), "hands that reached the flop with you in"],
    ["Limped pots", pctS(a.limpedPots), "hands where the pot was limped"],
    ["Discrepancies", a.discPer100 == null ? "–" : a.discPer100.toFixed(1), `per 100 hands · ${a.discrepancies.major} major, ${a.discrepancies.minor} minor, ${a.discrepancies.info} info`],
    ["Known net", pctS(a.hands ? Math.round((1000 * a.netKnownHands) / a.hands) / 10 : null), "hands whose net result could be established"],
    ["Rake paid", `${(a.rakePaidBb ?? 0).toFixed(1)} bb · $${((a.rakePaidCents ?? 0) / 100).toFixed(2)}`, `on the ${a.rakedHands ?? 0} pots you won that saw a flop — 5% capped by players dealt, no flop no drop`],
    ["Rake per 100", a.rakePer100 == null ? "–" : `${a.rakePer100.toFixed(1)} bb`, "rake paid per 100 hands, all hands in the scope"],
    ["Net after rake", `${sgn(a.netAfterRakeBb, 1)} bb`, `${sgn(a.bb100AfterRake, 1)} bb/100 — the recorded net less the ${(a.rakeUnseenBb ?? 0).toFixed(1)} bb of rake it never saw (uncontested wins are priced off the displayed pot; showdown wins already have rake out)`],
  ]);
}
function anAnswersTable(P) {
  const x = P.answers, tiers = Object.entries(x.tiers || {});
  return anStatRows([
    ["Decisions answered", `${x.decisionsCovered} of ${x.decisions}`, `${pctS(x.decisionsCoveredPct)} of hero's decisions · ${x.answers} answers logged, ${x.failed} failed`],
    ["Unanswered decisions", x.unansweredNodes, `${x.partialHands} hand${x.partialHands === 1 ? "" : "s"} got some answers but not all`],
    ...Object.entries(x.failKinds || {}).sort((a, b) => b[1] - a[1]).map(([k, n]) => [`· ${esc(k)}`, n, esc(WHY_MEANS[k] || "")]),
    ["Stray captures", x.strayCaptures, "answers keyed to a node hero never acted on — phantom reads, not decisions"],
    // Integrity is a BUG counter, kept out of the discrepancy audit on purpose: the
    // audit runs at ~130 per 100 hands, and a fault dropped in there would never be
    // seen. This line should read 0. (services/answerIntegrity.ts)
    [`<b${x.integrity?.faults ? ' style="color:var(--loss)"' : ""}>Integrity faults</b>`,
     x.integrity ? (x.integrity.faults ? `<b style="color:var(--loss)">${x.integrity.faults}</b>` : "0") : "–",
     x.integrity
       ? (x.integrity.faults
           ? `SEVERE — ${x.integrity.servedOffMix} served an action its own mix does not play, ${x.integrity.rollMismatch} where the roll landed elsewhere`
           : `every one of the ${x.integrity.checked} checkable answers agreed with its own mix`)
       : ""],
    ["· not checkable", x.integrity?.unchecked ?? "–", "answers logged before the mix was stored with them (before 2026-09-03) — unchecked, not clean"],
    ["Hands answered", pctS(x.handsAnsweredPct), `${x.handsAnswered} of ${P.hands.hands} hands got at least one answer`],
    ["Followed advice", pctS(x.followedPct), `${x.followed} of ${x.graded} graded decisions went the way the panel said`],
    ["MES ≠ GTO", pctS(x.disagreementRate), `${x.disagreements} of ${x.withBoth} decisions where the two picks disagreed`],
    ["Followed MES", pctS(x.followedMesWhenDisagreed), "when the two disagreed"],
    ...tiers.map(([k, t]) => [esc(k), t.n, `answers from this tier · p50 ${t.p50 ?? "–"} ms, p90 ${t.p90 ?? "–"} ms`]),
  ]);
}

/* ---- the chart: cumulative result by hand, Chart.js like the artifact -------
   Also drawn, with its own canvas and chart slot, by the session page's Outcome
   card (opt = { canvas, legend, slot }) — one chart renderer for both. */
function anDrawChart(P, C, opt = {}) {
  const slot = opt.slot ?? "chart";
  const cv = $(opt.canvas ?? "an-canvas");
  if (!cv) return;
  if (!window.Chart) {
    const s = document.querySelector("script[data-chartjs]");
    if (s && !s.dataset.failed) { s.addEventListener("load", () => anDrawChart(P, C, opt), { once: true }); s.addEventListener("error", () => { s.dataset.failed = "1"; anDrawChart(P, C, opt); }, { once: true }); }
    if (!s || s.dataset.failed) cv.parentElement.innerHTML = '<div class="ig-note" style="margin:0">Chart.js did not load (offline?) — the tables carry the same numbers.</div>';
    return;
  }
  const cum = (series) => { let c = 0; return series.map((h, i) => { if (h.net != null) c += h.net; return { x: i, y: Math.round(c * 100) / 100, known: h.net != null, id: h.id, t: h.t }; }); };
  const p = cum(P.series), q = C ? cum(C.series) : null;
  const win = anCss("--win"), evc = anCss("--ev"), muted = anCss("--muted"), grid = anCss("--grid"), ink = anCss("--ink"), faint = anCss("--faint");
  if (AN[slot]) { AN[slot].destroy(); AN[slot] = null; }
  AN[slot] = new Chart(cv, {
    type: "line",
    data: { datasets: [
      { label: P.label, data: p, borderColor: win, borderWidth: 2, pointRadius: 0, tension: 0, order: 2,
        fill: { target: "origin", above: anCss("--win-soft"), below: anCss("--loss-soft") },
        segment: { borderDash: (c) => p[c.p1DataIndex]?.known ? undefined : [4, 4], borderColor: (c) => p[c.p1DataIndex]?.known ? undefined : faint } },
      ...(q ? [{ label: C.label, data: q, borderColor: evc, borderWidth: 1.5, borderDash: [6, 4], pointRadius: 0, tension: 0, order: 1, fill: false }] : []),
    ] },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false, parsing: false, interaction: { mode: "index", intersect: false },
      plugins: { legend: { display: false }, tooltip: {
        callbacks: {
          title: (it) => { const r = it[0].raw; return `Hand ${it[0].parsed.x + 1} · #${r.id} · ${fmtT(r.t)}`; },
          label: (it) => ` ${it.dataset.label}: ${sgn(it.parsed.y, 1)} bb${it.raw.known ? "" : " · this hand's net is unknown"}`,
        },
        backgroundColor: anCss("--surface"), titleColor: ink, bodyColor: ink, borderColor: anCss("--line"), borderWidth: 1, titleFont: { family: "JetBrains Mono, ui-monospace, Consolas, monospace" }, bodyFont: { family: "JetBrains Mono, ui-monospace, Consolas, monospace" } } },
      scales: {
        x: { type: "linear", min: 0, max: Math.max(1, Math.max(p.length, q ? q.length : 0) - 1), ticks: { color: muted, font: { family: "JetBrains Mono, ui-monospace, Consolas, monospace", size: 11 }, maxTicksLimit: 12, callback: (v) => v }, grid: { color: grid }, title: { display: true, text: "hands", color: muted } },
        y: { ticks: { color: muted, font: { family: "JetBrains Mono, ui-monospace, Consolas, monospace", size: 11 }, callback: (v) => `${v} bb` }, grid: { color: (c) => c.tick.value === 0 ? muted : grid, lineWidth: (c) => c.tick.value === 0 ? 1.5 : 1 } },
      },
    },
  });
  // the axes are sized with whatever font is loaded at draw time; re-lay them out once the web fonts arrive
  if (document.fonts && document.fonts.status !== "loaded") document.fonts.ready.then(() => { if (AN[slot] && AN[slot].canvas === cv) AN[slot].update(); });
  const unk = p.filter((x) => !x.known).length;
  const leg = $(opt.legend ?? "an-legend");
  if (leg) leg.innerHTML = `<span><i></i>${esc(P.label)}</span>${C ? `<span><i class="ev"></i>${esc(C.label)}</span>` : ""}${unk ? `<span><i class="unk"></i>net unknown (${unk} hands, carried flat)</span>` : ""}<span><i class="zero"></i>Break-even</span>`;
}

/* ---- global block: solver and corpus, unchanged by the scope --------------- */
async function anGlobal(g) {
  let html = "";
  try {
    const mv = await (await fetch("/api/dashboard/mes-value")).json();
    if (mv.ok) {
      const f1 = (x) => x == null ? "—" : (x >= 0 ? "+" : "") + Number(x).toFixed(1);
      html += `<div class="card"><h2>Winrate ladder — graded backtest, measured rake (bb/100)</h2>
        <table><thead><tr><th>strategy</th><th>no rake</th><th>NL200 rake</th><th>NL25 rake</th><th>footing</th></tr></thead><tbody>` +
        mv.ladder.map((r) => `<tr><td>${esc(r.strategy)}</td><td>${f1(r.norake)}</td><td><b>${f1(r.nl200)}</b></td><td><b>${f1(r.nl25)}</b></td><td class="sub">${esc(r.note)}</td></tr>`).join("") +
        `</tbody></table></div>`;
      const famRow = (name, f, src) => f ? `<tr><td>${esc(name)}</td><td>${esc(src)}</td><td>${f.arrivals}</td><td>${f.arrival_pct_of_hands}%</td><td>${f1(f.mean_ev_gain_per_arrival)} bb</td><td><b>${f1(f.uplift_bb100)}</b></td></tr>` : "";
      const fams = ["M1_heroSB_bvb_cbet", "M2_heroBTN_srp_vs_BB"];
      html += `<div class="card"><h2>Postflop MES uplift — v3 locked solves, per arrival → bb/100</h2>
        <table><thead><tr><th>family</th><th>source</th><th>arrivals</th><th>% of hands</th><th>mean ev_gain / arrival</th><th>uplift bb/100</th></tr></thead><tbody>` +
        fams.map((k) => famRow(k, mv.corpus?.families?.[k], `corpus (${mv.corpus?.hands ?? 0} hands)`) + famRow(k, mv.live?.families?.[k], `live (${mv.live?.hands ?? 0} hands)`)).join("") +
        `<tr><td><b>total</b></td><td>corpus</td><td></td><td></td><td></td><td><b>${f1(mv.corpus?.total_uplift_bb100)}</b></td></tr>
         <tr><td><b>total</b></td><td>live</td><td></td><td></td><td></td><td><b>${f1(mv.live?.total_uplift_bb100)}</b></td></tr>
        </tbody></table>
        <div class="sub" style="margin-top:8px">${(mv.caveats || []).map((t) => "• " + esc(t)).join("<br>")}</div></div>`;
    }
  } catch (e) { html += `<div class="card warn">mes-value unavailable: ${esc(String(e))}</div>`; }
  const t = g?.answers?.tiers ?? {};
  html += `<div class="card"><h2>Study answers (last 60 days, every hand)</h2>
    <div class="sub">${g?.answers?.answered ?? 0} answered · ${g?.answers?.failed ?? 0} failed</div>
    <table><thead><tr><th>tier</th><th>n</th><th>p50 ms</th><th>p90 ms</th><th>max ms</th></tr></thead><tbody>
    ${Object.entries(t).map(([k, x]) => `<tr><td>${esc(k)}</td><td>${x.n}</td><td>${x.p50}</td><td>${x.p90}</td><td>${x.max}</td></tr>`).join("")}
    </tbody></table></div>`;
  html += `<div id="miss-queue"><div class="card sub">loading the preflop miss queue…</div></div>`;
  return html;

/* ================= preflop miss queue ================= */
// Postflop is complete (the AI chain solves any board on demand). Preflop has
// no live equivalent, so every chart miss is written down with the state to
// solve it; the HRC runner works the queue between sessions.
let MQ = null, mqFilter = "active", mqTimer = null, mqShowAll = false, mqShowAllJobs = false;
const MQ_KIND = {
  "size-snapped": ["size snapped", "answered, but from a size ≥0.1 log-bb away (e.g. a 3.9x open served from the 3.5x node)"],
  "size-off-tree": ["size off tree", "the played size is further than τ from every size in the tree — no answer"],
  "action-not-in-tree": ["action not in tree", "a limp / call / check the tree shape does not contain — no answer"],
  "jam-not-offered": ["jam not offered", "an all-in at a node with no aggressive action — no answer"],
  "node-missing": ["node missing", "the walked line is not in the solution — no answer"],
  "past-terminal": ["past terminal", "the line runs on past a terminal node — no answer"],
  "beyond-ladder": ["beyond ladder", "deep stacks past the 150bb rung — answered from the 150bb chart"],
  other: ["other", "an unclassified walk failure"],
};
const mqKind = (k) => `<span class="mq-kind ${esc(k)}" title="${esc((MQ_KIND[k] || MQ_KIND.other)[1])}">${esc((MQ_KIND[k] || MQ_KIND.other)[0])}</span>`;

async function loadMissQueue() {
  const host = $("miss-queue");
  if (!host) return;
  let j;
  try { j = await (await fetch("/api/dashboard/miss-queue")).json(); } catch (e) { host.innerHTML = '<div class="card warn">miss queue unavailable</div>'; return; }
  if (!j.ok) { host.innerHTML = '<div class="card warn">miss queue unavailable</div>'; return; }
  MQ = j;
  renderMissQueue();
  clearTimeout(mqTimer);
  // the sweep's progress bar lives on Analytics: poll while it is on screen (route() stops it on the way out)
  if (j.sweep.running && PATH.view === "analytics") mqTimer = setTimeout(() => whenVisible("missq", () => { if (PATH.view === "analytics") loadMissQueue(); }), 2000);
}

function renderMissQueue() {
  const host = $("miss-queue");
  if (!host || !MQ) return;
  const st = MQ.stats, sw = MQ.sweep;
  const bs = st.byStatus || {};
  const tile = (k, val, sub) => `<div class="tile"><div class="v num">${val}</div><div class="k">${k}</div>${sub ? `<div class="s">${sub}</div>` : ""}</div>`;
  const kinds = Object.entries(st.byKind || {}).sort((a, b) => b[1] - a[1]).map(([k, n]) => `${mqKind(k)} <span class="sub num">${n}</span>`).join(" &nbsp; ");
  const sweepHtml = sw.running
    ? `<span class="mq-prog">sweeping ${esc(sw.source)} <span class="bar"><i style="width:${sw.total ? Math.round(100 * sw.done / sw.total) : 0}%"></i></span> ${sw.done}/${sw.total} decisions · ${sw.misses} inexact · ${sw.charts} charts</span>`
    : sw.finishedAt
      ? `<span class="sub">last sweep: ${esc(sw.source)} · ${sw.decisions} decisions, ${sw.misses} inexact · ${sw.error ? `<span class="warn">${esc(sw.error)}</span>` : `${fmtAgo(sw.finishedAt)}`}</span>`
      : `<span class="sub">no sweep yet this run</span>`;
  const active = (MQ.items || []).filter((x) => mqFilter === "all" ? true : mqFilter === "active" ? (x.status === "open" || x.status === "queued") : x.status === mqFilter);
  const rows = (mqShowAll ? active : active.slice(0, 120)).map(mqRow).join("");
  // the runner's unit is a job, not an item: group the filtered items by the chart they'd produce
  const byJob = new Map();
  for (const x of active) {
    if (!x.job) continue;
    const g = byJob.get(x.job.id) || { job: x.job, n: 0, items: 0, kinds: {}, status: {}, live: 0, chart: x.chart };
    g.n += x.n; g.items++; g.live += x.nLive; g.kinds[x.kind] = (g.kinds[x.kind] || 0) + x.n; g.status[x.status] = (g.status[x.status] || 0) + 1;
    byJob.set(x.job.id, g);
  }
  const jobs = [...byJob.values()].sort((a, b) => b.n - a.n);
  const jobRows = (mqShowAllJobs ? jobs : jobs.slice(0, 25)).map((g) => {
    const st = g.status.queued ? (g.status.open ? "partly queued" : "queued") : g.status.solved && !g.status.open ? "solved" : g.status.dismissed && !g.status.open ? "dismissed" : "open";
    return `<tr class="src-static">
      <td><div class="mono">${esc(g.job.id)}</div><div class="sub">${esc(g.job.change)}</div></td>
      <td class="mq-state"><b>${esc(g.job.site)}</b> · ${g.job.stacksBB.join("/")}bb<div class="sub">from ${esc(g.chart)}</div></td>
      <td>${Object.entries(g.kinds).sort((a, b) => b[1] - a[1]).map(([k, n]) => `${mqKind(k)} <span class="sub num">${n}</span>`).join(" ")}</td>
      <td class="num"><b>${g.n}</b><div class="sub">${g.items} item${g.items === 1 ? "" : "s"}${g.live ? ` · live ${g.live}` : ""}</div></td>
      <td><span class="chip ${st === "queued" ? "good" : st === "open" ? "warn" : "dim"}">${st}</span></td>
      <td><div style="display:flex;gap:4px;flex-wrap:wrap">
        <button class="mini" onclick="mqJobStatus('${esc(g.job.id)}','queued')" ${st === "queued" ? "disabled" : ""}>queue</button>
        <button class="mini" onclick="mqJobStatus('${esc(g.job.id)}','open')" ${st === "open" ? "disabled" : ""}>open</button>
        <button class="mini" onclick="mqJobStatus('${esc(g.job.id)}','dismissed')">dismiss</button></div></td></tr>`;
  }).join("");
  host.innerHTML = `<div class="card">
    <h2>Preflop miss queue <span class="sub">— ${bs.open || 0} open · ${bs.queued || 0} queued · ${bs.solved || 0} solved · ${bs.dismissed || 0} dismissed</span></h2>
    <div class="banner">🧭 <b>Preflop is completed offline.</b> Postflop has the AI chain to solve any board on demand; a 3-handed preflop state takes HRC 12–90 min, so it can't be solved live. Instead every spot the chart corpus couldn't answer <i>exactly</i> is written down here with its state — stacks, line, the size or action the tree lacked — and a suggested HRC job. Queue the ones worth solving, write the plan, run it in HRC Runner; when the chart lands, <b>re-check</b> marks the item solved.</div>
    <div class="tiles">
      ${tile("open", bs.open || 0)} ${tile("queued", bs.queued || 0)} ${tile("solved", bs.solved || 0)}
      ${tile("decisions affected", (st.hands.live + st.hands.archive + st.hands.corpus), `live ${st.hands.live} · archive ${st.hands.archive} · corpus ${st.hands.corpus}`)}
    </div>
    <div class="sub" style="margin:10px 0 4px">${kinds || "no open misses"}</div>
    <div class="mq-ctl">
      <select id="mq-filter" onchange="mqFilter=this.value;renderMissQueue()">
        ${[["active", "open + queued"], ["all", "everything"], ["open", "open"], ["queued", "queued"], ["solved", "solved"], ["dismissed", "dismissed"]].map(([v, l]) => `<option value="${v}" ${mqFilter === v ? "selected" : ""}>${l}</option>`).join("")}
      </select>
      <button class="mini fleet-only" onclick="mqSweep('archive')" ${sw.running ? "disabled" : ""} title="walk every hero preflop decision in hands.db through the charts">sweep archive</button>
      <button class="mini fleet-only" onclick="mqSweep('corpus')" ${sw.running || !MQ.corpus ? "disabled" : ""} title="walk every preflop node of the 4k-hand Zone corpus through the charts (all actors) — minutes">sweep 4k corpus</button>
      <button class="mini fleet-only" onclick="mqPlan()" ${(bs.queued || 0) ? "" : "disabled"} title="write one HRC plan per queued job + a runner queue">write HRC plan (${bs.queued || 0} queued)</button>
      ${sweepHtml}
    </div>
    <h2 style="margin-top:14px">Suggested HRC jobs <span class="sub">— ${jobs.length} distinct, by decisions covered${jobs.length > 25 && !mqShowAllJobs ? ` · showing 25 <a href="#" onclick="mqShowAllJobs=true;renderMissQueue();return false">show all</a>` : ""}</span></h2>
    <div class="scroll"><table><thead><tr><th>job</th><th>state</th><th>what it fixes</th><th class="num">decisions</th><th>status</th><th></th></tr></thead>
    <tbody>${jobRows || `<tr class="src-static"><td colspan="6" class="sub">no jobs to suggest</td></tr>`}</tbody></table></div>
    <h2 style="margin-top:14px">Items <span class="sub">— ${active.length}${active.length > 120 && !mqShowAll ? ` · showing 120 <a href="#" onclick="mqShowAll=true;renderMissQueue();return false">show all</a>` : ""}</span></h2>

}

/* ================= chart catalog: the Charts picker =================
   WHY THIS IS FACETED AND NOT A SEARCH BOX (2026-09-20, Brady: "let me search
   'even 100bb stacks 2.5 open size from hijack' instead of the esoteric naming
   convention"). Every dimension of a chart is low-cardinality and enumerable —
   ~21 depth rungs, 5 open sizes, 6 short seats, 4 rooms, 6 generations. There is
   nothing to understand, only vocabulary to recognise, so the box parses words
   into FACET VALUES and shows each as a chip you can take back off. Word order
   does not matter and neither does the id's spelling: "2.5", "2.5x" and "o2_5"
   all reach the same facet, "hijack" and "hj" the same seat.

   A SEAT IS NOT A CHART FACET. One 2.5x tree holds UTG's open, HJ's open and the
   rest — "from hijack" names a NODE inside the chart, not a different chart. So a
   seat chip filters nothing; it turns each row's "show the node" button into that
   seat's first-in line and renders the strategy there. */
let CAT = null, catSel = {}, catText = "", catSug = [], catSugI = 0, catOpenRow = null, catMore = {};

const stacksStr = (e) => {
  if (!e.stacksBB) return e.depth != null ? `${e.depth}bb` : "—";
  const seats = e.seats ?? Object.keys(e.stacksBB);
  const vals = seats.map((s) => e.stacksBB[s]);
  return vals.every((v) => v === vals[0]) ? `${vals[0]}bb even`
    : seats.map((s) => `${s} ${e.stacksBB[s]}`).join(" · ");
};
/** What a chart row was solved WITH, from its sidecar (chartCatalog.sidecarFacts, 2026-09-24): the rake and cap, the
 *  ante, and the size menu. An API from before that carries none of it, and the cell says so once. */
function catSetupCell(e) {
  if (!e.rake && e.anteBb == null && !e.sizes?.length) return '<span class="sub">—</span>';
  const r = e.rake;
  const rake = !r ? "rake not stated" : !r.pct && !r.capBb ? "no rake" : `${r.pct}% cap ${r.capBb}bb${r.nfnd ? " NFND" : ""}`;
  return `<span style="white-space:nowrap">${esc(rake)}${e.anteBb ? ` · ante ${esc(e.anteBb)}bb` : ""}</span>${e.sizes?.length ? `<div class="sub" style="white-space:normal;max-width:320px">${e.sizes.map(esc).join(" · ")}</div>` : ""}`;
}
const fmtAgo = (ms) => {
  const m = Math.round((Date.now() - ms) / 60000);
  return m < 60 ? `${m}m ago` : m < 1440 ? `${Math.round(m / 60)}h ago` : `${Math.round(m / 1440)}d ago`;
};

/* ---- the facet model ----
   `of` maps an entry to its value in this facet (null = the facet does not apply to
   that chart). `alias` gives the words that reach a value beyond its own label. */
const CAT_SEATS = ["UTG", "HJ", "CO", "BTN", "SB", "BB"];
const SEAT_WORDS = { UTG: ["utg", "underthegun", "firstin"], HJ: ["hj", "hijack"], CO: ["co", "cutoff"], BTN: ["btn", "button", "dealer"], SB: ["sb", "smallblind"], BB: ["bb", "bigblind"] };
const gameOf = (e) => e.family === "6max" ? "6-max" : e.family === "husng" ? "HU SnG"
  : e.players === 2 ? "heads-up" : e.players === 3 ? "3-max" : e.players ? `${e.players}-max` : null;
const CAT_FACETS = [
  { key: "game", label: "game", of: gameOf,
    alias: { "3-max": ["3max", "3handed", "threemax", "zone", "trio"], "6-max": ["6max", "6handed", "sixmax", "ring", "full"], "heads-up": ["hu", "headsup", "heads"], "HU SnG": ["husng", "sng", "sitngo", "tournament"] } },
  { key: "stake", label: "stake", of: (e) => e.stake ?? null,
    alias: { NL200: ["200nl", "nl200"], NL25: ["25nl", "nl25"], NL50: ["50nl", "nl50"], NL100: ["100nl", "nl100"], NL500: ["500nl", "nl500"] } },
  { key: "room", label: "room", of: (e) => e.source === "gtow" ? "GTO Wizard library" : e.site ? (e.site.startsWith("cp") ? "CoinPoker" : "Ignition") : null,
    alias: { Ignition: ["ign", "ignition", "bovada"], CoinPoker: ["cp", "coinpoker"], "GTO Wizard library": ["gtow", "wizard", "library"] } },
  { key: "depth", label: "depth", of: (e) => e.depth != null ? `${e.depth}bb` : null, numeric: true },
  { key: "shape", label: "stacks", of: (e) => e.shape ?? null,
    display: { even: "all equal", short: "one seat short", patch: "bespoke stacks" },
    alias: { even: ["even", "equal", "symmetric", "flat"], short: ["short", "asym", "asymmetric", "uneven"], patch: ["patch", "bespoke", "custom"] } },
  { key: "shortSeat", label: "short seat", of: (e) => e.shortSeat && e.shortSeat !== "EQ" ? e.shortSeat : null, alias: SEAT_WORDS },
  { key: "shortDepth", label: "short stack", of: (e) => e.shape === "short" && e.shortDepth != null ? `${e.shortDepth}bb` : null, numeric: true },
  { key: "open", label: "open size", of: (e) => e.open == null ? null : e.open === "limp" ? "limp" : `${e.open}x`, numeric: true,
    alias: { limp: ["limp", "limped", "olimp"] } },
  { key: "threeBet", label: "3-bet", of: (e) => e.threeBet == null ? null : e.threeBet === "jam" ? "jam" : `${e.threeBet}bb`, numeric: true,
    alias: { jam: ["jam", "shove", "allin"] } },
  { key: "variant", label: "generation", of: (e) => e.variant ?? null,
    display: { base: "original", v2: "v2 full postflop", v2b: "A/B flop-only", v2ci: "re-solved (v2ci)", lock: "locked root", patch: "patch", accept: "acceptance check" },
    alias: { v2ci: ["2ci", "resolved", "resolve", "current", "latest"], lock: ["lock", "locked", "lockedroot"], base: ["base", "original", "first"], patch: ["patch"], accept: ["acceptance", "hrc1"] } },
  { key: "routed", label: "used by", of: (e) => e.routed ?? "browse-only",
    alias: { "browse-only": ["browse", "unused", "unrouted"] }, liveFirst: true },
  { key: "stored", label: "stored", of: (e) => e.source !== "hrc" ? "bundled" : e.cachedLocally ? "on this disk" : "R2 only",
    alias: { "on this disk": ["cached", "local", "disk"], "R2 only": ["r2", "remote", "cloud"] } },
];
/* The seat a spot is asked FROM. Not a filter — see the header comment. */
const CAT_SEAT_FACET = { key: "seat", label: "to act", alias: SEAT_WORDS };

const catNorm = (s) => String(s).toLowerCase().replace(/[^a-z0-9.]/g, "");
const catDisplay = (f, v) => (f.display && f.display[v]) || v;
/** every word that reaches this value */
const catWords = (f, v) => [catNorm(v), catNorm(catDisplay(f, v)), ...((f.alias && f.alias[v]) || []).map(catNorm)];
/** a value safe to drop into an inline onclick */
const catArg = (v) => JSON.stringify(String(v)).replace(/"/g, "&quot;");

/** rows matching every selected facet except `skip` (so a facet's own counts are drill-down counts).
 *  `useText` false ignores what is half-typed in the box: a count must say how many charts
 *  PICKING this value would leave, and the word being typed is about to become that chip,
 *  not an extra filter on top of it. Typing "6max" otherwise read 66 where the answer is 74. */
function catMatch(rows, skip, useText = true) {
  return rows.filter((e) => CAT_FACETS.every((f) => {
    if (f.key === skip) return true;
    const want = catSel[f.key];
    if (!want || !want.length) return true;
    const v = f.of(e);
    return v != null && want.includes(v);
  }) && (!useText || !catText || `${e.name} ${e.id}`.toLowerCase().includes(catText)));
}
/** A typed word filters text ONLY when it names no facet — then it is a plain substring
 *  search over the name and the id, so pasting an id still finds its chart. */
const catTextOn = () => !!catText && catSug.length === 0;

/** ordered distinct values of a facet over the given rows, with counts */
function catValues(f, rows) {
  const n = new Map();
  for (const e of rows) { const v = f.of(e); if (v != null) n.set(v, (n.get(v) ?? 0) + 1); }
  const vals = [...n.entries()].map(([value, count]) => ({ value, count }));
  if (f.numeric) vals.sort((a, b) => (parseFloat(a.value) || 0) - (parseFloat(b.value) || 0));
  else if (f.liveFirst) vals.sort((a, b) => (a.value === "browse-only" ? 1 : 0) - (b.value === "browse-only" ? 1 : 0) || b.count - a.count);
  else vals.sort((a, b) => b.count - a.count);
  return vals;
}

/** typed word → the facet values it could mean, best first */
function catSuggest(word) {
  const w = catNorm(word);
  if (!w) return [];
  const out = [];
  for (const f of CAT_FACETS) {
    const base = catMatch(CAT.entries, f.key, false);
    for (const { value, count } of catValues(f, base)) {
      if ((catSel[f.key] ?? []).includes(value)) continue;
      const words = catWords(f, value);
      const rank = words.some((x) => x === w) ? 0 : words.some((x) => x.startsWith(w)) ? 1 : words.some((x) => x.includes(w)) ? 2 : -1;
      if (rank >= 0) out.push({ f, value, count, rank, seat: false });
    }
  }
  for (const seat of CAT_SEATS) {
    if ((catSel.seat ?? []).includes(seat)) continue;
    const words = SEAT_WORDS[seat].map(catNorm);
    const rank = words.some((x) => x === w) ? 0 : words.some((x) => x.startsWith(w)) ? 1 : -1;
    if (rank < 0) continue;
    // SPELLING THE POSITION OUT MEANS THE SPOT. "hijack" in a poker sentence is who is
    // acting; "hj" is as likely to be the short seat of an uneven chart — and short-seat
    // BB covers 478 charts, so the abbreviation must not jump the filtering facet.
    const spelled = words.slice(1).some((x) => x === w);
    out.push({ f: CAT_SEAT_FACET, value: seat, count: null, rank: rank + (spelled ? -0.1 : 0.5), seat: true });
  }
  return out.sort((a, b) => a.rank - b.rank || (b.count ?? 0) - (a.count ?? 0)).slice(0, 8);
}

function catAdd(key, value) {
  if (key === "seat") catSel.seat = [value];          // one seat at a time: it picks a node
  else (catSel[key] ??= []).push(value);
  catText = ""; catSug = []; catSugI = 0;
  renderCatalog(true);
}
function catDrop(key, value) {
  catSel[key] = (catSel[key] ?? []).filter((v) => v !== value);
  if (!catSel[key].length) delete catSel[key];
  renderCatalog(true);
}
function catClear() { catSel = {}; catText = ""; catSug = []; catMore = {}; renderCatalog(true); }

async function loadCatalog() {
  const v = $("src-catalog");
  if (!v) return;
  v.innerHTML = '<div class="card sub">loading catalog…</div>';
  let j;
  try {
    j = await (await fetch("/api/dashboard/catalog")).json();
  } catch (e) { v.innerHTML = '<div class="card warn">catalog unavailable</div>'; return; }
  if (!j.ok) { v.innerHTML = '<div class="card warn">catalog unavailable</div>'; return; }
  CAT = j;
  renderCatalog();
}

/** the line that reaches this seat's first-in decision: everyone before it folds */
const catSeatLine = (e, seat) => {
  const order = e.seats ?? (e.players === 3 ? ["BTN", "SB", "BB"] : CAT_SEATS);
  const i = order.indexOf(seat);
  return i < 0 ? null : new Array(i).fill("F").join("-");
};

function renderCatalog(keepFocus) {
  const v = $("src-catalog");
  if (!v || !CAT) return;
  const s = CAT.summary;
  const tile = (k, val, sub) => `<div class="tile"><div class="v">${val}</div><div class="k">${k}</div>${sub ? `<div class="sub">${sub}</div>` : ""}</div>`;

  const rows = catMatch(CAT.entries, null, catTextOn());
  const seat = (catSel.seat ?? [])[0] ?? null;
  const shown = rows.slice(0, 400);

  // chips for what is selected, then the box, then every facet still worth picking
  const chips = [
    ...CAT_FACETS.flatMap((f) => (catSel[f.key] ?? []).map((val) =>
      `<button class="fchip on" onclick="catDrop('${f.key}', ${catArg(val)})">${esc(f.label)} ${esc(catDisplay(f, val))} <span class="x">×</span></button>`)),
    ...(seat ? [`<button class="fchip on seat" onclick="catDrop('seat', ${catArg(seat)})">to act ${esc(seat)} <span class="x">×</span></button>`] : []),
  ].join("");

  const facetRows = CAT_FACETS.map((f) => {
    const vals = catValues(f, catMatch(CAT.entries, f.key, catTextOn()));
    if (vals.length < 2 && !(catSel[f.key] ?? []).length) return "";
    const cap = catMore[f.key] ? vals.length : 12;
    const chip = (x) => `<button class="fchip${(catSel[f.key] ?? []).includes(x.value) ? " on" : ""}" onclick="catAdd('${f.key}', ${catArg(x.value)})">${esc(catDisplay(f, x.value))}<span class="n">${x.count}</span></button>`;
    // a selected value must stay visible even when it sorts past the cap
    const head = vals.slice(0, cap), tail = vals.slice(cap).filter((x) => (catSel[f.key] ?? []).includes(x.value));
    return `<div class="frow"><span class="fkey">${esc(f.label)}</span><span class="fvals">${[...head, ...tail].map(chip).join("")}${
      vals.length > cap ? `<button class="fchip more" onclick="catMore['${f.key}']=true;renderCatalog()">+${vals.length - cap} more</button>` : ""}${
      catMore[f.key] && vals.length > 12 ? `<button class="fchip more" onclick="catMore['${f.key}']=false;renderCatalog()">fewer</button>` : ""}</span></div>`;
  }).join("");

  const sugHtml = catSug.length
    ? `<div class="fsug">${catSug.map((x, i) => `<div class="fsug-row${i === catSugI ? " on" : ""}" onmousedown="event.preventDefault();catAdd('${x.f.key}', ${catArg(x.value)})">
        <span class="fsug-k">${esc(x.f.label)}</span><span class="fsug-v">${esc(catDisplay(x.f, x.value))}</span>
        <span class="fsug-n">${x.seat ? "a node, not a filter" : `${x.count} chart${x.count === 1 ? "" : "s"}`}</span></div>`).join("")}</div>`
    : "";

  const recent = (CAT.recent || []).slice(0, 8);
  const nameOf = (id) => (CAT.entries.find((e) => e.id === id) || {}).name || id;

  v.innerHTML = `
    <div class="tiles">
      ${tile("charts", s.total, `${s.routed} answer live study`)}
      ${tile("matching", rows.length, rows.length === s.total ? "no filter yet" : "after your filters")}
      ${recent.length ? tile("used in 30d", recent.length, "by live study") : ""}
    </div>
    <div class="card finder">
      <h2>Find a chart <span class="sub">— describe it in words; every word you type becomes a filter you can take back off</span></h2>
      <div class="fbox">
        ${chips}
        <input id="cat-q" type="text" autocomplete="off" spellcheck="false" placeholder="${chips ? "add another…" : "100bb · 2.5 open · even stacks · hijack · 6-max…"}" value="${esc(catText)}">
        ${sugHtml}
      </div>
      ${seat ? `<div class="sub" style="margin-top:8px">↓ <b>${esc(seat)}</b> is a node, not a chart — one tree holds every seat's open. Each row below opens ${esc(seat)}'s first-in decision in that chart's tree.</div>` : ""}
      <div class="facets">${facetRows}</div>
      <div class="frow" style="margin-top:6px">
        ${Object.keys(catSel).length || catText ? `<button class="mini" onclick="catClear()">clear all</button>` : ""}
        <button class="mini" id="cat-refresh">↻ rescan</button>
        <span class="sub">${s.solutionsDir ? `HRC sidecars at <code>${esc(s.solutionsDir)}</code>, bodies canonical in R2` : '<span class="warn">solutions dir NOT found</span>'} · <b style="color:var(--muted)">used by</b> = what the live study path answers from today</span>
      </div>
    </div>
    ${recent.length ? `<div class="card"><h2>Recently queried by live study (30d)</h2><table><thead><tr><th>chart</th><th>answers</th><th>last used</th></tr></thead><tbody>${
      recent.map((r) => `<tr><td>${esc(nameOf(r.chart))}<div class="mono sub">${esc(r.chart)}</div></td><td class="num">${r.n}</td><td class="sub">${fmtAgo(r.lastTs)}</td></tr>`).join("")}</tbody></table></div>` : ""}
    <div class="card">
      <h2>${rows.length} chart${rows.length === 1 ? "" : "s"}${shown.length < rows.length ? ` <span class="sub">— showing the first ${shown.length}</span>` : ""}</h2>
      ${rows.length ? `<table><thead><tr><th>chart</th><th>stacks</th><th>solved with</th><th>nodes</th><th>stored</th><th>used by</th><th></th></tr></thead><tbody>
      ${shown.map((e) => {
        const canToggle = e.source === "hrc" && !(seat && catSeatLine(e, seat) == null);
        const toggle = canToggle ? `catNode(${catArg(e.id)}, ${seat ? catArg(seat) : "null"})` : "";
        return `<tr class="catrow">
        <td${canToggle ? ` class="cat-name-cell" onclick="${toggle}" title="click to expand/collapse"` : ""}><div>${esc(e.name)}</div><div class="mono sub" title="${esc(e.location)}">${esc(e.id)}</div></td>
        <td>${esc(stacksStr(e))}</td>
        <td>${catSetupCell(e)}</td>
        <td class="num">${e.nodes ?? "—"}</td>
        <td>${e.source !== "hrc" ? '<span class="sub">bundled</span>' : e.cachedLocally ? "✓ disk" : '<span class="sub">R2</span>'}</td>
        <td>${e.routed ? `<span class="badge b-info">${esc(e.routed)}</span>` : '<span class="sub">browse-only</span>'}</td>
        <td>${e.source !== "hrc" ? "" : seat && catSeatLine(e, seat) == null
          ? `<span class="sub">no ${esc(seat)} at this table</span>`
          : `<button class="mini" onclick="event.stopPropagation();catNode(${catArg(e.id)}, ${seat ? catArg(seat) : "null"})">${seat ? `${esc(seat)} first in ↓` : "root ↓"}</button>`}</td>
      </tr>
      <tr class="catnode" id="catnode-${esc(e.id)}" hidden><td colspan="7"></td></tr>`;
      }).join("")}
      </tbody></table>` : `<div class="sub">Nothing matches all of those. Take a chip off — the counts on each chip say how many charts it would leave.</div>`}
    </div>`;

  const q = $("cat-q");
  q.oninput = (ev) => {
    catText = ev.target.value.trim().toLowerCase();
    catSug = catSuggest(catText); catSugI = 0;
    renderCatalog(true);
  };
  q.onkeydown = (ev) => {
    if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
      if (!catSug.length) return;
      ev.preventDefault();
      catSugI = (catSugI + (ev.key === "ArrowDown" ? 1 : catSug.length - 1)) % catSug.length;
      renderCatalog(true);
    } else if (ev.key === "Enter" && catSug.length) {
      ev.preventDefault(); const x = catSug[catSugI]; catAdd(x.f.key, x.value);
    } else if (ev.key === "Escape") { catSug = []; renderCatalog(true); }
    else if (ev.key === "Backspace" && !ev.target.value) {
      const last = [...CAT_FACETS, CAT_SEAT_FACET].reverse().find((f) => (catSel[f.key] ?? []).length);
      if (last) catDrop(last.key, catSel[last.key][catSel[last.key].length - 1]);
    }
  };
  if (keepFocus) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  $("cat-refresh").onclick = async () => {
    $("cat-refresh").textContent = "…";
    try { CAT = await (await fetch("/api/dashboard/catalog?refresh=1")).json(); } catch (e) {}
    renderCatalog();
  };
}

/** open one chart's node inline — the row's "root ↓" / "<seat> first in ↓" button.
 *  WALKABLE (2026-09-20, Brady asked for "BTN vs BB, BTN 2.5x open"): a seat chip can only
 *  name a FIRST-IN decision, and most spots worth looking at are not one — BB facing a
 *  button open is three actions deep. Every action at the node is a button that descends
 *  into it, and the crumb walks back, so any node of the tree is reachable from the row. */
async function catNode(id, seat, line) {
  const host = $(`catnode-${id}`);
  if (!host) return;
  const e = CAT.entries.find((x) => x.id === id);
  if (line == null) {                                   // the row button: toggle, start at the seat
    if (!host.hidden && catOpenRow === id) { host.hidden = true; catOpenRow = null; return; }
    line = seat ? (catSeatLine(e, seat) ?? "") : "";
  }
  catOpenRow = id; host.hidden = false;
  const cell = host.firstElementChild;
  cell.innerHTML = '<div class="sub">reading the node…</div>';
  let j;
  try { j = await (await fetch(`/api/dashboard/chart-node?id=${encodeURIComponent(id)}&line=${encodeURIComponent(line)}`)).json(); }
  catch (err) { cell.innerHTML = `<div class="warn">${esc(String(err))}</div>`; return; }
  if (!j.ok) { cell.innerHTML = `<div class="warn">${esc(j.error)}</div>`; return; }
  const toks = line ? line.split("-") : [];
  // the crumb is the way back: each step reopens the node that many actions in
  const back = `<span class="nv-crumb"><button class="lnk" onclick="catNode(${catArg(id)}, null, ${catArg("")})">root</button>${
    toks.map((t, i) => `<span class="sep">›</span><button class="lnk" onclick="catNode(${catArg(id)}, null, ${catArg(toks.slice(0, i + 1).join("-"))})">${esc(t)}</button>`).join("")}</span>`;
  if (!j.node) { cell.innerHTML = `<div class="nv-head"><span><span class="sub">line</span> ${back}</span></div><div class="warn">${esc(j.note)}</div>`; return; }
  const n = j.node;
  const cls = {};
  for (const c of n.cells) {
    const acts = n.actions.map((a) => c.actions[a.action] ?? 0);
    cls[c.hand] = { w: COMBOS(c.hand), acts: acts.map((p) => (COMBOS(c.hand) * p) / 100) };
  }
  const step = n.terminal || !n.actions.length ? '<span class="sub">the hand ends here</span>'
    : `<span class="sub">walk on:</span> ${n.actions.map((a) => a.token == null ? "" :
        `<button class="fchip" onclick="catNode(${catArg(id)}, null, ${catArg(line ? `${line}-${a.token}` : a.token)})">${esc(n.pos ?? "")} ${esc(a.action)} ›</button>`).join("")}`;
  cell.innerHTML = `<div class="nv-head"><span><span class="sub">chart</span> <b>${esc(e.name)}</b></span>
      <span><span class="sub">line</span> ${back}</span>${n.pos ? `<span><span class="sub">to act</span> <b>${esc(n.pos)}</b></span>` : ""}</div>
    ${classGrid(cls, n.actions.map((a) => a.action), null, { flat: true, wmax: 1e9, foot: "every class in the chart at this node · hover for the mix" })}
    <div class="nv-walk">${step}</div>
    <div class="sub" style="margin-top:8px"><a class="ev-link" href="${esc(j.browse)}" target="_blank" rel="noopener">raw node JSON ↗</a></div>`;
}

/* The runbook: a plan spelled out — order, preflight, and for every config the exact work (commands, cwd, env,

/* The runbook page: ONE proposal, at the level of WHAT is being worked on. Parts (preflop, postflop) each

const propPill = (x) => `<span class="st-pill ${esc(x)}">${esc(x)}</span>`;

  const lines = (xs) => xs.map((x) => `<span class="ln">${esc(x)}</span>`).join("");
  const liveLine = (w) => {

  };
  const work = pt.work.map((w) => {

async function viewChart(btn, id, keep) {

async function workData(btn, enc, keep) {

  if (!btn.dataset.label) btn.dataset.label = btn.textContent;
