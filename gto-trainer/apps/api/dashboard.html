    </div>
    <div class="scroll"><table class="diff-tbl"><thead><tr><th>node</th><th>action</th><th class="num">range % live</th><th class="num">range % now</th><th class="num">you % live</th><th class="num">you % now</th><th class="num">Δ you</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="sub" style="margin-top:6px">"range %" is how much of the actor's whole range takes the action; "you %" is your combo's frequency. A discrepancy of 5 points or more in your mix is flagged.</div></div>`;
}

/* ================= node solution + AI inputs ================= */
// fold is always blue (colorFor), so no series colour may be a blue: a 4th
// aggressive size / all-in next to a fold cell became unreadable
const ACT_COLORS = ["#d64550", "#e8933a", "#ceba4c", "#b07fe8", "#5cc8c8", "#ff8fb1", "#a3d977"];
const colorFor = (label, i) => /^fold/i.test(label) ? "#3d6fb4" : /^(check|call)/i.test(label) ? "#61d095" : ACT_COLORS[i % ACT_COLORS.length];
const RANKS = "AKQJT98765432";

async function solveNode(dbId, upto, btn) {
  // The ONLY postflop solver on the dashboard is the live answer chain
  // (services/aiChain.ts via POST /resolve-chain): same ranges, same pinned
  // sizes, same conditioning as the answer at the table, and every run is
  // stored and walkable. (The old AI-study route is SolverStudy's, not ours.)
  setStep(upto);
  const sol = $("solution");
  sol.innerHTML = `<div class="card"><span class="warn">re-solving this node through the live chain… fresh streets take a few seconds</span></div>`;
  if (btn) { btn.disabled = true; btn.textContent = "solving…"; }
  let r;
  try {
    r = await (await fetch("/api/dashboard/resolve-chain", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ dbId, upto }) })).json();
  } catch (e) { r = { ok: false, error: String(e) }; }
  if (btn) { btn.disabled = false; btn.textContent = "▶ solve (live chain)"; }
  if (!r.ok) { sol.innerHTML = `<div class="card warn">solve failed: ${esc(r.error ?? "unknown")}</div>`; return; }
  if (r.tier !== "ai-chain" || r.solveId == null) {
    sol.innerHTML = `<div class="card"><h2>Re-solve at action ${upto}</h2><div class="sub">The live path answered this node from <b>${esc(r.tier ?? r.source ?? "another tier")}</b>, not the AI chain, so there is no chain trace to walk.${r.warning ? ` ⚠ ${esc(r.warning)}` : ""}</div>
      <div class="ans-verdict" style="margin-top:8px"><span class="ans-pick ${verbClass(r.decision?.action)}">${esc((r.decision?.action ?? "").toUpperCase())}</span><span class="ans-how">${(r.actions || []).map((a) => `${esc(a.action)} ${Math.round(a.frequency)}%`).join(" · ")}</span></div>
      <div class="sub" style="margin-top:8px"><a class="ev-link" href="/hands/${dbId}/node/${upto}" onclick="go('/hands/${dbId}/node/${upto}');return false">open the exact node it used ↗</a></div></div>`;
    return;
  }
  sol.innerHTML = `<div class="card"><h2>Live-chain re-solve at action ${upto} <span class="sub">— stored as replay #${r.solveId}; every node below is walkable</span></h2><div id="walk-host"></div></div>`;
  renderWalkthrough(r.solveId, "walk-host", upto);
  sol.scrollIntoView({ behavior: "smooth", block: "start" });
}

/* ================= analytics ================= */
/* ================= Analytics =================
   Design follows the "Ignition Cash Results" artifact: one cumulative-result
   chart (Chart.js), a row of tiles, and plain tables in panels — no small
   multiples. SCOPE is a set of hands (all · sessions · months · stakes · a date
   range) picked with a segmented control and chips; a second scope can be laid
   over the chart as a dashed line, with its difference shown on the tiles. The
   scope lives in the URL (/analytics?scope=…&vs=…) so a view can be linked to.
   The Solver & model block underneath is corpus-level and ignores the scope. */
let AN = { options: null, chart: null };
const anQuery = (scope, vs) => { const q = new URLSearchParams(); if (scope && scope !== "all") q.set("scope", scope); if (vs) q.set("vs", vs); const s = q.toString(); return s ? `?${s}` : ""; };
const anGo = (scope, vs) => go("/analytics" + anQuery(scope, vs));
const anParse = (spec) => { const m = String(spec || "all").match(/^(sessions|months|stakes|range):(.*)$/); return m ? { kind: m[1], items: m[1] === "range" ? [] : m[2].split(",").filter(Boolean), raw: m[2] } : { kind: "all", items: [], raw: "" }; };
const fmtD = (ms) => ms == null ? "?" : new Date(ms).toLocaleDateString([], { month: "short", day: "numeric" });
const sgn = (x, d = 1) => x == null ? "–" : (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(Number(x)).toFixed(d);
const pctS = (x) => x == null ? "–" : x.toFixed(1) + "%";
const anCls = (x) => x > 0 ? "pos" : x < 0 ? "neg" : "";
const anCss = (v) => getComputedStyle($("view-analytics")).getPropertyValue(v).trim();
const AN_KINDS = [["all", "All"], ["sessions", "Sessions"], ["months", "Months"], ["stakes", "Stakes"], ["range", "Range"]];

async function loadAnalytics() {
  const v = $("view-analytics");
  const scope = PATH.scope || "all", vs = PATH.vs || null;
  if (!v.querySelector(".ig-head")) v.innerHTML = '<div class="card sub">loading…</div>';
  let j;
  try { j = await (await fetch(`/api/dashboard/analytics${anQuery(scope, vs)}`)).json(); } catch (e) { v.innerHTML = '<div class="card warn">analytics unavailable</div>'; return; }
  if (!j.ok) { v.innerHTML = '<div class="card warn">analytics unavailable</div>'; return; }
  if (PATH.view !== "analytics") return; // navigated away while the fetch was in flight
  AN.options = j.options;
  // disc counts fill in as the background audits land — refresh quietly
  pollWhilePending(j, () => { if (PATH.view === "analytics") loadAnalytics(); });
  v.innerHTML = anRender(j, scope, vs) + `<div class="ig-global"><div class="an-h">Solver &amp; model <span class="sub">— the corpus and the solvers, not hero's hands: this block does not change with the scope</span></div>${await anGlobal(j.global)}</div>`;
  anWire(v, scope, vs);
  anDrawChart(j.primary, j.compare);
  loadMissQueue();
}

/* ---- scope controls: a segmented control for the kind, chips for the items */
function anItems(kind) {
  const o = AN.options;
  if (kind === "sessions") return o.sessions.map((s) => ({ id: s.id, label: `${fmtD(s.startedAt)} · ${s.declared ? presetLabel(s.preset, s) : (s.stakes ?? "?")} · ${s.hands}h` }));
  if (kind === "months") return o.months.map((m) => ({ id: m.key, label: `${m.label} · ${m.hands}h` }));
  if (kind === "stakes") return o.stakes.map((s) => ({ id: s.key, label: `${s.key} · ${s.hands}h` }));
  return [];
}
const anKindSeg = (which, spec) => `<div class="ig-seg" data-which="${which}">${AN_KINDS.map(([k, l]) => `<button aria-pressed="${anParse(spec).kind === k}" data-kind="${k}">${l}</button>`).join("")}</div>`;
const dv = (ms) => { if (!ms) return ""; const d = new Date(ms); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
function anChips(which, spec) {
  const cur = anParse(spec), isVs = which === "vs";
  const lead = isVs ? `<span class="lab">Compare to</span>${anKindSeg("vs", spec)}` : "";
  const off = isVs ? `<button class="ig-chip" data-act="uncompare" title="stop comparing">✕</button>` : "";
  if (cur.kind === "all") return isVs ? `<div class="ig-chips">${lead}<span class="lab">every hand</span>${off}</div>` : "";
  if (cur.kind === "range") {
    const [f, t] = cur.raw.split("-").map(Number);
    return `<div class="ig-chips" data-which="${which}">${lead}<input type="date" class="an-from" value="${dv(f)}"><span class="lab">to</span><input type="date" class="an-to" value="${dv(t)}"><button class="ig-chip" data-act="range">Apply</button>${off}</div>`;
  }
  return `<div class="ig-chips" data-which="${which}" data-kind="${cur.kind}">${lead}${anItems(cur.kind).map((it) => `<button class="ig-chip" aria-pressed="${cur.items.includes(it.id)}" data-item="${esc(it.id)}">${esc(it.label)}</button>`).join("")}${off}</div>`;
}
function anWire(v, scope, vs) {
  const set = (which, spec) => which === "scope" ? anGo(spec, vs) : anGo(scope, spec);
  const allOf = (kind) => kind === "all" ? "all" : kind === "range" ? `range:${AN.options.range.from}-${AN.options.range.to}` : `${kind}:${anItems(kind).map((x) => x.id).join(",")}`;
  v.querySelectorAll(".ig-seg[data-which] button").forEach((b) => b.onclick = () => set(b.closest(".ig-seg").dataset.which, allOf(b.dataset.kind)));
  v.querySelectorAll(".ig-chips[data-kind] .ig-chip[data-item]").forEach((b) => b.onclick = () => {
    const row = b.closest(".ig-chips"), which = row.dataset.which, cur = anParse(which === "scope" ? scope : vs);
    const on = new Set(cur.items);
    if (on.has(b.dataset.item)) { if (on.size === 1) return; on.delete(b.dataset.item); } else on.add(b.dataset.item);
    set(which, `${cur.kind}:${anItems(cur.kind).map((x) => x.id).filter((id) => on.has(id)).join(",")}`);
  });
  v.querySelectorAll("[data-act=range]").forEach((b) => b.onclick = () => {
    const row = b.closest(".ig-chips"), f = row.querySelector(".an-from").valueAsNumber, t = row.querySelector(".an-to").valueAsNumber;
    if (!Number.isFinite(f) || !Number.isFinite(t)) return;
    // date inputs give UTC midnight; the scope wants the local day's bounds
    const day = (ms, end) => { const d = new Date(ms); return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), end ? 23 : 0, end ? 59 : 0, end ? 59 : 0, end ? 999 : 0).getTime(); };
    set(row.dataset.which, `range:${day(f)}-${day(t, true)}`);
  });
  const cmp = v.querySelector("[data-act=compare]"); if (cmp) cmp.onclick = () => anGo(scope, vs ? null : "all");
  v.querySelectorAll("[data-act=uncompare]").forEach((b) => b.onclick = () => anGo(scope, null));
  v.querySelectorAll("tr[data-scope]").forEach((tr) => tr.onclick = () => set("scope", tr.dataset.scope));
  v.querySelectorAll("tr[data-review]").forEach((tr) => tr.onclick = () => go(`/sessions/${encodeURIComponent(tr.dataset.review)}?show=unanswered`));
}

/* ---- the page ---------------------------------------------------------------- */
function anRender(j, scope, vs) {
  const P = j.primary, C = j.compare, a = P.hands, o = C ? C.hands : null, ans = P.answers;
  const first = P.series[0]?.t, last = P.series[P.series.length - 1]?.t;
  const delta = (k, d = 1, suf = "") => o && a[k] != null && o[k] != null ? `<div class="sub ${anCls(a[k] - o[k])}">${sgn(a[k] - o[k], d)}${suf} vs ${esc(C.label)}</div>` : "";
  const tile = (lab, val, sub, c = "", d = "") => `<div class="ig-tile"><div class="lab">${lab}</div><div class="val ${c}">${val}</div>${sub ? `<div class="sub">${sub}</div>` : ""}${d}</div>`;
  return `<header class="ig-head">
    <div><h1>Analytics</h1><p>${a.hands} hands${first ? `, ${fmtD(first)} to ${fmtD(last)}` : ""} · <b>${esc(P.label)}</b>${C ? ` · compared with <b>${esc(C.label)}</b> (${o.hands} hands, dashed on the chart)` : ""}</p></div>
    <div class="ig-controls">${anKindSeg("scope", scope)}<div class="ig-sep"></div><div class="ig-seg"><button aria-pressed="${!!C}" data-act="compare">Compare</button></div></div>
  </header>
  ${anChips("scope", scope)}${C ? anChips("vs", vs) : ""}
  ${a.hands ? "" : '<div class="ig-note">No hands in this scope.</div>'}
  <div class="ig-tiles">
    ${tile("Hands", a.hands, `${P.sessions.length} session${P.sessions.length === 1 ? "" : "s"}`, "", delta("hands", 0))}
    ${tile("Net won", `${sgn(a.netBb, 0)} bb`, `${a.netKnownHands} of ${a.hands} hands with a known net`, anCls(a.netBb), delta("netBb", 0, " bb"))}
    ${tile("bb/100", sgn(a.bb100, 1), a.bb100Se != null ? `±${a.bb100Se.toFixed(1)} standard error` : "over hands with a known net", anCls(a.bb100), delta("bb100"))}
    ${tile("VPIP", pctS(a.vpip), "voluntarily put money in preflop", "", delta("vpip", 1, " pp"))}
    ${tile("PFR", pctS(a.pfr), "raised preflop", "", delta("pfr", 1, " pp"))}
    ${tile("3-bet", pctS(a.threeBet), "re-raised when facing a raise", "", delta("threeBet", 1, " pp"))}
    ${tile("WTSD", pctS(a.wtsd), "went to showdown after seeing the flop", "", delta("wtsd", 1, " pp"))}
    ${tile("Discrepancies", a.discPer100 == null ? "–" : a.discPer100.toFixed(0), `per 100 hands · ${a.discrepancies.major} major`, "", delta("discPer100", 0))}
    ${tile("Answered", P.kind === "sessions" && P.sessions.length === 1 ? `<a class="ig-link" href="/sessions/${encodeURIComponent(P.sessions[0].id)}?show=unanswered" onclick="go('/sessions/${encodeURIComponent(P.sessions[0].id)}?show=unanswered');return false" title="review the unanswered hands">${pctS(ans.handsAnsweredPct)}</a>` : pctS(ans.handsAnsweredPct), `of hands · ${ans.decisions} decisions${P.kind === "sessions" && P.sessions.length === 1 ? " · click to review" : ""}`)}
    ${tile("Followed", pctS(ans.followedPct), `${ans.followed} of ${ans.graded} graded decisions`)}
  </div>
  <section class="ig-panel"><h2>Cumulative result by hand</h2><div class="ig-chart"><canvas id="an-canvas"></canvas></div><div class="ig-legend" id="an-legend"></div></section>
  <div class="ig-grid2">
    <section class="ig-panel"><h2>By session <span class="ig-dim">— ${P.kind === "sessions" && P.sessions.length === 1 ? "click the session again to open its page, with the unanswered hands on top" : "click a session to scope the analytics to it"}</span></h2><div class="tbl">${anSessionsTable(P)}</div></section>
    <section class="ig-panel"><h2>Preflop and postflop stats</h2><div class="tbl">${anStatsTable(P)}</div></section>
  </div>
  <div class="ig-grid2">
    <section class="ig-panel"><h2>By position</h2><div class="tbl">${anBreakdownTable(P.byPosition, "Seat", null)}</div></section>
    <section class="ig-panel"><h2>By stakes</h2><div class="tbl">${anBreakdownTable(P.byStakes, "Stakes", "stakes")}</div></section>
  </div>
  <div class="ig-grid2">
    <section class="ig-panel"><h2>By month</h2><div class="tbl">${anBreakdownTable(P.byMonth, "Month", "months")}</div></section>
    <section class="ig-panel"><h2>Study answers</h2><div class="tbl">${anAnswersTable(P)}</div></section>
  </div>
  <p class="ig-note"><b>How the numbers are made.</b> Net per hand is exact when the pot was uncontested or you folded (pot minus what you put in, or minus what you put in); a showdown hand takes the change in your stack to the next hand at the same stakes, when that is plausible for the pot, and is otherwise unknown. Unknown hands are drawn flat and dashed on the chart and left out of net, bb/100 and its standard error (100 × the standard deviation of the per-hand net over √n). Sessions are the ones declared on the wrapper's setup page; hands played before that are grouped by 45-minute gaps. Study answers are counted per distinct decision (the panel re-answers as villains act); the archive often stops before your own last action, so only decisions whose action was captured can be graded told-versus-did. Discrepancies are the audit of what the panel showed against what the archive recorded.</p>`;
}

const AN_POS = ["BTN", "SB", "BB", "CO", "HJ", "MP", "UTG"];
function anBreakdownTable(map, first, kind) {
  const keys = Object.keys(map || {});
  if (!keys.length) return '<div class="ig-note" style="margin:0">nothing in this scope</div>';
  const pos = (k) => { const i = AN_POS.indexOf(k); return i < 0 ? 99 : i; };
  keys.sort((x, y) => kind === "months" ? y.localeCompare(x) : kind ? map[y].hands - map[x].hands : pos(x) - pos(y));
  const maxAbs = Math.max(1, ...keys.map((k) => Math.abs(map[k].bb100 ?? 0)));
  const rows = keys.map((k) => {
    const x = map[k], b = x.bb100, w = b == null ? 0 : Math.round((60 * Math.abs(b)) / maxAbs);
    return `<tr${kind ? ` class="pick" data-scope="${esc(kind)}:${esc(k)}" title="scope to this"` : ""}><td>${esc(x.label ?? k)}</td><td class="num">${x.hands}</td><td class="num ${anCls(x.netBb)}">${sgn(x.netBb, 0)}</td><td class="num ${anCls(b)}">${sgn(b, 1)}</td><td class="num">${pctS(x.vpip)}</td><td class="num">${pctS(x.pfr)}</td><td style="text-align:left"><span class="ig-bar" style="width:${w}px;background:${b >= 0 ? "var(--win)" : "var(--loss)"}"></span></td></tr>`;
  }).join("");
  return `<table><thead><tr><th>${first}</th><th>Hands</th><th>Net bb</th><th>bb/100</th><th>VPIP</th><th>PFR</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
}
function anSessionsTable(P) {
  if (!P.sessions.length) return '<div class="ig-note" style="margin:0">no sessions in this scope</div>';
  // first click scopes the analytics to the session; once it IS the scope, the click goes on to the session page
  const scopedTo = P.kind === "sessions" && P.sessions.length === 1 ? P.sessions[0].id : null;
  const rows = P.sessions.slice().reverse().map((s) => `<tr class="pick" ${s.id === scopedTo ? `data-review="${esc(s.id)}" title="open this session's page — its hands, the unanswered ones on top"` : `data-scope="sessions:${esc(s.id)}" title="scope the analytics to this session"`}>
      <td>${fmtT(s.startedAt)} <span class="ig-dim">· ${s.declared ? esc(presetLabel(s.preset, s)) : "undeclared"}</span> <a class="ig-dim" href="/sessions/${encodeURIComponent(s.id)}" onclick="event.stopPropagation();go('/sessions/${encodeURIComponent(s.id)}');return false">page ↗</a></td>
      <td class="num">${s.hands}</td><td class="num ${anCls(s.netBb)}">${sgn(s.netBb, 0)}</td><td class="num ${anCls(s.bb100)}">${sgn(s.bb100, 1)}</td>
      <td class="num">${pctS(s.vpip)}</td><td class="num">${pctS(s.pfr)}</td><td class="num">${s.discPer100 == null ? "–" : s.discPer100.toFixed(0)}</td>
      <td class="num"><a class="ig-link" href="/sessions/${encodeURIComponent(s.id)}?show=unanswered" onclick="event.stopPropagation();go('/sessions/${encodeURIComponent(s.id)}?show=unanswered');return false" title="review this session's hands with the unanswered ones on top">${pctS(s.answers.handsAnsweredPct)}</a></td><td class="num">${pctS(s.answers.followedPct)}</td></tr>`).join("");
  const a = P.hands;
  return `<table><thead><tr><th>Session</th><th>Hands</th><th>Net bb</th><th>bb/100</th><th>VPIP</th><th>PFR</th><th>Disc/100</th><th>Answered</th><th>Followed</th></tr></thead><tbody>${rows}</tbody>
    <tfoot><tr><td>Selected</td><td class="num">${a.hands}</td><td class="num ${anCls(a.netBb)}">${sgn(a.netBb, 0)}</td><td class="num ${anCls(a.bb100)}">${sgn(a.bb100, 1)}</td><td class="num">${pctS(a.vpip)}</td><td class="num">${pctS(a.pfr)}</td><td class="num">${a.discPer100 == null ? "–" : a.discPer100.toFixed(0)}</td><td class="num">${pctS(P.answers.handsAnsweredPct)}</td><td class="num">${pctS(P.answers.followedPct)}</td></tr></tfoot></table>`;
}
const anStatRows = (rows) => `<table><thead><tr><th>Stat</th><th>Value</th><th style="text-align:left">Meaning</th></tr></thead><tbody>${rows.map((r) => `<tr><td>${r[0]}</td><td class="num">${r[1]}</td><td class="ig-meaning">${r[2]}</td></tr>`).join("")}</tbody></table>`;
function anStatsTable(P) {
  const a = P.hands;
  return anStatRows([
    ["VPIP", pctS(a.vpip), "voluntarily put money in preflop"],
    ["PFR", pctS(a.pfr), "raised preflop"],
    ["3-bet", pctS(a.threeBet), "re-raised when facing a raise"],
    ["WTSD", pctS(a.wtsd), "went to showdown after seeing the flop"],
    ["Flops seen", pctS(a.sawFlop), "hands that reached the flop with you in"],
    ["Limped pots", pctS(a.limpedPots), "hands where the pot was limped"],
    ["Discrepancies", a.discPer100 == null ? "–" : a.discPer100.toFixed(1), `per 100 hands · ${a.discrepancies.major} major, ${a.discrepancies.minor} minor, ${a.discrepancies.info} info`],
    ["Known net", pctS(a.hands ? Math.round((1000 * a.netKnownHands) / a.hands) / 10 : null), "hands whose net result could be established"],
  ]);
}
function anAnswersTable(P) {
  const x = P.answers, tiers = Object.entries(x.tiers || {});
  return anStatRows([
    ["Decisions answered", x.decisions, `${x.answers} answers logged, ${x.failed} failed`],
    ["Hands answered", pctS(x.handsAnsweredPct), `${x.handsAnswered} of ${P.hands.hands} hands got at least one answer`],
    ["Followed advice", pctS(x.followedPct), `${x.followed} of ${x.graded} graded decisions went the way the panel said`],
    ["MES ≠ GTO", pctS(x.disagreementRate), `${x.disagreements} of ${x.withBoth} decisions where the two picks disagreed`],
    ["Followed MES", pctS(x.followedMesWhenDisagreed), "when the two disagreed"],
    ...tiers.map(([k, t]) => [esc(k), t.n, `answers from this tier · p50 ${t.p50 ?? "–"} ms, p90 ${t.p90 ?? "–"} ms`]),
  ]);
}

/* ---- the chart: cumulative result by hand, Chart.js like the artifact ------- */
function anDrawChart(P, C) {
  const cv = $("an-canvas");
  if (!cv) return;
  if (!window.Chart) {
    const s = document.querySelector("script[data-chartjs]");
    if (s && !s.dataset.failed) { s.addEventListener("load", () => anDrawChart(P, C), { once: true }); s.addEventListener("error", () => { s.dataset.failed = "1"; anDrawChart(P, C); }, { once: true }); }
    if (!s || s.dataset.failed) cv.parentElement.innerHTML = '<div class="ig-note" style="margin:0">Chart.js did not load (offline?) — the tables carry the same numbers.</div>';
    return;
  }
  const cum = (series) => { let c = 0; return series.map((h, i) => { if (h.net != null) c += h.net; return { x: i, y: Math.round(c * 100) / 100, known: h.net != null, id: h.id, t: h.t }; }); };
  const p = cum(P.series), q = C ? cum(C.series) : null;
  const win = anCss("--win"), evc = anCss("--ev"), muted = anCss("--muted"), grid = anCss("--grid"), ink = anCss("--ink"), faint = anCss("--faint");
  if (AN.chart) { AN.chart.destroy(); AN.chart = null; }
  AN.chart = new Chart(cv, {
    type: "line",
    data: { datasets: [
      { label: P.label, data: p, borderColor: win, borderWidth: 2, pointRadius: 0, tension: 0, order: 2,
        fill: { target: "origin", above: anCss("--win-soft"), below: anCss("--loss-soft") },
        segment: { borderDash: (c) => p[c.p1DataIndex]?.known ? undefined : [4, 4], borderColor: (c) => p[c.p1DataIndex]?.known ? undefined : faint } },
      ...(q ? [{ label: C.label, data: q, borderColor: evc, borderWidth: 1.5, borderDash: [6, 4], pointRadius: 0, tension: 0, order: 1, fill: false }] : []),
    ] },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false, parsing: false, interaction: { mode: "index", intersect: false },
      plugins: { legend: { display: false }, tooltip: {
        callbacks: {
          title: (it) => { const r = it[0].raw; return `Hand ${it[0].parsed.x + 1} · #${r.id} · ${fmtT(r.t)}`; },
          label: (it) => ` ${it.dataset.label}: ${sgn(it.parsed.y, 1)} bb${it.raw.known ? "" : " · this hand's net is unknown"}`,
        },
        backgroundColor: anCss("--surface"), titleColor: ink, bodyColor: ink, borderColor: anCss("--line"), borderWidth: 1, titleFont: { family: "JetBrains Mono, ui-monospace, Consolas, monospace" }, bodyFont: { family: "JetBrains Mono, ui-monospace, Consolas, monospace" } } },
      scales: {
        x: { type: "linear", min: 0, max: Math.max(1, Math.max(p.length, q ? q.length : 0) - 1), ticks: { color: muted, font: { family: "JetBrains Mono, ui-monospace, Consolas, monospace", size: 11 }, maxTicksLimit: 12, callback: (v) => v }, grid: { color: grid }, title: { display: true, text: "hands", color: muted } },
        y: { ticks: { color: muted, font: { family: "JetBrains Mono, ui-monospace, Consolas, monospace", size: 11 }, callback: (v) => `${v} bb` }, grid: { color: (c) => c.tick.value === 0 ? muted : grid, lineWidth: (c) => c.tick.value === 0 ? 1.5 : 1 } },
      },
    },
  });
  // the axes are sized with whatever font is loaded at draw time; re-lay them out once the web fonts arrive
  if (document.fonts && document.fonts.status !== "loaded") document.fonts.ready.then(() => { if (AN.chart && AN.chart.canvas === cv) AN.chart.update(); });
  const unk = p.filter((x) => !x.known).length;
  $("an-legend").innerHTML = `<span><i></i>${esc(P.label)}</span>${C ? `<span><i class="ev"></i>${esc(C.label)}</span>` : ""}${unk ? `<span><i class="unk"></i>net unknown (${unk} hands, carried flat)</span>` : ""}<span><i class="zero"></i>Break-even</span>`;
}

/* ---- global block: solver and corpus, unchanged by the scope --------------- */
async function anGlobal(g) {
  let html = "";
  try {
    const mv = await (await fetch("/api/dashboard/mes-value")).json();
    if (mv.ok) {
      const f1 = (x) => x == null ? "—" : (x >= 0 ? "+" : "") + Number(x).toFixed(1);
      html += `<div class="card"><h2>Winrate ladder — graded backtest, measured rake (bb/100)</h2>
        <table><thead><tr><th>strategy</th><th>no rake</th><th>NL200 rake</th><th>NL25 rake</th><th>footing</th></tr></thead><tbody>` +
        mv.ladder.map((r) => `<tr><td>${esc(r.strategy)}</td><td>${f1(r.norake)}</td><td><b>${f1(r.nl200)}</b></td><td><b>${f1(r.nl25)}</b></td><td class="sub">${esc(r.note)}</td></tr>`).join("") +
        `</tbody></table></div>`;
      const famRow = (name, f, src) => f ? `<tr><td>${esc(name)}</td><td>${esc(src)}</td><td>${f.arrivals}</td><td>${f.arrival_pct_of_hands}%</td><td>${f1(f.mean_ev_gain_per_arrival)} bb</td><td><b>${f1(f.uplift_bb100)}</b></td></tr>` : "";
      const fams = ["M1_heroSB_bvb_cbet", "M2_heroBTN_srp_vs_BB"];
      html += `<div class="card"><h2>Postflop MES uplift — v3 locked solves, per arrival → bb/100</h2>
        <table><thead><tr><th>family</th><th>source</th><th>arrivals</th><th>% of hands</th><th>mean ev_gain / arrival</th><th>uplift bb/100</th></tr></thead><tbody>` +
        fams.map((k) => famRow(k, mv.corpus?.families?.[k], `corpus (${mv.corpus?.hands ?? 0} hands)`) + famRow(k, mv.live?.families?.[k], `live (${mv.live?.hands ?? 0} hands)`)).join("") +
        `<tr><td><b>total</b></td><td>corpus</td><td></td><td></td><td></td><td><b>${f1(mv.corpus?.total_uplift_bb100)}</b></td></tr>
         <tr><td><b>total</b></td><td>live</td><td></td><td></td><td></td><td><b>${f1(mv.live?.total_uplift_bb100)}</b></td></tr>
        </tbody></table>
        <div class="sub" style="margin-top:8px">${(mv.caveats || []).map((t) => "• " + esc(t)).join("<br>")}</div></div>`;
    }
  } catch (e) { html += `<div class="card warn">mes-value unavailable: ${esc(String(e))}</div>`; }
  const t = g?.answers?.tiers ?? {};
  html += `<div class="card"><h2>Study answers (last 60 days, every hand)</h2>
    <div class="sub">${g?.answers?.answered ?? 0} answered · ${g?.answers?.failed ?? 0} failed</div>
    <table><thead><tr><th>tier</th><th>n</th><th>p50 ms</th><th>p90 ms</th><th>max ms</th></tr></thead><tbody>
    ${Object.entries(t).map(([k, x]) => `<tr><td>${esc(k)}</td><td>${x.n}</td><td>${x.p50}</td><td>${x.p90}</td><td>${x.max}</td></tr>`).join("")}
    </tbody></table></div>`;
  html += `<div id="miss-queue"><div class="card sub">loading the preflop miss queue…</div></div>`;
  return html;
}

/* ================= preflop miss queue ================= */
// Postflop is complete (the AI chain solves any board on demand). Preflop has
// no live equivalent, so every chart miss is written down with the state to
// solve it; the HRC runner works the queue between sessions.
let MQ = null, mqFilter = "active", mqTimer = null, mqShowAll = false, mqShowAllJobs = false;
const MQ_KIND = {
  "size-snapped": ["size snapped", "answered, but from a size ≥0.1 log-bb away (e.g. a 3.9x open served from the 3.5x node)"],
  "size-off-tree": ["size off tree", "the played size is further than τ from every size in the tree — no answer"],
  "action-not-in-tree": ["action not in tree", "a limp / call / check the tree shape does not contain — no answer"],
  "jam-not-offered": ["jam not offered", "an all-in at a node with no aggressive action — no answer"],
  "node-missing": ["node missing", "the walked line is not in the solution — no answer"],
  "past-terminal": ["past terminal", "the line runs on past a terminal node — no answer"],
  "beyond-ladder": ["beyond ladder", "deep stacks past the 150bb rung — answered from the 150bb chart"],
  other: ["other", "an unclassified walk failure"],
};
const mqKind = (k) => `<span class="mq-kind ${esc(k)}" title="${esc((MQ_KIND[k] || MQ_KIND.other)[1])}">${esc((MQ_KIND[k] || MQ_KIND.other)[0])}</span>`;

async function loadMissQueue() {
  const host = $("miss-queue");
  if (!host) return;
  let j;
  try { j = await (await fetch("/api/dashboard/miss-queue")).json(); } catch (e) { host.innerHTML = '<div class="card warn">miss queue unavailable</div>'; return; }
  if (!j.ok) { host.innerHTML = '<div class="card warn">miss queue unavailable</div>'; return; }
  MQ = j;
  renderMissQueue();
  clearTimeout(mqTimer);
  if (j.sweep.running) mqTimer = setTimeout(loadMissQueue, 2000);
}

function renderMissQueue() {
  const host = $("miss-queue");
  if (!host || !MQ) return;
  const st = MQ.stats, sw = MQ.sweep;
  const bs = st.byStatus || {};
  const tile = (k, val, sub) => `<div class="tile"><div class="v num">${val}</div><div class="k">${k}</div>${sub ? `<div class="s">${sub}</div>` : ""}</div>`;
  const kinds = Object.entries(st.byKind || {}).sort((a, b) => b[1] - a[1]).map(([k, n]) => `${mqKind(k)} <span class="sub num">${n}</span>`).join(" &nbsp; ");
  const sweepHtml = sw.running
    ? `<span class="mq-prog">sweeping ${esc(sw.source)} <span class="bar"><i style="width:${sw.total ? Math.round(100 * sw.done / sw.total) : 0}%"></i></span> ${sw.done}/${sw.total} decisions · ${sw.misses} inexact · ${sw.charts} charts</span>`
    : sw.finishedAt
      ? `<span class="sub">last sweep: ${esc(sw.source)} · ${sw.decisions} decisions, ${sw.misses} inexact · ${sw.error ? `<span class="warn">${esc(sw.error)}</span>` : `${fmtAgo(sw.finishedAt)}`}</span>`
      : `<span class="sub">no sweep yet this run</span>`;
  const active = (MQ.items || []).filter((x) => mqFilter === "all" ? true : mqFilter === "active" ? (x.status === "open" || x.status === "queued") : x.status === mqFilter);
  const rows = (mqShowAll ? active : active.slice(0, 120)).map(mqRow).join("");
  // the runner's unit is a job, not an item: group the filtered items by the chart they'd produce
  const byJob = new Map();
  for (const x of active) {
    if (!x.job) continue;
    const g = byJob.get(x.job.id) || { job: x.job, n: 0, items: 0, kinds: {}, status: {}, live: 0, chart: x.chart };
    g.n += x.n; g.items++; g.live += x.nLive; g.kinds[x.kind] = (g.kinds[x.kind] || 0) + x.n; g.status[x.status] = (g.status[x.status] || 0) + 1;
    byJob.set(x.job.id, g);
  }
  const jobs = [...byJob.values()].sort((a, b) => b.n - a.n);
  const jobRows = (mqShowAllJobs ? jobs : jobs.slice(0, 25)).map((g) => {
    const st = g.status.queued ? (g.status.open ? "partly queued" : "queued") : g.status.solved && !g.status.open ? "solved" : g.status.dismissed && !g.status.open ? "dismissed" : "open";
    return `<tr class="src-static">
      <td><div class="mono">${esc(g.job.id)}</div><div class="sub">${esc(g.job.change)}</div></td>
      <td class="mq-state"><b>${esc(g.job.site)}</b> · ${g.job.stacksBB.join("/")}bb<div class="sub">from ${esc(g.chart)}</div></td>
      <td>${Object.entries(g.kinds).sort((a, b) => b[1] - a[1]).map(([k, n]) => `${mqKind(k)} <span class="sub num">${n}</span>`).join(" ")}</td>
      <td class="num"><b>${g.n}</b><div class="sub">${g.items} item${g.items === 1 ? "" : "s"}${g.live ? ` · live ${g.live}` : ""}</div></td>
      <td><span class="chip ${st === "queued" ? "good" : st === "open" ? "warn" : "dim"}">${st}</span></td>
      <td><div style="display:flex;gap:4px;flex-wrap:wrap">
        <button class="mini" onclick="mqJobStatus('${esc(g.job.id)}','queued')" ${st === "queued" ? "disabled" : ""}>queue</button>
        <button class="mini" onclick="mqJobStatus('${esc(g.job.id)}','open')" ${st === "open" ? "disabled" : ""}>open</button>
        <button class="mini" onclick="mqJobStatus('${esc(g.job.id)}','dismissed')">dismiss</button></div></td></tr>`;
  }).join("");
  host.innerHTML = `<div class="card">
    <h2>Preflop miss queue <span class="sub">— ${bs.open || 0} open · ${bs.queued || 0} queued · ${bs.solved || 0} solved · ${bs.dismissed || 0} dismissed</span></h2>
    <div class="banner">🧭 <b>Preflop is completed offline.</b> Postflop has the AI chain to solve any board on demand; a 3-handed preflop state takes HRC 12–90 min, so it can't be solved live. Instead every spot the chart corpus couldn't answer <i>exactly</i> is written down here with its state — stacks, line, the size or action the tree lacked — and a suggested HRC job. Queue the ones worth solving, write the plan, run it in HRC Runner; when the chart lands, <b>re-check</b> marks the item solved.</div>
    <div class="tiles">
      ${tile("open", bs.open || 0)} ${tile("queued", bs.queued || 0)} ${tile("solved", bs.solved || 0)}
      ${tile("decisions affected", (st.hands.live + st.hands.archive + st.hands.corpus), `live ${st.hands.live} · archive ${st.hands.archive} · corpus ${st.hands.corpus}`)}
    </div>
    <div class="sub" style="margin:10px 0 4px">${kinds || "no open misses"}</div>
    <div class="mq-ctl">
      <select id="mq-filter" onchange="mqFilter=this.value;renderMissQueue()">
        ${[["active", "open + queued"], ["all", "everything"], ["open", "open"], ["queued", "queued"], ["solved", "solved"], ["dismissed", "dismissed"]].map(([v, l]) => `<option value="${v}" ${mqFilter === v ? "selected" : ""}>${l}</option>`).join("")}
      </select>
      <button class="mini" onclick="mqSweep('archive')" ${sw.running ? "disabled" : ""} title="walk every hero preflop decision in hands.db through the charts">sweep archive</button>
      <button class="mini" onclick="mqSweep('corpus')" ${sw.running || !MQ.corpus ? "disabled" : ""} title="walk every preflop node of the 4k-hand Zone corpus through the charts (all actors) — minutes">sweep 4k corpus</button>
      <button class="mini" onclick="mqPlan()" ${(bs.queued || 0) ? "" : "disabled"} title="write one HRC plan per queued job + a runner queue">write HRC plan (${bs.queued || 0} queued)</button>
      ${sweepHtml}
    </div>
    <h2 style="margin-top:14px">Suggested HRC jobs <span class="sub">— ${jobs.length} distinct, by decisions covered${jobs.length > 25 && !mqShowAllJobs ? ` · showing 25 <a href="#" onclick="mqShowAllJobs=true;renderMissQueue();return false">show all</a>` : ""}</span></h2>
    <div class="scroll"><table><thead><tr><th>job</th><th>state</th><th>what it fixes</th><th class="num">decisions</th><th>status</th><th></th></tr></thead>
    <tbody>${jobRows || `<tr class="src-static"><td colspan="6" class="sub">no jobs to suggest</td></tr>`}</tbody></table></div>
    <h2 style="margin-top:14px">Items <span class="sub">— ${active.length}${active.length > 120 && !mqShowAll ? ` · showing 120 <a href="#" onclick="mqShowAll=true;renderMissQueue();return false">show all</a>` : ""}</span></h2>
    <div class="scroll"><table><thead><tr><th>kind</th><th>state</th><th>node</th><th class="num">seen</th><th>hands</th><th>suggested HRC job</th><th>status</th></tr></thead>
    <tbody>${rows || `<tr class="src-static"><td colspan="7" class="sub">nothing here — run a sweep, or play with Study Answers on</td></tr>`}</tbody></table></div>
    <div class="sub" style="margin-top:8px">Items are keyed by chart · line · wanted token. A "seen" count is decisions, not hands. Sweeps reset their own counts before re-walking, so they never double count; live counts only grow. Store: <span class="mono">${esc(MQ.store)}</span> · plans: <span class="mono">${esc(MQ.planDir)}</span></div>
  </div>`;
}

function mqRow(x) {
  const stk = x.state?.stacksBB || {};
  const stacks = ["BTN", "SB", "BB"].filter((p) => stk[p] != null).map((p) => `${p} ${stk[p]}`).join(" · ");
  const shape = x.shortSeat === "EQ" ? `${x.depth}bb even` : `${x.depth}/${x.depth} + ${esc(x.shortSeat)} ${x.shortDepth}bb`;
  const state = `<div class="mq-state"><b>${esc(x.site)}</b> · ${shape}${x.kind === "beyond-ladder" ? ` <span class="chip warn">deep</span>` : ""}<div class="sub">${esc(stacks || "stacks unreadable")}${x.state?.heroPos ? ` · hero ${esc(x.state.heroPos)}` : ""}</div><div class="mono sub">${esc(x.chart)}</div></div>`;
  const node = `<div class="mq-node"><span class="mono">${esc(x.line || "(root)")}</span>
    ${x.want ? `<div><span class="mono">${esc(x.want)}</span> <span class="arrow">→</span> ${x.got ? `<span class="mono">${esc(x.got)}</span>` : '<span class="crit">nothing</span>'}</div>` : ""}
    ${x.offered?.length ? `<div class="sub">offered: <span class="mono">${esc(x.offered.join(" "))}</span></div>` : ""}
    <div class="sub" title="${esc(x.reason)}">${esc(x.reason.length > 90 ? x.reason.slice(0, 90) + "…" : x.reason)}</div></div>`;
  const seen = `<div class="num"><b>${x.n}</b><div class="sub">${[x.nLive ? `live ${x.nLive}` : "", x.nArchive ? `archive ${x.nArchive}` : "", x.nCorpus ? `corpus ${x.nCorpus}` : ""].filter(Boolean).join(" · ")}</div><div class="sub">${x.lastSeen ? fmtT(x.lastSeen) : ""}</div></div>`;
  const linked = (x.refs || []).filter((r) => r.dbId != null).slice(-3);
  const corpusRefs = (x.refs || []).filter((r) => r.dbId == null).slice(-3);
  const hands = `<div>${linked.map((r) => `<a href="/hands/${r.dbId}/node/${r.actionIndex ?? ""}" onclick="go('/hands/${r.dbId}/node/${r.actionIndex ?? ""}');return false">#${r.dbId}</a>`).join(" ")}
    ${corpusRefs.length ? `<div class="sub">corpus ${corpusRefs.map((r) => esc(String(r.handId ?? "?"))).join(", ")}</div>` : ""}</div>`;
  const job = x.job
    ? `<div class="mq-job"><div class="mono id">${esc(x.job.id)}</div><div class="sub">${esc(x.job.change)}</div><div class="sub">stacks ${x.job.stacksBB.join("/")} · opens ${esc(String(x.job.sizes[0]))}</div></div>`
    : '<span class="sub">no job suggested</span>';
  const status = `<div style="display:flex;flex-direction:column;gap:4px">
    <select onchange="mqStatus(${x.id}, this.value)">${["open", "queued", "solved", "dismissed"].map((s) => `<option value="${s}" ${x.status === s ? "selected" : ""}>${s}</option>`).join("")}</select>
    <button class="mini" onclick="mqRecheck(${x.id}, this)" title="re-walk this state through today's charts; an exact walk marks it solved">re-check</button>
    ${x.note ? `<div class="sub" title="${esc(x.note)}">${esc(x.note.length > 60 ? x.note.slice(0, 60) + "…" : x.note)}</div>` : ""}</div>`;
  return `<tr class="src-static mq-${esc(x.status)}"><td>${mqKind(x.kind)}</td><td>${state}</td><td>${node}</td><td class="num">${seen}</td><td>${hands}</td><td>${job}</td><td>${status}</td></tr>`;
}

async function mqSweep(source) {
  const r = await (await fetch("/api/dashboard/miss-queue/sweep", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ source }) })).json();
  if (!r.ok) alert(r.error || "sweep failed");
  loadMissQueue();
}
async function mqJobStatus(jobId, status) {
  await fetch("/api/dashboard/miss-queue/status-by-job", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ jobId, status }) });
  loadMissQueue();
}
async function mqStatus(id, status) {
  await fetch(`/api/dashboard/miss-queue/${id}/status`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ status }) });
  loadMissQueue();
}
async function mqRecheck(id, btn) {
  if (btn) { btn.disabled = true; btn.textContent = "checking…"; }
  const r = await (await fetch(`/api/dashboard/miss-queue/${id}/recheck`, { method: "POST" })).json();
  if (!r.ok) alert(r.error || "re-check failed");
  else if (!r.exact) alert(`still inexact on ${r.chart}: ${r.walk.reason || ("snapped " + JSON.stringify(r.walk.repaired))}`);
  loadMissQueue();
}
async function mqPlan() {
  const r = await (await fetch("/api/dashboard/miss-queue/plan", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" })).json();
  if (!r.ok) { alert(r.error || "plan failed"); return; }
  alert(`wrote ${r.jobs} job(s)\n\nplan: ${r.plan}\nrunner queue: ${r.queue}\n\nOpen HRC Runner and load the queue file.`);
}

/* ================= chart catalog ================= */
let CAT = null, catFam = "", catQ = "";

const stacksStr = (e) => {
  if (!e.stacksBB) return e.depth != null ? `${e.depth}bb` : "—";
  const seats = e.seats ?? Object.keys(e.stacksBB);
  const vals = seats.map((s) => e.stacksBB[s]);
  return vals.every((v) => v === vals[0]) ? `${vals[0]}bb even`
    : seats.map((s) => `${s} ${e.stacksBB[s]}`).join(" · ");
};
const fmtAgo = (ms) => {
  const m = Math.round((Date.now() - ms) / 60000);
  return m < 60 ? `${m}m ago` : m < 1440 ? `${Math.round(m / 60)}h ago` : `${Math.round(m / 1440)}d ago`;
};

async function loadCatalog() {
  const v = $("src-catalog");
  if (!v) return;
  v.innerHTML = '<div class="card sub">loading catalog…</div>';
  let j;
  try {
    j = await (await fetch("/api/dashboard/catalog")).json();
  } catch (e) { v.innerHTML = '<div class="card warn">catalog unavailable</div>'; return; }
  if (!j.ok) { v.innerHTML = '<div class="card warn">catalog unavailable</div>'; return; }
  CAT = j;
  renderCatalog();
}

function renderCatalog() {
  const v = $("src-catalog");
  if (!v) return;
  const s = CAT.summary;
  const tile = (k, val, sub) => `<div class="tile"><div class="v">${val}</div><div class="k">${k}</div>${sub ? `<div class="sub">${sub}</div>` : ""}</div>`;
  const famNames = Object.keys(s.byFamily).sort();

  // recently-queried strip: live answers joined back to their chart
  const recent = (CAT.recent || []).slice(0, 12);
  const recentHtml = recent.length
    ? `<div class="card"><h2>Recently queried by live study (30d)</h2><table><thead><tr>
        <th>chart</th><th>answers</th><th>last used</th></tr></thead><tbody>` +
      recent.map((r) => `<tr><td>${esc(r.chart)}</td><td>${r.n}</td><td class="sub">${fmtAgo(r.lastTs)}</td></tr>`).join("") +
      `</tbody></table></div>`
    : `<div class="card sub">No live study answers logged against a chart yet — play a session with Study Answers on and the charts used will appear here.</div>`;

  let rows = CAT.entries;
  if (catFam) rows = rows.filter((e) => e.family === catFam);
  if (catQ) rows = rows.filter((e) => `${e.id} ${e.label} ${e.site ?? ""} ${e.routed ?? ""}`.toLowerCase().includes(catQ));
  // Live-routed families first — alphabetical order buried the 3-max corpus
  // under a screenful of browse-only HU grids.
  const famRank = { "3max-asym": 0, gtow: 1, "3max": 2, "hu-grid": 3, "hu-size": 4, husng: 5 };
  rows = rows.slice().sort((a, b) =>
    ((famRank[a.family] ?? 8) - (famRank[b.family] ?? 8)) || a.id.localeCompare(b.id));
  const shown = rows.slice(0, 800);

  v.innerHTML = `
    <div class="tiles">
      ${tile("charts", s.total, `${s.routed} live-routed`)}
      ${famNames.map((f) => tile(f, s.byFamily[f])).join("")}
    </div>
    <div class="card sub" style="line-height:1.7">
      <b style="color:#9db1c7">Sources:</b>
      HRC corpus ${s.solutionsDir ? `sidecars at <code>${esc(s.solutionsDir)}</code>` : '<span class="warn">solutions dir NOT found</span>'} (bodies canonical in R2, fetched on demand) ·
      GTOW crawl ${s.gtowDb ? "<code>data/preflop-db.sqlite</code>" : '<span class="warn">sqlite missing</span>'} ·
      <b style="color:#9db1c7">routed</b> = what the Ignition study poller answers from today; everything else is browsable in SolverStudy.
    </div>
    ${recentHtml}
    <div class="card">
      <h2>All charts
        <select id="cat-fam" style="margin-left:10px;background:#10151d;border:1px solid #2c3a4d;color:inherit;border-radius:5px;padding:2px 6px">
          <option value="">all families</option>
          ${famNames.map((f) => `<option value="${f}" ${f === catFam ? "selected" : ""}>${f} (${s.byFamily[f]})</option>`).join("")}
        </select>
        <input id="cat-q" type="text" placeholder="filter id, site, routed…" value="${esc(catQ)}" style="margin-left:8px">
        <button id="cat-refresh" class="mini" style="margin-left:8px">↻ rescan</button>
        <span class="sub" style="margin-left:10px">${rows.length} match${shown.length < rows.length ? ` · showing ${shown.length}` : ""}</span>
      </h2>
      <table><thead><tr>
        <th>id</th><th>family</th><th>site</th><th>players</th><th>stacks</th><th>sizes</th><th>nodes</th><th>cached</th><th>routed</th>
      </tr></thead><tbody>
      ${shown.map((e) => `<tr style="cursor:default">
        <td title="${esc(e.location)}">${esc(e.id)}</td>
        <td>${esc(e.family)}</td>
        <td>${esc(e.site ?? "—")}</td>
        <td>${e.players ?? "—"}</td>
        <td>${esc(stacksStr(e))}</td>
        <td class="sub">${e.open != null ? `o${e.open}` : ""}${e.threeBet != null ? ` 3b${e.threeBet}` : ""}</td>
        <td>${e.nodes ?? "—"}</td>
        <td>${e.source !== "hrc" ? "bundled" : e.cachedLocally ? "✓" : '<span class="sub">R2</span>'}</td>
        <td>${e.routed ? `<span class="badge b-info">${esc(e.routed)}</span>` : '<span class="sub">browse-only</span>'}</td>
      </tr>`).join("")}
      </tbody></table>
    </div>`;
  $("cat-fam").onchange = (ev) => { catFam = ev.target.value; renderCatalog(); };
  $("cat-q").oninput = (ev) => { catQ = ev.target.value.trim().toLowerCase(); renderCatalog(); };
  // keep typing focus through re-render
  const q = $("cat-q"); q.focus(); q.setSelectionRange(q.value.length, q.value.length);
  $("cat-refresh").onclick = async () => {
    $("cat-refresh").textContent = "…";
    try { CAT = await (await fetch("/api/dashboard/catalog?refresh=1")).json(); } catch (e) {}
    renderCatalog();
  };
}

/* ================= Ledger: formats · configs · plans · jobs ================= */
let LG = null, lgJobTimer = null, lgOpenLog = null;
const minsStr = (m) => m >= 48 * 60 ? `${(m / 1440).toFixed(m >= 14400 ? 0 : 1)} days` : m >= 60 ? `${(m / 60).toFixed(m >= 600 ? 0 : 1)} h` : `${Math.round(m)} min`;
async function loadLedger() {
  const v = $("view-ledger");
  if (!LG) v.innerHTML = '<div class="card sub">loading the ledger…</div>';
  try { LG = await (await fetch("/api/ledger")).json(); } catch (e) { v.innerHTML = '<div class="card warn">ledger unavailable</div>'; return; }
  if (!LG.ok) { v.innerHTML = '<div class="card warn">ledger unavailable</div>'; return; }
  if ((PATH.pane === "runbook" || PATH.pane === "plan") && PATH.id) { await renderRunbook(PATH.id); return; }
  if (PATH.pane === "ledger") { renderLedger(); return; }
  if (PATH.pane === "detail") { renderOperatorDetail(); return; }
  if (PATH.pane === "progress" && PATH.id) { await renderProgress(PATH.id); return; }
  renderProposalPage();
  clearTimeout(lgJobTimer);
  if ((LG.jobs || []).some((j) => j.status === "running" || j.status === "queued")) lgJobTimer = setTimeout(loadLedger, 4000);
}
function renderLedger() {
  const v = $("view-ledger"), L = LG;

/* the data behind a WORK line: chart nodes, ranges, tables — fetched on demand, shown inline under the line */
/* data panels stay open across the 4-second re-render while a run is live: opened panels are remembered by their
   encoded descriptor and re-fetched after each render; the same for chart views opened inside a table */
const wdOpen = new Set(), wcOpen = new Set(), wdCache = new Map();
function wdReopen() {

async function viewChart(btn, id, keep) {
  const tr = btn.closest("tr"); let row = tr.nextElementSibling;
  if (!(row && row.classList.contains("wc-row"))) { row = document.createElement("tr"); row.className = "wc-row"; row.innerHTML = `<td colspan="${tr.children.length}"></td>`; tr.after(row); }
  if (!keep && !row.hidden && row.firstChild.innerHTML) { row.hidden = true; row.firstChild.innerHTML = ""; btn.textContent = "view chart"; wcOpen.delete(id); return; }
  wcOpen.add(id); row.hidden = false; row.firstChild.innerHTML = '<div class="sub">fetching the chart…</div>'; btn.textContent = "…";
  let j; try { j = await (await fetch(`/api/ledger/work-data?d=${encodeURIComponent(JSON.stringify({ kind: "chart", id, seats: 3 }))}`)).json(); } catch (e) { j = { ok: false, error: String(e) }; }
  btn.textContent = "hide chart";
  row.firstChild.innerHTML = j.ok ? `<div class="wd-title">${esc(j.title)}</div><div class="wd-grid">${wdSections(j.sections)}</div>` : `<div class="warn">${esc(j.error ?? "no data")}</div>`;
}
async function workData(btn, enc, keep) {
  const panel = btn.closest("span").querySelector(".wd-panel");
  if (!keep && !panel.hidden) { panel.hidden = true; btn.textContent = btn.dataset.label || "data"; wdOpen.delete(enc); return; }
  if (!btn.dataset.label) btn.dataset.label = btn.textContent;
  wdOpen.add(enc);
  // after a live re-render show the last content at once and refresh it in the background — no flashing "fetching…"
  if (panel.hidden) { panel.hidden = false; panel.innerHTML = wdCache.get(enc) || '<div class="sub">fetching…</div>'; }
  btn.textContent = keep && wdCache.has(enc) ? "hide" : "…";
  let j; try { j = await (await fetch(`/api/ledger/work-data?d=${enc}`)).json(); } catch (e) { j = { ok: false, error: String(e) }; }
  btn.textContent = "hide";
  if (!j.ok) { if (!wdCache.has(enc)) panel.innerHTML = `<div class="warn">${esc(j.error ?? "no data")}</div>`; return; }
  const html = `<div class="wd-title">${esc(j.title)}</div><div class="wd-grid">${wdSections(j.sections)}</div>`;
  wdCache.set(enc, html);
  if (!wdOpen.has(enc)) return;   // closed while fetching
  panel.innerHTML = html;
  // chart views that were open inside this panel before the re-render
  panel.querySelectorAll("button.wc-btn").forEach((b) => { if (wcOpen.has(b.dataset.id)) viewChart(b, b.dataset.id, true); });
}
function wdSections(sections) {
  const secs = sections.map((sec) => {
    let body = "";
    if (sec.node) {
      const cls = {};
      for (const [hand, acts] of Object.entries(sec.node.cells)) cls[hand] = { w: COMBOS(hand), acts: sec.node.actions.map((a) => (COMBOS(hand) * (acts[a] ?? 0)) / 100) };
      body = classGrid(cls, sec.node.actions, null, { flat: true, wmax: 1e9, small: true, foot: "hover a cell for its mix" });
    } else if (sec.range) {
      const cls = {}; let mass = 0;
      for (const [hand, w] of Object.entries(sec.range)) { cls[hand] = { w: COMBOS(hand) * w, acts: [COMBOS(hand) * w] }; mass += COMBOS(hand) * w; }
      body = classGrid(cls, ["in range"], null, { single: "#4da3ff", small: true, foot: `${(100 * mass / 1326).toFixed(1)}% of hands · opacity = weight` });
    } else if (sec.table) {
      const T = sec.table, hasView = T.chart != null;
      const stCls = (s) => s === "done" ? "done" : String(s).startsWith("solving") ? "running" : "queued";
      body = `<div class="scroll"><table><thead><tr>${T.cols.map((c) => `<th>${esc(String(c))}</th>`).join("")}${hasView ? "<th></th>" : ""}</tr></thead><tbody>${T.rows.map((r) => `<tr class="src-static">${r.map((v, i) => `<td>${i === T.status ? `<span class="st-pill ${stCls(v)}">${esc(String(v))}</span>` : esc(String(v))}</td>`).join("")}${hasView ? `<td>${r[T.status] === "done" ? `<button class="mini wc-btn" data-id="${esc(String(r[T.chart]))}" onclick="viewChart(this, this.dataset.id)">view chart</button>` : ""}</td>` : ""}</tr>`).join("")}</tbody></table></div>`;
    } else if (sec.list) {
      body = `<ul class="rb-list">${sec.list.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`;
    }
    return `<div class="wd-sec${sec.table ? " wide" : ""}"><b>${esc(sec.title)}</b>${sec.note ? `<div class="sub">${esc(sec.note)}</div>` : ""}${body}</div>`;
  }).join("");
  return secs;
}

/* The session review: every hand of the session with its study-answer status,
   filterable to the ones that got no answer (the Analytics "Answered" cell links
   here with the Unanswered chip on), and a per-hand jump into Replay Review's
   frame recording when the session has one. */
function sessionHandsCard(j, id, show) {
  const hands = j.hands || [];
  // the session's recording, or (gap clusters) the recording its hands were found in
  const rec = j.recording ?? (hands.find((h) => h.recording) ? { name: hands.find((h) => h.recording).recording } : null);
  const n = (st) => hands.filter((h) => h.status?.status === st).length;
  const unanswered = hands.filter((h) => h.status?.status !== "answered");
  const rows = show === "unanswered" ? unanswered : show === "failed" ? hands.filter((h) => h.status?.status === "failed") : hands;
  const chip = (key, label, count) => `<button class="mini ${(show ?? "all") === key ? "on" : ""}" data-show="${key}">${label} <span class="sub">${count}</span></button>`;
  const tr = (h) => `<tr data-id="${h.dbId}" class="${h.status?.status === "answered" ? "" : "unanswered"}"><td>${fmtT(h.playedAt)}</td><td>${esc(h.stakes ?? "?")}</td><td>${esc(h.heroPos ?? "?")}</td><td>${cardsHtml(h.heroCards)}</td><td>${esc(h.finalStreet)}</td><td class="num">${h.potBb}</td>${evCell(h.netBb, {})}<td>${ansChip(h.status)}</td>
    <td>${(h.recording || rec) && h.clientHandId ? `<a class="mini" href="/replay?session=${encodeURIComponent(h.recording || rec.name)}&hand=${encodeURIComponent(h.clientHandId)}" target="_blank" rel="noopener" style="text-decoration:none" onclick="event.stopPropagation()" title="frame-by-frame, as the screen showed it">as recorded ↗</a>` : '<span class="sub">—</span>'}</td></tr>`;
  return `<div class="card"><h2>Hands <span class="sub">— ${hands.length} · ${n("answered")} answered · ${n("failed")} failed · ${n("missing")} no answer · ${n("no-decision")} no decision seen${n("unknown") ? ` · ${n("unknown")} unknown` : ""} · click a row to open the hand</span></h2>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px">${chip("all", "All", hands.length)}${chip("unanswered", "Unanswered", unanswered.length)}${chip("failed", "Failed", n("failed"))}
      ${rec ? `<a class="mini" href="/replay?session=${encodeURIComponent(rec.name)}" target="_blank" rel="noopener" style="text-decoration:none;margin-left:auto">open the recording in Replay Review ↗</a>` : '<span class="sub" style="margin-left:auto">no frame recording for this session — hands open in the archive replayer</span>'}</div>
    <div class="scroll"><table><thead><tr><th>time</th><th>stakes</th><th>pos</th><th>cards</th><th>street</th><th class="num">pot</th><th class="num">net bb</th><th>answers</th><th>recording</th></tr></thead>
    <tbody>${rows.map(tr).join("") || `<tr class="src-static"><td colspan="9" class="sub">${hands.length ? "nothing in this filter" : "no hands archived under this session yet"}</td></tr>`}</tbody></table></div></div>`;
}
function wireSessionHands(v, id) {
  v.querySelectorAll("tr[data-id]").forEach((tr) => tr.onclick = () => go(`/hands/${tr.dataset.id}`));

/** the selected whole-hand strategy, and its two layers */

    const tip = `${key}: ` + acts.map((a, ai) => `${a} ${(100 * c.s[ai] / c.w).toFixed(0)}%${c.ev ? ` (${(c.ev[ai] / c.w / 100).toFixed(2)}bb)` : ""}`).join(" · ");
    html += `<div title="${esc(tip)}" style="background:linear-gradient(135deg,${stops.join(",")})">${key}</div>`;
  }
  return html + `</div>`;
}
async function mesWalk(family, board, hist, stage = { street: "flop" }) {
  const el = $("mes-walk"); if (!el) return;
  el.innerHTML = `<div class="card sub">loading ${esc(stage.street)} node…</div>`;
  let j;
  try {
    if (stage.street === "flop") j = await (await fetch(`/api/dashboard/sources/mes/node?family=${encodeURIComponent(family)}&board=${board}&hist=${hist.join(",")}`)).json();
    else if (stage.street === "turn") j = await (await fetch(`/api/dashboard/sources/mes/turn?family=${encodeURIComponent(family)}&board=${board}&flop=${stage.flop.join(",")}&card=${stage.card}&hist=${hist.join(",")}`)).json();
    else j = await (await fetch(`/api/dashboard/sources/mes/river?family=${encodeURIComponent(family)}&board=${board}&line=${encodeURIComponent(stage.line.join("|"))}&hist=${hist.join(",")}`)).json();
  } catch (e) { el.innerHTML = `<div class="card warn">${esc(String(e))}</div>`; return; }
  if (!j.ok) { el.innerHTML = `<div class="card warn">${esc(j.error)}</div>`; return; }
  const n = j.node;
  WALK = { family, board, hist, stage, node: n, view: WALK?.view ?? (typeof PT !== "undefined" && ptStrat()?.postflop === "gto" ? "gto" : "mes") };
  const who = n.isHero ? `<span class="mode mes">HERO (${esc(n.heroPos ?? (n.heroPlayer === 0 ? "OOP" : "IP"))}) to act</span>` : `<span class="chip">villain to act</span>`;
  // n.path already begins with the spot line on the flop; later streets carry their own prefix
  const crumbs = stage.street === "flop" ? n.path
    : stage.street === "turn" ? [...(stage.flopLabels ?? n.flopLabels ?? []), stage.card, ...n.path]
    : [...(stage.flopLabels ?? []), stage.card, ...(stage.turnLabels ?? []), stage.rcard, ...n.path];
  const agg = (strat) => strat ? n.acts.map((_, ai) => { let s = 0, t = 0; (n.w || []).forEach((wj, j) => { s += wj * (strat[ai]?.[j] ?? 0); t += wj; }); return t ? 100 * s / t : 0; }) : null;
  const aggMes = agg(n.mes), aggGto = agg(n.gto);
  const canToggle = !!n.gto;
  const strat = WALK.view === "gto" && n.gto ? n.gto : n.mes;
  const ev = WALK.view === "gto" && n.gtoEv ? n.gtoEv : n.mesEv;
  let html = `<div class="card">
    <div class="dt-top"><button class="mini" onclick="mesWalk('${esc(family)}','${board}',[])">⏮ flop root</button>
      <h2 style="margin:0">${cardsHtml((n.board5 || board).match(/.{2}/g))} · ${esc(stage.street)} · pot ${(n.pot / 100).toFixed(2)}bb · ${who}</h2>
      ${canToggle ? `<span class="strat-toggle"><button class="mini ${WALK.view === "mes" ? "on" : ""}" onclick="WALK.view='mes';mesWalk('${esc(family)}','${board}',${JSON.stringify(hist)},WALK.stage)">MES</button><button class="mini ${WALK.view === "gto" ? "on" : ""}" onclick="WALK.view='gto';mesWalk('${esc(family)}','${board}',${JSON.stringify(hist)},WALK.stage)">GTO</button></span>` : `<span class="chip dim">MES only on this street</span>`}
    </div>
    <div class="sub mono" style="margin:6px 0">line: ${esc(crumbs.join(" › ") || "(root)")}</div>
    <div class="sub">${n.isHero ? (WALK.view === "gto" ? "equilibrium mix (the baseline the MES improves on)" : "MES mix — best response to the pool at this node") : "villain's node: the locked pool frequencies decide here; pick an action to continue"}</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin:8px 0">` +
    n.acts.map((a, ai) => `<button class="mini" ${n.children[ai] ? `onclick="mesStep(${ai})"` : `disabled title="street ends here"`}>${esc(a)}${aggMes ? ` <span class="sub">MES ${aggMes[ai].toFixed(0)}%${aggGto ? ` · GTO ${aggGto[ai].toFixed(0)}%` : ""}</span>` : ""}${n.children[ai] ? " ›" : " ⏹"}</button>`).join("") +
    `</div>` + (n.isHero && typeof PT !== "undefined" && PT.street !== "preflop" ? `<div class="pl-take"><button class="mini" onclick="playStudyAnswer()" title="the answer the table would give: same solve, same roll, same text">📣 Study answer${PT.combo ? ` for ${esc(PT.combo)}` : " — pick your hand"}</button><span class="sub">what the panel would say at the table — same solve, same roll</span></div><div id="pl-answer"></div>` : "") +
    (n.isHero && strat ? mesGridHtml(n.holes || [], n.w, strat, ev, n.acts, null) : "") + `</div>`;
  // street ended? offer the next card
  const ended = n.children.every((x) => !x) || n.acts.every((_, ai) => !n.children[ai]);
  if (stage.street === "flop") {
    const lines = await (await fetch(`/api/dashboard/sources/mes/turn-lines?family=${encodeURIComponent(family)}&board=${board}`)).json().catch(() => null);
    const here = lines?.ok ? lines.lines.filter((l) => l.hist.join(",") === hist.join(",") || n.acts.some((_, ai) => !n.children[ai] && l.hist.join(",") === [...hist, ai].join(","))) : [];
    if (lines?.ok && here.length) {
      html += `<div class="card"><h2>Deal the turn <span class="sub">— extracted for the flop lines that carry ~97% of hero's reach</span></h2>` +
        here.map((l) => `<div style="margin:6px 0"><span class="mono sub">after ${esc(l.labels.join(" › "))}:</span> ` +
          l.cards.map((cd) => `<button class="mini" onclick="mesWalk('${esc(family)}','${board}',[], {street:'turn', flop:${JSON.stringify(l.hist)}, flopLabels:${JSON.stringify(l.labels)}, card:'${cd}'})">${cardsHtml([cd])}</button>`).join(" ") + `</div>`).join("") + `</div>`;
    } else if (lines && !lines.ok) html += `<div class="card sub">${esc(lines.error)}</div>`;
  } else if (stage.street === "turn" && ended) {
    const R = "23456789TJQKA", S = "shdc"; const used = new Set([...board.match(/.{2}/g), stage.card]);
    const cards = []; for (const r of R) for (const s of S) if (!used.has(r + s)) cards.push(r + s);
    const line = [...(n.flopLabels || []), stage.card, ...n.path];
    html += `<div class="card"><h2>Deal the river <span class="sub">— extracted on demand from the locked tree (~1 min the first time, then cached)</span></h2>` +
      cards.map((cd) => `<button class="mini" onclick="mesWalk('${esc(family)}','${board}',[], {street:'river', line:${JSON.stringify([...line, cd])}, flopLabels:${JSON.stringify(n.flopLabels || [])}, card:'${stage.card}', turnLabels:${JSON.stringify(n.path)}, rcard:'${cd}'})">${cardsHtml([cd])}</button>`).join(" ") + `</div>`;
  }
  el.innerHTML = html;
  if (n.isHero && typeof PT !== "undefined" && PT.street !== "preflop") ptAutoAsk(`mes|${family}|${board}|${stage.street}|${(n.path || []).join(",")}`, true);
  el.scrollIntoView({ behavior: "smooth", block: "start" });
}
function mesStep(ai) { if (!WALK) return; mesWalk(WALK.family, WALK.board, [...WALK.hist, ai], WALK.stage); }

  const nodeHtml = j.nodes.map((n) => {
    const cls = {};
