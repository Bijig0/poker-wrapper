const durStr = (min) => min == null ? "—" : min >= 60 ? `${Math.floor(min / 60)} h ${Math.round(min % 60)} min` : `${Math.round(min)} min`;

async function loadSessions() {
  const v = $("view-sessions");
  v.innerHTML = '<div class="card sub">loading sessions…</div>';
  let j;
  try { j = await (await fetch("/api/dashboard/sessions")).json(); } catch (e) { v.innerHTML = '<div class="card warn">sessions unavailable</div>'; return; }
  if (!j.ok) { v.innerHTML = '<div class="card warn">sessions unavailable</div>'; return; }
  /* The tables this session's hands actually came from. A single-table session
     has one entry with slot null and shows a dash — tables.py gives it no slot
     on purpose. When the session DECLARED more tables than ever archived a hand,
     say so: that gap is how a split sitting looks from here. */
  const tablesCell = (x) => {
    const ts = x.tables || [];
    const slots = ts.filter((t) => t.slot != null);
    if (!slots.length) return '<span class="sub">—</span>';
    const chips = slots.map((t) => `<span class="chip" title="${t.hands} hand${t.hands === 1 ? "" : "s"} on table ${t.slot}">T${t.slot}</span>`).join(" ");
    const missing = x.declaredTables && x.declaredTables > slots.length;
    return chips + (missing
      ? ` <span class="chip warn" title="declared ${x.declaredTables} tables; only ${slots.length} archived any hands — the sitting may have split">${slots.length}/${x.declaredTables}</span>`
      : "");
  };
  const row = (x) => `<tr data-id="${esc(x.id)}">
      <td>${fmtT(x.startedAt)}${x.declared && !x.endedAt ? ` <span class="chip good">open</span> <button class="mini" onclick="endSession('${esc(x.id)}', event)" title="end this session — the wrapper writes its closing summary">end</button>` : ""}</td>
      <td>${x.declared ? presetChip(x.preset, x) : '<span class="chip dim">undeclared</span>'}</td>
      <td>${esc(x.label ?? "")}</td>
      <td>${x.declared ? (x.answersOn ? '<span class="chip">answers on</span>' : '<span class="sub">answers off</span>') : '<span class="sub">—</span>'}</td>
      <td>${esc(x.stakes ?? "?")}</td>
      <td class="num">${x.hands}</td>
      <td>${tablesCell(x)}</td>
      <td class="num">${x.answers ?? "—"}${x.failed ? ` <span class="sub">+${x.failed} failed</span>` : ""}</td>
      ${evCell(x.bb100, {})}
      <td>${x.recorded ? '<span class="chip">● recorded</span>' : '<span class="sub">—</span>'}</td>
      <td class="num">${durStr(x.durationMin)}</td>
    </tr>`;
  const declared = j.declared || [], clusters = j.clusters || [];
  v.innerHTML = `
    <div class="banner">🗂 A session is declared on the wrapper's setup page before the table opens: the strategy, the sources allowed, the preflight that passed, and the version of every source in force are written down with it. Hands played before that are shown below as undeclared gaps.</div>
    <div class="card"><h2>Declared sessions <span class="sub">— ${declared.length} · from ${esc(j.store)}</span></h2>
      ${declared.length ? `<div class="scroll"><table><thead><tr><th>started</th><th>strategy</th><th>label</th><th>answers</th><th>stakes</th><th class="num">hands</th><th title="which of the session's tables archived hands">tables</th><th class="num">answered</th><th class="num">bb/100</th><th>recording</th><th class="num">length</th></tr></thead><tbody>${declared.map(row).join("")}</tbody></table></div>`
        : '<div class="sub">None yet. The next time the wrapper is started it opens on <span class="mono">/setup</span>; the session declared there appears here.</div>'}
    </div>
    <div class="card"><h2>Before sessions were declared <span class="sub">— ${clusters.length} gap clusters, inferred</span></h2>
      <div class="scroll"><table><thead><tr><th>started</th><th></th><th></th><th></th><th>stakes</th><th class="num">hands</th><th></th><th class="num">answered</th><th class="num">bb/100</th><th>recording</th><th class="num">length</th></tr></thead><tbody>${clusters.map(row).join("")}</tbody></table></div>
    </div>`;
  v.querySelectorAll("tr[data-id]").forEach((tr) => tr.onclick = () => go(`/sessions/${encodeURIComponent(tr.dataset.id)}`));
}

/* End a session that was left open. A session is open only because nothing
   wrote its ended_at: closing the table tab or quitting the wrapper does not.
   The wrapper owns the record, so the API proxies to it — which also stops the
   answers, the recording and the router when the session is the live one. */
async function endSession(id, ev) {
  if (ev) ev.stopPropagation();
  const NL = String.fromCharCode(10);
  if (!confirm("End this session?" + NL + NL + "The wrapper writes the closing summary now, so the session's length is measured to this moment — not to when you stopped playing.")) return;
  let r;
  try { r = await (await fetch(`/api/dashboard/sessions/${encodeURIComponent(id)}/end`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ note: "ended from the dashboard" }) })).json(); }
  catch (e) { alert(`end failed: ${e}`); return; }
  if (!r.ok) { alert(r.error || "end failed"); return; }
  if (PATH.view === "sessions" && PATH.id) loadSession(PATH.id); else loadSessions();
}

async function loadSession(id) {
  const v = $("view-sessions");
  v.innerHTML = '<div class="card sub">loading session…</div>';
  let j;
  try { j = await (await fetch(`/api/dashboard/sessions/${encodeURIComponent(id)}`)).json(); } catch (e) { v.innerHTML = '<div class="card warn">session unavailable</div>'; return; }
  if (!j.ok) { v.innerHTML = `<div class="card warn">${esc(j.error)} <button class="mini" onclick="go('/sessions')">← sessions</button></div>`; return; }
  const s = j.session, cfg = s.config || {}, src = cfg.sources || {};
  const handsCard = sessionHandsCard(j, id, PATH.show);
  const kv = (k, val) => `<span class="k">${k}</span><span class="v">${val}</span>`;
  const head = `<div class="dt-top">
      <button class="mini" onclick="go('/sessions')">← sessions</button>
      <h2 style="margin:0">${s.declared ? esc(sessionName(s)) : `Undeclared session · ${fmtT(s.startedAt)}`}</h2>
      <a class="mini" href="/analytics?scope=sessions:${encodeURIComponent(s.id)}" onclick="go('/analytics?scope=sessions:${encodeURIComponent(s.id)}');return false" style="text-decoration:none" title="the Analytics tab scoped to this session">analytics for this session ↗</a>
      <span class="sub">${s.endedAt ? `ended ${fmtT(s.endedAt)}` : `<span class="chip good">still open</span> <button class="mini" onclick="endSession('${esc(s.id)}', event)" title="end this session — the wrapper writes its closing summary">end session</button>`}</span>
    </div>
    ${s.declared ? `<div class="sess-strat"><span class="k">${isStrategyPreset(s.preset) ? "Strategy" : "Mode"}</span> ${presetChip(s.preset, s)} <span class="sub">${cfg.answers ? "· study answers on" : "· study answers off"}</span>${s.profile ? `<span class="k" style="margin-left:14px">Account</span> <a href="/profiles" onclick="go('/profiles');return false"><b>${esc(s.profile)}</b></a>` : '<span class="sub" style="margin-left:14px">no account declared</span>'}</div>` : ""}`;
  if (!s.declared) {
    v.innerHTML = head + sessionOutcomeCard(j) + `<div class="card sub">This is a gap cluster inferred from the archive: hands played before sessions were declared. Nothing was written down at the time, so there is no config, preflight or version snapshot.</div>
      ${handsCard}`;
    wireSessionHands(v, id);
    drawSessionChart(j);
    return;
  }
  const ver = s.versions || {};
  const verRows = [
    ["API", ver.api ? `probed ${fmtT(ver.api.at)} · mode ${ver.api.strategyMode ?? "?"}` : "not reachable at start"],
    ["exploit preflop", ver.exploitPreflop ? `${ver.exploitPreflop.armed ? "armed" : "not armed"} · ${esc(ver.exploitPreflop.freshness ?? "")} · ${esc(ver.exploitPreflop["fit to"] ?? "")}` : "—"],
    ["MES flops", ver.mesPostflop ? `${ver.mesPostflop.loaded ? `${ver.mesPostflop.boards} boards` : "not loaded"} · ${esc(ver.mesPostflop.generation ?? "")} · built ${esc(ver.mesPostflop.built ?? "")}` : "—"],
    ["3-max charts", ver.hrc ? `${ver.hrc.up ? "up" : "down"} · ${esc(ver.hrc.charts ?? "")} · ${esc(ver.hrc["re-solved rungs"] ?? "")}` : "—"],
    ["GTO Wizard", ver.gtow ? (ver.gtow.tokenLive ? "token live" : "no token") : "—"],
    ["wrapper git", ver.wrapperGit ?? "—"],
  ];
  const pf = s.preflight || {};
  const events = (s.eventsList || []).map((e) => `<div class="ev-line"><span class="t">${fmtT(e.at)}</span><span>${esc(e.kind)}${e.kind === "study-toggle" ? ` → answers ${e.on ? "on" : "off"}` : ""}${e.hand != null ? ` <span class="sub">· at hand ${e.hand}</span>` : ""}</span></div>`).join("");
  const ansRows = (j.answers || []).slice(0, 60).map((a) => `<tr class="src-static"><td>${fmtT(a.ts)}</td><td>${esc(a.street ?? "")}${a.board ? ` <span class="mono">${esc(a.board)}</span>` : ""}</td><td>${a.tier ? `<span class="chip">${esc(a.tier)}</span>` : '<span class="chip crit">failed</span>'}</td><td>${a.text ? esc(a.text) : `<span class="sub">${esc(a.failReason ?? "")}</span>`}</td><td>${a.exploitPick || a.chartPick ? `<span class="picks"><span class="pk mes"><small>MES</small>${esc(a.exploitPick ?? "—")}</span><span class="pk gto"><small>GTO</small>${esc(a.chartPick ?? "—")}</span></span>` : ""}</td><td class="num">${fmtMs(a.latencyMs)}</td></tr>`).join("");
  v.innerHTML = head + sessTechSeg() + '<div id="sess-overview">' + sessionOutcomeCard(j) + (PATH.show ? handsCard : "") + `
    <div class="sess-grid">
      <div class="card"><h2>Declared config</h2><div class="kv">
        ${kv(isStrategyPreset(s.preset) ? "strategy" : "mode", presetChip(s.preset, s))}
        ${kv("study answers", cfg.answers ? "on" : "off")}
        ${kv("sources allowed", [src.exploitPreflop ? "exploit preflop" : null, src.mesPostflop ? "MES flops" : null, src.aiChain ? "AI chain" : null].filter(Boolean).join(" · ") || "none")}
        ${kv("recording", cfg.recording ? "on" : "off")}
        ${kv("budget", cfg.budget && (cfg.budget.hands || cfg.budget.minutes) ? `${cfg.budget.hands ? `${cfg.budget.hands} hands` : ""} ${cfg.budget.minutes ? `${cfg.budget.minutes} min` : ""}` : "none")}
        ${kv("note", s.note ? esc(s.note) : '<span class="sub">—</span>')}
        ${kv("session id", `<span class="mono">${esc(s.id)}</span>`)}
      </div></div>
      <div class="card"><h2>Preflight at start ${pf.ok ? '<span class="chip good">passed</span>' : '<span class="chip crit">blocked</span>'}</h2>
        ${(pf.checks || []).map((c) => `<div class="pf-row"><span class="dot ${c.ok ? "good" : c.required ? "crit" : "warn"}"></span><span>${esc(c.label)} <span class="sub">${esc(c.detail)}</span></span><span class="sub">${c.required ? "required" : "optional"}</span></div>`).join("") || '<div class="sub">no preflight recorded</div>'}</div>
      <div class="card"><h2>Sources in force</h2><div class="kv">${verRows.map(([k, val]) => kv(k, val)).join("")}</div></div>
    </div>
    <div class="card"><h2>Timeline <span class="sub">— every declared change, in order</span></h2>${events || '<div class="sub">no events</div>'}</div>
    ${PATH.show ? "" : handsCard}
    <div class="card"><h2>Answers <span class="sub">— ${(j.answers || []).length}${(j.answers || []).length > 60 ? ", showing 60" : ""}</span></h2><div class="scroll"><table><thead><tr><th>when</th><th>node</th><th>tier</th><th>answer</th><th>both strategies</th><th class="num">latency</th></tr></thead><tbody>${ansRows || '<tr class="src-static"><td colspan="6" class="sub">no answers logged under this session</td></tr>'}</tbody></table></div></div>` +
    '</div><div id="sess-tech" hidden></div>';
  wireSessionHands(v, id);
  drawSessionChart(j);
  wireSessTech(id);
}

/* The Outcome card: what the session actually DID — the net in big blinds and in
   money, the cumulative graph, the frequencies, the two hands that moved it most
   and the showdown split. Every number here comes from the same aggregate the
   Analytics tab is built from (session.stats, from aggregateHands), so the two
   views cannot drift; Analytics keeps what only makes sense across sessions —
   the slicing by month / stakes / position, and the comparisons. */
function sessionOutcomeCard(j) {
  const s = j.session, st = j.stats || {}, bb = s.bbUsd, hands = j.hands || [];
  const priced = hands.filter((h) => h.netBb != null);
  const usd = (v) => bb == null || v == null ? null : v * bb;
  const money = (v) => v == null ? "—" : `${v > 0 ? "+" : v < 0 ? "−" : ""}$${Math.abs(v).toFixed(2)}`;
  const cls = (v) => v == null ? "" : v > 0 ? "pos" : v < 0 ? "neg" : "";
  const tile = (v, k, sub, c = "") => `<div class="tile"><div class="v num ${c}">${v}</div><div class="k">${k}</div>${sub ? `<div class="s">${sub}</div>` : ""}</div>`;
  const unpriced = (st.hands ?? 0) - (st.netKnownHands ?? 0);
  const sum = (hs) => hs.reduce((a, h) => a + h.netBb, 0);
  const sd = priced.filter((h) => h.wentToShowdown), nsd = priced.filter((h) => !h.wentToShowdown);
  const best = priced.reduce((a, h) => (a == null || h.netBb > a.netBb ? h : a), null);
  const worst = priced.reduce((a, h) => (a == null || h.netBb < a.netBb ? h : a), null);
  const ext = (label, h) => h == null ? "" : `<div class="x pick" data-hand="${h.dbId}" title="open this hand">${label} <b class="${cls(h.netBb)}">${sgn(h.netBb, 1)} bb</b>${bb == null ? "" : ` <span>${money(usd(h.netBb))}</span>`} <span>· ${esc(h.heroPos ?? "?")} ${cardsHtml(h.heroCards)} · ${esc(h.finalStreet ?? "")}</span></div>`;
  const split = (label, hs) => !hs.length ? "" : `<div class="x">${label} <b class="${cls(sum(hs))}">${sgn(sum(hs), 1)} bb</b>${bb == null ? "" : ` <span>${money(usd(sum(hs)))}</span>`} <span>· ${hs.length} hand${hs.length === 1 ? "" : "s"}</span></div>`;
  const stat = (k, v) => `<span>${k} <b>${v}</b></span>`;
  return `<div class="card"><h2>Outcome <span class="sub">— ${st.hands ?? 0} hands${s.stakes ? ` at ${esc(s.stakes)}` : ""}${unpriced ? `, ${unpriced} with no net established` : ""}</span></h2>
    <div class="tiles">
      ${tile(`${sgn(st.netBb, 1)}`, "net bb", `${st.netKnownHands ?? 0} of ${st.hands ?? 0} hands priced`, cls(st.netBb))}
      ${tile(money(usd(st.netBb)), "net money", bb == null ? "stakes unknown" : `at ${esc(s.stakes)} · $${bb.toFixed(2)} per bb`, cls(st.netBb))}
      ${tile(sgn(st.bb100, 1), "bb/100", st.bb100Se != null ? `±${st.bb100Se.toFixed(1)} standard error` : "over the priced hands", cls(st.bb100))}
      ${tile(`${(st.rakePaidBb ?? 0).toFixed(1)} bb`, "rake paid", `${money(usd(st.rakePaidBb ?? 0)).replace(/^[+−]/, "")} on ${st.rakedHands ?? 0} won pots · ${sgn(st.bb100AfterRake, 1)} bb/100 after rake`)}
      ${tile(st.hands ?? 0, "hands", `${pctS(st.sawFlop)} saw a flop`)}
      ${s.declared && s.decisions ? tile(`${s.decisionsCovered}<span class="sub" style="font-size:14px"> of ${s.decisions}</span>`, "decisions answered", `${pctS(s.decisionsCoveredPct)}${s.unansweredNodes ? ` · ${s.unansweredNodes} node${s.unansweredNodes === 1 ? "" : "s"} unanswered` : ""}`, s.unansweredNodes ? "neg" : "") : ""}
      ${s.declared ? tile(s.answers ?? 0, "answers", `${s.failed ?? 0} failed${s.strayCaptures ? ` · ${s.strayCaptures} stray` : ""}`) : ""}
      ${s.declared ? tile(s.solves ?? 0, "chain solves", "stored for this session") : ""}
      ${tile(durStr(s.declared ? s.durationMin : Math.round(((s.endedAt ?? 0) - (s.startedAt ?? 0)) / 6000) / 10), "length", "")}
    </div>
    ${(j.series || []).length ? `<div class="sess-chart"><canvas id="sess-canvas"></canvas></div><div class="ig-legend sess-legend" id="sess-legend"></div>` : ""}
    <div class="sess-strip">
      ${stat("VPIP", pctS(st.vpip))}${stat("PFR", pctS(st.pfr))}${stat("3-bet", pctS(st.threeBet))}${stat("WTSD", pctS(st.wtsd))}
      ${stat("flops seen", pctS(st.sawFlop))}${stat("limped pots", pctS(st.limpedPots))}
      ${stat("discrepancies / 100", st.discPer100 == null ? "–" : st.discPer100.toFixed(1))}
      <span class="sub">${(st.discrepancies?.major ?? 0)} major, ${(st.discrepancies?.minor ?? 0)} minor</span>
    </div>
    ${priced.length ? `<div class="sess-ext">${ext("biggest win", best)}${worst && worst !== best ? ext("biggest loss", worst) : ""}${split("at showdown", sd)}${split("without showdown", nsd)}</div>` : ""}
    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">${j.recording ? `<a class="mini" href="/replay?session=${encodeURIComponent(j.recording.name)}" target="_blank" rel="noopener" style="text-decoration:none">open the recording in Replay Review ↗</a><a class="mini" href="/replay?session=${encodeURIComponent(j.recording.name)}&mode=scrub" target="_blank" rel="noopener" style="text-decoration:none">scrub it ↗</a>` : '<span class="sub">no frame recording for this session</span>'}</div>
  </div>`;
}

/* Draw the Outcome card's cumulative graph with the Analytics chart renderer,
   into its own canvas and chart slot so the two never fight over one Chart. */
function drawSessionChart(j) {
  if (!(j.series || []).length) return;
  const s = j.session;
  anDrawChart({ label: s.declared ? sessionName(s) : "This session", series: j.series }, null,
    { canvas: "sess-canvas", legend: "sess-legend", slot: "sess" });
}

/* The session review: every hand of the session with its study-answer status,
   filterable to the ones that got no answer (the Analytics "Answered" cell links
   here with the Unanswered chip on), and a per-hand jump into Replay Review's
   frame recording when the session has one. */
function sessionHandsCard(j, id, show) {
  const hands = j.hands || [];
  // the session's recording, or (gap clusters) the recording its hands were found in
  const rec = j.recording ?? (hands.find((h) => h.recording) ? { name: hands.find((h) => h.recording).recording } : null);
  const n = (st) => hands.filter((h) => h.status?.status === st).length;
  const unanswered = hands.filter((h) => h.status?.status !== "answered");
  // the chip counts DECISIONS, not hands: one hand can leave several nodes unanswered,
  // and a hand with three good answers and an unanswered river used to count as zero
  const nodes = hands.reduce((t, h) => t + (h.status?.uncovered?.length ?? 0), 0);
  const decs = hands.reduce((t, h) => t + (h.status?.decisions ?? 0), 0);
  const stray = hands.reduce((t, h) => t + (h.status?.stray ?? 0), 0);
  // WHY the unanswered ones were unanswered (services/answerLog FAIL_KINDS)
  const whyCount = {};
  for (const h of hands) for (const d of h.status?.uncovered || []) { const k = d.kind || "unexplained"; whyCount[k] = (whyCount[k] || 0) + 1; }
  const why = Object.entries(whyCount).sort((a, b) => b[1] - a[1]).map(([k, n]) => `${n} ${k}`).join(", ");
  const rows = show === "unanswered" ? unanswered : show === "failed" ? hands.filter((h) => h.status?.status === "failed") : hands;
  const chip = (key, label, count) => `<button class="mini ${(show ?? "all") === key ? "on" : ""}" data-show="${key}">${label} <span class="sub">${count}</span></button>`;
  const tr = (h) => `<tr data-id="${h.dbId}" class="${h.status?.status === "answered" ? "" : "unanswered"}"><td>${fmtT(h.playedAt)}</td><td>${esc(h.stakes ?? "?")}</td><td>${esc(h.heroPos ?? "?")}</td><td>${cardsHtml(h.heroCards)}</td><td>${esc(h.finalStreet)}</td><td class="num">${h.potBb}</td>${evCell(h.netBb, {})}<td>${ansChip(h.status)}${(h.status?.uncovered || []).map((d) => ` <a class="mini" href="/hands/${h.dbId}/node/${d.index}" onclick="event.stopPropagation();go('/hands/${h.dbId}/node/${d.index}');return false" style="text-decoration:none" title="${esc(d.reason || "nothing was ever logged at this decision")}">${esc(d.street ?? ("action " + d.index))} ↗</a>${d.kind ? ` <span class="sub" title="${esc(d.reason ?? "")}">${esc(d.kind)}</span>` : ""}`).join("")}</td>
    <td>${(h.recording || rec) && h.clientHandId ? `<a class="mini" href="/replay?session=${encodeURIComponent(h.recording || rec.name)}&hand=${encodeURIComponent(h.clientHandId)}" target="_blank" rel="noopener" style="text-decoration:none" onclick="event.stopPropagation()" title="frame-by-frame, as the screen showed it">as recorded ↗</a>` : '<span class="sub">—</span>'}</td></tr>`;
  return `<div class="card"><h2>Hands <span class="sub">— ${hands.length} · ${decs - nodes} of ${decs} decisions answered · ${n("partial")} partly answered · ${n("failed")} failed · ${n("missing")} no answer · ${n("no-decision")} no decision seen${n("unknown") ? ` · ${n("unknown")} unknown` : ""}${stray ? ` · ${stray} stray capture${stray === 1 ? "" : "s"}` : ""} · click a row to open the hand</span>${why ? `<div class="sub" style="margin-top:2px">unanswered because: ${esc(why)}</div>` : ""}</h2>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px">${chip("all", "All", hands.length)}${chip("unanswered", "Unanswered", nodes)}${chip("failed", "Failed", n("failed"))}
      ${rec ? `<a class="mini" href="/replay?session=${encodeURIComponent(rec.name)}" target="_blank" rel="noopener" style="text-decoration:none;margin-left:auto">open the recording in Replay Review ↗</a>` : '<span class="sub" style="margin-left:auto">no frame recording for this session — hands open in the archive replayer</span>'}</div>
    <div class="scroll"><table><thead><tr><th>time</th><th>stakes</th><th>pos</th><th>cards</th><th>street</th><th class="num">pot</th><th class="num">net bb</th><th>answers</th><th>recording</th></tr></thead>
    <tbody>${rows.map(tr).join("") || `<tr class="src-static"><td colspan="9" class="sub">${hands.length ? "nothing in this filter" : "no hands archived under this session yet"}</td></tr>`}</tbody></table></div></div>`;
}
function wireSessionHands(v, id) {
  v.querySelectorAll("tr[data-id]").forEach((tr) => tr.onclick = () => go(`/hands/${tr.dataset.id}`));
  v.querySelectorAll("[data-hand]").forEach((el) => el.onclick = () => go(`/hands/${el.dataset.hand}`));
  v.querySelectorAll("button[data-show]").forEach((b) => b.onclick = () => go(`/sessions/${encodeURIComponent(id)}${b.dataset.show === "all" ? "" : `?show=${b.dataset.show}`}`));
}

/* ================= Profiles (the accounts, and whether the money adds up) ====
   A profile is an ACCOUNT (ignition-study-wrapper/auth.py): the wrapper declares
   one at session start and signs in as it. Hands reach an account through the
   session they were stamped with, so hands from before that flow — and every
   undeclared gap cluster — are UNATTRIBUTED here on purpose.

   The rule this page exists to check: between two balance snapshots the money may
   move by exactly what poker did. Anything left over entered or left the account
   for a non-poker reason, and is shown as such. */
// Money on this page is stored in USD cents; the USD/AUD segment converts at the
// house rate for DISPLAY only (the toggle persists in localStorage.sd_ccy).
const CCY = { code: (() => { try { return localStorage.getItem("sd_ccy") === "AUD" ? "AUD" : "USD"; } catch { return "USD"; } })(), rate: null };
const moneyOf = (cents) => CCY.code === "AUD" && CCY.rate ? { v: cents * CCY.rate, sym: "A$" } : { v: cents, sym: "$" };
const usdc = (cents) => { if (cents == null) return "—"; const m = moneyOf(cents); return `${m.v < 0 ? "−" : m.v > 0 ? "+" : ""}${m.sym}${(Math.abs(m.v) / 100).toFixed(2)}`; };
const usdFlat = (cents) => { if (cents == null) return "—"; const m = moneyOf(cents); return `${m.v < 0 ? "−" : ""}${m.sym}${(Math.abs(m.v) / 100).toFixed(2)}`; };
const moneyCls = (c) => c == null ? "" : c > 0 ? "pos" : c < 0 ? "neg" : "";

async function loadProfiles() {
  const v = $("view-profiles");
  if (!v.dataset.loaded) v.innerHTML = '<div class="card sub">loading profiles…</div>';
  let j;
  try { j = await (await fetch("/api/dashboard/profiles")).json(); } catch (e) { v.innerHTML = '<div class="card warn">profiles unavailable</div>'; return; }
  if (!j.ok) { v.innerHTML = '<div class="card warn">profiles unavailable</div>'; return; }
  // equity now is scraped from the client, not carried forward from the last
  // reading — the stored snapshot is the fallback, and is labelled as one
  let LIVE = null;
  try { const r = await (await fetch("/api/dashboard/balance-live")).json(); LIVE = r && r.ok ? r : null; } catch { LIVE = null; }
  v.dataset.loaded = "1";
  const rows = j.profiles || [];
  const fx = j.fx && !j.fx.stale ? j.fx : null;
  CCY.rate = fx ? fx.rate : null;
  if (!CCY.rate && CCY.code === "AUD") CCY.code = "USD"; // no usable rate: AUD is not offered
  const tile = (val, k, sub, cls = "") => `<div class="tile"><div class="v num ${cls}">${val}</div><div class="k">${k}</div>${sub ? `<div class="s">${sub}</div>` : ""}</div>`;

  /* EQUITY NOW is a reading taken from the client at this moment, not the last
     stored snapshot carried forward. The stored one is shown, and said to be
     stored, only when the client cannot be read. ⚠ when the reading disagrees
     with the last reading plus the hands after rake, beyond tolerance. */
  const equityTile = (p, bal) => {
    const live = LIVE?.live && LIVE.signedInAs === p.name ? LIVE.live : null;
    const k = live ? LIVE.check : null;
    if (live) {
      const off = k && !k.agrees;
      return tile(`${usdFlat(live.equityCents)}${off ? ' <span class="hm-warn">⚠</span>' : ""}`, "equity now · live",
        `${usdFlat(live.amountCents)} cashier${live.inPlayCents != null ? ` + ${usdFlat(live.inPlayCents)} on the table` : ""} · read just now${off ? ` · <b class="neg">off by ${usdc(k.unexplainedCents)}</b>` : k ? " · matches the hands" : ""}`,
        off ? "neg" : "");
    }
    if (!bal) return tile('<span class="sub">nil</span>', "equity now", "not seeded");
    return tile(usdFlat(bal.equityCents), "equity now · stored",
      `${usdFlat(bal.amountCents)} cashier${bal.inPlayCents != null ? ` + ${usdFlat(bal.inPlayCents)} on the table` : ""} · ${fmtT(bal.ts)}`);
  };

  const card = (p) => {
    const bal = p.balance;
    const bad = p.movementIntervals > 0;
    const intervals = (p.intervals || []).map((i) => `<tr class="src-static ${i.tier === "movement" ? "unexplained" : i.tier === "unverifiable" ? "unverifiable" : ""}">
        <td>${fmtT(i.from.ts)} → ${fmtT(i.to.ts)}</td>
        <td>${i.sessionId ? `<a href="/sessions/${encodeURIComponent(i.sessionId)}" onclick="go('/sessions/${encodeURIComponent(i.sessionId)}');return false">${esc(i.sessionId)}</a>` : '<span class="sub">between sessions</span>'}</td>
        <td class="num ${moneyCls(i.movedCents)}">${usdc(i.movedCents)}</td>
        <td class="num ${moneyCls(i.pokerCents)}">${usdc(i.pokerCents)}</td>
        <td class="num sub">${i.rakeEstCents ? "−" + usdFlat(i.rakeEstCents) : "—"}</td>
        <td class="num ${i.tier === "movement" ? "neg" : "sub"}"><b>${usdc(i.unexplainedCents)}</b> <span class="sub">±${usdFlat(i.toleranceCents)}</span></td>
        <td>${i.tier === "accepted"
          ? `<span class="tier accepted" title="${esc(i.accepted?.note || "")}">marked correct</span> <span class="sub">${fmtT(i.accepted.at)} · was ${i.flaggedTier}</span> <button class="mini" data-unack="${i.to.id}" data-prof="${esc(p.name)}" title="put the flag back">undo</button>`
          : `<span class="tier ${i.tier}">${i.tier}</span>${i.tier === "movement" || i.tier === "unverifiable" ? ` <button class="mini" data-ack="${i.to.id}" data-prof="${esc(p.name)}" title="the closing reading is right: keep the residue on record, take it out of the verdict">mark correct</button>` : ""}`}</td>
        <td class="num">${i.hands}${i.unpricedHands ? ` <span class="sub">(${i.unpricedHands} unpriced)</span>` : ""}</td>
      </tr>`).join("");
    const checkCell = (b) => {
      const k = b.check;
      if (!k) return '<span class="sub">—</span>';
      if (k.seed) return '<span class="tier clean">seed</span> <span class="sub">the anchor — nothing before it to check against</span>';
      if (k.tier === "accepted") return `<span class="sub">math says</span> <b>${usdFlat(k.mathCents)}</b> · <span class="tier accepted">marked correct</span> <span class="sub">(off by ${usdc(k.deltaCents)} — accepted ${fmtT(k.accepted.at)}${k.accepted.note ? `: ${esc(k.accepted.note)}` : ""})</span>`;
      return `<span class="sub">math says</span> <b>${usdFlat(k.mathCents)}</b> · <span class="tier ${k.tier}">${k.matched ? "matched" : k.tier}</span>${k.matched ? ` <span class="sub">(${k.deltaCents === 0 ? "exact" : `off by ${usdc(k.deltaCents)}, within ±${usdFlat(k.toleranceCents)}`})</span>` : ` <span class="neg">off by ${usdc(k.deltaCents)}</span>`}`;
    };
    const snaps = (p.snapshots || []).slice(0, 12).map((b) => `<tr class="src-static ${b.check && !b.check.seed && !b.check.matched ? (b.check.tier === "movement" ? "unexplained" : "unverifiable") : ""}"><td>${fmtT(b.ts)}</td><td>${usdFlat(b.amountCents)}</td><td>${b.inPlayCents == null ? '<span class="sub">not seated</span>' : usdFlat(b.inPlayCents)}</td><td><b>${usdFlat(b.equityCents)}</b></td><td>${checkCell(b)}</td><td>${esc(b.phase ?? "—")}</td><td class="sub">${esc(b.how ?? "")}</td></tr>`).join("");
    return `<div class="card">
      <div class="dt-top"><h2 style="margin:0">${esc(p.name)}</h2>
        <span class="sub">${esc(p.site ?? "")}</span></div>
      ${!bad && p.unverifiableIntervals ? `<div class="sub" style="margin-top:8px">⚠ ${p.unverifiableIntervals} interval${p.unverifiableIntervals === 1 ? "" : "s"} could not be verified: a hand inside it has no established net, so its residue may be the hand rather than the account.</div>` : ""}
      ${!p.seeded ? `<div class="card" style="margin:10px 0;background:var(--surface2)"><b>nil — not seeded.</b> <span class="sub">This account has no equity reading yet, so nothing can be checked and no balance is shown. The seed is scraped from the client, never typed: open Ignition on the lobby (seated is fine — the stack is read too) and take the first reading.</span>
          <div style="margin-top:8px;display:flex;gap:8px;align-items:center"><button class="mini big" data-seed="${esc(p.name)}">Seed from the client</button><span class="sub" data-seed-msg="${esc(p.name)}"></span></div></div>` : ""}
      <div class="tiles" style="margin-top:10px">
        ${equityTile(p, bal)}
        ${p.seeded ? tile(usdFlat(p.seed.equityCents), "seeded at", `${fmtT(p.seed.ts)} · ${esc(p.seed.how ?? p.seed.source)}`) : ""}
        ${(() => {
          // net = equity now − the seed, off the SAME reading "equity now" shows:
          // a live figure above a net computed from a stored one would not add up
          const live = LIVE?.live && LIVE.signedInAs === p.name ? LIVE.live : null;
          const net = !p.seeded ? null : live ? live.equityCents - p.seed.equityCents : p.netSinceSeedCents;
          return tile(p.seeded ? usdc(net) : '<span class="sub">nil</span>', live ? "net · live" : "net",
            p.seeded ? `since the seed · poker says ${usdc(p.netCents)} on ${p.priced} of ${p.hands} priced hands` : "not seeded", moneyCls(net));
        })()}
        ${tile(p.sessions, "sessions", p.firstAt ? `since ${fmtD(p.firstAt)}` : "")}
      </div>
      ${LIVE?.check && LIVE.signedInAs === p.name && !LIVE.check.agrees ? `<div class="ans-severe money-severe" style="margin-top:10px"><b>⚠ the client reads ${usdFlat(LIVE.check.liveCents)}, the hands say ${usdFlat(LIVE.check.expectedCents)}</b><br>
          Since the reading of ${fmtT(LIVE.check.sinceTs)} (${usdFlat(LIVE.check.sinceCents)}) the account's equity moved ${usdc(LIVE.check.movedCents)} while ${LIVE.check.hands} hand${LIVE.check.hands === 1 ? "" : "s"} account for ${usdc(LIVE.check.pokerCents)}${LIVE.check.rakeEstCents ? ` less ${usdFlat(LIVE.check.rakeEstCents)} of estimated rake` : ""} — <b>${usdc(LIVE.check.unexplainedCents)} unexplained</b>, outside the ±${usdFlat(LIVE.check.toleranceCents)} tolerance.${LIVE.check.unpricedHands ? ` ${LIVE.check.unpricedHands} hand${LIVE.check.unpricedHands === 1 ? "" : "s"} in the window could not be priced, so the gap may be the hand rather than the account.` : ""}
          ${bad ? "" : `<div style="margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="mini" data-ack-all="${esc(p.name)}">Mark the current reading as correct</button><span class="sub" data-ack-msg="${esc(p.name)}">— takes a fresh reading and makes that the baseline.</span></div>`}</div>` : ""}
      ${bad ? `<div class="ans-severe money-severe" style="margin-top:10px"><b>unexplained ${usdc(p.unexplainedCents)} — something went wrong</b><br>
          ${p.movementIntervals} interval${p.movementIntervals === 1 ? "" : "s"} moved by more than the hands, the rake and the tolerance explain: a scrape that read wrong, a deposit, a cash-out, a bonus or a fee, or hands never captured. The flagged interval${p.movementIntervals === 1 ? " is" : "s are"} below.
          <div style="margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="mini" data-ack-all="${esc(p.name)}">Mark the current reading as correct</button><span class="sub" data-ack-msg="${esc(p.name)}">— reads the client now (open Ignition on the lobby, or seated) and makes that the baseline; every flagged interval up to it is accepted. With the client closed only the stored flags are accepted. Undo per row below.</span></div></div>` : ""}
      ${intervals ? `<h2 style="margin-top:14px">Between snapshots <span class="sub">— what the account's equity did, against what the hands say after rake</span></h2>
        <div class="scroll"><table><thead><tr><th>window</th><th>session</th><th class="num">equity moved</th><th class="num">poker says</th><th class="num">rake est.</th><th class="num">unexplained</th><th>verdict</th><th class="num">hands</th></tr></thead><tbody>${intervals}</tbody></table></div>`
        : p.seeded ? `<div class="sub" style="margin-top:12px">Seeded, one reading so far — the first check happens at the next session's opening reading.</div>` : ""}
      ${snaps ? `<h2 style="margin-top:14px">Readings <span class="sub">— every scrape, checked against the math (previous equity + poker after rake)</span></h2><div class="scroll"><table><thead><tr><th>when</th><th>cashier</th><th>on the table</th><th>equity scraped</th><th>against the math</th><th>phase</th><th>read by</th></tr></thead><tbody>${snaps}</tbody></table></div>` : ""}
    </div>`;
  };

  v.innerHTML = `
    ${LIVE?.live ? `<div class="banner">🔎 <b>Equity now is read from the client</b>, not carried forward — scraped ${fmtAgo(LIVE.at)} for <b>${esc(LIVE.signedInAs ?? "?")}</b>, the account the open client is signed in as. Every other account shows its last stored reading.</div>`
      : `<div class="banner">🔎 <b>No live reading.</b> ${esc(LIVE?.reason ?? "the wrapper is not running")} — the figures below are each account's last stored reading, and are only as fresh as the session that took them. Open the wrapper with Ignition signed in to read the balance now.</div>`}
    <div class="banner">👤 A profile is an <b>account</b> — the wrapper signs in as it and stamps every session with it. Between two snapshots the account's equity may move by exactly what poker did (after rake); anything beyond tolerance is flagged below.
      <span class="seg" id="ccy-seg" style="margin-left:12px;vertical-align:middle"><button data-c="USD" class="${CCY.code === "USD" ? "on" : ""}">USD</button><button data-c="AUD" class="${CCY.code === "AUD" ? "on" : ""}" ${fx ? "" : "disabled"} title="${fx ? `at ${fx.rate.toFixed(4)} · ${esc(fx.source)}${fx.asOf ? ` · ${esc(fx.asOf)}` : ""}` : "no usable AUD rate"}">AUD</button></span>
      ${j.fx ? `<span class="sub" style="margin-left:8px">${CCY.code === "AUD" ? `at ${j.fx.rate.toFixed(4)} · ` : ""}${esc(j.fx.source)}${j.fx.asOf ? ` · ${esc(j.fx.asOf)}` : ""}${j.fx.stale ? ' · <b style="color:var(--ev)">rate stale — AUD off</b>' : ""}</span>` : '<span class="sub" style="margin-left:8px">no AUD rate yet</span>'}</div>
    ${rows.length ? rows.map(card).join("") : '<div class="card sub">No profiles yet. The wrapper\'s setup page creates them (the password goes to Windows Credential Manager, never here).</div>'}
    <div class="card sub">${j.unattributedHands} of ${j.totalHands} archived hands are not attributed to an account — they were played before sessions declared a profile, or in an undeclared gap. They are left out of every figure above rather than guessed at.</div>`;
  v.querySelectorAll("#ccy-seg button").forEach((b) => b.onclick = () => {
    if (b.disabled) return;
    CCY.code = b.dataset.c === "AUD" ? "AUD" : "USD";
    try { localStorage.setItem("sd_ccy", CCY.code); } catch { /* private mode */ }
    loadProfiles();
  });
  v.querySelectorAll("button[data-seed]").forEach((b) => b.onclick = async () => {
    const name = b.dataset.seed, msg = v.querySelector(`[data-seed-msg="${CSS.escape(name)}"]`);
    b.disabled = true; msg.textContent = "reading the client…";
    let r = null;
    try { r = await (await fetch(`/api/dashboard/profiles/${encodeURIComponent(name)}/seed`, { method: "POST" })).json(); } catch { r = { ok: false, error: "the API did not answer" }; }
    if (r?.ok) { msg.textContent = `seeded at ${usdFlat(r.seed.equityCents)}`; v.dataset.loaded = ""; loadProfiles(); return; }
    b.disabled = false;
    msg.innerHTML = `<span class="neg">${esc(r?.error ?? "could not read the client")}</span>${r?.candidates?.length ? ` <span class="sub">· money-looking text on the page: ${r.candidates.slice(0, 4).map(esc).join(" | ")}</span>` : ""}`;
  });
  // a reading marked correct (or the mark taken back): the residue stays on record, the verdict changes
  const ackPost = async (name, path, body) => {
    try { return await (await fetch(`/api/dashboard/profiles/${encodeURIComponent(name)}/${path}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })).json(); }
    catch { return { ok: false, error: "the API did not answer" }; }
  };
  v.querySelectorAll("button[data-ack], button[data-ack-all], button[data-unack]").forEach((b) => b.onclick = async () => {
    b.disabled = true;
    const name = b.dataset.prof ?? b.dataset.ackAll;
    const msg = b.dataset.ackAll ? v.querySelector(`[data-ack-msg="${CSS.escape(name)}"]`) : null;
    if (msg) msg.textContent = "reading the client…";
    const r = b.dataset.unack ? await ackPost(name, "unaccept", { id: Number(b.dataset.unack) })
      : b.dataset.ackAll ? await ackPost(name, "reset", {})
      : await ackPost(name, "accept", { ids: [Number(b.dataset.ack)] });
    if (!r?.ok) { alert(r?.error || "could not update the reading"); b.disabled = false; if (msg) msg.textContent = ""; return; }
    if (b.dataset.ackAll && !r.fresh) alert(`No fresh reading — ${r.freshError}. The stored reading (${usdFlat(r.baseline?.equityCents)}) was marked correct instead; with Ignition open, press again to re-read.`);
    v.dataset.loaded = ""; loadProfiles();
  });
}

/* ================= Tasks (the hand-off board) =================
   Every piece of work carries the brief needed to pick it up cold — goal, where it is
   now, the exact next action, done-when, what is waiting on Brady — rewritten every
   time work on it stops; plus a dated log and links to the evidence. */
const TASK_ST = { active: ["running", "in progress"], ready: ["planned", "ready"], waiting: ["stale", "waiting on you"], idea: ["queued", "idea"], done: ["done", "done"] };
let TASK_FILTER = "open";
async function loadTasks() {
  const v = $("view-tasks");
  if (!v.dataset.loaded) v.innerHTML = '<div class="card sub">loading tasks…</div>';
  let j;
  try { j = await (await fetch("/api/dashboard/tasks")).json(); } catch { v.innerHTML = '<div class="card warn">tasks unavailable</div>'; return; }
  if (!j.ok) { v.innerHTML = '<div class="card warn">tasks unavailable</div>'; return; }
  v.dataset.loaded = "1";
  const all = j.tasks || [];
  const open = all.filter((t) => t.status !== "done");
  const needs = open.filter((t) => t.needsYou);
  const shown = TASK_FILTER === "open" ? open : TASK_FILTER === "all" ? all : all.filter((t) => t.status === TASK_FILTER);
  const ago = (ms) => { const m = Math.round((Date.now() - ms) / 60000); return m < 60 ? `${m} min ago` : m < 2880 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`; };
  const pill = (st) => `<span class="st-pill ${(TASK_ST[st] || ["queued"])[0]}">${(TASK_ST[st] || [st, st])[1]}</span>`;
  const row = (k, val, cls = "") => val ? `<div class="k">${k}</div><div class="v ${cls}">${esc(val)}</div>` : "";
  const card = (t, i) => `<div class="card task ${t.needsYou && t.status !== "done" ? "task-needs" : ""}" data-task="${esc(t.id)}">
      <div class="task-head"><span class="n">#${i + 1}</span><h2>${esc(t.title)}</h2>${pill(t.status)}<span class="sub">updated ${ago(t.updatedAt)}</span></div>
      <div class="task-grid">
        ${row("goal", t.goal)}
        ${row("now", t.brief)}
        ${row("next", t.next, "next")}
        ${row("done when", t.doneWhen)}
        ${t.needsYou && t.status !== "done" ? `<div class="k" style="color:var(--ev)">needs you</div><div class="v" style="color:var(--ev)">${esc(t.needsYou)}</div>` : ""}
        ${t.links?.length ? `<div class="k">links</div><div class="v task-links">${t.links.map((l) => `<a href="${esc(l.href)}" ${/^https?:/.test(l.href) ? 'target="_blank" rel="noopener"' : `onclick="if(!/^\\/(replay|table|state-tester)/.test('${esc(l.href)}')){go('${esc(l.href)}');return false}"`}>${esc(l.label)}</a>`).join("")}</div>` : ""}
      </div>
      <div class="task-ctl">
        <select data-st="${esc(t.id)}">${Object.keys(TASK_ST).map((k) => `<option value="${k}" ${t.status === k ? "selected" : ""}>${TASK_ST[k][1]}</option>`).join("")}</select>
        <button class="mini" data-move="${esc(t.id)}" data-dir="-1" title="higher priority">↑</button><button class="mini" data-move="${esc(t.id)}" data-dir="1" title="lower priority">↓</button>
        <button class="mini" data-edit="${esc(t.id)}">edit brief</button>
        <input type="text" data-note="${esc(t.id)}" placeholder="add a dated note…" style="flex:1;min-width:220px">
        <button class="mini" data-addnote="${esc(t.id)}">note</button>
      </div>
      <div data-editor="${esc(t.id)}" hidden style="margin-top:10px;display:grid;gap:8px">
        <label class="sub">now (the resume brief)<textarea data-f="brief">${esc(t.brief)}</textarea></label>
        <label class="sub">next action<textarea data-f="next" style="min-height:44px">${esc(t.next)}</textarea></label>
        <label class="sub">done when<textarea data-f="doneWhen" style="min-height:44px">${esc(t.doneWhen)}</textarea></label>
        <label class="sub">needs you (blank = nothing)<textarea data-f="needsYou" style="min-height:36px">${esc(t.needsYou || "")}</textarea></label>
        <div><button class="mini on" data-save="${esc(t.id)}">save brief</button> <button class="mini" data-cancel="${esc(t.id)}">cancel</button></div>
      </div>
      <details style="margin-top:8px"><summary>log · ${t.log.length}</summary><ul class="task-log" style="margin-top:6px">${t.log.slice().reverse().map((l) => `<li><span class="t">${fmtT(l.at)}</span><span>${esc(l.note)}</span></li>`).join("")}</ul></details>
    </div>`;
  v.innerHTML = `
    <div class="banner">📋 <b>The hand-off board.</b> Each task carries the brief needed to pick it up cold: where it is <b>now</b>, the exact <b>next</b> action, and what only you can do. Say "pick up <i>task</i>" and the brief is read back before anything is touched. Order is priority — yours to set.</div>
    ${needs.length ? `<div class="card task-needs"><h2>Waiting on you</h2>${needs.map((t) => `<div class="pf-row"><span class="dot warn"></span><span><b>${esc(t.title)}</b> — ${esc(t.needsYou)}</span><span class="sub">#${all.indexOf(t) + 1}</span></div>`).join("")}</div>` : ""}
    <div class="ig-chips"><span class="lab">show</span>${[["open", "open"], ["active", "in progress"], ["waiting", "waiting on you"], ["ready", "ready"], ["idea", "ideas"], ["done", "done"], ["all", "all"]].map(([k, l]) => `<button class="ig-chip" data-tf="${k}" aria-pressed="${TASK_FILTER === k}">${l}</button>`).join("")}
      <span style="flex:1"></span><button class="mini" id="task-new">+ new task</button></div>
    ${shown.length ? shown.map((t) => card(t, all.indexOf(t))).join("") : '<div class="card sub">nothing here</div>'}`;
  const post = async (path, body) => { try { return await (await fetch(`/api/dashboard/tasks${path}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })).json(); } catch { return { ok: false, error: "the API did not answer" }; } };
  const refresh = () => { v.dataset.loaded = ""; loadTasks(); };
  v.querySelectorAll("[data-tf]").forEach((b) => b.onclick = () => { TASK_FILTER = b.dataset.tf; refresh(); });
  v.querySelectorAll("select[data-st]").forEach((sl) => sl.onchange = async () => { const r = await post(`/${encodeURIComponent(sl.dataset.st)}`, { status: sl.value, note: `status → ${TASK_ST[sl.value][1]}` }); if (!r.ok) alert(r.error); refresh(); });
  v.querySelectorAll("button[data-move]").forEach((b) => b.onclick = async () => {
    const ids = all.map((t) => t.id), i = ids.indexOf(b.dataset.move), k = i + Number(b.dataset.dir);
    if (k < 0 || k >= ids.length) return;
    [ids[i], ids[k]] = [ids[k], ids[i]];
    await post("/reorder", { ids }); refresh();
  });
  v.querySelectorAll("button[data-edit]").forEach((b) => b.onclick = () => { const ed = v.querySelector(`[data-editor="${CSS.escape(b.dataset.edit)}"]`); ed.hidden = !ed.hidden; });

  combined: ["combined corpus walk", "one pass over the corpus pricing both legs together"],

let WALK = null;
/**
 * The MES walk's 13x13, on the SAME grid as every other chart (2026-09-20).
 *
 * It used to hand-roll its own `#grid`, which meant it alone had no combo panel — and it
 * is the one place that has genuine per-combo data to show: `holes`/`strat`/`ev` are
 * 1,326-wide and a flop is exactly where two combos of a class stop being the same hand.
 */
function mesGridHtml(holes, w, strat, ev, acts, heroIdx, board, heroCombo) {
  const R = "AKQJT98765432";
  const cls = {}, combos = {};
  holes.forEach((h, j) => {
    if (!w || w[j] <= 0) return;
    const a = h.slice(0, 2), b = h.slice(2, 4);
    const ia = R.indexOf(a[0]), ib = R.indexOf(b[0]);
    const hi = Math.min(ia, ib), lo = Math.max(ia, ib);
    const key = ia === ib ? R[hi] + R[lo] : a[1] === b[1] ? R[hi] + R[lo] + "s" : R[hi] + R[lo] + "o";
    const c = (cls[key] ??= { w: 0, acts: new Array(acts.length).fill(0) });
    c.w += w[j];
    acts.forEach((_, ai) => { c.acts[ai] += w[j] * (strat?.[ai]?.[j] ?? 0); });
    (combos[key] ??= []).push({ hand: h, w: w[j],
      s: acts.map((_, ai) => strat?.[ai]?.[j] ?? 0),
      ev: acts.map((_, ai) => ev?.[ai]?.[j] ?? null) });

  for (const k in combos) combos[k].sort((x, y) => y.w - x.w || x.hand.localeCompare(y.hand));

    const h = holes[heroIdx], ia = R.indexOf(h[0]), ib = R.indexOf(h[2]);

}

/* ---- the pool-exploit preflop overlay, node by node ---- */
async function loadExploitDetail() {
  const d = $("src-detail-drill");
  let j;
  try { j = await (await fetch("/api/dashboard/sources/exploit-preflop/detail")).json(); } catch (e) { d.innerHTML = '<div class="card warn">overlay unavailable</div>'; return; }
  if (!j.ok) { d.innerHTML = `<div class="card warn">${esc(j.error)}</div>`; return; }
  // a choice node is pure: each class carries its whole combo weight on one action
  const nodeHtml = j.nodes.map((n) => {
    const cls = {};
    for (const [k, act] of Object.entries(n.cells)) { const ai = n.actions.indexOf(act); const w = COMBOS(k); cls[k] = { w, acts: n.actions.map((_, i) => (i === ai ? w : 0)) }; }
    return `<div class="card">
      <h2>${esc(n.label)} <span class="sub">— hero ${esc(n.heroPos)} · node <span class="mono">${esc(n.tag)}</span></span></h2>
      <div class="sub" style="margin-bottom:6px">answers the chart lines ${n.lines.map((l) => `<span class="mono">${esc(l)}</span>`).join(" ")} — ${esc(n.note)}</div>
      ${classGrid(cls, n.actions, null, { flat: true, foot: "one pure action per class · colour = the action, size included · legend = % of all combos · hover a cell" })}
    </div>`;
  }).join("");
  const rangeHtml = j.ranges.map((r) => {
    const cls = {};
    for (const [k, wt] of Object.entries(r.weights)) cls[k] = { w: COMBOS(k) * Number(wt), acts: [COMBOS(k) * Number(wt)] };
    return `<div class="card">
      <h2>${esc(r.label)} <span class="sub">— <span class="mono">${esc(r.key)}</span> · ${r.combos} combos (${r.pct}% of hands), ${r.classes} classes</span></h2>
      <div class="sub" style="margin-bottom:6px">used for: ${esc(r.usedFor)}</div>
      ${classGrid(cls, ["in range"], null, { single: "var(--mes)", foot: "shade = weight of the class in the range" })}
    </div>`;
  }).join("");
  const lr = j.lockedRoot;
  const lrHtml = lr ? `<div class="card">
      <h2>Locked-root charts <span class="sub">— the follow-on set, ${lr.jobs.filter((x) => x.solved).length} of ${lr.jobs.length} solved · ${lr.rung}bb</span></h2>
      <div class="sub" style="margin-bottom:8px">The overlay above stops at hero's first decision. These charts carry the same pool-fitted premise through the <b>whole tree</b>: one HRC solve per villain seat × open size, villain's root frozen to the pool's range at that size, every other node solved — so a 4-bet after our 3-bet is answered as a best response to the range villain actually opened, not to the equilibrium's per-size sub-range.</div>
      <dl class="src-dl"><dt>tree</dt><dd>${esc(lr.tree)}</dd><dt>lock</dt><dd>${esc(lr.lock)}</dd></dl>
      <div class="scroll"><table><thead><tr><th>chart</th><th>villain</th><th>line</th><th>pool share</th><th>serves hero</th><th>lock range</th><th>status</th></tr></thead><tbody>
        ${lr.jobs.map((x) => `<tr class="src-static"><td class="mono">${esc(x.id)}</td><td>${esc(x.villain)} opens ${x.size}x</td><td class="mono">${esc(x.line)}</td><td class="num">${x.poolShare != null ? x.poolShare + "%" : "—"}</td><td>${x.servesHero.join(" · ")}</td><td class="sub">${esc(x.lockRange)}</td><td>${x.solved ? '<span class="chip good">solved</span>' : '<span class="chip warn">planned</span>'}</td></tr>`).join("")}
      </tbody></table></div>
      <div class="g2" style="margin-top:10px">
        <div><div class="sub" style="text-transform:uppercase;letter-spacing:.5px;font-size:11px">covers</div>${lr.covers.map((t) => `<div class="sub">✓ ${esc(t)}</div>`).join("")}</div>
        <div><div class="sub" style="text-transform:uppercase;letter-spacing:.5px;font-size:11px">not covered</div>${lr.notCovered.map((t) => `<div class="sub">– ${esc(t)}</div>`).join("")}</div>
      </div>
    </div>` : "";
  d.innerHTML = `
    <div class="banner">📐 <b>This is the whole overlay.</b> Five decision nodes, each 169 classes → one pure action with its size, fitted as a best response to the pool model on <span class="mono">${esc(j.chart ?? "")}</span> (100bb even, NL200 rake). Villain's open <i>size</i> is not a dimension here: every single-raise line maps to the same node, so a 2x and a 3.5x open get the same response. Hero's own sizes are in the answers (Raise 2 / Raise 9 …) and must also exist at the equilibrium chart's node, or the chart answers instead. Below the nodes: the nine derived range sets the AI chain uses as hero's flop range.</div>
    <h2 class="sub" style="margin:12px 0 4px;text-transform:uppercase;letter-spacing:.6px">Decision nodes</h2>
    <div class="sess-grid" style="grid-template-columns:repeat(auto-fit,minmax(470px,1fr))">${nodeHtml}</div>
    <h2 class="sub" style="margin:12px 0 4px;text-transform:uppercase;letter-spacing:.6px">Derived range sets</h2>
    <div class="sess-grid" style="grid-template-columns:repeat(auto-fit,minmax(470px,1fr))">${rangeHtml}</div>
    <h2 class="sub" style="margin:12px 0 4px;text-transform:uppercase;letter-spacing:.6px">Follow-on charts</h2>
    ${lrHtml}`;
}

/* ---- the five fields, shared by the cards and the detail page ---- */
const pieceChips = (c) => `<span class="pieces">${(c.pieces || (c.piece ? [c.piece] : [])).map((p) => `<span class="pc ${esc(p)}" title="the piece this source serves">${esc(p)}</span>`).join("")}</span>`;
const edgeV = (x) => x == null ? '<span class="v">—</span>' : `<span class="v ${x > 0 ? "pos" : x < 0 ? "neg" : "zero"}">${x > 0 ? "+" : ""}${Number(x).toFixed(1)}</span>`;
function edgeBlock(c) {
  const e = c.edge;
  if (!e) return "";
  if (e.kind === "none") return `<div class="edge none"><span><span class="k">edge</span><span class="v">none of its own</span></span><span></span><span></span><span class="n">${esc(e.note)}</span></div>`;
  const label = e.kind === "floor" ? "floor" : e.kind === "construction" ? "by construction" : e.kind === "increment" ? "with MES" : "edge";
  return `<div class="edge ${e.kind}"><span><span class="k">${label} · NL25 rake</span>${edgeV(e.nl25)}</span><span><span class="k">NL200 rake</span>${edgeV(e.nl200)}</span><span><span class="k">no rake</span>${edgeV(e.norake)}</span><span class="n">bb/100 · ${esc(e.note)}</span></div>`;
}
// one pill per FORMAT — a format is the full combination site · seats · stake · depth
const formatChips = (c) => Array.isArray(c.formats) && c.formats.length
  ? `<div><div class="field-k">formats · ${c.formats.length}</div><div class="fmts">${c.formats.map((f) => `<span class="fmt" title="${esc(f.note || "")}">${[f.site, f.seats, f.stake, f.depth].filter((v) => v && v !== "—").map(esc).join(" · ")}${f.note ? ` <span class="sub" style="font-size:10.5px">(${esc(f.note)})</span>` : ""}</span>`).join("")}</div></div>`
  : "";
const coverageLine = (c) => c.coverage ? `<div><div class="field-k">coverage</div><div class="cov">${esc(c.coverage.text)}${c.coverage.gap ? `<span class="gap">gap: ${esc(c.coverage.gap)}</span>` : ""}</div></div>` : "";

  const section = (p, cards) => cards.length ? `
    <h2 class="piece-h">${esc(p.label)} <span class="sub">${esc(p.what)}</span></h2>
    <div class="reg">${cards.map((c) => card(c).replace('<div class="head">', `<div class="head">${roleTag(c)}`)).join("")}</div>` : "";
  el.innerHTML = `
    <div class="card explain">
      <h2>Pieces are what Strategies are made of</h2>
      <p>A whole-hand <a href="/sources/strategies" onclick="go('/sources/strategies');return false">strategy</a> is assembled from three pieces:
        <b>preflop</b> (how hero plays before the flop), <b>postflop</b> (flop, turn, river from the range preflop arrives with) and the
        <b>opponent model</b> (what hero assumes the villains do). Each piece is served by one or more <b>sources</b> below, tried in tier order:
        the <span class="tag2 ok">primary</span> answers when it can, a <span class="tag2 warn">fallback</span> only when it cannot.</p>
      <p class="sub">A source is a file or service that produces answers; a piece is the role it plays in a strategy. The same source can serve two pieces
        (the HRC 3-max grid is both the GTO preflop piece and the equilibrium opponent model). Every MES piece is a best-response to one specific
        opponent model, which is why the Strategies page refuses to pair them with any other. Cards show what each source is routing for right now,
        its freshness, and its live answers over 30 days; click one for its page.</p>
    </div>
    ${pieces.map((p) => section(p, byPiece(p.id))).join("")}
    ${orphan.length ? section({ label: "Unassigned", what: "sources not mapped to a piece" }, orphan) : ""}`;
  el.querySelectorAll(".src").forEach((d) => d.onclick = () => go(`/sources/pieces/${d.dataset.id}`));

/* ---- strategy matrix ---- */
async function loadMatrix() {
  const el = $("src-matrix");
  let j;
  try { j = await (await fetch("/api/dashboard/sources/matrix")).json(); } catch (e) { el.innerHTML = '<div class="card warn">matrix unavailable</div>'; return; }
  srcLoaded.matrix = true;
  const m = j.matrix;
  const realized = j.realized || {};
  const rl = (mode) => { const r = realized[mode]; return r && r.bb100 != null ? `<td class="ev ${r.bb100 > 0 ? "p" : "n"}">${r.bb100 > 0 ? "+" : ""}${r.bb100} <span class="se">${r.knownHands} h</span></td>` : '<td class="ev z">no sessions yet</td>'; };
  const missing = (j.missing || []).length ? `<div class="card warn">${j.missing.map(esc).join("<br>")}</div>` : "";
  if (!m) { el.innerHTML = missing + '<div class="card sub">The matrix artifact has not been built. Run <code>analysis/pipeline/limp_study/strategy_matrix.py</code>.</div>'; return; }
  const modeTag = (k) => k === "exploit" ? '<span class="mode mes">MES</span> exploit' : k === "mes" ? '<span class="mode mes">MES</span>' : k === "chart" ? '<span class="mode gto">GTO</span> charts' : k === "gto" ? '<span class="mode gto">GTO</span> AI chain' : esc(k);
  const cell = (c, key) => {
    if (!c) return evCell(null, { why: "—" });
    if (c.kind === "legs") return `<td class="ev ${c.pre > 0 ? "p" : "n"}">${c.pre > 0 ? "+" : ""}${c.pre} <span class="se">pre</span> ⊕ ${c.post > 0 ? "+" : ""}${c.post} <span class="se">${esc(c.postTag || "raw")}</span></td>`;
    if (c.v == null) return evCell(null, { why: c.why || "pending", reuse: c.reuse });
    return evCell(c.v, { reuse: c.reuse, se: c.se, tag: c.tag });
  };
  const rows = (m.groups || []).map((g) => `<tr class="row-group"><td colspan="10">${esc(g.title)}</td></tr>` +
    g.rows.map((r) => `<tr class="src-static">
      <td>${r.indent ? `<span class="sub" style="padding-left:24px">${esc(r.label || "")}</span>` : modeTag(r.preflop)}</td>
      <td class="sub">${r.indent ? "" : "→"}</td>
      <td>${r.indent ? "" : modeTag(r.postflop) + (r.mesGen ? ` ${esc(r.mesGen)}` : "")}</td>
      <td>${esc(r.family || "")}</td>
      ${cell(r.cells?.norake)}${cell(r.cells?.nl200)}${cell(r.cells?.nl25)}
      ${r.haircut ? evCell(-Math.abs(r.haircut.v), { tag: r.haircut.tag }) : evCell(null, { why: r.haircutWhy || "n/a" })}
      ${r.realizedMode ? rl(r.realizedMode) : '<td class="ev z">—</td>'}
      <td>${(r.evidence || []).map((e) => `<a class="ev-link" href="#" title="${esc(e.path || "")}" onclick="return false">${esc(e.label)}${e.date ? ` · ${esc(e.date)}` : ""}</a>`).join(" · ")}${(r.flags || []).map((f) => ` <span class="chip ${f.kind || ""}">${esc(f.text)}</span>`).join("")}${r.note ? `<div class="sub">${esc(r.note)}</div>` : ""}</td>
    </tr>`).join("")).join("");
  const chain = (m.evidenceChain || []);
  el.innerHTML = `${missing}
    <div class="banner">📐 Each row is one way to play the whole hand. Columns are the same corpus priced under three rake models. A <b>combined</b> cell is one corpus walk that plays both legs; a <b>legs</b> cell (⊕) is two separate numbers that must not be added.</div>
    <div class="card"><h2>Strategy matrix <span class="sub">— bb/100 · 3-max Zone · ${esc(m.inputs?.corpusNote || "")} · built ${esc(m.generatedAt || "?")}</span></h2>
      <div class="scroll"><table><thead><tr><th>preflop</th><th></th><th>postflop</th><th>family</th><th class="num">no rake</th><th class="num">NL200 cap 1bb</th><th class="num">NL25 cap 4bb</th><th class="num">coverage haircut</th><th class="num">realized bb/100</th><th>evidence</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="legend"><span><span class="sw" style="background:var(--win-soft);border:1px solid var(--win)"></span> positive</span><span><span class="sw" style="background:var(--loss-soft);border:1px solid var(--loss)"></span> negative</span><span><span class="sw" style="background:var(--surface2);border:1px solid var(--faint)"></span> no number yet, and why</span><span><span class="sw" style="border-left:2px dashed var(--line)"></span> reused from the 100bb ign200 state</span><span>⊕ two legs, do not sum</span><span>realized = hero's own sessions, by the strategy mode logged in them</span></div>
    </div>
    ${chain.length ? `<div class="card"><h2>What moves a cell <span class="sub">— the evidence chain, oldest to newest</span></h2><div class="scroll"><table class="src-static"><thead><tr><th>step</th><th>artifact</th><th>date</th><th>what it changed</th></tr></thead><tbody>${chain.map((e) => `<tr><td>${esc(e.step)}</td><td class="mono">${esc(e.artifact)}</td><td>${esc(e.date || "")}</td><td>${esc(e.what)}</td></tr>`).join("")}</tbody></table></div></div>` : ""}`;
}

/* ---- approximations ----
   The one place every knowingly-inexact thing in the strategy is listed side
   by side. The register is authored (services/approximations.ts); the volume
   columns are joined from the miss queue and the answer log, so the ranking
   moves with play rather than with opinion.

   The split that carries the page: MEASURED entries first, ranked by how often
   they actually fired, then the ones we cannot count at all. An unmeasured row
   is not a blank — it is a thing we know we approximate and have no telemetry
   for, which is its own backlog. */
async function loadApprox() {
  const el = $("src-approx");
  let j;
  try { j = await (await fetch("/api/dashboard/sources/approximations?days=30")).json(); }
  catch (e) { el.innerHTML = '<div class="card warn">approximations unavailable</div>'; return; }
  if (!j.ok) { el.innerHTML = '<div class="card warn">approximations unavailable</div>'; return; }
  srcLoaded.approx = true;

  const STATUS = {
    "vendor-ceiling": ["crit", "vendor ceiling", "no solve of ours closes this — the solver cannot express the spot"],
    "solvable": ["warn", "solvable", "a solve would close it; the miss queue usually carries the job"],
    "by-design": ["off", "by design", "a modelling choice we would keep even with unlimited compute"],
  };
  const statusChip = (k) => {
    const [cls, label, why] = STATUS[k] || ["dim", k, ""];
    return `<span class="st" title="${esc(why)}"><span class="dot ${cls}"></span>${esc(label)}</span>`;
  };
  const fires = (r) => {
    if (!r.measured) return '<td class="num"><span class="chip dim" title="no miss-queue kind and no answer warning carries this — we know we do it, we cannot say how often">unmeasured</span></td>';
    const bits = [];
    if (r.warn && r.warn.n) bits.push(`${r.warn.n} answer${r.warn.n === 1 ? "" : "s"} said so`);
    if (r.miss && r.miss.live) bits.push(`${r.miss.live} live hit${r.miss.live === 1 ? "" : "s"}`);
    if (r.miss && r.miss.rows) bits.push(`${r.miss.rows} open state${r.miss.rows === 1 ? "" : "s"}`);
    const n = r.fires;
    return `<td class="num">${n > 0 ? `<b>${n}</b>` : '<span class="sub">0</span>'}<div class="sub">${esc(bits.join(" · ") || "never yet")}</div></td>`;
  };

  const rows = (j.rows || []).map((r) => `
    <tr class="${r.measured ? "" : "reuse"}">
      <td><b>${esc(r.title)}</b>
        <div class="sub">${esc(r.what)}</div>
        ${r.cost ? `<div class="sub"><i>cost:</i> ${esc(r.cost)}</div>` : ""}</td>
      <td><span class="chip">${esc(r.source)}</span></td>
      <td>${statusChip(r.status)}</td>
      ${fires(r)}
      <td class="sub">${esc(r.why)}</td>
      <td>${esc(r.fix)}${r.code ? `<div class="sub mono">${esc(r.code)}</div>` : ""}</td>
    </tr>`).join("");

  // Drift: a caveat printed on a registry card that no register entry claims.
  // SRC.cards is already in memory — the Sources tab loaded it.
  const claimed = j.claimedCaveats || [];
  const unclaimed = [];
  for (const card of (SRC && SRC.cards) || []) {
    for (const cav of card.caveats || []) {
      if (!claimed.some((k) => cav.includes(k))) unclaimed.push({ source: card.id, caveat: cav });
    }
  }
  const drift = unclaimed.length
    ? `<div class="card"><h2>On a card, not in the register <span class="n">${unclaimed.length}</span></h2>
         <div class="sub">Caveats the Sources cards print that no register entry accounts for. Some are operational (a client being down is not an approximation) — the rest are rows this page is missing.</div>
         <div class="scroll"><table><thead><tr><th>source</th><th>caveat</th></tr></thead><tbody class="src-static">
         ${unclaimed.map((u) => `<tr><td><span class="chip">${esc(u.source)}</span></td><td class="sub">${esc(u.caveat)}</td></tr>`).join("")}
         </tbody></table></div></div>`
    : "";

  const t = j.totals || {};
  el.innerHTML = `
    <div class="banner">⚠ Every place the strategy is knowingly not exact. Ranked by how often it actually fires — live miss-queue hits plus answers that printed the warning, over ${j.days} days — not by how bad it sounds. <b>Open states are a backlog, not a rate:</b> a kind with hundreds of rows and no live hits costs less today than one with a handful that bites every session.</div>
    <div class="armed">
      <div class="cell"><span class="k">Known approximations</span><span class="v">${t.all ?? 0}</span><span class="s">authored in services/approximations.ts</span></div>
      <div class="cell"><span class="k">Measured</span><span class="v">${t.measured ?? 0}</span><span class="s">a miss-queue kind or an answer warning counts them</span></div>
      <div class="cell"><span class="k">Unmeasured</span><span class="v">${t.unmeasured ?? 0}</span><span class="s">no telemetry — instrument these next</span></div>
      <div class="cell"><span class="k">Fired in ${j.days}d</span><span class="v">${t.liveHits ?? 0}</span><span class="s">live hits + warned answers</span></div>
      <div class="cell"><span class="k">Vendor ceilings</span><span class="v">${(t.byStatus || {})["vendor-ceiling"] ?? 0}</span><span class="s">no solve of ours closes these</span></div>
    </div>
    <div class="card"><h2>The register</h2><div class="scroll"><table>
      <thead><tr><th>what we approximate</th><th>piece</th><th>status</th><th class="num">fires (${j.days}d)</th><th>why it can't be exact</th><th>what would close it</th></tr></thead>
      <tbody class="src-static">${rows}</tbody></table></div></div>
    ${drift}`;
}

/* ================= Coverage: the chain's seventeen invariants =================
   (2026-09-27, services/chainChecks — the owner's "checker coverage list".) One row per check: the correct behaviour
   in his words (so this page IS the spec), how it is checked and what is not, its build status, and what it found over

const CKC_BUILD = { built: ["good", "built"], partial: ["warn", "partial"], "to build": ["dim", "to build"] };

  catch { v.innerHTML = '<div class="card warn">coverage unavailable (the study API did not answer)</div>'; return; }
  if (PATH.view !== "coverage") return;
  if (!j.ok) { v.innerHTML = `<div class="card warn">${esc(j.error || "coverage unavailable")}</div>`; return; }
  v.innerHTML = checkCoverageHtml(j);
  const to = (session, days) => go(canonical({ view: "coverage", session: session || null, days: String(days || 7) }));
  $("ckc-session").onchange = (e) => to(e.target.value, PATH.days);

function checkCoverageHtml(j) {

    const t = `${e.street}: ${e.text}`;
    return row != null ? `<a href="/hands/${row}" onclick="go('/hands/${row}');return false" class="mono${e.status === "flag" ? " sub" : ""}" title="${esc(t)}">${esc(e.hand)}</a>`

  const sessOpts = [`<option value="">all sessions</option>`, ...(j.sessions || []).map((s) =>
    `<option value="${esc(s.id)}"${s.id === j.session ? " selected" : ""}>${esc(s.label || s.id)}${s.startedAt ? ` · ${fmtT(s.startedAt)}` : ""} (${s.decisions})</option>`)].join("");
  const dayOpts = [1, 7, 30, 90].map((d) => `<option value="${d}"${Number(j.days) === d ? " selected" : ""}>last ${d} day${d === 1 ? "" : "s"}</option>`).join("");
  const num = (n, cls) => n ? `<b class="${cls}">${n}</b>` : '<span class="sub">0</span>';

      `<td><span class="chip ${cls}">${esc(label)}</span>${seen}</td><td class="num">${num(c.pass, "")}</td><td class="num">${num(c.fail, "bad")}</td><td class="num">${num(c.flag, "flag")}</td>` +

let PATH = { view: "hands", pane: null, id: null };
const TABS = { home: "tab-home", hands: "tab-hands", sessions: "tab-sessions", profiles: "tab-profiles", analytics: "tab-analytics", coverage: "tab-coverage", sources: "tab-sources", review: "tab-replay", playthrough: "tab-play", ledger: "tab-ledger", tasks: "tab-tasks" };
$("tab-ledger").onclick = () => go("/proposals");
const SRC_PANES = ["strategies", "pieces", "matrix", "grading", "approx", "roadmap"];

function parsePath() {

  const view = seg[0] || "home";
  if (view === "home") { const q = new URLSearchParams(location.search); return { view: "home", pane: null, id: null, profile: q.get("profile") || "all", window: q.get("window") || "7d" }; }
  if (view === "hands") return { view, pane: null, id: seg[1] && /^\d+$/.test(seg[1]) ? seg[1] : null, node: seg[2] === "node" && /^\d+$/.test(seg[3] ?? "") ? Number(seg[3]) : null };
  if (view === "sources") {
    const seg1 = seg[1] === "registry" ? "pieces" : seg[1];
    const pane = SRC_PANES.includes(seg1) ? seg1 : "strategies";
    return { view, pane, id: (pane === "pieces" || pane === "strategies") && seg[2] ? decodeURIComponent(seg[2]) : null };
  }
  if (view === "sessions") return { view, pane: null, id: seg[1] ? decodeURIComponent(seg[1]) : null, show: new URLSearchParams(location.search).get("show") || null };
  if (view === "playthrough") return { view, pane: null, id: seg[1] === "spot" && seg[2] && seg[3] ? `spot/${decodeURIComponent(seg[2])}/${seg[3]}` : seg[1] === "strategy" && seg[2] ? `strategy/${decodeURIComponent(seg[2])}` : null };
  if (window.PLAYER_MODE && ["ledger", "runbook", "proposals", "tasks"].includes(view)) return { view: "home", pane: null, id: null, profile: "all", window: "7d" };
  if (view === "ledger" || view === "runbook" || view === "proposals") return { view: "ledger", pane: seg[1] || null, id: seg[2] ? decodeURIComponent(seg[2]) : null };
  if (view === "analytics") { const q = new URLSearchParams(location.search); return { view, pane: null, id: null, scope: q.get("scope") || "all", vs: q.get("vs") || null, profile: q.get("profile") || "all", window: q.get("window") || "all" }; }

function canonical(p) {

// hand walkthrough: ← / → move through the session from a hand page (buttons are wired in showDetail's render)
document.addEventListener("keydown", (ev) => {
  if (PATH.view !== "hands" || !PATH.id || !DETAIL?.nav) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName ?? "")) return;
  if (ev.key === "ArrowLeft" && DETAIL.nav.prev != null) { ev.preventDefault(); go(`/hands/${DETAIL.nav.prev}`); }
  if (ev.key === "ArrowRight" && DETAIL.nav.next != null) { ev.preventDefault(); go(`/hands/${DETAIL.nav.next}`); }
});
document.addEventListener("click", (ev) => {
  const b = ev.target.closest("#nav-prev, #nav-next");
  if (!b || !DETAIL?.nav) return;
  const to = b.id === "nav-prev" ? DETAIL.nav.prev : DETAIL.nav.next;
  if (to != null) go(`/hands/${to}`);
});
window.onhashchange = route; // legacy #hand/N
// theme: light and dark follow the OS unless pinned here; "legacy" is the pre-restyle palette, kept to compare.
// Charts read the tokens at draw time (anCss), so a change re-renders the view rather than restyling in place.
const THEMES = ["auto", "light", "dark", "legacy"];
function applyTheme(t, rerender) {
  if (!THEMES.includes(t)) t = "auto";
  if (t === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
  try { localStorage.setItem("sd_theme", t); } catch { /* private mode */ }
  for (const b of document.querySelectorAll("#theme-seg button")) b.setAttribute("aria-pressed", b.dataset.t === t ? "true" : "false");
  if (rerender) route();
}
applyTheme((() => { try { return localStorage.getItem("sd_theme") || "auto"; } catch { return "auto"; } })(), false);
// the hands table pins its header under the app bar, whose height depends on how the bar wraps
// (a ResizeObserver, not a resize listener: a hidden or zero-width window measures the bar fully wrapped,
// and the observer fires again the moment it lays out for real)
const measureHeader = () => { const h = document.querySelector("header").offsetHeight; if (h > 0) document.documentElement.style.setProperty("--hdr", `${h}px`); };
measureHeader(); new ResizeObserver(measureHeader).observe(document.querySelector("header")); document.fonts?.ready.then(measureHeader);
$("theme-seg").onclick = (ev) => { const b = ev.target.closest("button"); if (b) applyTheme(b.dataset.t, true); };
for (const [v, tab] of Object.entries(TABS)) $(tab).onclick = () => go(v === "sources" ? "/sources/strategies" : v === "home" ? "/" + hmQuery(HOME.profile, HOME.window) : `/${v}`);

route();
// Home re-reads on its own, slower, clock: a refresh rebuilds the whole page
// (and with it the chart), so it wants to be rare enough not to yank a tooltip
// out from under the cursor — and pointless while the tab is in the background.
setInterval(() => { if (PATH.view === "home" && !document.hidden) loadHome({ quiet: true }); }, 30000);
// The hands list and the sources registry re-read on their own 15 s clock while on screen. A tick that comes due
// with the tab hidden is parked; the hands list shares its name with the live-hand poll, so showing the tab re-reads
// it once, not twice.
setInterval(() => {
  if (onListView("hands")) whenVisible("hands", loadHands);
  if (PATH.view === "sources" && PATH.pane === "pieces" && !PATH.id) whenVisible("sources", loadSources);
}, 15000);

/* ================= "there's been an update" ================= */
/* The API runs WITHOUT --watch on purpose (a --watch worker crash leaves the
   watcher alive and hides the failure), so an edit changes nothing until the
   process restarts — and nothing used to say so. On 2026-09-19 it stayed up from
   19:54 while four fixes landed on disk, including the one that made every
   decision get solved and rolled twice all evening. */
let BUILD_DISMISSED = 0;

async function checkBuild() {
  const host = $("build-alert");
  if (!host) return;
  let j;
  try { j = await (await fetch("/api/build")).json(); } catch { return; }
  if (!j.ok || !j.stale || j.bootStamp === BUILD_DISMISSED) { host.innerHTML = ""; return; }
  const n = j.changedCount;
  const files = (j.changed || []).slice(0, 3).join("  ");
  const more = n > 3 ? `  +${n - 3} more` : "";
  host.innerHTML = `<div class="ba">
    <span>⟳ <b>This API is running older code than the disk.</b>
      Booted ${fmtAgo(j.bootAt)} · ${n} source file${n === 1 ? "" : "s"} changed since —
      none of it is live until it restarts.</span>
    <span class="files">${esc(files)}${esc(more)}</span>
    <span class="act">
      ${j.supervised
        ? `<button onclick="restartApi(this)">Restart now</button>`
        : `<button disabled title="no StudyAPI supervisor in this process — exiting would leave nothing serving :2000">Restart by hand</button>`}
      <button class="ghost" title="hide until something else changes"
              onclick="BUILD_DISMISSED=${j.bootStamp};$('build-alert').innerHTML='';">✕</button>
    </span></div>`;
}

async function restartApi(btn) {
  btn.disabled = true; btn.textContent = "restarting…";
  let j = null;
  try { j = await (await fetch("/api/build/restart", { method: "POST" })).json(); }
  catch { /* the exit can cut the response — that is a restart, not a failure */ }
  if (j && j.ok === false) { btn.textContent = "can't restart"; btn.title = j.error || ""; return; }
  const host = $("build-alert");
  host.innerHTML = `<div class="ba done">⟳ <b>Restarting.</b> The supervisor relaunches within ~10s; this page reloads itself when it answers again.</div>`;
  const t0 = Date.now();
  const tick = async () => {
    if (Date.now() - t0 > 90000) {
      host.innerHTML = `<div class="ba">⚠ <b>Not back after 90s.</b> <span class="files">data/jobs/api.log</span> says why.</div>`;
      return;
    }
    try {
      const r = await (await fetch("/api/build?force=1", { cache: "no-store" })).json();
      // a LATER boot than the one we asked to kill = the new process is serving
      if (r && r.ok && r.bootAt > t0 - 60000) { location.reload(); return; }
    } catch { /* still down */ }
    setTimeout(tick, 1500);
  };
  setTimeout(tick, 3000);
}

checkBuild();
setInterval(() => { if (!document.hidden) checkBuild(); }, 20000);

</script>
</body>
</html>
