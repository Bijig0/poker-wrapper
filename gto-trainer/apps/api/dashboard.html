<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js" data-chartjs></script>
<link rel="stylesheet" href="/dashboard.css">
<script>/* a pinned theme, before first paint (light/dark otherwise follow the OS) */try { const t = localStorage.getItem("sd_theme"); if (t && t !== "auto") document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body>
<div id="build-alert"></div>
<header>
  <h1>🃏 Study Dashboard</h1>
  <div class="tabs">
    <button id="tab-home" class="on" title="the overall situation: results for one account over one window, and whether the machinery that answers a spot is up">Home</button>
    <button id="tab-hands">Hands</button>
    <button id="tab-sessions">Sessions</button>
    <button id="tab-profiles" title="the accounts hands are played on: the money in them, and whether it adds up to what poker did">Profiles</button>
    <button id="tab-analytics">Analytics</button>
    <button id="tab-coverage" title="the postflop chain's seventeen invariants: the rule each one enforces, whether it is built, and what it found on the last days' answers">Coverage</button>
    <button id="tab-sources">Sources</button>
    <button id="tab-replay">Replay Review</button>
    <button id="tab-play">Playthrough</button>
    <button id="tab-ledger" title="solve proposals: what is being solved, from what, into what, at what cost — approve one, run it, watch it">Solve Proposals</button>
    <button id="tab-tasks" title="the hand-off board: every piece of work with the brief needed to pick it up cold, its next action, and what is waiting on you">Tasks</button>
  </div>
  <span id="count" class="sub"></span>
  <span style="flex:1"></span>
  <input id="filter" type="text" placeholder="filter: T4o, AKs, 44, pos, stakes…">
  <select id="table-filter" style="display:none" title="which of the session's tables the hand was played on — a session opens 1, 2 or 4 and each table's hands are stamped with its slot"><option value="">all tables</option></select>
  <select id="sess-filter" title="show only the hands of one session — declared sessions first, then the undeclared gap clusters from before sessions were declared (same partition as the Sessions tab)"><option value="">all sessions</option></select>
  <label class="sub"><input id="only-flop" type="checkbox"> saw flop</label>
  <label class="sub"><input id="only-disc" type="checkbox"> has discrepancy</label>
  <label class="sub" title="hands with a decision left unanswered: partly answered, failed, never logged, or no hero decision seen"><input id="only-unanswered" type="checkbox"> unanswered</label>
  <div id="theme-seg" title="light and dark follow the OS unless pinned; legacy is the palette the dashboard had before the restyle, kept to compare"><button data-t="auto">Auto</button><button data-t="light">Light</button><button data-t="dark">Dark</button><button data-t="legacy">Legacy</button></div>
</header>
<main>
  <div id="view-home" style="display:none"></div>
  <div id="view-hands">
    <table>
      <thead><tr>
        <th data-k="playedAt">time</th><th data-k="stakes">stakes</th><th data-k="pos">pos</th>
        <th data-k="cards">cards</th><th data-k="street">street</th><th data-k="strategy">strategy</th><th data-k="pot">pot</th>
        <th data-k="table" title="which table of the session (1-4); — for a single-table session, which has no slot by design">tbl</th>
        <th data-k="net">net bb</th><th data-k="ans">answers</th><th>flags</th><th>disc</th>
      </tr></thead>
      <tbody id="hands-body"></tbody>
    </table>
  </div>
  <div id="view-detail" style="display:none"></div>
  <div id="view-sessions" style="display:none"></div>
  <div id="view-profiles" style="display:none"></div>
  <div id="view-ledger" style="display:none"></div>
  <div id="view-tasks" style="display:none"></div>
  <div id="view-analytics" style="display:none"></div>
  <div id="view-coverage" style="display:none"></div>
  <div id="view-sources" style="display:none"></div>
  <div id="view-play" style="display:none"></div>
  <!-- Side-by-side replay review lives in the React dashboard (it renders the
       Ignition table replica); this tab embeds it so review stays reachable
       from the study dashboard the recordings belong to. -->
  <div id="view-replay" style="display:none">
    <!-- Replay Review is served by this same API (studyUi.ts -> /replay), so the
         tab is a same-origin iframe with no second process behind it. -->
    <iframe id="replay-frame" style="width:100%;height:calc(100vh - 90px);border:0;border-radius:12px;background:var(--bg)"></iframe>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const SUITS = { s: ["♠", "var(--ink)"], h: ["♥", "var(--loss)"], d: ["♦", "var(--loss)"], c: ["♣", "var(--ink)"] };
const cardHtml = (c) => {
  if (!c || c.length < 2) return esc(c);
  const [sym, col] = SUITS[c[1]] ?? ["?", "var(--ink)"];
  return `<span class="cardsuit" style="color:${col}">${esc(c[0])}${sym}</span>`;
};
const cardsHtml = (cs) => (cs || []).map(cardHtml).join(" ");
const fmtT = (ms) => ms ? new Date(ms).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "—";
const netCls = (n) => n == null ? "" : n >= 0 ? "pos" : "neg";
const netStr = (n) => n == null ? "?" : (n > 0 ? "+" : "") + n.toFixed(2);
const r2 = (x) => Math.round(x * 100) / 100;

/* ================= polls only while the tab is on screen ================= */
/* The study API that serves this page also answers live poker decisions on the same event loop, and a tab in the
   background kept re-reading it: the hands list every 3 s for as long as a table was being played (GET
   /api/dashboard/hands, the biggest recurring [stall] source), and on 2026-09-25 a background Proposals tab re-read
   the ~900 KB /api/ledger every ~7 s and blocked the loop for 3-13 s a time. Every repeating poll goes through
   whenVisible: one that comes due while the tab is hidden is parked under its name (a later one with the same name
   replaces it) and runs once when the tab is shown again. route() drops the parked polls of the view being left. */
const PARKED = new Map();
function whenVisible(name, fn) { if (document.hidden) PARKED.set(name, fn); else fn(); }
document.addEventListener("visibilitychange", () => {
  if (document.hidden || !PARKED.size) return;
  const due = [...PARKED.values()]; PARKED.clear();
  for (const fn of due) try { fn(); } catch (e) { console.error(e); }
});

/* ================= hands list ================= */
let HANDS = [], SESSIONS = [], AUDIT_NOTE = "", sortK = "playedAt", sortDir = -1;

// The discrepancy audits are computed by the server in the background after a
// restart; while any are still pending the disc column shows "?" — re-poll
// until they are all in (one timer, whichever loader asked last). `view` is the
// list the loader draws (hands · home · analytics): the poll runs while that list
// is on screen, is parked while the tab is hidden, and route() stops it when the
// user leaves the list.
let auditTimer = null, auditView = null;
const onListView = (view) => PATH.view === view && !PATH.id;
function pollWhilePending(j, view, reload) {
  if (!onListView(view)) return; // left the list while the read was in flight: re-arm nothing, and leave the new view's poll alone
  clearTimeout(auditTimer); auditView = view;
  // hands in play (the wrapper's live rows) keep the list moving as well as pending audits
  if (j.auditPending > 0 || j.live > 0) auditTimer = setTimeout(() => whenVisible(view, () => { if (onListView(view)) reload(); }), j.live > 0 ? 3000 : 2500);
}

async function loadHands() {
  try {
    const j = await (await fetch("/api/dashboard/hands")).json();
    HANDS = j.hands || [];
    SESSIONS = j.sessions || [];
    AUDIT_NOTE = j.auditPending ? ` · auditing ${j.auditPending}…` : "";
    buildSessionFilter();
    renderHands();
    pollWhilePending(j, "hands", loadHands);
  } catch (e) { /* server restarting */ }
}
const sortVal = (h, k) => k === "pos" ? (h.summary.heroPos ?? "") : k === "cards" ? h.heroCards.join("")
  : k === "street" ? h.summary.finalStreet : k === "strategy" ? (h.strategy?.name ?? "") : k === "pot" ? h.summary.potBb : k === "net" ? (h.netBb ?? -1e9)
  : k === "ans" ? (ANS_RANK[h.answerStatus?.status] ?? 9)
  : k === "table" ? (h.table ?? 99)          // single-table hands sort last, not first
  : (h[k] ?? "");

// Study-answer status per hand (server: answerStatusOf) as a chip. The reason is the tooltip.
const ANS_RANK = { failed: 0, missing: 1, "no-decision": 2, unknown: 3, answered: 4 };
const ansChip = (st) => !st ? '<span class="sub">—</span>'
  : st.status === "answered" ? `<span class="chip good" title="every one of hero's ${st.decisions ?? st.answered} decision${(st.decisions ?? st.answered) === 1 ? "" : "s"} got an answer${st.failed ? ` · ${st.failed} failed attempt${st.failed === 1 ? "" : "s"} as well` : ""}">${st.covered ?? st.answered} answered</span>`
  : st.status === "partial" ? `<span class="chip warn" title="${esc(st.reason ?? "")}">${st.covered} of ${st.decisions}</span>`
  : st.status === "failed" ? `<span class="chip crit" title="${esc(st.reason ?? "")}">failed ×${st.failed}</span>`
  : st.status === "missing" ? `<span class="chip warn" title="${esc(st.reason ?? "")}">no answer</span>`
  : st.status === "no-decision" ? `<span class="chip dim" title="${esc(st.reason ?? "")}">no decision seen</span>`
  : `<span class="chip dim" title="${esc(st.reason ?? "")}">unknown</span>`;

// Session dropdown: one option per session the /hands payload knows about, in
// the Sessions tab's own words (preset / strategy, label, stakes, hand count).
// Declared sessions come first, the inferred gap clusters after; the current
// pick survives a reload as long as that session still exists.
const sessionOptionLabel = (s) => {
  const when = fmtT(s.startedAt);
  const what = s.declared ? [presetLabel(s.preset, s), s.label].filter(Boolean).join(" · ") : "undeclared";
  return `${when} · ${what} · ${s.stakes ?? "?"} · ${s.hands} hand${s.hands === 1 ? "" : "s"}${s.declared && !s.endedAt ? " · open" : ""}`;
};
function buildSessionFilter() {
  const sel = $("sess-filter"), keep = sel.value;
  const group = (label, xs) => xs.length ? `<optgroup label="${esc(label)}">${xs.map((s) => `<option value="${esc(s.id)}">${esc(sessionOptionLabel(s))}</option>`).join("")}</optgroup>` : "";
  sel.innerHTML = `<option value="">all sessions</option>` + group("Declared sessions", SESSIONS.filter((s) => s.declared)) + group("Before sessions were declared (inferred)", SESSIONS.filter((s) => !s.declared));
  sel.value = SESSIONS.some((s) => s.id === keep) ? keep : "";
  buildTableFilter();
}

/* The table filter earns its place or stays hidden. Most sessions are one table
   and tables.py gives those no slot at all ("None is not slot 1"), so on a rig
   that has never run multi-table this control would be a permanent "all tables"
   over a column of dashes. */
function buildTableFilter() {
  const sel = $("table-filter"), keep = sel.value;
  const slots = [...new Set(HANDS.map((h) => h.table).filter((t) => t != null))].sort((a, b) => a - b);
  const anyUnslotted = HANDS.some((h) => h.table == null);
  sel.dataset.avail = slots.length ? "1" : "0";
  if (!slots.length) { sel.style.display = "none"; sel.value = ""; return; }
  sel.style.display = "";
  sel.innerHTML = `<option value="">all tables</option>`
    + slots.map((t) => `<option value="${t}">table ${t}</option>`).join("")
    // the single-table hands are a real bucket, not an absence: without this they
    // are only reachable by clearing the filter, which also shows everything else
    + (anyUnslotted ? `<option value="none">single table (—)</option>` : "");
  sel.value = [...slots.map(String), "none"].includes(keep) ? keep : "";
}

/* Filter terms are space-separated and ALL must match. A term shaped like a hand
   class (T4o, T4s, T4, 44 — either rank order) matches hero's two cards as a class;
   anything else is a substring of the row's stakes / position / cards / street /
   strategy text, as before. */
const HAND_CLASS_RE = /^([2-9tjqka])([2-9tjqka])([so])?$/;
function handClassMatch(term, cards) {
  const m = HAND_CLASS_RE.exec(term);
  if (!m || !cards || cards.length !== 2) return null;
  const [r1, r2] = cards.map((c) => c[0].toLowerCase());
  if (!(r1 === m[1] && r2 === m[2]) && !(r1 === m[2] && r2 === m[1])) return false;
  if (!m[3]) return true;
  const suited = cards[0][1].toLowerCase() === cards[1][1].toLowerCase();
  return m[3] === "s" ? suited : !suited;
}
function handMatchesTerm(h, term, text) {
  return HAND_CLASS_RE.test(term) ? handClassMatch(term, h.heroCards) === true : text.includes(term);
}

function renderHands() {
  const q = $("filter").value.trim().toLowerCase();
  const terms = q ? q.split(/\s+/) : [];
  const sid = $("sess-filter").value;
  let rows = HANDS.filter((h) => {
    if (sid && h.session !== sid) return false;
    const tf = $("table-filter").value;
    if (tf === "none" ? h.table != null : tf && String(h.table) !== tf) return false;
    if ($("only-flop").checked && !h.summary.sawFlop) return false;
    if ($("only-disc").checked && !(h.discrepancies && (h.discrepancies.major || h.discrepancies.minor))) return false;
    if ($("only-unanswered").checked && h.answerStatus?.status === "answered") return false;
    if (!terms.length) return true;
    const text = `${h.stakes} ${h.summary.heroPos} ${h.heroCards.join("")} ${h.summary.finalStreet} ${h.strategy?.name ?? ""}`.toLowerCase();
    return terms.every((t) => handMatchesTerm(h, t, text));
  });
  rows = rows.slice().sort((a, b) => {
    const va = sortVal(a, sortK), vb = sortVal(b, sortK);
    return (va < vb ? -1 : va > vb ? 1 : 0) * sortDir;
  });
  $("count").textContent = (rows.length === HANDS.length ? `${HANDS.length} hands` : `${rows.length} of ${HANDS.length} hands`) + AUDIT_NOTE;
  $("hands-body").innerHTML = rows.map((h) => {
    const s = h.summary;
    const flags = [s.limpedPot ? "limped" : "", s.threeBet ? "3bet" : "", s.wentToShowdown ? "SD" : "", s.heroWonUncontested ? "steal" : ""].filter(Boolean).join(" ");
    const d = h.discrepancies;
    const disc = (h.integrityFaults ? `<span class="badge b-severe" title="an answer in this hand disagreed with its own mix — see the hand page">${h.integrityFaults}!</span>` : "")
      + (d ? (d.major ? `<span class="badge b-major">${d.major}M</span>` : "") + (d.minor ? `<span class="badge b-minor">${d.minor}m</span>` : "") + (d.info ? `<span class="badge b-info">${d.info}i</span>` : "") : "?");
    return `<tr data-id="${h.dbId}"><td>${fmtT(h.playedAt)}</td><td>${esc(h.stakes ?? "?")}</td><td>${esc(s.heroPos ?? "?")}</td>
      <td>${cardsHtml(h.heroCards)}</td><td>${esc(s.finalStreet)}${h.live ? ` <span class="chip ${h.live === "live" ? "good" : "warn"}" title="${h.live === "live" ? "being played now: the wrapper writes this row as the hand goes and finishes it in place" : "the wrapper stopped writing this hand before it ended (closed or crashed mid-hand)"}">${h.live}</span>` : ""}</td><td>${h.strategy ? `<span class="chip ${h.strategy.id === "ign25-zone-3max-exploit" ? "good" : ""}">${esc(h.strategy.name)}</span>${h.strategy.test ? ' <span class="chip warn" title="declared at a test stake: this strategy answering on a cheaper table">test</span>' : ""}` : '<span class="sub">—</span>'}</td><td>${s.potBb}</td>
      <td>${h.table == null ? '<span class="sub">—</span>' : `<span class="chip">T${h.table}</span>`}</td>
      <td class="${netCls(h.netBb)}">${netStr(h.netBb)}</td><td>${ansChip(h.answerStatus)}</td><td class="sub">${esc(flags)}</td><td>${disc}</td></tr>`;
  }).join("");
  for (const tr of $("hands-body").querySelectorAll("tr")) tr.onclick = () => go(`/hands/${tr.dataset.id}`);
}
document.querySelectorAll("thead th[data-k]").forEach((th) => {
  th.onclick = () => { const k = th.dataset.k; sortDir = sortK === k ? -sortDir : -1; sortK = k; renderHands(); };
});
$("table-filter").onchange = renderHands;
$("filter").oninput = renderHands; $("only-flop").onchange = renderHands; $("only-disc").onchange = renderHands; $("only-unanswered").onchange = renderHands; $("sess-filter").onchange = renderHands;

/* ================= replayer state ================= */
const STREET_N = { preflop: 0, flop: 3, turn: 4, river: 5 };
function replayState(hand, step) {
  // per-seat committed for the CURRENT street, pot carried from prior streets
  const st = { street: "preflop", potPrev: 0, cur: {}, folded: new Set(), invested: {} };
  for (let i = 0; i < step; i++) {
    const a = hand.actions[i];
    if (a.street !== st.street) {
      st.potPrev += Object.values(st.cur).reduce((s, x) => s + x, 0);
      st.cur = {}; st.street = a.street;
    }
    const amt = a.amount ?? 0;
    if (a.type === "post-sb" || a.type === "post-bb" || a.type === "call") st.cur[a.seatId] = (st.cur[a.seatId] ?? 0) + amt;
    else if (a.type === "bet" || a.type === "raise" || a.type === "all-in") st.cur[a.seatId] = amt;
    else if (a.type === "fold") st.folded.add(a.seatId);
    st.invested[a.seatId] = (st.invested[a.seatId] ?? 0);
  }
  // total invested per seat (for stack display)
  const inv = {};
  {
    let street = "preflop", cur = {};
    for (let i = 0; i < step; i++) {
      const a = hand.actions[i];
      if (a.street !== street) { for (const [s, v] of Object.entries(cur)) inv[s] = (inv[s] ?? 0) + v; cur = {}; street = a.street; }
      const amt = a.amount ?? 0;
      if (a.type === "post-sb" || a.type === "post-bb" || a.type === "call") cur[a.seatId] = (cur[a.seatId] ?? 0) + amt;
      else if (a.type === "bet" || a.type === "raise" || a.type === "all-in") cur[a.seatId] = amt;
    }
    for (const [s, v] of Object.entries(cur)) inv[s] = (inv[s] ?? 0) + v;
  }
  const next = hand.actions[step] ?? null;
  const shownStreet = next ? next.street : st.street;
  return {
    street: st.street,
    board: hand.board.slice(0, STREET_N[shownStreet] ?? hand.board.length),
    pot: r2(st.potPrev + Object.values(st.cur).reduce((s, x) => s + x, 0)),
    bets: st.cur,
    folded: st.folded,
    invested: inv,
    toAct: next ? next.seatId : null,
    next,
  };
}

/* ================= SVG table mirror ================= */
function svgCard(x, y, c, w = 26, h = 36) {
  if (!c) return `<rect x="${x}" y="${y}" rx="3" width="${w}" height="${h}" fill="#1b2f4d" stroke="#33507a"/>
    <rect x="${x + 4}" y="${y + 4}" rx="2" width="${w - 8}" height="${h - 8}" fill="none" stroke="#3d5f8f" stroke-width="1"/>`;
  const [sym, col] = SUITS[c[1]] ?? ["?", "var(--ink)"];
  return `<rect x="${x}" y="${y}" rx="3" width="${w}" height="${h}" fill="#eef2f7"/>
    <text x="${x + w / 2}" y="${y + h / 2 - 3}" text-anchor="middle" font-size="13" font-weight="700" fill="${col === SUITS.s[1] ? "#22303f" : "#d3364b"}">${c[0]}</text>
    <text x="${x + w / 2}" y="${y + h / 2 + 12}" text-anchor="middle" font-size="12" fill="${col === SUITS.s[1] ? "#22303f" : "#d3364b"}">${sym}</text>`;
}

function renderMirror(hand, rs) {
  const W = 640, H = 380, cx = W / 2, cy = H / 2 - 6, RX = 240, RY = 128;
  const seats = [...new Set([...Object.keys(hand.positions).map(Number), ...hand.liveSeats, hand.heroSeatId])].sort((a, b) => a - b);
  const heroIdx = Math.max(0, seats.indexOf(hand.heroSeatId));
  const n = seats.length;
  const btnSeat = seats.find((s) => hand.positions[s] === "BTN") ?? seats.find((s) => hand.positions[s] === "SB");
  let g = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="${cx}" cy="${cy}" rx="${RX + 44}" ry="${RY + 44}" fill="#12202e" stroke="#243447" stroke-width="3"/>
    <ellipse cx="${cx}" cy="${cy}" rx="${RX + 22}" ry="${RY + 22}" fill="#173042" stroke="#2c4a63" stroke-width="2"/>`;
  // board
  const b0 = cx - (5 * 30) / 2;
  for (let i = 0; i < 5; i++) g += svgCard(b0 + i * 30, cy - 30, rs.board[i] ?? null, 26, 36).replace(/#1b2f4d/g, i < STREET_N[rs.next ? rs.next.street : rs.street] || rs.board[i] ? "#1b2f4d" : "none");
  for (let i = rs.board.length; i < 5; i++) { /* empty slots drawn faint above */ }
  g = g.replace(/fill="none" stroke="#33507a"/g, 'fill="#132030" stroke="#22364e"');
  g += `<text x="${cx}" y="${cy + 34}" text-anchor="middle" font-size="14" fill="#ffd35c" font-weight="700">pot ${rs.pot} bb</text>`;
  for (let k = 0; k < n; k++) {
    const seat = seats[(heroIdx + k) % n];
    const ang = Math.PI / 2 + (k * 2 * Math.PI) / n; // hero at bottom, clockwise
    const sx = cx + RX * Math.cos(ang), sy = cy + RY * Math.sin(ang);
    const isHero = seat === hand.heroSeatId;
    const folded = rs.folded.has(seat);
    const toAct = rs.toAct === seat;
    const stack0 = hand.stacks?.[seat];
    const stackStr = stack0 != null ? `${r2(Math.max(0, stack0 - (rs.invested[seat] ?? 0)))} bb` : "";
    const op = folded ? 0.35 : 1;
    // hole cards
    const cardY = sy - 52;
    if (!folded && (isHero ? hand.heroCards.length : hand.liveSeats.includes(seat))) {
      const c1 = isHero ? hand.heroCards[0] : null, c2 = isHero ? hand.heroCards[1] : null;
      g += `<g opacity="${op}">${svgCard(sx - 27, cardY, c1)}${svgCard(sx + 1, cardY, c2)}</g>`;
    }
    // pod
    g += `<g opacity="${op}">
      <rect x="${sx - 46}" y="${sy - 12}" rx="7" width="92" height="36" fill="${isHero ? "#1c3550" : "#182230"}"
        stroke="${toAct ? "#ffd35c" : isHero ? "#3f6d9e" : "#2a3a4e"}" stroke-width="${toAct ? 2.5 : 1.2}"/>
      <text x="${sx}" y="${sy + 2}" text-anchor="middle" font-size="12" font-weight="700" fill="${isHero ? "#9fd1ff" : "#c8d5e2"}">
        ${isHero ? "YOU" : "seat " + seat}${hand.positions[seat] ? " · " + esc(hand.positions[seat]) : ""}</text>
      <text x="${sx}" y="${sy + 17}" text-anchor="middle" font-size="11" fill="#8fa1b6">${folded ? "folded" : stackStr}</text></g>`;
    // Things drawn on the seat→pot line (dealer button, committed chips)
    // must never sit on the hole cards. The cards are always ABOVE the pod,
    // so for seats in the lower half of the table a fixed fraction of the
    // way to the pot lands right on them (hero's 2.52 covered his cards).
    // Slide along the line until clear of the card rectangle, so the marker
    // ends up between the cards and the pot for every seat angle.
    const cardsDrawn = !folded && (isHero ? hand.heroCards.length > 0 : hand.liveSeats.includes(seat));
    const cardRect = cardsDrawn ? { x1: sx - 30, y1: cardY - 3, x2: sx + 30, y2: cardY + 39 } : null;
    const alongLine = (t0, w, h, dx) => {
      let t = t0, x = 0, y = 0;
      for (; t <= 0.72; t += 0.03) {
        x = sx + (cx - sx) * t + dx; y = sy + (cy - sy) * t;
        const clear = !cardRect || x + w / 2 < cardRect.x1 || x - w / 2 > cardRect.x2 || y + h / 2 < cardRect.y1 || y - h / 2 > cardRect.y2;
        if (clear) break;
      }
      return { x, y };
    };
    // dealer button
    if (seat === btnSeat) {
      // -40: clear of the chip (48 wide, centred on the line) when both slide to the same spot
      const { x: dxp, y: dyp } = alongLine(0.26, 20, 20, -40);
      g += `<circle cx="${dxp}" cy="${dyp}" r="9" fill="#e8ecf2"/><text x="${dxp}" y="${dyp + 3.5}" text-anchor="middle" font-size="10" font-weight="800" fill="#22303f">D</text>`;
    }
    // committed chips this street
    const bet = rs.bets[seat];
    if (bet) {
      const { x: bx, y: by } = alongLine(0.34, 52, 22, 0);
      g += `<rect x="${bx - 24}" y="${by - 10}" rx="9" width="48" height="18" fill="#0f1a26" stroke="#3b556f"/>
        <text x="${bx}" y="${by + 3.5}" text-anchor="middle" font-size="11" font-weight="700" fill="#ffd35c">${r2(bet)}</text>`;
    }
  }
  return g + "</svg>";
}

/* ================= feed ↔ step sync ================= */
function feedStepMap(feedLines, actions) {
  // Map each feed line to "actions consumed so far": action lines advance the
  // counter; everything else inherits the current count.
  const isAction = (l) => /^Seat \d+ (posts|folds|checks|calls|bets|raises to|is ALL-IN)/.test(l);
  let k = 0;
  return feedLines.map((l) => {
    if (isAction(l) && k < actions.length) k++;
    return k;
  });
}

/* ================= detail page ================= */
let DETAIL = null, STEP = 0, PLAY = null;

/* THE CHAIN PATH (2026-09-25, services/chainPath): how each answer of the hand was produced. The happy path is: the
   flop ranges computed once from the tree hero's preflop answers were read on (the preflop pin), and every later
   decision takes each earlier street from the hand's memo (a hit) or resumes it at hero's last node. BY DESIGN is a
   rule you set (hero left the pick, a collapse plan, a size pinned into a new tree); REBUILT is the recovery path
   (the ranges derived again from the capture); EXTRA REQUESTS is a tree or node GTO Wizard had already served. */
const CHAIN_VERDICT = {
  clean: ["good", "clean"], "by-design": ["good", "clean · by design"], rebuilt: ["warn", "rebuilt"],
  leaked: ["crit", "extra requests"], failed: ["crit", "check failed"], fault: ["crit", "no answer"],
};
function chainChip(v) {
  const [cls, label] = CHAIN_VERDICT[v] || ["dim", v || "—"];
  return `<span class="chip ${cls}">${esc(label)}</span>`;
}
const CHAIN_HOW = {
  hit: "memo hit", resumed: "resumed", first: "first walk", pin: "from the preflop pin", designed: "the strategy's source",
  "by-design": "by design", rebuilt: "REBUILT", leaked: "extra requests",
};
function chainHow(how, why) {
  const bad = how === "rebuilt" || how === "leaked";
  const t = CHAIN_HOW[how] || how || "—";
  return `<span${bad ? ' class="chain-bad"' : how === "by-design" ? ' class="chain-dz"' : ""}${why ? ` title="${esc(why)}"` : ""}>${esc(t)}</span>`;
}
function chainReq(r) {
  if (!r) return '<span class="sub">—</span>';
  const n = (r.tree || 0) + (r.solution || 0) + (r.poll || 0) + (r.library || 0) + (r.other || 0);
  return n ? `${n} <span class="sub">(${r.tree || 0} tree · ${r.poll || 0} poll)</span>` : '<span class="sub">0</span>';
}
/* PER STREET (2026-09-26): did it start from the previous street's solved output ranges (the hand-off check), and who
   solved it. A memo hit was not solved again on this decision — it reuses the street's earlier solve. */
function chainCheck(s) {
  const c = s.check;
  if (!c) return "";
  if (c.ok === true) return `<br><span class="chain-ok" title="${esc(c.why)}">✓ verified: uses the ${esc(c.from)} solve's ranges</span>`;
  if (c.ok === false) return `<br><span class="chain-bad" title="${esc(c.why)}">✗ did NOT start from the ${esc(c.from)} solve's ranges</span>`;
  if (!c.from) return `<br><span class="sub">starts from the preflop ranges (flop ranges column)</span>`;
  return `<br><span class="sub" title="${esc(c.why)}">not verified — ${esc(c.why)}</span>`;
}
/* VILLAIN MISTAKE LINES (2026-09-27, services/offTree): an action the equilibrium almost never takes — flagged, not acted
   on. GTO Wizard's custom solves are QRE (since 2025-04-16): the small frequency is the solver's modelled mistake, not noise. */
function chainOffTree(s) {
  const pc = (x) => `${(x * 100).toFixed(x < 0.001 ? 3 : 2)}%`;
  return (s.offTree || []).map((l) => `<br><span class="chain-dz" title="a villain mistake line: GTO Wizard's QRE solve models this action as a mistake at this frequency, so the range narrowed by it is QRE's model of who makes the mistake, not the pool's — flagged, not a verdict; logged for a pool range later">⚑ villain mistake line: ${esc(l.seat)} ${esc(l.action)}${l.betsize != null ? ` ${esc(String(l.betsize))}` : ""} — solver ${pc(l.nodeFreq)}, no hand above ${pc(l.maxHand)}${l.evGapBb != null ? `, costs him ${Number(l.evGapBb).toFixed(2)}bb avg` : ""}</span>`).join("");
}
function chainSolver(s) {
  if (s.how === "hit") return `<br><span class="sub">reused — not solved again</span>`;
  const acct = s.account ? ` · ${esc({ primary: "Ultra", secondary: "Elite" }[s.account] || s.account)}` : "";
  return `<br><span class="sub">solved with GTO Wizard AI postflop${acct} · ${s.tree === "created" ? "new tree" : "cached tree"}</span>`;
}
/* THE CHECKS TAB (2026-09-27, services/chainChecks) — it took over the Chain path card. At the top, the hand's verdict
   and what it cost (the preflop pin, GTO Wizard requests, the streets walked); then per decision: its verdict, requests
   and reasons, how each street's ranges were produced (folded away), and the chain's seventeen invariants as a table of
   checks × streets: ✓ held · ✗ failed (red, with the reason) · ⚑ a villain mistake line (flagged, never a verdict) ·
   — not checked (hover says why). Hover a check's name for the rule it enforces. */
const CK_STREETS = ["preflop", "flop", "turn", "river"];
const CK_GROUP = { inputs: "Inputs", process: "Process", output: "Output" };
function ckCellHtml(c) {
  if (!c) return '<td class="ck-cell"><span class="sub" title="not checked on this street">—</span></td>';
  if (c.status === "pass") return `<td class="ck-cell"><span class="chain-ok" title="${esc(c.text)}">✓</span></td>`;
  if (c.status === "fail") return `<td class="ck-cell"><span class="chain-bad">✗</span> <span class="ck-why">${esc(c.text)}</span>${c.covered ? ` <span class="sub" title="another reason on this answer already reports it">(reported as ${esc(c.covered)})</span>` : ""}</td>`;
  if (c.status === "flag") return `<td class="ck-cell"><span class="ck-flag" title="flagged, never a verdict">⚑</span> <span class="sub">${esc(c.text)}</span></td>`;
  return `<td class="ck-cell"><span class="sub" title="${esc(c.text)}">—</span></td>`;
}
function ckTableHtml(p, defs) {
  const checks = p.checks || {};

  if (!streets.length) return '<div class="sub">no checks recorded for this answer (logged before 2026-09-27)</div>';
  let group = null;
  const rows = defs.map((d) => {
    const head = d.group !== group ? `<tr class="ck-group"><td colspan="${streets.length + 1}">${esc(CK_GROUP[d.group] || d.group)}</td></tr>` : "";
    group = d.group;
    const cells = streets.map((s) => ckCellHtml((checks[s] || []).find((c) => c.id === d.id))).join("");
    return `${head}<tr class="src-static"><td class="ck-name" title="${esc(d.spec)}"><span class="mono sub">${d.id}</span> ${esc(d.name)}</td>${cells}</tr>`;
  }).join("");
  return `<div class="scroll"><table class="ck-tbl"><thead><tr><th>check</th>${streets.map((s) => `<th>${esc(s)}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

  const top = `<div class="ck-top">hand verdict ${hv ? chainChip(hv.verdict) : '<span class="sub">—</span>'} <span class="sub">${pin}${origins ? ` · GTO Wizard requests for this hand: ${origins}` : ""}${walked ? `<br>streets walked: ${walked}` : ""}</span></div>
    <div class="sub" style="margin:0 0 6px"><span class="chain-ok">✓</span> held · <span class="chain-bad">✗</span> failed (a reason on the answer: verdict "check failed") · <span class="ck-flag">⚑</span> a villain mistake line — flagged, never a verdict · — not checked (hover for why) · hover a check for its rule; <a href="/coverage" onclick="go('/coverage');return false">all checks across hands ↗</a></div>`;

       <span class="what">${esc(String(d.actual ?? "—"))} → ${esc(String(d.shown ?? "—"))}${d.note ? `<span class="sub"> · ${esc(d.note)}</span>` : ""}</span></div>`).join("") + `</div>` : ""}`;
  DETAIL.flMap = feedStepMap(j.feedLines, j.hand.actions);
  renderTimeline();
  $("tl-seg").querySelectorAll("button").forEach((b) => b.onclick = () => tlView(b.dataset.v));
  tlView(TL_VIEW);
  setStep(STEP);
  $("rp-first").onclick = () => setStep(0);
  $("rp-prev").onclick = () => setStep(STEP - 1);
  $("rp-next").onclick = () => setStep(STEP + 1);
  $("rp-last").onclick = () => setStep(DETAIL.hand.actions.length);
  $("rp-play").onclick = () => {
    if (PLAY) { clearInterval(PLAY); PLAY = null; $("rp-play").textContent = "▶ play"; return; }
    if (STEP >= DETAIL.hand.actions.length) setStep(0);
    $("rp-play").textContent = "⏸";
    PLAY = setInterval(() => {
      if (STEP >= DETAIL.hand.actions.length) { clearInterval(PLAY); PLAY = null; $("rp-play").textContent = "▶ play"; return; }
      setStep(STEP + 1);
    }, 900);
  };
}

/* ---- Actual: Ignition's own hand history of the hand (via the wrapper), checked against what the reader recorded.
   The verdict and the diffs come from /api/ignition-hh (services/hhCheck); every renderer below is data → HTML. ---- */
const HH_STREETS = ["preflop", "flop", "turn", "river"];
const HH_NOISE = /^(Set dealer|Card dealt to a spot)$/;
const HH_CARD = /^[2-9TJQKA][cdhs]$/;
const HH_ACTION_KINDS = new Set(["action-missing", "action-extra", "action-amount"]);
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
const hhBoardOn = (board, street) => ({ flop: board.slice(0, 3), turn: board.slice(3, 4), river: board.slice(4, 5) })[street] ?? [];
const hhDataHtml = (data) => {
  const d = data.filter(Boolean);
  return d.length && d.every((x) => HH_CARD.test(x)) ? cardsHtml(d) : esc(d.join(" "));
};

/** Does the recording match Ignition's — and if not, did it at least match up to hero's last action (what the answers saw)? */
function hhVerdictHtml(check) {
  if (!check) return '<div class="hh-verdict sub">this hand is not in the archive, so there is nothing to check it against</div>';
  const when = check.checkedAt ? `<span class="sub">· checked ${fmtT(check.checkedAt)}</span>` : "";
  const badge = check.status === "match"
    ? `<span class="badge b-info">✓ matches Ignition's hand history</span><span class="sub">seats, stacks as dealt, cards, board and every action</span>`
    : check.throughOk
      ? `<span class="badge b-minor">matches up to your last action</span><span class="sub">${plural(check.diffs.length, "difference")} after it — what the answers saw was right</span>`
      : `<span class="badge b-major">does not match</span><span class="sub">${plural(check.diffs.length, "difference")}, ${check.through.length} before your last action</span>`;
  return `<div class="hh-verdict">${badge}${when}</div>`;
}

/** The differences that are not about one action (board, stacks, seats, hero): actions are marked in the log instead. */
function hhOtherDiffsHtml(diffs) {
  const rows = diffs.filter((d) => !HH_ACTION_KINDS.has(d.kind));
  return rows.length ? `<table class="cs-seats"><thead><tr><th>what</th><th>recorded</th><th>Ignition</th><th></th></tr></thead><tbody>${rows.map((d) =>
    `<tr><td>${esc(d.field)}</td><td class="mono">${esc(d.ours)}</td><td class="mono">${esc(d.ignition)}</td><td class="sub">${esc(d.note ?? "")}</td></tr>`).join("")}</tbody></table>` : "";
}

const hhSeatsHtml = (g) => `<table class="cs-seats"><thead><tr><th>seat</th><th>position</th><th>cards</th><th class="num">start</th><th class="num">end</th><th class="num">net</th></tr></thead><tbody>${g.seats.map((s) =>
  `<tr class="${s.hero ? "hero" : ""}"><td>${s.seat}</td><td>${esc(s.position)}</td><td>${s.cards.length ? cardsHtml(s.cards) : '<span class="sub">—</span>'}</td><td class="num">${s.startBb}bb</td><td class="num">${s.endBb}bb</td><td class="num">${s.netBb > 0 ? "+" : ""}${s.netBb}bb</td></tr>`).join("")}</tbody></table>`;

/** Ignition's log street by street. A line the recording lacks, or has at another size, is marked; an action only the
 *  recording has closes its street. */
function hhLogHtml(g, diffs, ours) {
  const byIgn = (kind) => new Map(diffs.filter((d) => d.kind === kind).map((d) => [d.ignitionAt, d]));
  const missing = byIgn("action-missing"), resized = byIgn("action-amount");
  const extras = diffs.filter((d) => d.kind === "action-extra").map((d) => ours.actions[d.oursAt]).filter(Boolean);
  const heroSeat = g.seats.find((s) => s.hero)?.seat;
  const lineHtml = (l) => {
    const a = l.action != null ? g.actions[l.action] : null;
    const miss = a != null && missing.has(l.action), size = a != null ? resized.get(l.action) : null;
    const cls = [!a && "info", miss && "miss", size && "amount", l.seat != null && l.seat === heroSeat && "hero"].filter(Boolean).join(" ");
    const flag = miss ? '<span class="hh-flag">not in our recording</span>'
      : size ? `<span class="hh-flag">we recorded ${ours.actions[size.oursAt]?.amount ?? "?"}bb</span>` : "";
    const who = l.position ? `${esc(l.position)}${l.seat != null ? ` <span class="sub">s${l.seat}</span>` : ""}` : "";
    return `<div class="tl-row hh-line ${cls}"><span class="who">${who}</span><span class="what">${esc(l.label)} ${hhDataHtml(l.data)}${a?.amountBb != null ? ` <span class="sub">${a.amountBb}bb</span>` : ""}</span>${flag}</div>`;
  };
  const extraHtml = (a) => `<div class="tl-row hh-line extra"><span class="who">seat ${a.seatId}</span><span class="what">${esc(a.type)}${a.amount != null ? ` ${a.amount}bb` : ""}</span><span class="hh-flag">only in our recording</span></div>`;
  return HH_STREETS.map((st) => {
    const lines = g.log.filter((l) => l.street === st && !HH_NOISE.test(l.label));
    const extra = extras.filter((a) => a.street === st);
    const board = hhBoardOn(g.board, st);
    return lines.length || extra.length
      ? `<div class="hh-street">${st}${board.length ? " " + cardsHtml(board) : ""}</div>${lines.map(lineHtml).join("")}${extra.map(extraHtml).join("")}` : "";
  }).join("");
}

function actualHtml(r, ours) {
  if (!r.ok) return `<div class="warn">${esc(r.error)}</div>${r.check?.checkedAt ? hhVerdictHtml(r.check) : ""}`;
  const g = r.ignition, diffs = r.check?.diffs ?? [];
  return `${hhVerdictHtml(r.check)}${hhOtherDiffsHtml(diffs)}
    <div class="sub" style="margin:6px 0">${esc(g.table)} · Ignition hand #${esc(r.handId)} · ${r.cached ? "saved copy" : "fetched now"}${r.fetchedAt ? " " + fmtT(Date.parse(r.fetchedAt)) : ""} · villains' cards show only when shown down
      <button class="mini" onclick="loadActual(true)">re-fetch</button></div>
    ${hhSeatsHtml(g)}${hhLogHtml(g, diffs, ours)}`;
}

async function loadActual(refresh = false) {
  const host = $("actual"), id = DETAIL?.clientHandId;
  if (!host) return;
  host.dataset.drawn = "1";
  if (!/^\d{10}$/.test(id ?? "")) { host.innerHTML = '<div class="sub">this hand has no Ignition hand number, so there is no hand history to check it against</div>'; return; }
  host.innerHTML = '<div class="sub">asking Ignition…</div>';
  const r = await fetch(`/api/ignition-hh/${id}${refresh ? "?refresh=1" : ""}`).then((x) => x.json()).catch((e) => ({ ok: false, error: String(e?.message ?? e) }));
  if (DETAIL?.clientHandId === id && $("actual") === host) host.innerHTML = actualHtml(r, DETAIL.hand);
}

/* ---- one logged answer as a card: verdict → strategy mix → provenance ---- */
const verbClass = (label) => { const s = String(label ?? "").toLowerCase(); return s.startsWith("fold") ? "fold" : s.startsWith("check") ? "check" : s.startsWith("call") || s.startsWith("limp") ? "call" : s.startsWith("bet") ? "bet" : s.startsWith("raise") || s.startsWith("all") ? "raise" : ""; };
const fmtLatency = (ms) => ms == null ? "" : ms >= 1000 ? `${(ms / 1000).toFixed(1)} s` : `${ms} ms`;
/* ---- hover popover for every 13x13 grid: the cell's action split as bars ----
   Cells carry their mix in `title` ("AQo: Raise 2.5 60% · Fold 40%"); the

(function gridTip() {
  const tip = document.createElement("div"); tip.id = "gridtip"; document.body.appendChild(tip);
  const cellOf = (e) => e.target && e.target.closest ? e.target.closest(".grid169 > div") : null;
  const render = (raw) => {

    // "MES Raise 2 · chart Fold 55%, Raise 2 45%" (playthrough preflop) or "Fold 55% · Raise 2 45% (0.12bb)"
    let pre = "";
    let text = body;
    const mesPick = text.match(/^MES\s+(.+?)\s+·\s+chart\s+/);

      rows.map((r, i) => r.pct == null ? `<div class="note">${esc(r.label)}</div>` :
        `<div class="r"><div><div class="lab"><span>${esc(r.label)}</span>${r.ev ? `<span class="sub">${esc(r.ev)}</span>` : ""}</div><div class="bar"><i style="width:${Math.min(100, 100 * r.pct / total).toFixed(1)}%;background:${colorFor(r.label, i)}"></i></div></div><div class="pct">${r.pct}%</div></div>`).join("");
  };
  const place = (e) => { const x = Math.min(window.innerWidth - tip.offsetWidth - 12, e.clientX + 14), y = e.clientY + 16 + tip.offsetHeight > window.innerHeight ? e.clientY - tip.offsetHeight - 10 : e.clientY + 16; tip.style.left = `${Math.max(4, x)}px`; tip.style.top = `${Math.max(4, y)}px`; };

  document.addEventListener("mouseout", (e) => { const c = cellOf(e); if (c && !(e.relatedTarget && c.contains(e.relatedTarget))) tip.style.display = "none"; });

/* ---- click-in card picker: cpMount(containerId, { need, used, onDone, label, value })
   draws 4 suit rows x 13 ranks (like the analysis app / GTO Wizard); cards
   already out are dimmed; picking `need` cards calls onDone(["Ah","Qs"]). A set
   value collapses to chips + "change". Delegated clicks, no per-render wiring. ---- */
const CP = {};
const CP_RANKS = "AKQJT98765432", CP_SUITS = [["s", "♠", false], ["h", "♥", true], ["d", "♦", true], ["c", "♣", false]];
function cpMount(id, o) {
  CP[id] = { need: o.need, used: new Set(o.used || []), sel: [], onDone: o.onDone, label: o.label || "", value: o.value || null, open: !(o.value && o.value.length), hint: o.hint || "" };
  cpDraw(id);
}
function cpDraw(id) {
  const p = CP[id], el = $(id); if (!p || !el) return;
  const red = (c) => c[1] === "h" || c[1] === "d";
  const chip = (c) => `<span class="cp-chip ${red(c) ? "red" : ""}">${esc(c[0])}${CP_SUITS.find((s) => s[0] === c[1])?.[1] ?? ""}</span>`;
  if (!p.open && p.value && p.value.length) {
    el.innerHTML = `<span class="cp-done">${p.label ? `<span class="sub">${esc(p.label)}</span>` : ""}${p.value.map(chip).join(" ")}<button class="mini" onclick="CP['${id}'].open=true;CP['${id}'].sel=[];cpDraw('${id}')">change</button></span>`;
    return;
  }
  const slots = []; for (let i = 0; i < p.need; i++) slots.push(p.sel[i] ? chip(p.sel[i]) : `<span class="cp-chip slot">${i === p.sel.length ? "pick" : "·"}</span>`);
  el.innerHTML = `<div class="cardpicker" data-cp="${id}">
    <div class="cp-head">${p.label ? `<span class="sub">${esc(p.label)}</span>` : ""}${slots.join(" ")}${p.sel.length ? `<button class="mini" onclick="CP['${id}'].sel=[];cpDraw('${id}')">clear</button>` : ""}${p.value && p.value.length ? `<button class="mini" onclick="CP['${id}'].open=false;cpDraw('${id}')">keep ${p.value.join("")}</button>` : ""}${p.hint ? `<span class="sub">${esc(p.hint)}</span>` : ""}</div>
    ${CP_SUITS.map(([s, sym, isRed]) => `<div class="cp-row">${[...CP_RANKS].map((r) => { const c = r + s; const used = p.used.has(c) && !p.sel.includes(c); const sel = p.sel.includes(c); return `<button class="cp-card ${isRed ? "red" : ""} ${sel ? "sel" : ""} ${used ? "used" : ""}" data-card="${c}" ${used ? "disabled" : ""}>${r}${sym}</button>`; }).join("")}</div>`).join("")}
  </div>`;
}
document.addEventListener("click", (e) => {
  const b = e.target && e.target.closest ? e.target.closest(".cp-card[data-card]") : null; if (!b) return;
  const host = b.closest("[data-cp]"); const id = host && host.dataset.cp; const p = CP[id]; if (!p) return;
  const c = b.dataset.card;
  if (p.sel.includes(c)) { p.sel = p.sel.filter((x) => x !== c); cpDraw(id); return; }
  if (p.used.has(c) || p.sel.length >= p.need) return;
  p.sel.push(c);
  if (p.sel.length === p.need) { const cards = p.sel.slice(); p.value = cards; p.sel = []; p.open = false; cpDraw(id); p.onDone(cards); }
  else cpDraw(id);
});
const cpUsed = () => [...((PT.board && PT.free && PT.free.board.length ? PT.free.board : (PT.board || "").match(/[2-9TJQKA][shdc]/g) || [])), ...((PT.combo || "").match(/[2-9TJQKA][shdc]/g) || [])];

/* ---- GTO Wizard AI client watch: the postflop fallback for everything the MES
   overlay does not cover. Down = a page-covering alert with a Connect button
   (POST /api/dashboard/gtow-connect launches the client with its debug port and
   waits for a token). Snooze hides it for 10 minutes behind a red pill. ---- */
const GTOW = { st: null, snoozeUntil: 0, connecting: false, busy: {}, timer: null, panelOpen: false };
const isGtowDownReason = (r) => /No access token|CDP on 92\d\d|Client unreachable|GTO Wizard|debug port|daily solution limit/i.test(String(r ?? ""));
(function gtowWatch() {
  const ov = document.createElement("div"); ov.id = "gtow-down";
  ov.innerHTML = `<div class="box"><h1>🔌 No GTO Wizard session is connected</h1>
    <p><b>Every postflop spot the MES overlay does not cover has no answer right now.</b> The AI chain is the fallback for all of postflop — off-family lines, off-tree sizes, rivers, and every spot in GTO mode — so until a session is back those spots fail at the table and in the playthrough.</p>
    <p id="gtow-why" class="sub"></p>
    <div class="row"><button class="big" id="gtow-connect" onclick="gtowConnect()">Connect GTO Wizard</button><button class="mini" onclick="gtowSnooze()">keep working, remind me in 10 min</button></div>
    <div class="st" id="gtow-st"></div>
    <p class="sub" style="margin-top:10px">Connect launches each session with its debug port and waits for a token (up to a minute). A session that comes up on its activation or sign-in screen needs you to type the code in its own window — it is never restarted from here.</p></div>`;
  document.body.appendChild(ov);
  const pill = document.createElement("div"); pill.id = "gtow-pill"; pill.title = "GTO Wizard sessions — the postflop fallback for every spot the MES overlay does not cover. Click for the per-session breakdown.";
  document.body.appendChild(pill);
  const panel = document.createElement("div"); panel.id = "gtow-panel";
  document.body.appendChild(panel);
  gtowPoll(); GTOW.timer = setInterval(() => whenVisible("gtow", gtowPoll), 20000);
})();
async function gtowPoll() {
  try { GTOW.st = await (await fetch("/api/dashboard/gtow-status")).json(); } catch { GTOW.st = null; }
  gtowRender();
}
/** Minutes left on a token, or null. */
const gtowMins = (ms) => ms != null ? Math.max(0, Math.round(ms / 60000)) : null;

function gtowRender() {
  const st = GTOW.st; const ov = $("gtow-down"), pill = $("gtow-pill"), panel = $("gtow-panel");
  if (!ov) return;
  const down = st && !st.usable;
  const snoozed = Date.now() < GTOW.snoozeUntil;
  ov.classList.toggle("on", !!down && !snoozed && !GTOW.connecting ? true : !!down && GTOW.connecting);

  // DEGRADED is its own state, and it is the one that would otherwise be
  // invisible: sessions are live so nothing looks broken, but none of them can
  // solve a 3+ player tree, so every multiway spot silently has no answer.
  const sessions = st?.sessions ?? [];
  const enabled = sessions.filter((x) => x.enabled);
  const live = sessions.filter((x) => x.state === "up");
  const degraded = !!st && st.usable && !st.multiwayUsable;
  const mins = gtowMins(st?.expiresInMs);
  pill.className = !st ? "" : st.state === "up" ? (degraded ? "degraded" : "up") : st.state === "no-token" ? "notoken" : "down";
  pill.innerHTML = GTOW.connecting ? `<span class="dot warn"></span>GTO Wizard · connecting…`
    : !st ? `<span class="dot off"></span>GTO Wizard · status unknown (API?)`
    : st.state === "up" && degraded ? `<span class="dot warn"></span>GTO Wizard · ${live.length}/${enabled.length} · no multiway`
    : st.state === "up" ? `<span class="dot good"></span>GTO Wizard · ${live.length}/${enabled.length} live${mins != null ? ` · ${mins} min` : ""}`
    : st.state === "no-token" ? `<span class="dot warn"></span>GTO Wizard · up, no token <button class="act" onclick="event.stopPropagation();gtowConnect()">retry</button>`
    : `<span class="dot crit"></span>GTO Wizard · DOWN <button class="act" onclick="event.stopPropagation();gtowConnect()">connect</button>`;
  pill.onclick = () => { GTOW.panelOpen = !GTOW.panelOpen; if (GTOW.panelOpen) gtowPoll(); else gtowRender(); };

  // ---- the per-session panel: one row per account, each with its own state,
  // its own capability and its own Connect ----
  panel.classList.toggle("on", GTOW.panelOpen);
  if (GTOW.panelOpen) {
    const dotOf = (x) => x.state === "up" ? "good" : (x.state === "blocked" || x.state === "no-token" || x.state === "unknown") ? "warn" : x.state === "off" ? "off" : "crit";
    const rows = sessions.map((x) => {
      const cls = x.state === "up" ? "" : x.state === "down" ? " bad" : " warn";
      const busy = !!GTOW.busy[x.id];
      return `<div class="gs">
        <div class="hd"><span class="dot ${dotOf(x)}"></span>${esc(x.label)}
          <span class="cap${x.multiway ? " mw" : ""}" title="${x.multiway ? "this account's AI can solve 3+ player trees" : "this account's AI is heads-up only — multiway trees go to the other session"}">${x.multiway ? "multiway" : "heads-up"}</span></div>
        <div class="txt${cls}">${esc(x.text)} · <span class="mono">${esc(x.cdpHost)}</span>${x.trees ? ` · ${x.trees} solve${x.trees === 1 ? "" : "s"} this run` : ""}</div>
        ${x.lastError && x.state !== "up" ? `<div class="txt bad">${esc(String(x.lastError).slice(0, 160))}</div>` : ""}
        <div class="acts">
          <button ${busy ? "disabled" : ""} onclick="gtowConnect('${x.id}')">${busy ? "working…" : x.state === "up" ? "Reconnect" : "Connect"}</button>
          ${(x.blockedKind || x.multiwayRefused) ? `<button class="ghost" ${busy ? "disabled" : ""} onclick="gtowReset('${x.id}')" title="forget the quota wall or plan refusal we recorded, and offer this session work again">Clear wall</button>` : ""}
        </div>
      </div>`;
    }).join("");
    const note = degraded
      ? `<div class="note"><b>No multiway session.</b> 3+ player spots cannot be solved right now — only the Ultra account's AI accepts a 3-player tree. Heads-up spots are unaffected.</div>`

function setStep(n) {

  const lines = $("feed-sync").querySelectorAll("[data-fl]");

}

const weightGrid = (agg, heroKey, hue, combos = null, heroCombo = null, board = null) => {
  const cls = {}; for (const k in agg) cls[k] = { w: agg[k].w, acts: [agg[k].w] };
  const mass = Object.values(agg).reduce((s, x) => s + x.w, 0);
  return classGrid(cls, ["in range"], heroKey, { single: hue, small: true, board, foot: `${mass.toFixed(1)} combos · fill height = share of the class still in range`, heroCombo, ...(combos ? { combos } : {}) });

/* ---- an AI-chain answer's inputs & outputs, inline on its card ----

      <div class="walk-grids">
        <div class="card"><h2>OOP range entering this node <span class="sub">${esc((n.players ?? [sp.oopPos, sp.ipPos])[0])}</span></h2>${weightGrid(n.rangesIn.oop, (n.heroSeatLabel ?? sp.heroSeat) === "oop" ? heroKey : null, "var(--oop)", n.rangesInCombos?.oop, sp.heroCombo, n.board)}</div>
        ${n.rangesIn.mid ? `<div class="card"><h2>OOP+1 range entering this node <span class="sub">${esc((n.players ?? [sp.oopPos, sp.ipPos])[1])} · middle seat</span></h2>${weightGrid(n.rangesIn.mid, (n.heroSeatLabel ?? sp.heroSeat) === "mid" ? heroKey : null, "var(--oop)", n.rangesInCombos?.mid, sp.heroCombo, n.board)}</div>` : ""}
        <div class="card"><h2>IP range entering this node <span class="sub">${esc((n.players ?? [sp.oopPos, sp.ipPos])[(n.players ?? [sp.oopPos, sp.ipPos]).length - 1])}</span></h2>${weightGrid(n.rangesIn.ip, (n.heroSeatLabel ?? sp.heroSeat) === "ip" ? heroKey : null, "var(--ip)", n.rangesInCombos?.ip, sp.heroCombo, n.board)}</div>

      <div class="card" style="margin-top:12px"><h2>${esc(n.actorPos)}'s strategy at this node <span class="sub">— what the solve says the whole range does here${n.taken != null ? `; the observed action was <b style="color:#fff">${esc(n.takenName)}</b>` : ""}</span></h2>
        ${classGrid(stratCls, labels, isHeroActor ? heroKey : null, { combos: n.actorCombos, board: n.board, heroCombo: sp.heroCombo, foot: isHeroActor ? "your class outlined · hover for the mix" : "villain's range · hover for the mix" })}
        ${hero ? `<div class="nv-hero"><span class="big">${esc(sp.heroCombo ?? "")}</span> <span class="sub">${n.heroNode ? "the answer:" : "the solve has you playing"}</span> ${hero.filter((x) => x.p > 0.5).sort((a, b) => b.p - a.p).map((x) => `<b>${esc(x.name)}${x.betsize != null && !/\d/.test(x.name) ? ` ${x.betsize}` : ""}</b> ${x.p}%${x.ev != null ? ` <span class="sub">ev ${x.ev}</span>` : ""}`).join(" · ")}${n.heroWeightIn != null ? ` <span class="sub">· weight in range ${n.heroWeightIn}</span>` : ""}</div>` : ""}
      </div>
      ${n.rangesOut ? `<div class="card" style="margin-top:12px"><h2>After conditioning on ${esc(n.takenName)} <span class="sub">— ${esc(n.actorPos)}'s range × the frequency of that action, combo by combo; this is what the next node sees</span></h2>
        <div class="walk-grids"><div>${weightGrid(n.rangesOut.oop, (n.heroSeatLabel ?? sp.heroSeat) === "oop" ? heroKey : null, "var(--oop)", null, sp.heroCombo, n.board)}</div><div>${weightGrid(n.rangesOut.ip, (n.heroSeatLabel ?? sp.heroSeat) === "ip" ? heroKey : null, "var(--ip)", null, sp.heroCombo, n.board)}</div></div></div>` : ""}
    </div>`;
  };
  host.innerHTML = `${facts}${sentBlock(w, hostId === "walk-host")}<div class="walk"><div class="walk-list" id="walk-list">${list()}</div><div id="walk-view">${view()}</div></div>`;
  const bind = () => host.querySelectorAll(".walk-node").forEach((el) => el.onclick = () => {
    sel = Number(el.dataset.i);
    $("walk-list").innerHTML = list(); $("walk-view").innerHTML = view(); bind();
    // keep the table replica on the same moment
    const n = w.nodes[sel];
    if (upto != null && DETAIL?.hand) setStep(n.heroNode ? upto : (postIdx[sel] ?? upto));
  });
  bind();
}
const classOfCardsJs = (cards) => {
  const cs = (cards || []).filter((c) => /^[2-9TJQKA][shdc]$/.test(c));
  if (cs.length !== 2) return null;
  const i1 = RANKS.indexOf(cs[0][0]), i2 = RANKS.indexOf(cs[1][0]);
  if (i1 === i2) return cs[0][0] + cs[1][0];
  return RANKS[Math.min(i1, i2)] + RANKS[Math.max(i1, i2)] + (cs[0][1] === cs[1][1] ? "s" : "o");
};

/* ---- live solve vs re-solve, node by node ---- */
async function renderCompare(aId, bId, hostId) {
  const host = $(hostId);
  host.innerHTML = `<div class="card sub" style="margin-top:10px">comparing #${aId} with #${bId}…</div>`;
  let c;
  try { c = await (await fetch(`/api/dashboard/solve-compare?a=${aId}&b=${bId}`)).json(); } catch (e) { host.innerHTML = `<div class="card warn">${esc(String(e))}</div>`; return; }
  if (!c.ok) { host.innerHTML = `<div class="card warn">${esc(c.error)}</div>`; return; }
  const s = c.summary;
  const flag = s.flag === "discrepancy" ? '<span class="chip crit">discrepancy</span>' : s.flag === "minor drift" ? '<span class="chip warn">minor drift</span>' : s.flag === "same" ? '<span class="chip good">same answer</span>' : `<span class="chip dim">${esc(s.flag)}</span>`;
  const d = (x) => x == null ? "—" : `<span class="${x > 0 ? "diff-pos" : x < 0 ? "diff-neg" : ""}">${x > 0 ? "+" : ""}${x}</span>`;
  const rows = c.nodes.map((n) => n.missingInB
    ? `<tr class="src-static"><td>${esc(n.street)} ${esc(n.codes.join("-") || "root")}</td><td colspan="6" class="warn">not reached by the re-solve</td></tr>`
    : n.actions.map((x, i) => `<tr class="src-static">${i === 0 ? `<td rowspan="${n.actions.length}"><b>${esc(n.street)}</b> ${esc(n.codes.join("-") || "root")}<div class="sub">${esc(n.actorPos)}${n.heroNode ? " ★ you" : ""}${n.takenName ? ` · took ${esc(n.takenName)}` : ""}</div><div class="sub">ranges in: Δ OOP ${n.rangeTv.oop} · IP ${n.rangeTv.ip}</div></td>` : ""}
        <td>${esc(x.name)}${x.betsize != null && !/\d/.test(x.name) ? ` ${x.betsize}` : ""}</td>
        <td class="num">${x.overallA ?? "—"}</td><td class="num">${x.overallB ?? "—"}</td>
        <td class="num">${x.heroA ?? "—"}</td><td class="num">${x.heroB ?? "—"}</td><td class="num">${d(x.heroDiff)}</td></tr>`).join("")).join("");
  host.innerHTML = `<div class="card" style="margin-top:12px"><h2>Live solve #${aId} vs re-solve #${bId} ${flag}</h2>
    <div class="nv-facts">
      ${fact("your decision", s.heroMaxDiffPts != null ? `largest change in your mix: <b>${s.heroMaxDiffPts} pts</b>` : "no matching hero node")}
      ${fact("cloud solutions", s.solIdsSame ? "identical solution ids — the same trees were served" : "different solution ids — the trees were solved again")}
      ${fact("ranges", s.rangesSame ? "identical ranges at every node" : "ranges differ somewhere — see Δ per node (total variation, 0 = same)")}
      ${fact("stored", `live ${fmtT(c.a.ts)} · replay ${fmtT(c.b.ts)}`)}
    </div>
    <div class="scroll"><table class="diff-tbl"><thead><tr><th>node</th><th>action</th><th class="num">range % live</th><th class="num">range % now</th><th class="num">you % live</th><th class="num">you % now</th><th class="num">Δ you</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="sub" style="margin-top:6px">"range %" is how much of the actor's whole range takes the action; "you %" is your combo's frequency. A discrepancy of 5 points or more in your mix is flagged.</div></div>`;
}

// action colours = GTO Wizard's (see GWPAL above); the raise shades rank by size within the node's labels
const ACT_COLORS = [GWPAL.fold, GWPAL.call, ...GWPAL.raise];
const colorFor = (label, i, labels) => labels ? gtowColor(label, labels) : (actKind(label) === "fold" ? GWPAL.fold : actKind(label) === "call" ? GWPAL.call : actKind(label) === "allin" ? GWPAL.allin : GWPAL.raise[Math.min(Math.max(i - 2, 0), GWPAL.raise.length - 1)]);
const RANKS = "AKQJT98765432";

async function solveNode(dbId, upto, btn) {
  // The ONLY postflop solver on the dashboard is the live answer chain
  // (services/aiChain.ts via POST /resolve-chain): same ranges, same pinned
  // sizes, same conditioning as the answer at the table, and every run is
  // stored and walkable. (The old AI-study route is SolverStudy's, not ours.)
  setStep(upto);
  const sol = $("solution");
  sol.innerHTML = `<div class="card"><span class="warn">re-solving this node through the live chain… fresh streets take a few seconds</span></div>`;
  if (btn) { btn.disabled = true; btn.textContent = "solving…"; }
  let r;
  try {
    r = await (await fetch("/api/dashboard/resolve-chain", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ dbId, upto }) })).json();
  } catch (e) { r = { ok: false, error: String(e) }; }
  if (btn) { btn.disabled = false; btn.textContent = "▶ solve (live chain)"; }
  if (!r.ok) { sol.innerHTML = `<div class="card warn">solve failed: ${esc(r.error ?? "unknown")}</div>`; return; }
  if (r.tier !== "ai-chain" || r.solveId == null) {
    sol.innerHTML = `<div class="card"><h2>Re-solve at action ${upto}</h2><div class="sub">The live path answered this node from <b>${esc(r.tier ?? r.source ?? "another tier")}</b>, not the AI chain, so there is no chain trace to walk.${r.warning ? ` ⚠ ${esc(r.warning)}` : ""}</div>
      <div class="ans-verdict" style="margin-top:8px"><span class="ans-pick ${verbClass(r.decision?.action)}">${esc((r.decision?.action ?? "").toUpperCase())}</span><span class="ans-how">${(r.actions || []).map((a) => `${esc(a.action)} ${Math.round(a.frequency)}%`).join(" · ")}</span></div>
      <div class="sub" style="margin-top:8px"><a class="ev-link" href="/hands/${dbId}/node/${upto}" onclick="go('/hands/${dbId}/node/${upto}');return false">open the exact node it used ↗</a></div></div>`;
    return;
  }
  sol.innerHTML = `<div class="card"><h2>Live-chain re-solve at action ${upto} <span class="sub">— stored as replay #${r.solveId}; every node below is walkable</span></h2><div id="walk-host"></div></div>`;
  renderWalkthrough(r.solveId, "walk-host", upto);
  sol.scrollIntoView({ behavior: "smooth", block: "start" });
}

/* ================= Home =================
   The landing page: how the money is going, for ONE account over ONE recent
   window, and whether the machinery that answers a spot is up right now.

   It reads the same /analytics payload Analytics does — same aggregate, same
   series, so the two can never disagree — narrowed by `profile` and `window`
   instead of a scope. What it does differently is FIT: six tiles beside a short
   chart, so the whole picture is above the fold at a laptop height and the rest
   (sessions, positions) is a scroll away rather than a hunt. Whatever is on a
   tile here is on Analytics too; Analytics is where the other six tiles, the
   comparison line and the breakdown tables live.

   The window is RELATIVE (`window=7d`, not a frozen date range), so a bookmark
   or a pinned tab still means "the last seven days" tomorrow. Both controls
   live in the URL, and the Home tab remembers the last pair you looked at. */
let HOME = { profile: "all", window: "7d", data: null, health: null, liveBal: null };
const HM_WINDOWS = [["1d", "24h"], ["7d", "7 days"], ["14d", "2 weeks"], ["30d", "1 month"], ["all", "All time"]];
const hmQuery = (profile, win) => {
  const q = new URLSearchParams();
  if (profile && profile !== "all") q.set("profile", profile);

  const t = q.toString();
  return t ? `?${t}` : "";
};
const hmGo = (profile, win) => go("/" + hmQuery(profile, win));
const hmAgo = (ms) => ms == null ? "never" : fmtAgo(ms);

/** `quiet` is the background tick: keep whatever is on screen if a fetch fails,
 *  and never flash a loading card over a page that is already good. */
async function loadHome(opt = {}) {
  const v = $("view-home");
  HOME.profile = PATH.profile || "all";
  HOME.window = PATH.window || "7d";
  if (!opt.quiet && !v.querySelector(".hm-head")) v.innerHTML = '<div class="card sub">loading…</div>';
  const q = new URLSearchParams();
  if (HOME.profile !== "all") q.set("profile", HOME.profile);
  q.set("window", HOME.window);
  let j, h = null;
  try { j = await (await fetch(`/api/dashboard/analytics?${q}`)).json(); } catch (e) { if (!opt.quiet) v.innerHTML = '<div class="card warn">the dashboard API is not answering</div>'; return; }
  if (!j.ok) { if (!opt.quiet) v.innerHTML = '<div class="card warn">analytics unavailable</div>'; return; }
  try { const r = await (await fetch("/api/dashboard/health")).json(); h = r && r.ok ? r : null; } catch { h = null; }
  // the balance is a READING, not a running total: scrape the client now and
  // keep the stored snapshot only as the fallback for when it is shut
  try { const r = await (await fetch("/api/dashboard/balance-live")).json(); HOME.liveBal = r && r.ok ? r : null; } catch { HOME.liveBal = null; }
  if (PATH.view !== "home") return; // navigated away while the fetches were in flight
  HOME.data = j; HOME.health = h;
  pollWhilePending(j, "home", () => loadHome({ quiet: true }));
  v.innerHTML = hmRender(j, h);
  hmWire(v);
  // the series is the scope's, but on Home the scope is always "all" — label the
  // line with what actually picked these hands
  const profLabel = HOME.profile === "all" ? "All accounts" : HOME.profile === "none" ? "Unattributed" : HOME.profile;
  const winLabel = (HM_WINDOWS.find(([id]) => id === HOME.window) ?? ["all", "All time"])[1];
  anDrawChart({ ...j.primary, label: `${profLabel} · ${winLabel}` }, null, { slot: "homeChart", canvas: "hm-canvas", legend: "hm-legend" });
}
