<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Dashboard</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0e1116; color: #dfe6ee; font: 13px/1.45 "Segoe UI", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 18px; padding: 10px 16px; background: #151a22; border-bottom: 1px solid #232b37; position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 15px; margin: 0; letter-spacing: .4px; }
  .tabs button { background: none; border: none; color: #8fa1b6; font: inherit; padding: 6px 10px; cursor: pointer; border-bottom: 2px solid transparent; }
  .tabs button.on { color: #fff; border-color: #4da3ff; }
  main { padding: 14px 16px 60px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 4px 8px; text-align: left; white-space: nowrap; }
  thead th { color: #8fa1b6; font-weight: 600; border-bottom: 1px solid #232b37; background: transparent; }
  /* only the main hands table pins its header under the app bar; a table
     inside a card must not (the pinned header floated over its first row) */
  #view-hands thead th { position: sticky; top: 44px; background: #0e1116; cursor: pointer; }
  tbody tr { border-bottom: 1px solid #1a212c; cursor: pointer; }
  tbody tr:hover { background: #161d28; }
  .pos, .neg { font-variant-numeric: tabular-nums; }
  .pos { color: #61d095; } .neg { color: #ff7373; }
  .badge { display: inline-block; padding: 0 6px; border-radius: 8px; font-size: 11px; margin-right: 3px; }
  .b-major { background: #57222a; color: #ff9a9a; } .b-minor { background: #4d3d1e; color: #ffce56; } .b-info { background: #1e3247; color: #9ecbff; }
  .card { background: #151a22; border: 1px solid #232b37; border-radius: 8px; padding: 12px 14px; margin: 12px 0; }
  .card h2 { margin: 0 0 8px; font-size: 13px; color: #9db1c7; text-transform: uppercase; letter-spacing: .6px; }
  .cardsuit { font-weight: 700; }
  .red { color: #ff7d7d; } .blk { color: #cfd8e3; }
  .mini { background: #1d2836; border: 1px solid #2c3a4d; color: #cfe0f2; border-radius: 5px; padding: 2px 8px; font-size: 11px; cursor: pointer; }
  .mini:hover { background: #24344a; }
  .mini:disabled { opacity: .4; cursor: default; }
  .sub { color: #8fa1b6; font-size: 12px; }
  details { margin-top: 8px; } summary { cursor: pointer; color: #9db1c7; }
  pre { background: #10151d; padding: 8px; border-radius: 6px; overflow: auto; max-height: 280px; font-size: 11px; }
  .warn { color: #ffce56; }
  input[type=text] { background: #10151d; border: 1px solid #2c3a4d; color: inherit; border-radius: 5px; padding: 3px 8px; }
  /* ---- detail page ---- */
  .dt-top { display: flex; align-items: center; gap: 14px; margin-bottom: 4px; }
  .dt-grid { display: grid; grid-template-columns: minmax(560px, 1.15fr) minmax(340px, .85fr); gap: 14px; align-items: start; }
  @media (max-width: 1080px) { .dt-grid { grid-template-columns: 1fr; } }
  #mirror svg { width: 100%; height: auto; display: block; }
  .rp-controls { display: flex; gap: 8px; align-items: center; justify-content: center; margin-top: 8px; }
  .rp-controls button { background: #1d2836; border: 1px solid #2c3a4d; color: #dfe6ee; border-radius: 6px; padding: 4px 14px; font-size: 14px; cursor: pointer; }
  .rp-controls button:hover { background: #24344a; }
  #feed-sync { max-height: 430px; overflow: auto; font-size: 12px; line-height: 1.55; }
  #feed-sync div { padding: 1px 6px; border-radius: 4px; color: #55647a; }
  #feed-sync div.past { color: #c7d3e0; }
  #feed-sync div.now { background: #1c2f45; color: #fff; }
  .tl-row { display: flex; gap: 8px; align-items: center; padding: 3px 6px; border-radius: 5px; cursor: pointer; }
  .tl-row:nth-child(odd) { background: #10151d; }
  .tl-row.cur { background: #1c2f45; }
  .tl-row.hero .who { color: #7fc4ff; font-weight: 700; }
  .tl-row .who { width: 118px; color: #8fa1b6; }
  .tl-row .what { flex: 1; }
  .street-h { margin: 8px 0 3px; color: #9db1c7; font-weight: 700; }
  #grid { display: grid; grid-template-columns: repeat(13, 30px); gap: 2px; margin-top: 8px; }
  #grid div { width: 30px; height: 26px; font-size: 10px; display: flex; align-items: center; justify-content: center; border-radius: 3px; background: #10151d; color: #b9c6d6; }
  #grid div.hero { outline: 2px solid #ffd35c; z-index: 1; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; font-size: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .tiles { display: flex; flex-wrap: wrap; gap: 10px; }
  .tile { background: #151a22; border: 1px solid #232b37; border-radius: 8px; padding: 10px 16px; min-width: 110px; }
  .tile .v { font-size: 20px; font-weight: 700; } .tile .k { color: #8fa1b6; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
  .tile .s { color: #8fa1b6; font-size: 11px; }
  /* ---- Sources tab ---- */
  .mono { font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; font-size: 11.5px; }
  .num { font-variant-numeric: tabular-nums; }
  .armed { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .armed .cell { background: #151a22; border: 1px solid #232b37; border-radius: 8px; padding: 9px 12px; display: flex; flex-direction: column; gap: 3px; }
  .armed .k { color: #8fa1b6; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
  .armed .v { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 7px; }
  .armed .s { color: #8fa1b6; font-size: 11px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
  .dot.good { background: #61d095; } .dot.warn { background: #ffce56; } .dot.crit { background: #ff7373; } .dot.off { background: #3a4453; }
  .mode { display: inline-block; padding: 0 7px; border-radius: 8px; font-size: 11px; font-weight: 700; line-height: 17px; }
  .mode.mes { background: rgba(232,119,46,.18); color: #e8772e; }
  .mode.gto { background: rgba(59,139,216,.18); color: #3b8bd8; }
  .chip { display: inline-block; padding: 0 6px; border-radius: 8px; font-size: 11px; line-height: 17px; background: #1e3247; color: #9ecbff; margin-right: 3px; }
  .chip.warn { background: #4d3d1e; color: #ffce56; } .chip.crit { background: #57222a; color: #ff9a9a; }
  .chip.good { background: #1c3b2c; color: #61d095; } .chip.dim { background: #1a212c; color: #8fa1b6; }
  .sub-tabs { display: flex; gap: 4px; border-bottom: 1px solid #232b37; margin-bottom: 14px; }
  .sub-tabs button { background: none; border: none; color: #8fa1b6; font: inherit; padding: 7px 12px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .sub-tabs button.on { color: #fff; border-color: #4da3ff; }
  .sub-tabs .n { color: #8fa1b6; font-size: 11px; margin-left: 5px; }
  .pane { display: none; } .pane.on { display: block; }
  .banner { background: #1c2f45; border: 1px solid #2a4a6e; color: #cfe0f2; border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; font-size: 12px; }
  .banner b { color: #fff; }
  .reg { display: grid; grid-template-columns: repeat(auto-fill, minmax(410px, 1fr)); gap: 12px; }
  .src { background: #151a22; border: 1px solid #232b37; border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .src.click { cursor: pointer; } .src.click:hover { border-color: #2c3a4d; }
  .src .head { display: flex; align-items: center; gap: 8px; }
  .src .head h3 { margin: 0; font-size: 14px; flex: 1; }
  .src .tiers { display: flex; flex-wrap: wrap; gap: 4px; }
  .src dl { display: grid; grid-template-columns: 96px 1fr; gap: 3px 10px; margin: 0; font-size: 12px; }
  .src dt { color: #8fa1b6; } .src dd { margin: 0; white-space: normal; word-break: break-word; }
  .src .foot { display: flex; gap: 14px; align-items: baseline; border-top: 1px solid #232b37; padding-top: 8px; margin-top: 2px; }
  .src .foot .big { font-size: 18px; font-weight: 700; } .src .foot .k { color: #8fa1b6; font-size: 11px; }
  .src .caveat { color: #ffce56; font-size: 12px; }
  .spark { display: inline-flex; align-items: flex-end; gap: 2px; height: 22px; margin-left: auto; }
  .spark i { display: block; width: 4px; background: #2f78bd; border-radius: 2px 2px 0 0; min-height: 1px; }
  .spark i.m { background: #cf6a24; }
  .scroll { overflow-x: auto; }
  .ev { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; border-radius: 4px; }
  .ev.p { background: rgba(97,208,149,.14); color: #61d095; } .ev.n { background: rgba(255,115,115,.14); color: #ff7373; }
  .ev.z { background: rgba(143,161,182,.10); color: #8fa1b6; font-weight: 400; }
  .ev .se { color: #8fa1b6; font-weight: 400; font-size: 11px; }
  .row-group td { background: #10151d; color: #9db1c7; font-weight: 700; font-size: 11.5px; text-transform: uppercase; letter-spacing: .5px; cursor: default; }
  .reuse { border-left: 2px dashed #2c3a4d; }
  .ev-link { color: #4da3ff; text-decoration: none; font-size: 11.5px; } .ev-link:hover { text-decoration: underline; }
  .bar { display: flex; height: 10px; border-radius: 3px; overflow: hidden; gap: 2px; background: #0e1116; width: 180px; }
  .bar i { display: block; } .bar .agree { background: #3a4453; } .bar .mes { background: #cf6a24; } .bar .gto { background: #2f78bd; } .bar .unk { background: #1a212c; }
  .g2 { display: grid; grid-template-columns: 1.1fr .9fr; gap: 12px; }
  @media (max-width: 1000px) { .g2 { grid-template-columns: 1fr; } }
  .reach { display: inline-flex; align-items: center; gap: 8px; }
  .reach i { display: block; height: 8px; background: #2f78bd; border-radius: 2px; } .reach i.built { background: #cf6a24; }
  .st { display: inline-flex; align-items: center; gap: 6px; }
  .src-static tr { cursor: default; }
  /* the hands table's sticky header must not float over the panes' own tables */
  #view-sources thead th { position: static; cursor: default; background: transparent; }
  #view-sources td { white-space: normal; }
  #view-sources td.num, #view-sources td.ev, #view-sources td.mono { white-space: nowrap; }
  #src-matrix td:last-child { min-width: 300px; }
  .src-dl { display: grid; grid-template-columns: 110px 1fr; gap: 4px 12px; margin: 0; font-size: 12.5px; }
  .src-dl dt { color: #8fa1b6; } .src-dl dd { margin: 0; white-space: normal; word-break: break-word; }
  /* hand detail: logged answers as structured cards (verdict → mix → provenance) */
  .ans { display: grid; grid-template-columns: 150px 1fr; gap: 6px 16px; background: #10151d; border: 1px solid #1f2936; border-radius: 8px; padding: 10px 12px; margin: 8px 0; }
  .ans.compact { grid-template-columns: 130px 1fr; padding: 8px 10px; margin: 2px 0 8px 12px; border-left: 3px solid #2c3a4d; }
  .ans.failed { border-color: #57222a; }
  .ans-where { display: flex; flex-direction: column; gap: 3px; }
  .ans-street { font-size: 11px; letter-spacing: .6px; text-transform: uppercase; color: #9db1c7; font-weight: 700; }
  .ans-node { color: #8fa1b6; font-size: 11.5px; }
  .ans-lat { color: #55647a; font-size: 11px; }
  .ans-main { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
  .ans-verdict { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .ans-pick { font-size: 18px; font-weight: 800; letter-spacing: .3px; color: #fff; }
  .ans-pick.fold { color: #8fb3e6; } .ans-pick.call, .ans-pick.check { color: #61d095; } .ans-pick.bet, .ans-pick.raise { color: #ffb454; }
  .ans-how { color: #8fa1b6; font-size: 12px; }
  .ans-approx { display: inline-flex; align-items: center; gap: 4px; background: #4d3d1e; color: #ffce56; border-radius: 8px; padding: 0 7px; font-size: 11px; line-height: 17px; cursor: help; }
  .mix { display: flex; flex-direction: column; gap: 4px; max-width: 520px; }
  .mix-bar { position: relative; display: flex; height: 12px; border-radius: 3px; overflow: visible; gap: 2px; margin-top: 16px; }
  .mix-bar i { display: block; height: 100%; border-radius: 3px; opacity: .55; }
  .mix-bar i.picked { opacity: 1; box-shadow: 0 0 0 1px #0e1116 inset; }
  .mix-bar .roll { position: absolute; top: -4px; width: 2px; height: 20px; background: #fff; border-radius: 1px; }
  .mix-bar .roll::after { content: attr(data-roll); position: absolute; top: -13px; left: 50%; transform: translateX(-50%); font-size: 10px; color: #dfe6ee; white-space: nowrap; }
  .mix-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: #c7d3e0; }
  .mix-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .mix-legend .sw { width: 10px; height: 10px; border-radius: 2px; }
  .mix-legend b { font-variant-numeric: tabular-nums; }
  .prov { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 5px 14px; font-size: 12px; }
  .prov .f { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .prov .k { color: #8fa1b6; font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; }
  .prov .v { color: #dfe6ee; overflow-wrap: anywhere; }
  .prov .v a { color: #4da3ff; text-decoration: none; } .prov .v a:hover { text-decoration: underline; }
  .prov .v .mono { font-size: 11px; color: #b9c6d6; }
  .picks { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .picks .pk { display: inline-flex; align-items: center; gap: 5px; border-radius: 6px; padding: 1px 7px; font-weight: 700; }
  .picks .pk.mes { background: rgba(232,119,46,.16); color: #ffb98a; } .picks .pk.gto { background: rgba(59,139,216,.16); color: #9ecbff; }
  .picks .pk small { font-weight: 400; opacity: .8; font-size: 10px; }
  .ans-note { color: #ffce56; font-size: 12px; }
  .ans-none { display: flex; align-items: center; gap: 8px; margin: 2px 0 8px 12px; padding: 6px 10px; border-left: 3px solid #2c3a4d; color: #55647a; font-style: italic; font-size: 12px; }
  .ans-fail { color: #ff9a9a; font-weight: 600; }
  /* node viewer (the exact chart / MES node behind an answer) */
  .grid169 { display: grid; grid-template-columns: repeat(13, 30px); gap: 2px; margin-top: 8px; }
  .grid169 div { width: 30px; height: 26px; font-size: 10px; display: flex; align-items: center; justify-content: center; border-radius: 3px; background: #10151d; color: #b9c6d6; }
  .grid169 div.hero { outline: 2px solid #ffd35c; z-index: 1; }
  .nv-head { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; margin-bottom: 8px; }
  .nv-crumb { display: inline-flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .nv-crumb span { background: #1d2836; border: 1px solid #2c3a4d; border-radius: 5px; padding: 1px 8px; font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; font-size: 11.5px; }
  .nv-crumb span.snap { border-color: #ffce56; color: #ffce56; }
  .nv-crumb .sep { background: none; border: none; color: #55647a; padding: 0; }
  .nv-two { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 14px; }
  .nv-facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 5px 14px; font-size: 12px; margin: 6px 0 10px; }
  .nv-facts .f { display: flex; flex-direction: column; gap: 1px; }
  .nv-facts .k { color: #8fa1b6; font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; }
  .nv-facts .v { color: #dfe6ee; }
  .nv-hero { background: #1c3550; border: 1px solid #3f6d9e; border-radius: 8px; padding: 8px 12px; margin-top: 8px; }
  .nv-hero .big { font-size: 15px; font-weight: 700; color: #fff; }
  /* miss queue */
  .mq-ctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0 10px; }
  .mq-ctl select { background: #1d2836; border: 1px solid #2c3a4d; color: #cfe0f2; border-radius: 5px; padding: 2px 6px; font-size: 11.5px; }
  .mq-kind { display: inline-block; padding: 0 7px; border-radius: 8px; font-size: 11px; line-height: 17px; font-weight: 700; white-space: nowrap; }
  .mq-kind.size-snapped { background: #4d3d1e; color: #ffce56; }
  .mq-kind.size-off-tree { background: #57222a; color: #ff9a9a; }
  .mq-kind.action-not-in-tree, .mq-kind.jam-not-offered { background: #3b2a57; color: #d3b7ff; }
  .mq-kind.node-missing, .mq-kind.past-terminal, .mq-kind.other { background: #57222a; color: #ff9a9a; }
  .mq-kind.beyond-ladder { background: #1e3247; color: #9ecbff; }
  .mq-state b { font-weight: 600; }
  .mq-node .arrow { color: #ffce56; font-weight: 700; }
  .mq-job { max-width: 340px; }
  .mq-job .id { word-break: break-all; }
  .mq-prog { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: #8fa1b6; }
  .mq-prog .bar { width: 140px; height: 6px; background: #232b37; border-radius: 3px; overflow: hidden; }
  .mq-prog .bar i { display: block; height: 100%; background: #4da3ff; }
  tr.mq-solved td, tr.mq-dismissed td { opacity: .55; }
  /* sessions */
  .sess-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
  .sess-grid .card { margin: 0; }
  .kv { display: grid; grid-template-columns: 130px 1fr; gap: 4px 12px; font-size: 12.5px; }
  .kv .k { color: #8fa1b6; } .kv .v { overflow-wrap: anywhere; }
  .ev-line { display: grid; grid-template-columns: 120px 1fr; gap: 10px; padding: 4px 6px; border-left: 2px solid #2c3a4d; margin-left: 4px; font-size: 12.5px; }
  .ev-line .t { color: #8fa1b6; font-variant-numeric: tabular-nums; }
  .pf-row { display: grid; grid-template-columns: 14px 1fr auto; gap: 8px; align-items: center; padding: 3px 0; font-size: 12.5px; }
  .pf-row .sub { font-size: 11.5px; }
  .preset-chip { display: inline-block; border-radius: 8px; padding: 1px 8px; font-size: 11px; font-weight: 700; background: #1e3247; color: #9ecbff; }
  .preset-chip.silent { background: #1a212c; color: #8fa1b6; } .preset-chip.capture-qa { background: #57222a; color: #ff9a9a; } .preset-chip.test-rig { background: #4d3d1e; color: #ffce56; }
  /* AI-chain walkthrough */
  .walk { display: grid; grid-template-columns: 300px 1fr; gap: 14px; align-items: start; }
  @media (max-width: 1100px) { .walk { grid-template-columns: 1fr; } }
  .walk-list { display: flex; flex-direction: column; gap: 3px; }
  .walk-street { color: #9db1c7; font-weight: 700; font-size: 11px; letter-spacing: .6px; text-transform: uppercase; margin: 8px 0 2px; }
  .walk-node { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; padding: 6px 8px; border-radius: 6px; background: #10151d; border: 1px solid #1f2936; cursor: pointer; }
  .walk-node:hover { border-color: #2c3a4d; } .walk-node.on { border-color: #4da3ff; background: #14243a; }
  .walk-node.hero { border-left: 3px solid #ffd35c; }
  .walk-node .n { color: #55647a; font-size: 11px; font-variant-numeric: tabular-nums; }
  .walk-node .who { font-weight: 700; } .walk-node .took { color: #c7d3e0; font-size: 12px; } .walk-node .took b { color: #fff; }
  .walk-node .pct { color: #8fa1b6; font-size: 11px; }
  .walk-grids { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 12px; }
  .walk-grids .card { margin: 0; }
  .grid169.sm { grid-template-columns: repeat(13, 24px); } .grid169.sm div { width: 24px; height: 20px; font-size: 9px; }
  .diff-tbl td.num { text-align: right; }
  .diff-pos { color: #61d095; } .diff-neg { color: #ff7373; }
  .seg { display: inline-flex; border: 1px solid #2c3a4d; border-radius: 6px; overflow: hidden; }
  .seg button { background: none; border: none; color: #8fa1b6; font: inherit; padding: 3px 10px; cursor: pointer; }
  .seg button.on.mes { background: rgba(232,119,46,.2); color: #ffb98a; } .seg button.on.gto { background: rgba(59,139,216,.2); color: #9ecbff; }
  /* hand detail: per-decision provenance + session line */
  .tl-prov { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 3px 6px 7px 130px; font-size: 12px; color: #9db1c7; border-left: 2px solid #2c3a4d; margin-left: 6px; }
  .tl-prov .ans { color: #dfe6ee; font-weight: 600; }
  .tl-prov .none { color: #55647a; font-style: italic; }
  .tl-prov a { color: #4da3ff; text-decoration: none; } .tl-prov a:hover { text-decoration: underline; }
  .sess-line { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 6px 0 10px; font-size: 12.5px; }
  .sess-line a { color: #4da3ff; text-decoration: none; } .sess-line a:hover { text-decoration: underline; }
  .prov-grid { display: grid; grid-template-columns: 90px 1fr; gap: 4px 12px; font-size: 12.5px; }
  .prov-grid .k { color: #8fa1b6; }

  /* ---- playthrough ---- */
  #view-play .felt { position: relative; height: 300px; border-radius: 150px/110px; background: radial-gradient(ellipse at center, #1d5a3a 0%, #123c27 70%, #0d2a1c 100%); border: 6px solid #3b2a1a; margin: 8px auto; max-width: 720px; }
  #view-play .seat { position: absolute; width: 150px; transform: translate(-50%, -50%); background: #0d141c; border: 1px solid #2a3442; border-radius: 8px; padding: 6px 8px; text-align: center; font-size: 12px; }
  #view-play .seat.hero { border-color: #ffd35c; }
  #view-play .seat.toact { box-shadow: 0 0 0 2px #4da3ff; }
  #view-play .seat .pos { font-weight: 700; font-size: 13px; }
  #view-play .seat .strat { font-size: 10px; color: #8fa1b6; }
  #view-play .seat .did { font-family: ui-monospace, monospace; font-size: 11px; color: #dfe6ee; min-height: 14px; }
  #view-play .mid { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; }
  #view-play .mid .pot { font-size: 12px; color: #dfe6ee; margin-top: 4px; }
  #view-play .cfg { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  #view-play .cfg select { background: #10151d; color: #dfe6ee; border: 1px solid #2a3442; border-radius: 5px; padding: 3px 6px; }
  #view-play .avail { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 10px; }
  #view-play .avail.on { background: rgba(97,208,149,.15); color: #61d095; }
  #view-play .avail.off { background: rgba(255,255,255,.06); color: #8fa1b6; }
  #view-play .avail.near { background: rgba(230,179,90,.15); color: #e6b35a; }
  #view-play .boards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
  #view-play .board { border: 1px solid #2a3442; border-radius: 6px; padding: 6px; cursor: pointer; background: #10151d; }
  #view-play .board:hover { border-color: #4da3ff; }
  #view-play .board .ev { font-family: ui-monospace, monospace; font-size: 11px; color: #8fa1b6; }
  #view-play .actrow { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  #view-play .actrow button.mes { border-color: #e8772e; }
  #view-play .rng { border: 1px solid #2a3442; border-radius: 6px; padding: 6px 8px; margin: 6px 0; font-size: 12px; }
  #view-play .rng input { width: 70px; background: #10151d; color: #dfe6ee; border: 1px solid #2a3442; border-radius: 4px; padding: 2px 5px; font-family: ui-monospace, monospace; }

  /* ---- strategies ---- */
  .strat-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
  .strat-card { border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: rgba(255,255,255,.02); cursor: pointer; position: relative; }
  .strat-card:hover { border-color: var(--accent); }
  .strat-card.bad { opacity: .72; border-style: dashed; }
  .strat-card h3 { margin: 0 0 2px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .strat-card .tag2 { font-size: 10px; padding: 1px 7px; border-radius: 10px; }
  .strat-card .tag2.ok { background: rgba(97,208,149,.15); color: #61d095; }
  .strat-card .tag2.warn { background: rgba(230,179,90,.15); color: #e6b35a; }
  .strat-card .tag2.bad { background: rgba(224,108,117,.15); color: #e06c75; }
  .strat-card .layers { font-size: 11px; color: var(--dim); margin: 6px 0; }
  .strat-card .layers b { color: #dfe6ee; font-weight: 600; }
  .strat-card .wr { font-family: ui-monospace, monospace; font-size: 20px; margin-top: 8px; }
  .strat-card .wr .u { font-size: 11px; color: var(--dim); font-family: inherit; }
  .strat-card .foot { font-size: 10px; color: var(--dim); margin-top: 2px; }
  .pc-row { display: flex; gap: 8px; align-items: baseline; font-size: 12px; padding: 3px 0; border-bottom: 1px solid var(--line-soft); }
  .pc-row .mark { width: 14px; }
  .pc-row .mark.ok { color: #61d095; } .pc-row .mark.no { color: #e06c75; }
  .pc-row .det { color: var(--dim); }
  .piece-h { margin: 18px 0 8px; font-size: 14px; display: flex; align-items: baseline; gap: 10px; }
  .piece-h .sub { font-weight: 400; }
  .card.explain p { margin: 6px 0; line-height: 1.45; }
  .src .head .tag2 { font-size: 10px; padding: 1px 7px; border-radius: 10px; margin-right: 2px; }
  .src .head .tag2.ok { background: rgba(97,208,149,.15); color: #61d095; }
  .src .head .tag2.warn { background: rgba(230,179,90,.15); color: #e6b35a; }
</style>
</head>
<body>
<header>
  <h1>🃏 Study Dashboard</h1>
  <div class="tabs">
    <button id="tab-hands" class="on">Hands</button>
    <button id="tab-sessions">Sessions</button>
    <button id="tab-analytics">Analytics</button>
    <button id="tab-sources">Sources</button>
    <button id="tab-replay">Replay Review</button>
    <button id="tab-play">Playthrough</button>
  </div>
  <span id="count" class="sub"></span>
  <span style="flex:1"></span>
  <input id="filter" type="text" placeholder="filter: pos, cards, stakes…">
  <label class="sub"><input id="only-flop" type="checkbox"> saw flop</label>
  <label class="sub"><input id="only-disc" type="checkbox"> has discrepancy</label>
</header>
<main>
  <div id="view-hands">
    <table>
      <thead><tr>
        <th data-k="playedAt">time</th><th data-k="stakes">stakes</th><th data-k="pos">pos</th>
        <th data-k="cards">cards</th><th data-k="street">street</th><th data-k="pot">pot</th>
        <th data-k="net">net bb</th><th>flags</th><th>disc</th>
      </tr></thead>
      <tbody id="hands-body"></tbody>
    </table>
  </div>
  <div id="view-detail" style="display:none"></div>
  <div id="view-sessions" style="display:none"></div>
  <div id="view-analytics" style="display:none"></div>
  <div id="view-sources" style="display:none"></div>
  <div id="view-play" style="display:none"></div>
  <!-- Side-by-side replay review lives in the React dashboard (it renders the
       Ignition table replica); this tab embeds it so review stays reachable
       from the study dashboard the recordings belong to. -->
  <div id="view-replay" style="display:none">
    <!-- Replay Review is served by this same API (studyUi.ts -> /replay), so the
         tab is a same-origin iframe with no second process behind it. -->
    <iframe id="replay-frame" style="width:100%;height:calc(100vh - 90px);border:0;border-radius:8px;background:#0d141c"></iframe>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const SUITS = { s: ["♠", "#cfd8e3"], h: ["♥", "#ff7d7d"], d: ["♦", "#ff7d7d"], c: ["♣", "#cfd8e3"] };
const cardHtml = (c) => {
  if (!c || c.length < 2) return esc(c);
  const [sym, col] = SUITS[c[1]] ?? ["?", "#cfd8e3"];
  return `<span class="cardsuit" style="color:${col}">${esc(c[0])}${sym}</span>`;
};
const cardsHtml = (cs) => (cs || []).map(cardHtml).join(" ");
const fmtT = (ms) => ms ? new Date(ms).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "—";
const netCls = (n) => n == null ? "" : n >= 0 ? "pos" : "neg";
const netStr = (n) => n == null ? "?" : (n > 0 ? "+" : "") + n.toFixed(2);
const r2 = (x) => Math.round(x * 100) / 100;

/* ================= hands list ================= */
let HANDS = [], sortK = "playedAt", sortDir = -1;

// The discrepancy audits are computed by the server in the background after a
// restart; while any are still pending the disc column shows "?" — re-poll
// until they are all in (one timer, whichever loader asked last).
let auditTimer = null;
function pollWhilePending(j, reload) {
  clearTimeout(auditTimer);
  if (j.auditPending > 0) auditTimer = setTimeout(reload, 2500);
}

async function loadHands() {
  try {
    const j = await (await fetch("/api/dashboard/hands")).json();
    HANDS = j.hands || [];
    $("count").textContent = `${HANDS.length} hands` + (j.auditPending ? ` · auditing ${j.auditPending}…` : "");
    renderHands();
    pollWhilePending(j, () => { if (PATH.view === "hands" && !PATH.id) loadHands(); });
  } catch (e) { /* server restarting */ }
}
const sortVal = (h, k) => k === "pos" ? (h.summary.heroPos ?? "") : k === "cards" ? h.heroCards.join("")
  : k === "street" ? h.summary.finalStreet : k === "pot" ? h.summary.potBb : k === "net" ? (h.netBb ?? -1e9) : (h[k] ?? "");

function renderHands() {
  const q = $("filter").value.trim().toLowerCase();
  let rows = HANDS.filter((h) => {
    if ($("only-flop").checked && !h.summary.sawFlop) return false;
    if ($("only-disc").checked && !(h.discrepancies && (h.discrepancies.major || h.discrepancies.minor))) return false;
    if (!q) return true;
    return `${h.stakes} ${h.summary.heroPos} ${h.heroCards.join("")} ${h.summary.finalStreet} ${h.strategy?.name ?? ""}`.toLowerCase().includes(q);
  });
  rows = rows.slice().sort((a, b) => {
    const va = sortVal(a, sortK), vb = sortVal(b, sortK);
    return (va < vb ? -1 : va > vb ? 1 : 0) * sortDir;
  });
  $("hands-body").innerHTML = rows.map((h) => {
    const s = h.summary;
    const flags = [s.limpedPot ? "limped" : "", s.threeBet ? "3bet" : "", s.wentToShowdown ? "SD" : "", s.heroWonUncontested ? "steal" : ""].filter(Boolean).join(" ");
    const d = h.discrepancies;
    const disc = d ? (d.major ? `<span class="badge b-major">${d.major}M</span>` : "") + (d.minor ? `<span class="badge b-minor">${d.minor}m</span>` : "") + (d.info ? `<span class="badge b-info">${d.info}i</span>` : "") : "?";
    return `<tr data-id="${h.dbId}"><td>${fmtT(h.playedAt)}</td><td>${esc(h.stakes ?? "?")}</td><td>${esc(s.heroPos ?? "?")}</td>
      <td>${cardsHtml(h.heroCards)}</td><td>${esc(s.finalStreet)}</td><td>${h.strategy ? `<span class="chip ${h.strategy.id === "apex" ? "good" : ""}">${esc(h.strategy.name)}</span>` : '<span class="sub">—</span>'}</td><td>${s.potBb}</td>
      <td class="${netCls(h.netBb)}">${netStr(h.netBb)}</td><td class="sub">${esc(flags)}</td><td>${disc}</td></tr>`;
  }).join("");
  for (const tr of $("hands-body").querySelectorAll("tr")) tr.onclick = () => go(`/hands/${tr.dataset.id}`);
}
document.querySelectorAll("thead th[data-k]").forEach((th) => {
  th.onclick = () => { const k = th.dataset.k; sortDir = sortK === k ? -sortDir : -1; sortK = k; renderHands(); };
});
$("filter").oninput = renderHands; $("only-flop").onchange = renderHands; $("only-disc").onchange = renderHands;

/* ================= replayer state ================= */
const STREET_N = { preflop: 0, flop: 3, turn: 4, river: 5 };
function replayState(hand, step) {
  // per-seat committed for the CURRENT street, pot carried from prior streets
  const st = { street: "preflop", potPrev: 0, cur: {}, folded: new Set(), invested: {} };
  for (let i = 0; i < step; i++) {
    const a = hand.actions[i];
    if (a.street !== st.street) {
      st.potPrev += Object.values(st.cur).reduce((s, x) => s + x, 0);
      st.cur = {}; st.street = a.street;
    }
    const amt = a.amount ?? 0;
    if (a.type === "post-sb" || a.type === "post-bb" || a.type === "call") st.cur[a.seatId] = (st.cur[a.seatId] ?? 0) + amt;
    else if (a.type === "bet" || a.type === "raise" || a.type === "all-in") st.cur[a.seatId] = amt;
    else if (a.type === "fold") st.folded.add(a.seatId);
    st.invested[a.seatId] = (st.invested[a.seatId] ?? 0);
  }
  // total invested per seat (for stack display)
  const inv = {};
  {
    let street = "preflop", cur = {};
    for (let i = 0; i < step; i++) {
      const a = hand.actions[i];
      if (a.street !== street) { for (const [s, v] of Object.entries(cur)) inv[s] = (inv[s] ?? 0) + v; cur = {}; street = a.street; }
      const amt = a.amount ?? 0;
      if (a.type === "post-sb" || a.type === "post-bb" || a.type === "call") cur[a.seatId] = (cur[a.seatId] ?? 0) + amt;
      else if (a.type === "bet" || a.type === "raise" || a.type === "all-in") cur[a.seatId] = amt;
    }
    for (const [s, v] of Object.entries(cur)) inv[s] = (inv[s] ?? 0) + v;
  }
  const next = hand.actions[step] ?? null;
  const shownStreet = next ? next.street : st.street;
  return {
    street: st.street,
    board: hand.board.slice(0, STREET_N[shownStreet] ?? hand.board.length),
    pot: r2(st.potPrev + Object.values(st.cur).reduce((s, x) => s + x, 0)),
    bets: st.cur,
    folded: st.folded,
    invested: inv,
    toAct: next ? next.seatId : null,
    next,
  };
}

/* ================= SVG table mirror ================= */
function svgCard(x, y, c, w = 26, h = 36) {
  if (!c) return `<rect x="${x}" y="${y}" rx="3" width="${w}" height="${h}" fill="#1b2f4d" stroke="#33507a"/>
    <rect x="${x + 4}" y="${y + 4}" rx="2" width="${w - 8}" height="${h - 8}" fill="none" stroke="#3d5f8f" stroke-width="1"/>`;
  const [sym, col] = SUITS[c[1]] ?? ["?", "#cfd8e3"];
  return `<rect x="${x}" y="${y}" rx="3" width="${w}" height="${h}" fill="#eef2f7"/>
    <text x="${x + w / 2}" y="${y + h / 2 - 3}" text-anchor="middle" font-size="13" font-weight="700" fill="${col === "#cfd8e3" ? "#22303f" : "#d3364b"}">${c[0]}</text>
    <text x="${x + w / 2}" y="${y + h / 2 + 12}" text-anchor="middle" font-size="12" fill="${col === "#cfd8e3" ? "#22303f" : "#d3364b"}">${sym}</text>`;
}

function renderMirror(hand, rs) {
  const W = 640, H = 380, cx = W / 2, cy = H / 2 - 6, RX = 240, RY = 128;
  const seats = [...new Set([...Object.keys(hand.positions).map(Number), ...hand.liveSeats, hand.heroSeatId])].sort((a, b) => a - b);
  const heroIdx = Math.max(0, seats.indexOf(hand.heroSeatId));
  const n = seats.length;
  const btnSeat = seats.find((s) => hand.positions[s] === "BTN") ?? seats.find((s) => hand.positions[s] === "SB");
  let g = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="${cx}" cy="${cy}" rx="${RX + 44}" ry="${RY + 44}" fill="#12202e" stroke="#243447" stroke-width="3"/>
    <ellipse cx="${cx}" cy="${cy}" rx="${RX + 22}" ry="${RY + 22}" fill="#173042" stroke="#2c4a63" stroke-width="2"/>`;
  // board
  const b0 = cx - (5 * 30) / 2;
  for (let i = 0; i < 5; i++) g += svgCard(b0 + i * 30, cy - 30, rs.board[i] ?? null, 26, 36).replace(/#1b2f4d/g, i < STREET_N[rs.next ? rs.next.street : rs.street] || rs.board[i] ? "#1b2f4d" : "none");
  for (let i = rs.board.length; i < 5; i++) { /* empty slots drawn faint above */ }
  g = g.replace(/fill="none" stroke="#33507a"/g, 'fill="#132030" stroke="#22364e"');
  g += `<text x="${cx}" y="${cy + 34}" text-anchor="middle" font-size="14" fill="#ffd35c" font-weight="700">pot ${rs.pot} bb</text>`;
  for (let k = 0; k < n; k++) {
    const seat = seats[(heroIdx + k) % n];
    const ang = Math.PI / 2 + (k * 2 * Math.PI) / n; // hero at bottom, clockwise
    const sx = cx + RX * Math.cos(ang), sy = cy + RY * Math.sin(ang);
    const isHero = seat === hand.heroSeatId;
    const folded = rs.folded.has(seat);
    const toAct = rs.toAct === seat;
    const stack0 = hand.stacks?.[seat];
    const stackStr = stack0 != null ? `${r2(Math.max(0, stack0 - (rs.invested[seat] ?? 0)))} bb` : "";
    const op = folded ? 0.35 : 1;
    // hole cards
    const cardY = sy - 52;
    if (!folded && (isHero ? hand.heroCards.length : hand.liveSeats.includes(seat))) {
      const c1 = isHero ? hand.heroCards[0] : null, c2 = isHero ? hand.heroCards[1] : null;
      g += `<g opacity="${op}">${svgCard(sx - 27, cardY, c1)}${svgCard(sx + 1, cardY, c2)}</g>`;
    }
    // pod
    g += `<g opacity="${op}">
      <rect x="${sx - 46}" y="${sy - 12}" rx="7" width="92" height="36" fill="${isHero ? "#1c3550" : "#182230"}"
        stroke="${toAct ? "#ffd35c" : isHero ? "#3f6d9e" : "#2a3a4e"}" stroke-width="${toAct ? 2.5 : 1.2}"/>
      <text x="${sx}" y="${sy + 2}" text-anchor="middle" font-size="12" font-weight="700" fill="${isHero ? "#9fd1ff" : "#c8d5e2"}">
        ${isHero ? "YOU" : "seat " + seat}${hand.positions[seat] ? " · " + esc(hand.positions[seat]) : ""}</text>
      <text x="${sx}" y="${sy + 17}" text-anchor="middle" font-size="11" fill="#8fa1b6">${folded ? "folded" : stackStr}</text></g>`;
    // Things drawn on the seat→pot line (dealer button, committed chips)
    // must never sit on the hole cards. The cards are always ABOVE the pod,
    // so for seats in the lower half of the table a fixed fraction of the
    // way to the pot lands right on them (hero's 2.52 covered his cards).
    // Slide along the line until clear of the card rectangle, so the marker
    // ends up between the cards and the pot for every seat angle.
    const cardsDrawn = !folded && (isHero ? hand.heroCards.length > 0 : hand.liveSeats.includes(seat));
    const cardRect = cardsDrawn ? { x1: sx - 30, y1: cardY - 3, x2: sx + 30, y2: cardY + 39 } : null;
    const alongLine = (t0, w, h, dx) => {
      let t = t0, x = 0, y = 0;
      for (; t <= 0.72; t += 0.03) {
        x = sx + (cx - sx) * t + dx; y = sy + (cy - sy) * t;
        const clear = !cardRect || x + w / 2 < cardRect.x1 || x - w / 2 > cardRect.x2 || y + h / 2 < cardRect.y1 || y - h / 2 > cardRect.y2;
        if (clear) break;
      }
      return { x, y };
    };
    // dealer button
    if (seat === btnSeat) {
      // -40: clear of the chip (48 wide, centred on the line) when both slide to the same spot
      const { x: dxp, y: dyp } = alongLine(0.26, 20, 20, -40);
      g += `<circle cx="${dxp}" cy="${dyp}" r="9" fill="#e8ecf2"/><text x="${dxp}" y="${dyp + 3.5}" text-anchor="middle" font-size="10" font-weight="800" fill="#22303f">D</text>`;
    }
    // committed chips this street
    const bet = rs.bets[seat];
    if (bet) {
      const { x: bx, y: by } = alongLine(0.34, 52, 22, 0);
      g += `<rect x="${bx - 24}" y="${by - 10}" rx="9" width="48" height="18" fill="#0f1a26" stroke="#3b556f"/>
        <text x="${bx}" y="${by + 3.5}" text-anchor="middle" font-size="11" font-weight="700" fill="#ffd35c">${r2(bet)}</text>`;
    }
  }
  return g + "</svg>";
}

/* ================= feed ↔ step sync ================= */
function feedStepMap(feedLines, actions) {
  // Map each feed line to "actions consumed so far": action lines advance the
  // counter; everything else inherits the current count.
  const isAction = (l) => /^Seat \d+ (posts|folds|checks|calls|bets|raises to|is ALL-IN)/.test(l);
  let k = 0;
  return feedLines.map((l) => {
    if (isAction(l) && k < actions.length) k++;
    return k;
  });
}

/* ================= detail page ================= */
let DETAIL = null, STEP = 0, PLAY = null;

async function showDetail(dbId) {
  const v = $("view-detail"); v.innerHTML = '<div class="card sub">loading…</div>';
  const j = await (await fetch(`/api/dashboard/hand/${dbId}`)).json();
  if (!j.ok) { v.innerHTML = `<div class="card warn">${esc(j.error)}</div>`; return; }
  DETAIL = j; STEP = j.hand.actions.length; // start at the end (full hand)
  const s = j.summary;
  v.innerHTML = `
    <div class="dt-top">
      <button class="mini" onclick="go('/hands')">← all hands</button>
      <h2 style="margin:0">Hand #${j.dbId} · ${cardsHtml(j.hand.heroCards)} ${esc(s.heroPos ?? "?")} · ${esc(j.stakes ?? "?")} · ${fmtT(j.playedAt)}</h2>
      <span class="sub">${esc(j.clientHandId ?? "no site id")}${j.resultText ? " · " + esc(j.resultText) : ""}</span>
    </div>
    ${sessionLine(j)}
    ${provenanceCard(j)}
    <div class="dt-grid">
      <div class="card" style="margin:0">
        <div id="mirror"></div>
        <div class="rp-controls">
          <button id="rp-first">⏮</button><button id="rp-prev">◀</button>
          <span id="rp-pos" class="sub" style="min-width:90px;text-align:center"></span>
          <button id="rp-next">▶</button><button id="rp-last">⏭</button>
          <button id="rp-play">▶ play</button>
        </div>
      </div>
      <div class="card" style="margin:0"><h2>Live hand feed</h2><div id="feed-sync">
        ${j.feedLines.map((l, i) => `<div data-fl="${i}">${esc(l)}</div>`).join("")}
      </div></div>
    </div>
    <div class="card"><h2>Timeline — click a node, solve it, open it</h2><div id="timeline"></div></div>
    <div id="solution"></div>
    ${j.answers?.length ? `<div class="card"><h2>Every study answer logged for this hand <span class="sub">— in the order they were pushed; each also sits under its decision in the timeline</span></h2>` + j.answers.map((a, i) => answerCard(a, { index: i })).join("") + `</div>` : ""}

function setStep(n) {

  for (const row of $("timeline").querySelectorAll(".tl-row")) row.classList.toggle("cur", Number(row.dataset.step) === STEP);
  // feed sync: lines whose step <= STEP are past; the last of them is "now"
  const lines = $("feed-sync").querySelectorAll("[data-fl]");
  let last = null;
  lines.forEach((el, i) => {

  if (last) {

const COMBOS = (k) => k.length === 2 ? 6 : k.endsWith("s") ? 4 : 12;

  html += `<div class="grid169${opt.small ? " sm" : ""}">`;
  for (let r = 0; r < 13; r++) for (let c = 0; c < 13; c++) {
    const key = classKey(r, c), e = cls[key];

        actions.forEach((a, ai) => { const p = (100 * e.acts[ai]) / e.w; if (p > 0.5) { stops.push(`${colorFor(a, ai)} ${acc}% ${acc + p}%`); acc += p; } });

    const op = e ? (opt.single ? Math.min(1, 0.12 + 0.88 * (e.w / COMBOS(key))) : Math.min(1, (opt.flat ? 1 : 0.25) + e.w / (opt.wmax ?? 4))) : 0.12;
    html += `<div class="${key === heroKey ? "hero" : ""}" style="background:${bg};opacity:${op}" title="${key}${e ? ` · ` + actions.map((a, ai) => `${a} ${((100 * e.acts[ai]) / (e.w || 1)).toFixed(0)}%`).join(" · ") : " · not in range"}">${key.slice(0, 2)}</div>`;
  }

    })() : "";
    sol.innerHTML = `<div class="card"><h2>${j.kind === "hrc" ? "HRC chart node" : "GTO Wizard chart node"} <span class="sub">— what answered at action ${upto}</span></h2>

  }
  sol.scrollIntoView({ behavior: "smooth", block: "start" });
}

/* ---- walkthrough of a stored AI-chain solve: every node, the ranges assumed, the conditioning ---- */
const weightGrid = (agg, heroKey, hue) => {
  const cls = {}; for (const k in agg) cls[k] = { w: agg[k].w, acts: [agg[k].w] };
  const combos = Object.values(agg).reduce((s, x) => s + x.w, 0);
  return classGrid(cls, ["in range"], heroKey, { single: hue, small: true, foot: `${combos.toFixed(1)} combos · opacity = share of the class still in range` });
};
async function renderWalkthrough(solveId, hostId, upto) {
  const host = $(hostId);
  let w;
  try { w = await (await fetch(`/api/dashboard/solve/${solveId}`)).json(); } catch (e) { host.innerHTML = `<div class="warn">${esc(String(e))}</div>`; return; }
  if (!w.ok) { host.innerHTML = `<div class="warn">${esc(w.error)}</div>`; return; }
  const sp = w.spec, heroKey = DETAIL?.summary ? classOfCardsJs(DETAIL.hand.heroCards) : null;
  const heroSeatPos = sp.heroSeat === "oop" ? sp.oopPos : sp.ipPos;
  // chain node k ↔ the k-th postflop action of the archived hand (hero's pending node ↔ upto)
  const postIdx = DETAIL.hand.actions.map((a, i) => (a.street !== "preflop" ? i : -1)).filter((i) => i >= 0);
  let sel = w.nodes.findIndex((n) => n.heroNode); if (sel < 0) sel = w.nodes.length - 1;
  const facts = `<div class="nv-facts">
      ${fact("stored", `#${w.row.id} · ${esc(w.row.origin)} · ${fmtT(w.row.ts)}`)}
      ${fact("seats", `<b>OOP</b> ${esc(sp.oopPos)} · <b>IP</b> ${esc(sp.ipPos)} · you are <b>${esc(String(sp.heroSeat).toUpperCase())}</b> (${esc(heroSeatPos)})`)}
      ${fact("your combo", sp.heroCombo ? `<span class="mono">${esc(sp.heroCombo)}</span>` : "unknown")}
      ${fact("entering the flop", `pot ${sp.flopPot}bb · stack ${sp.flopStack}bb`)}
      ${fact("board", `<span class="mono">${esc(sp.board)}</span>`)}
      ${fact("tokens walked", sp.streets.map((t, i) => `<span class="chip dim">${["flop", "turn", "river"][i]}</span> ${esc(t.join("-") || "root")}`).join(" "))}
      ${fact("cloud solutions", w.streets.map((st) => `${st.street.toLowerCase()} <span class="mono" title="${esc(st.solId ?? "")}">${esc((st.solId ?? "—").slice(0, 8))}</span> <span class="chip ${st.created ? "good" : "dim"}">${st.created ? "fresh solve" : "cached"}</span>${st.fixedLevels ? ` <span class="chip warn" title="${esc(st.fixedLevels.join(", "))}">sizes pinned</span>` : ""}`).join(" · "))}
      ${fact("verdict", w.result?.ok ? `reached hero's node · ${w.result.solves} fresh solve${w.result.solves === 1 ? "" : "s"} · ${w.row.solveMs != null ? fmtLatency(w.row.solveMs) : ""}` : `<span class="warn">failed: ${esc(w.result?.why ?? "?")}</span>`)}
    </div>`;
  const list = () => {
    let cur = null, html = "";
    w.nodes.forEach((n, i) => {
      if (n.street !== cur) { cur = n.street; html += `<div class="walk-street">${cur} · ${esc(n.board)}</div>`; }
      html += `<div class="walk-node${i === sel ? " on" : ""}${n.heroNode ? " hero" : ""}" data-i="${i}">
        <span class="n">${i + 1}</span>
        <span><span class="who">${esc(n.actorPos)} <span class="sub">(${n.actor.toUpperCase()})</span>${n.heroNode ? " ★ your decision" : ""}</span><br>
          ${n.taken != null ? `<span class="took">took <b>${esc(n.takenName)}</b></span> <span class="pct">${n.takenOverallPct != null ? `· ${n.takenOverallPct}% of the range does this` : ""}</span>` : `<span class="took">${n.heroNode ? "the answer was read here" : "pending"}</span>`}
          <div class="pct">pot ${n.potNode}bb${n.codes.length ? ` · after ${esc(n.codes.join("-"))}` : " · street root"}</div></span></div>`;
    });
    return html;
  };
  const view = () => {
    const n = w.nodes[sel];
    const labels = n.actions.map((a) => a.name + (a.betsize != null && !/\d/.test(a.name) ? ` ${a.betsize}` : ""));
    const stratCls = n.actorStrategy;
    const hero = n.heroRow;
    const isHeroActor = n.actor === sp.heroSeat;
    return `<div>
      <div class="nv-head"><span><span class="sub">node ${sel + 1} of ${w.nodes.length}</span></span><span><b>${esc(n.street)}</b> <span class="mono">${esc(n.board)}</span></span><span><span class="sub">to act</span> <b>${esc(n.actorPos)}</b> (${n.actor.toUpperCase()}${isHeroActor ? ", you" : ", villain"})</span><span><span class="sub">pot</span> ${n.potNode}bb</span><span><span class="sub">invested this street</span> OOP ${n.invested[0]} · IP ${n.invested[1]}</span></div>
      <div class="walk-grids">
        <div class="card"><h2>OOP range entering this node <span class="sub">${esc(sp.oopPos)}</span></h2>${weightGrid(n.rangesIn.oop, sp.heroSeat === "oop" ? heroKey : null, "#3b8bd8")}</div>
        <div class="card"><h2>IP range entering this node <span class="sub">${esc(sp.ipPos)}</span></h2>${weightGrid(n.rangesIn.ip, sp.heroSeat === "ip" ? heroKey : null, "#e8772e")}</div>

        ${hero ? `<div class="nv-hero"><span class="big">${esc(sp.heroCombo ?? "")}</span> <span class="sub">${n.heroNode ? "the answer:" : "the solve has you playing"}</span> ${hero.filter((x) => x.p > 0.5).sort((a, b) => b.p - a.p).map((x) => `<b>${esc(x.name)}${x.betsize != null && !/\d/.test(x.name) ? ` ${x.betsize}` : ""}</b> ${x.p}%${x.ev != null ? ` <span class="sub">ev ${x.ev}</span>` : ""}`).join(" · ")}${n.heroWeightIn != null ? ` <span class="sub">· weight in range ${n.heroWeightIn}</span>` : ""}</div>` : ""}
      </div>
      ${n.rangesOut ? `<div class="card" style="margin-top:12px"><h2>After conditioning on ${esc(n.takenName)} <span class="sub">— ${esc(n.actorPos)}'s range × the frequency of that action, combo by combo; this is what the next node sees</span></h2>
        <div class="walk-grids"><div>${weightGrid(n.rangesOut.oop, sp.heroSeat === "oop" ? heroKey : null, "#3b8bd8")}</div><div>${weightGrid(n.rangesOut.ip, sp.heroSeat === "ip" ? heroKey : null, "#e8772e")}</div></div></div>` : ""}
    </div>`;
  };
  host.innerHTML = `${facts}<div class="walk"><div class="walk-list" id="walk-list">${list()}</div><div id="walk-view">${view()}</div></div>`;
  const bind = () => host.querySelectorAll(".walk-node").forEach((el) => el.onclick = () => {
    sel = Number(el.dataset.i);
    $("walk-list").innerHTML = list(); $("walk-view").innerHTML = view(); bind();
    // keep the table replica on the same moment
    const n = w.nodes[sel];
    setStep(n.heroNode ? upto : (postIdx[sel] ?? upto));
  });
  bind();
}
const classOfCardsJs = (cards) => {
  const cs = (cards || []).filter((c) => /^[2-9TJQKA][shdc]$/.test(c));
  if (cs.length !== 2) return null;
  const i1 = RANKS.indexOf(cs[0][0]), i2 = RANKS.indexOf(cs[1][0]);
  if (i1 === i2) return cs[0][0] + cs[1][0];
  return RANKS[Math.min(i1, i2)] + RANKS[Math.max(i1, i2)] + (cs[0][1] === cs[1][1] ? "s" : "o");
};

/* ---- live solve vs re-solve, node by node ---- */
async function renderCompare(aId, bId, hostId) {

  if (!c.ok) { host.innerHTML = `<div class="card warn">${esc(c.error)}</div>`; return; }
  const s = c.summary;
  const flag = s.flag === "discrepancy" ? '<span class="chip crit">discrepancy</span>' : s.flag === "minor drift" ? '<span class="chip warn">minor drift</span>' : s.flag === "same" ? '<span class="chip good">same answer</span>' : `<span class="chip dim">${esc(s.flag)}</span>`;
  const d = (x) => x == null ? "—" : `<span class="${x > 0 ? "diff-pos" : x < 0 ? "diff-neg" : ""}">${x > 0 ? "+" : ""}${x}</span>`;
  const rows = c.nodes.map((n) => n.missingInB
    ? `<tr class="src-static"><td>${esc(n.street)} ${esc(n.codes.join("-") || "root")}</td><td colspan="6" class="warn">not reached by the re-solve</td></tr>`
    : n.actions.map((x, i) => `<tr class="src-static">${i === 0 ? `<td rowspan="${n.actions.length}"><b>${esc(n.street)}</b> ${esc(n.codes.join("-") || "root")}<div class="sub">${esc(n.actorPos)}${n.heroNode ? " ★ you" : ""}${n.takenName ? ` · took ${esc(n.takenName)}` : ""}</div><div class="sub">ranges in: Δ OOP ${n.rangeTv.oop} · IP ${n.rangeTv.ip}</div></td>` : ""}
        <td>${esc(x.name)}${x.betsize != null && !/\d/.test(x.name) ? ` ${x.betsize}` : ""}</td>
        <td class="num">${x.overallA ?? "—"}</td><td class="num">${x.overallB ?? "—"}</td>
        <td class="num">${x.heroA ?? "—"}</td><td class="num">${x.heroB ?? "—"}</td><td class="num">${d(x.heroDiff)}</td></tr>`).join("")).join("");
  host.innerHTML = `<div class="card" style="margin-top:12px"><h2>Live solve #${aId} vs re-solve #${bId} ${flag}</h2>
    <div class="nv-facts">
      ${fact("your decision", s.heroMaxDiffPts != null ? `largest change in your mix: <b>${s.heroMaxDiffPts} pts</b>` : "no matching hero node")}
      ${fact("cloud solutions", s.solIdsSame ? "identical solution ids — the same trees were served" : "different solution ids — the trees were solved again")}
      ${fact("ranges", s.rangesSame ? "identical ranges at every node" : "ranges differ somewhere — see Δ per node (total variation, 0 = same)")}
      ${fact("stored", `live ${fmtT(c.a.ts)} · replay ${fmtT(c.b.ts)}`)}
    </div>
    <div class="scroll"><table class="diff-tbl"><thead><tr><th>node</th><th>action</th><th class="num">range % live</th><th class="num">range % now</th><th class="num">you % live</th><th class="num">you % now</th><th class="num">Δ you</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="sub" style="margin-top:6px">"range %" is how much of the actor's whole range takes the action; "you %" is your combo's frequency. A discrepancy of 5 points or more in your mix is flagged.</div></div>`;
}

/* ================= node solution + AI inputs ================= */
// fold is always blue (colorFor), so no series colour may be a blue: a 4th
// aggressive size / all-in next to a fold cell became unreadable
const ACT_COLORS = ["#d64550", "#e8933a", "#ceba4c", "#b07fe8", "#5cc8c8", "#ff8fb1", "#a3d977"];
const colorFor = (label, i) => /^fold/i.test(label) ? "#3d6fb4" : /^(check|call)/i.test(label) ? "#61d095" : ACT_COLORS[i % ACT_COLORS.length];
const RANKS = "AKQJT98765432";

async function solveNode(dbId, upto, btn) {
  // The ONLY postflop solver on the dashboard is the live answer chain
  // (services/aiChain.ts via POST /resolve-chain): same ranges, same pinned
  // sizes, same conditioning as the answer at the table, and every run is
  // stored and walkable. (The old AI-study route is SolverStudy's, not ours.)
  setStep(upto);
  const sol = $("solution");
  sol.innerHTML = `<div class="card"><span class="warn">re-solving this node through the live chain… fresh streets take a few seconds</span></div>`;
  if (btn) { btn.disabled = true; btn.textContent = "solving…"; }
  let r;
  try {
    r = await (await fetch("/api/dashboard/resolve-chain", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ dbId, upto }) })).json();
  } catch (e) { r = { ok: false, error: String(e) }; }
  if (btn) { btn.disabled = false; btn.textContent = "▶ solve (live chain)"; }
  if (!r.ok) { sol.innerHTML = `<div class="card warn">solve failed: ${esc(r.error ?? "unknown")}</div>`; return; }
  if (r.tier !== "ai-chain" || r.solveId == null) {
    sol.innerHTML = `<div class="card"><h2>Re-solve at action ${upto}</h2><div class="sub">The live path answered this node from <b>${esc(r.tier ?? r.source ?? "another tier")}</b>, not the AI chain, so there is no chain trace to walk.${r.warning ? ` ⚠ ${esc(r.warning)}` : ""}</div>
      <div class="ans-verdict" style="margin-top:8px"><span class="ans-pick ${verbClass(r.decision?.action)}">${esc((r.decision?.action ?? "").toUpperCase())}</span><span class="ans-how">${(r.actions || []).map((a) => `${esc(a.action)} ${Math.round(a.frequency)}%`).join(" · ")}</span></div>
      <div class="sub" style="margin-top:8px"><a class="ev-link" href="/hands/${dbId}/node/${upto}" onclick="go('/hands/${dbId}/node/${upto}');return false">open the exact node it used ↗</a></div></div>`;
    return;
  }
  sol.innerHTML = `<div class="card"><h2>Live-chain re-solve at action ${upto} <span class="sub">— stored as replay #${r.solveId}; every node below is walkable</span></h2><div id="walk-host"></div></div>`;
  renderWalkthrough(r.solveId, "walk-host", upto);
  sol.scrollIntoView({ behavior: "smooth", block: "start" });
}

async function loadAnalytics() {
  const v = $("view-analytics");
  v.innerHTML = '<div class="card sub">loading…</div>';
  const j = await (await fetch("/api/dashboard/stats")).json();
  if (!j.ok) { v.innerHTML = '<div class="card warn">stats unavailable</div>'; return; }
  // disc counts fill in as the background audits land — refresh quietly
  pollWhilePending(j, () => { if ($("view-analytics").style.display !== "none") loadAnalytics(); });
  const o = j.overall;

  const p = (x) => x == null ? "—" : x + "%";
  let html = `<div class="tiles">
    ${tile("hands", o.hands)}
    ${tile("bb/100", o.bb100 == null ? "—" : o.bb100, `${o.netKnownHands}/${o.hands} known net (${netStr(o.netBb)} bb)`)}
    ${tile("VPIP", p(o.vpip))} ${tile("PFR", p(o.pfr))} ${tile("3Bet", p(o.threeBet))}
    ${tile("WTSD", p(o.wtsd))} ${tile("limped pots", p(o.limpedPots))} ${tile("major disc.", o.discrepancies.major)}

  html += tbl("By session", j.sessions.map((s) => row(`${fmtT(s.start)} (${s.stakes ?? "?"})`, s)).join(""));
  html += tbl("By stakes", Object.entries(j.byStakes).map(([k, a]) => row(k, a)).join(""));
  html += tbl("By position", Object.entries(j.byPosition).map(([k, a]) => row(k, a)).join(""));
  const t = j.answers?.tiers ?? {};
  // ---- formalized winrate picture (GET /api/dashboard/mes-value) ----------

      html += `<div class="card"><h2>Winrate ladder — graded backtest, measured rake (bb/100)</h2>
        <table><thead><tr><th>strategy</th><th>no rake</th><th>NL200 rake</th><th>NL25 rake</th><th>footing</th></tr></thead><tbody>` +
        mv.ladder.map((r) => `<tr><td>${esc(r.strategy)}</td><td>${f1(r.norake)}</td><td><b>${f1(r.nl200)}</b></td><td><b>${f1(r.nl25)}</b></td><td class="sub">${esc(r.note)}</td></tr>`).join("") +
        `</tbody></table></div>`;
      const famRow = (name, f, src) => f ? `<tr><td>${esc(name)}</td><td>${esc(src)}</td><td>${f.arrivals}</td><td>${f.arrival_pct_of_hands}%</td><td>${f1(f.mean_ev_gain_per_arrival)} bb</td><td><b>${f1(f.uplift_bb100)}</b></td></tr>` : "";
      const fams = ["M1_heroSB_bvb_cbet", "M2_heroBTN_srp_vs_BB"];
      html += `<div class="card"><h2>Postflop MES uplift — v3 locked solves, per arrival → bb/100</h2>

        fams.map((k) => famRow(k, mv.corpus?.families?.[k], `corpus (${mv.corpus?.hands ?? 0} hands)`) + famRow(k, mv.live?.families?.[k], `live (${mv.live?.hands ?? 0} hands)`)).join("") +
        `<tr><td><b>total</b></td><td>corpus</td><td></td><td></td><td></td><td><b>${f1(mv.corpus?.total_uplift_bb100)}</b></td></tr>
         <tr><td><b>total</b></td><td>live</td><td></td><td></td><td></td><td><b>${f1(mv.live?.total_uplift_bb100)}</b></td></tr>

        <div class="sub" style="margin-top:8px">${(mv.caveats || []).map((t) => "• " + esc(t)).join("<br>")}</div></div>`;

  html += `<div class="card"><h2>Study answers (last 60 days)</h2>
    <div class="sub">${j.answers.answered} answered · ${j.answers.failed} failed</div>
    <table><thead><tr><th>tier</th><th>n</th><th>p50 ms</th><th>p90 ms</th><th>max ms</th></tr></thead><tbody>
    ${Object.entries(t).map(([k, x]) => `<tr><td>${esc(k)}</td><td>${x.n}</td><td>${x.p50}</td><td>${x.p90}</td><td>${x.max}</td></tr>`).join("")}
    </tbody></table></div>`;
  html += `<div id="miss-queue"><div class="card sub">loading the preflop miss queue…</div></div>`;
  v.innerHTML = html;
  loadMissQueue();
}

/* ================= preflop miss queue ================= */
// Postflop is complete (the AI chain solves any board on demand). Preflop has
// no live equivalent, so every chart miss is written down with the state to
// solve it; the HRC runner works the queue between sessions.
let MQ = null, mqFilter = "active", mqTimer = null, mqShowAll = false, mqShowAllJobs = false;
const MQ_KIND = {
  "size-snapped": ["size snapped", "answered, but from a size ≥0.1 log-bb away (e.g. a 3.9x open served from the 3.5x node)"],
  "size-off-tree": ["size off tree", "the played size is further than τ from every size in the tree — no answer"],
  "action-not-in-tree": ["action not in tree", "a limp / call / check the tree shape does not contain — no answer"],
  "jam-not-offered": ["jam not offered", "an all-in at a node with no aggressive action — no answer"],
  "node-missing": ["node missing", "the walked line is not in the solution — no answer"],
  "past-terminal": ["past terminal", "the line runs on past a terminal node — no answer"],
  "beyond-ladder": ["beyond ladder", "deep stacks past the 150bb rung — answered from the 150bb chart"],
  other: ["other", "an unclassified walk failure"],
};
const mqKind = (k) => `<span class="mq-kind ${esc(k)}" title="${esc((MQ_KIND[k] || MQ_KIND.other)[1])}">${esc((MQ_KIND[k] || MQ_KIND.other)[0])}</span>`;

async function loadMissQueue() {
  const host = $("miss-queue");
  if (!host) return;
  let j;
  try { j = await (await fetch("/api/dashboard/miss-queue")).json(); } catch (e) { host.innerHTML = '<div class="card warn">miss queue unavailable</div>'; return; }
  if (!j.ok) { host.innerHTML = '<div class="card warn">miss queue unavailable</div>'; return; }
  MQ = j;
  renderMissQueue();
  clearTimeout(mqTimer);
  if (j.sweep.running) mqTimer = setTimeout(loadMissQueue, 2000);
}

function renderMissQueue() {
  const host = $("miss-queue");
  if (!host || !MQ) return;
  const st = MQ.stats, sw = MQ.sweep;
  const bs = st.byStatus || {};
  const tile = (k, val, sub) => `<div class="tile"><div class="v num">${val}</div><div class="k">${k}</div>${sub ? `<div class="s">${sub}</div>` : ""}</div>`;
  const kinds = Object.entries(st.byKind || {}).sort((a, b) => b[1] - a[1]).map(([k, n]) => `${mqKind(k)} <span class="sub num">${n}</span>`).join(" &nbsp; ");
  const sweepHtml = sw.running
    ? `<span class="mq-prog">sweeping ${esc(sw.source)} <span class="bar"><i style="width:${sw.total ? Math.round(100 * sw.done / sw.total) : 0}%"></i></span> ${sw.done}/${sw.total} decisions · ${sw.misses} inexact · ${sw.charts} charts</span>`
    : sw.finishedAt
      ? `<span class="sub">last sweep: ${esc(sw.source)} · ${sw.decisions} decisions, ${sw.misses} inexact · ${sw.error ? `<span class="warn">${esc(sw.error)}</span>` : `${fmtAgo(sw.finishedAt)}`}</span>`
      : `<span class="sub">no sweep yet this run</span>`;
  const active = (MQ.items || []).filter((x) => mqFilter === "all" ? true : mqFilter === "active" ? (x.status === "open" || x.status === "queued") : x.status === mqFilter);
  const rows = (mqShowAll ? active : active.slice(0, 120)).map(mqRow).join("");
  // the runner's unit is a job, not an item: group the filtered items by the chart they'd produce
  const byJob = new Map();
  for (const x of active) {
    if (!x.job) continue;
    const g = byJob.get(x.job.id) || { job: x.job, n: 0, items: 0, kinds: {}, status: {}, live: 0, chart: x.chart };
    g.n += x.n; g.items++; g.live += x.nLive; g.kinds[x.kind] = (g.kinds[x.kind] || 0) + x.n; g.status[x.status] = (g.status[x.status] || 0) + 1;
    byJob.set(x.job.id, g);
  }
  const jobs = [...byJob.values()].sort((a, b) => b.n - a.n);
  const jobRows = (mqShowAllJobs ? jobs : jobs.slice(0, 25)).map((g) => {
    const st = g.status.queued ? (g.status.open ? "partly queued" : "queued") : g.status.solved && !g.status.open ? "solved" : g.status.dismissed && !g.status.open ? "dismissed" : "open";
    return `<tr class="src-static">
      <td><div class="mono">${esc(g.job.id)}</div><div class="sub">${esc(g.job.change)}</div></td>
      <td class="mq-state"><b>${esc(g.job.site)}</b> · ${g.job.stacksBB.join("/")}bb<div class="sub">from ${esc(g.chart)}</div></td>
      <td>${Object.entries(g.kinds).sort((a, b) => b[1] - a[1]).map(([k, n]) => `${mqKind(k)} <span class="sub num">${n}</span>`).join(" ")}</td>
      <td class="num"><b>${g.n}</b><div class="sub">${g.items} item${g.items === 1 ? "" : "s"}${g.live ? ` · live ${g.live}` : ""}</div></td>
      <td><span class="chip ${st === "queued" ? "good" : st === "open" ? "warn" : "dim"}">${st}</span></td>
      <td><div style="display:flex;gap:4px;flex-wrap:wrap">
        <button class="mini" onclick="mqJobStatus('${esc(g.job.id)}','queued')" ${st === "queued" ? "disabled" : ""}>queue</button>
        <button class="mini" onclick="mqJobStatus('${esc(g.job.id)}','open')" ${st === "open" ? "disabled" : ""}>open</button>
        <button class="mini" onclick="mqJobStatus('${esc(g.job.id)}','dismissed')">dismiss</button></div></td></tr>`;
  }).join("");
  host.innerHTML = `<div class="card">
    <h2>Preflop miss queue <span class="sub">— ${bs.open || 0} open · ${bs.queued || 0} queued · ${bs.solved || 0} solved · ${bs.dismissed || 0} dismissed</span></h2>
    <div class="banner">🧭 <b>Preflop is completed offline.</b> Postflop has the AI chain to solve any board on demand; a 3-handed preflop state takes HRC 12–90 min, so it can't be solved live. Instead every spot the chart corpus couldn't answer <i>exactly</i> is written down here with its state — stacks, line, the size or action the tree lacked — and a suggested HRC job. Queue the ones worth solving, write the plan, run it in HRC Runner; when the chart lands, <b>re-check</b> marks the item solved.</div>
    <div class="tiles">
      ${tile("open", bs.open || 0)} ${tile("queued", bs.queued || 0)} ${tile("solved", bs.solved || 0)}
      ${tile("decisions affected", (st.hands.live + st.hands.archive + st.hands.corpus), `live ${st.hands.live} · archive ${st.hands.archive} · corpus ${st.hands.corpus}`)}
    </div>
    <div class="sub" style="margin:10px 0 4px">${kinds || "no open misses"}</div>
    <div class="mq-ctl">
      <select id="mq-filter" onchange="mqFilter=this.value;renderMissQueue()">
        ${[["active", "open + queued"], ["all", "everything"], ["open", "open"], ["queued", "queued"], ["solved", "solved"], ["dismissed", "dismissed"]].map(([v, l]) => `<option value="${v}" ${mqFilter === v ? "selected" : ""}>${l}</option>`).join("")}
      </select>
      <button class="mini" onclick="mqSweep('archive')" ${sw.running ? "disabled" : ""} title="walk every hero preflop decision in hands.db through the charts">sweep archive</button>
      <button class="mini" onclick="mqSweep('corpus')" ${sw.running || !MQ.corpus ? "disabled" : ""} title="walk every preflop node of the 4k-hand Zone corpus through the charts (all actors) — minutes">sweep 4k corpus</button>
      <button class="mini" onclick="mqPlan()" ${(bs.queued || 0) ? "" : "disabled"} title="write one HRC plan per queued job + a runner queue">write HRC plan (${bs.queued || 0} queued)</button>
      ${sweepHtml}
    </div>
    <h2 style="margin-top:14px">Suggested HRC jobs <span class="sub">— ${jobs.length} distinct, by decisions covered${jobs.length > 25 && !mqShowAllJobs ? ` · showing 25 <a href="#" onclick="mqShowAllJobs=true;renderMissQueue();return false">show all</a>` : ""}</span></h2>
    <div class="scroll"><table><thead><tr><th>job</th><th>state</th><th>what it fixes</th><th class="num">decisions</th><th>status</th><th></th></tr></thead>
    <tbody>${jobRows || `<tr class="src-static"><td colspan="6" class="sub">no jobs to suggest</td></tr>`}</tbody></table></div>
    <h2 style="margin-top:14px">Items <span class="sub">— ${active.length}${active.length > 120 && !mqShowAll ? ` · showing 120 <a href="#" onclick="mqShowAll=true;renderMissQueue();return false">show all</a>` : ""}</span></h2>
    <div class="scroll"><table><thead><tr><th>kind</th><th>state</th><th>node</th><th class="num">seen</th><th>hands</th><th>suggested HRC job</th><th>status</th></tr></thead>
    <tbody>${rows || `<tr class="src-static"><td colspan="7" class="sub">nothing here — run a sweep, or play with Study Answers on</td></tr>`}</tbody></table></div>
    <div class="sub" style="margin-top:8px">Items are keyed by chart · line · wanted token. A "seen" count is decisions, not hands. Sweeps reset their own counts before re-walking, so they never double count; live counts only grow. Store: <span class="mono">${esc(MQ.store)}</span> · plans: <span class="mono">${esc(MQ.planDir)}</span></div>
  </div>`;
}

function mqRow(x) {
  const stk = x.state?.stacksBB || {};
  const stacks = ["BTN", "SB", "BB"].filter((p) => stk[p] != null).map((p) => `${p} ${stk[p]}`).join(" · ");
  const shape = x.shortSeat === "EQ" ? `${x.depth}bb even` : `${x.depth}/${x.depth} + ${esc(x.shortSeat)} ${x.shortDepth}bb`;
  const state = `<div class="mq-state"><b>${esc(x.site)}</b> · ${shape}${x.kind === "beyond-ladder" ? ` <span class="chip warn">deep</span>` : ""}<div class="sub">${esc(stacks || "stacks unreadable")}${x.state?.heroPos ? ` · hero ${esc(x.state.heroPos)}` : ""}</div><div class="mono sub">${esc(x.chart)}</div></div>`;
  const node = `<div class="mq-node"><span class="mono">${esc(x.line || "(root)")}</span>
    ${x.want ? `<div><span class="mono">${esc(x.want)}</span> <span class="arrow">→</span> ${x.got ? `<span class="mono">${esc(x.got)}</span>` : '<span class="crit">nothing</span>'}</div>` : ""}
    ${x.offered?.length ? `<div class="sub">offered: <span class="mono">${esc(x.offered.join(" "))}</span></div>` : ""}
    <div class="sub" title="${esc(x.reason)}">${esc(x.reason.length > 90 ? x.reason.slice(0, 90) + "…" : x.reason)}</div></div>`;
  const seen = `<div class="num"><b>${x.n}</b><div class="sub">${[x.nLive ? `live ${x.nLive}` : "", x.nArchive ? `archive ${x.nArchive}` : "", x.nCorpus ? `corpus ${x.nCorpus}` : ""].filter(Boolean).join(" · ")}</div><div class="sub">${x.lastSeen ? fmtT(x.lastSeen) : ""}</div></div>`;
  const linked = (x.refs || []).filter((r) => r.dbId != null).slice(-3);
  const corpusRefs = (x.refs || []).filter((r) => r.dbId == null).slice(-3);
  const hands = `<div>${linked.map((r) => `<a href="/hands/${r.dbId}/node/${r.actionIndex ?? ""}" onclick="go('/hands/${r.dbId}/node/${r.actionIndex ?? ""}');return false">#${r.dbId}</a>`).join(" ")}
    ${corpusRefs.length ? `<div class="sub">corpus ${corpusRefs.map((r) => esc(String(r.handId ?? "?"))).join(", ")}</div>` : ""}</div>`;
  const job = x.job
    ? `<div class="mq-job"><div class="mono id">${esc(x.job.id)}</div><div class="sub">${esc(x.job.change)}</div><div class="sub">stacks ${x.job.stacksBB.join("/")} · opens ${esc(String(x.job.sizes[0]))}</div></div>`
    : '<span class="sub">no job suggested</span>';
  const status = `<div style="display:flex;flex-direction:column;gap:4px">
    <select onchange="mqStatus(${x.id}, this.value)">${["open", "queued", "solved", "dismissed"].map((s) => `<option value="${s}" ${x.status === s ? "selected" : ""}>${s}</option>`).join("")}</select>
    <button class="mini" onclick="mqRecheck(${x.id}, this)" title="re-walk this state through today's charts; an exact walk marks it solved">re-check</button>
    ${x.note ? `<div class="sub" title="${esc(x.note)}">${esc(x.note.length > 60 ? x.note.slice(0, 60) + "…" : x.note)}</div>` : ""}</div>`;
  return `<tr class="src-static mq-${esc(x.status)}"><td>${mqKind(x.kind)}</td><td>${state}</td><td>${node}</td><td class="num">${seen}</td><td>${hands}</td><td>${job}</td><td>${status}</td></tr>`;
}

async function mqSweep(source) {
  const r = await (await fetch("/api/dashboard/miss-queue/sweep", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ source }) })).json();
  if (!r.ok) alert(r.error || "sweep failed");
  loadMissQueue();
}
async function mqJobStatus(jobId, status) {
  await fetch("/api/dashboard/miss-queue/status-by-job", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ jobId, status }) });
  loadMissQueue();
}
async function mqStatus(id, status) {
  await fetch(`/api/dashboard/miss-queue/${id}/status`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ status }) });
  loadMissQueue();
}
async function mqRecheck(id, btn) {
  if (btn) { btn.disabled = true; btn.textContent = "checking…"; }
  const r = await (await fetch(`/api/dashboard/miss-queue/${id}/recheck`, { method: "POST" })).json();
  if (!r.ok) alert(r.error || "re-check failed");
  else if (!r.exact) alert(`still inexact on ${r.chart}: ${r.walk.reason || ("snapped " + JSON.stringify(r.walk.repaired))}`);
  loadMissQueue();
}
async function mqPlan() {
  const r = await (await fetch("/api/dashboard/miss-queue/plan", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" })).json();
  if (!r.ok) { alert(r.error || "plan failed"); return; }
  alert(`wrote ${r.jobs} job(s)\n\nplan: ${r.plan}\nrunner queue: ${r.queue}\n\nOpen HRC Runner and load the queue file.`);
}

/* ================= chart catalog ================= */
let CAT = null, catFam = "", catQ = "";

const stacksStr = (e) => {
  if (!e.stacksBB) return e.depth != null ? `${e.depth}bb` : "—";
  const seats = e.seats ?? Object.keys(e.stacksBB);
  const vals = seats.map((s) => e.stacksBB[s]);
  return vals.every((v) => v === vals[0]) ? `${vals[0]}bb even`
    : seats.map((s) => `${s} ${e.stacksBB[s]}`).join(" · ");
};
const fmtAgo = (ms) => {
  const m = Math.round((Date.now() - ms) / 60000);
  return m < 60 ? `${m}m ago` : m < 1440 ? `${Math.round(m / 60)}h ago` : `${Math.round(m / 1440)}d ago`;
};

async function loadCatalog() {
  const v = $("src-catalog");
  if (!v) return;
  v.innerHTML = '<div class="card sub">loading catalog…</div>';
  let j;
  try {
    j = await (await fetch("/api/dashboard/catalog")).json();
  } catch (e) { v.innerHTML = '<div class="card warn">catalog unavailable</div>'; return; }
  if (!j.ok) { v.innerHTML = '<div class="card warn">catalog unavailable</div>'; return; }
  CAT = j;
  renderCatalog();
}

function renderCatalog() {
  const v = $("src-catalog");
  if (!v) return;
  const s = CAT.summary;
  const tile = (k, val, sub) => `<div class="tile"><div class="v">${val}</div><div class="k">${k}</div>${sub ? `<div class="sub">${sub}</div>` : ""}</div>`;
  const famNames = Object.keys(s.byFamily).sort();

  // recently-queried strip: live answers joined back to their chart
  const recent = (CAT.recent || []).slice(0, 12);
  const recentHtml = recent.length
    ? `<div class="card"><h2>Recently queried by live study (30d)</h2><table><thead><tr>
        <th>chart</th><th>answers</th><th>last used</th></tr></thead><tbody>` +
      recent.map((r) => `<tr><td>${esc(r.chart)}</td><td>${r.n}</td><td class="sub">${fmtAgo(r.lastTs)}</td></tr>`).join("") +
      `</tbody></table></div>`
    : `<div class="card sub">No live study answers logged against a chart yet — play a session with Study Answers on and the charts used will appear here.</div>`;

  let rows = CAT.entries;
  if (catFam) rows = rows.filter((e) => e.family === catFam);
  if (catQ) rows = rows.filter((e) => `${e.id} ${e.label} ${e.site ?? ""} ${e.routed ?? ""}`.toLowerCase().includes(catQ));
  // Live-routed families first — alphabetical order buried the 3-max corpus
  // under a screenful of browse-only HU grids.

/* ================= Sources (mission control) ================= */
let SRC = null, srcPane = "strategies", srcLoaded = {};
const fmtIso = (iso) => { const d = new Date(iso); return isNaN(d) ? esc(iso) : d.toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }); };
const fmtMs = (ms) => ms == null ? "—" : ms >= 1000 ? `${(ms / 1000).toFixed(1)} s` : `${ms} ms`;
const spark = (byDay, mes) => {
  const xs = (byDay || []).slice(-14); const mx = Math.max(1, ...xs);
  return `<span class="spark" aria-hidden="true">${xs.map((x) => `<i class="${mes ? "m" : ""}" style="height:${Math.max(1, Math.round(22 * x / mx))}px"></i>`).join("")}</span>`;
};
const evCell = (v, opt = {}) => {
  if (v == null) return `<td class="ev z${opt.reuse ? " reuse" : ""}">${esc(opt.why ?? "—")}</td>`;
  const cls = v > 0.05 ? "p" : v < -0.05 ? "n" : "z";
  const se = opt.se != null ? ` <span class="se">±${opt.se}</span>` : opt.tag ? ` <span class="se">${esc(opt.tag)}</span>` : "";
  return `<td class="ev ${cls}${opt.reuse ? " reuse" : ""}">${v > 0 ? "+" : ""}${Number(v).toFixed(1)}${se}</td>`;
};

async function loadSources() {
  const v = $("view-sources");
  if (!SRC) v.innerHTML = '<div class="card sub">probing sources…</div>';
  let j;
  try { j = await (await fetch("/api/dashboard/sources/registry")).json(); }
  catch (e) { v.innerHTML = '<div class="card warn">sources unavailable</div>'; return; }
  if (!j.ok) { v.innerHTML = '<div class="card warn">sources unavailable</div>'; return; }
  SRC = j;
  // A periodic refresh only repaints the armed strip and the registry cards;
  // the other panes keep whatever they loaded (re-rendering them left
  // "loading…" placeholders behind, since their loaders run once).
  if ($("src-armed")) { $("src-armed").outerHTML = armedStrip(); if (srcPane === "pieces" && !PATH.id) renderRegistry(); return; }
  renderSources();
}

function armedStrip() {
  const a = SRC.armed;
  const dot = (ok, warn) => `<span class="dot ${ok ? (warn ? "warn" : "good") : "crit"}"></span>`;
  const tokenMin = a.gtow.expiresInMs != null ? Math.round(a.gtow.expiresInMs / 60000) : null;
  const modeChip = a.strategyMode === "exploit" ? '<span class="mode mes">MES</span> primary'
    : a.strategyMode === "chart" ? '<span class="mode gto">GTO</span> primary' : '<span class="chip dim">no probe yet</span>';
  return `
    <div class="armed" id="src-armed">
      <div class="cell"><span class="k">Strategy mode now</span><span class="v">${modeChip}</span><span class="s">${a.strategyMode ? "the other answer rides along on every solve" : "wrapper toggle not seen this session"}</span></div>
      <div class="cell"><span class="k">Exploit preflop</span><span class="v">${a.exploitPreflop ? '<span class="dot good"></span>Armed' : '<span class="dot off"></span>Not armed'}</span><span class="s">EXPLOIT_CHART in the API's env</span></div>
      <div class="cell"><span class="k">MES postflop</span><span class="v">${a.mesPostflop ? '<span class="dot good"></span>Loaded' : '<span class="dot off"></span>Missing'}</span><span class="s">${a.mesBoards} boards served</span></div>
      <div class="cell"><span class="k">3-max charts :8777</span><span class="v">${dot(a.hrc.up)}${a.hrc.up ? "Up" : "Down"}</span><span class="s">probe ${a.hrc.ms} ms</span></div>
      <div class="cell"><span class="k">GTO Wizard cloud</span><span class="v">${dot(a.gtow.tokenLive, tokenMin != null && tokenMin < 4)}${a.gtow.tokenLive ? `Token ${tokenMin} min` : a.gtow.clientUp ? "No token" : "Client down"}</span><span class="s">keeper refreshes at 3 min</span></div>
      <div class="cell"><span class="k">Study wrapper</span><span class="v">${dot(a.wrapper.up)}${a.wrapper.up ? "Live" : "Down"}</span><span class="s">${esc(a.wrapper.url.replace(/^https?:\/\//, ""))}${a.wrapper.studyAnswersOn != null ? ` · answers ${a.wrapper.studyAnswersOn ? "on" : "off"}` : ""}</span></div>
    </div>`;
}

function renderSources() {
  const v = $("view-sources");
  const tierCount = Object.values(SRC.tiers).reduce((s, x) => s + x, 0);
  v.innerHTML = `
    ${armedStrip()}
    <div class="sub-tabs" role="tablist">
      <button data-pane="strategies" role="tab">Strategies</button>
      <button data-pane="pieces" role="tab">Pieces <span class="n">${SRC.cards.length} sources</span></button>
      <button data-pane="matrix" role="tab">Strategy matrix</button>
      <button data-pane="grading" role="tab">Live grading <span class="n">${tierCount} answers</span></button>
      <button data-pane="roadmap" role="tab">Roadmap</button>
    </div>
    <section class="pane" id="src-strategies"><div class="card sub">loading…</div></section>
    <section class="pane" id="src-pieces"></section>
    <section class="pane" id="src-matrix"><div class="card sub">loading…</div></section>
    <section class="pane" id="src-grading"><div class="card sub">loading…</div></section>
    <section class="pane" id="src-roadmap"><div class="card sub">loading…</div></section>`;

  v.querySelectorAll(".sub-tabs button").forEach((b) => b.onclick = () => go(`/sources/${b.dataset.pane}`));
