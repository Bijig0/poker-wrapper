<style>
/* Layout: the study dashboard's own chrome — a sticky bar, then cards; the hand page is the dashboard's hand detail

:root {
  color-scheme: light;
  --bg: #F2F4F1; --surface: #FFFFFF; --surface2: #E9EDE9; --surface3: #DEE4DF;
  --line: #D6DDD7; --grid: #E3E8E3; --ink: #1A2320; --muted: #5F6D65; --faint: #8A968E;
  --win: #1F7A4D; --win-soft: rgba(31,122,77,.12);
  --ev: #C4861A; --ev-soft: rgba(196,134,26,.14);
  --loss: #B8433A; --loss-soft: rgba(184,67,58,.12);
  --info: #2F6FB3; --info-soft: rgba(47,111,179,.12);
  --violet: #6B4FBB; --violet-soft: rgba(107,79,187,.12);
  --severe: #8E1E2B; --severe-soft: rgba(184,67,58,.2);
  --chip: #E4EAE5; --chip-on: #1A2320; --chip-on-ink: #F2F4F1;
  --shadow: 0 1px 2px rgba(20,30,25,.06), 0 8px 20px rgba(20,30,25,.06);
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-head: Sora, "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  color-scheme: dark;
  --bg: #121715; --surface: #1B211E; --surface2: #242B27; --surface3: #2B3330;
  --line: #2E3733; --grid: #273029; --ink: #E7ECE8; --muted: #9AA69E; --faint: #6E7A72;
  --win: #4CC382; --win-soft: rgba(76,195,130,.14);
  --ev: #E5AE4A; --ev-soft: rgba(229,174,74,.16);
  --loss: #E0675C; --loss-soft: rgba(224,103,92,.16);
  --info: #6FA8E6; --info-soft: rgba(111,168,230,.16);
  --violet: #B48CFF; --violet-soft: rgba(180,140,255,.16);
  --severe: #FF5470; --severe-soft: rgba(255,84,112,.18);
  --chip: #262E29; --chip-on: #E7ECE8; --chip-on-ink: #121715;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 20px rgba(0,0,0,.35);
} }
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121715; --surface: #1B211E; --surface2: #242B27; --surface3: #2B3330;
  --line: #2E3733; --grid: #273029; --ink: #E7ECE8; --muted: #9AA69E; --faint: #6E7A72;
  --win: #4CC382; --win-soft: rgba(76,195,130,.14);
  --ev: #E5AE4A; --ev-soft: rgba(229,174,74,.16);
  --loss: #E0675C; --loss-soft: rgba(224,103,92,.16);
  --info: #6FA8E6; --info-soft: rgba(111,168,230,.16);
  --violet: #B48CFF; --violet-soft: rgba(180,140,255,.16);
  --severe: #FF5470; --severe-soft: rgba(255,84,112,.18);
  --chip: #262E29; --chip-on: #E7ECE8; --chip-on-ink: #121715;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 20px rgba(0,0,0,.35);
}
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font: 14px/1.45 var(--font-body); background: var(--bg); color: var(--ink); }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 10px; padding-inline: 16px; }
header h1 { font-family: var(--font-head); font-weight: 600; font-size: 16px; margin: 0; white-space: nowrap; }

.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; flex: 1 1 520px; min-width: 0; }
.filters input[type=search], .filters select { font: inherit; font-size: 13px; padding: 5px 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface2); color: var(--ink); min-width: 0; }

.ans-pick { font: 600 22px var(--font-head); }
.ans-pick.fold { color: var(--info); } .ans-pick.call { color: var(--win); } .ans-pick.raise { color: var(--ev); } .ans-pick.none { color: var(--loss); }
.mixbar { display: flex; height: 22px; border-radius: 6px; overflow: hidden; margin: 6px 0; background: var(--surface3); }

.warn-text { white-space: pre-wrap; font-size: 12.5px; line-height: 1.5; background: var(--surface2); border-radius: 8px; padding: 8px 10px; max-height: 240px; overflow: auto; }
.checks div { font-size: 12.5px; padding: 3px 0; border-bottom: 1px solid var(--grid); }

.back { margin-bottom: 4px; }

@media (max-width: 520px) {
  .grid169 { grid-template-columns: repeat(13, 22px) !important; } .grid169 div { width: 22px !important; height: 19px !important; font-size: 8px !important; }
  .rl-card.v .grid169.sm { grid-template-columns: repeat(13, 19px) !important; } .rl-card.v .grid169.sm div { width: 19px !important; height: 16px !important; font-size: 7.5px !important; }
  td.t { min-width: 180px; }
  .tl-row { grid-template-columns: 44px 70px 1fr auto; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

.legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; font-size: 12.5px; color: var(--muted); }

.cmb:nth-child(even) { background: var(--surface2); }

<script>
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (x) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[x]));
const $ = (id) => document.getElementById(id);
window.cardHtml = (c) => {
  if (!c || c.length < 2) return String(c ?? "");
  const S = { s: ["♠", "var(--ink)"], h: ["♥", "var(--loss)"], d: ["♦", "var(--loss)"], c: ["♣", "var(--ink)"] };
  const [sym, col] = S[c[1]] ?? ["?", "inherit"];
  return `<span class="cardsuit" style="color:${col}">${esc(c[0])}${sym}</span>`;
};
</script>
<script>
/* ===== static/study/grid169.js — the dashboard's 13x13 grid, verbatim (GTO Wizard's palette, hover mix, combos) ===== */
const GWPAL = { base: "rgb(30,30,30)", call: "#5AB966", fold: "#3D7CB8", range: "#FF8F00", allin: "#7D1F1F",
               raise: ["#F03C3C", "#DD3737", "#CA3232", "#B62E2E", "#A32929", "#912424"] };
const actKind = (label) => {
  const l = String(label ?? "").toLowerCase();
  if (/^(fold)/.test(l)) return "fold";
  if (/^(check|call|limp|in range)/.test(l)) return "call";
  if (/all-?in|jam|\brai\b/.test(l)) return "allin";
  return "raise";
};
const actSize = (label) => { const m = String(label ?? "").match(/(\d+(?:\.\d+)?)/); return m ? parseFloat(m[1]) : 0; };
function gtowColors(labels) {
  const raises = labels.map((l, i) => ({ l, i, k: actKind(l), sz: actSize(l) })).filter((x) => x.k === "raise").sort((a, b) => a.sz - b.sz);
  const out = labels.map((l) => { const k = actKind(l); return k === "fold" ? GWPAL.fold : k === "call" ? GWPAL.call : k === "allin" ? GWPAL.allin : GWPAL.raise[0]; });
  const n = raises.length;
  raises.forEach((r, rank) => { const t = n <= 1 ? 0 : rank / (n - 1); out[r.i] = GWPAL.raise[Math.round(t * (GWPAL.raise.length - 1))]; });
  return out;
}
function gtowOrder(labels) {
  const rank = (l) => { const k = actKind(l); return k === "allin" ? 0 : k === "raise" ? 1 : k === "call" ? 2 : 3; };
  return labels.map((l, i) => i).sort((a, b) => rank(labels[a]) - rank(labels[b]) || (actKind(labels[a]) === "raise" ? actSize(labels[b]) - actSize(labels[a]) : 0));
}
function gtowCellStyle(segs, weight) {
  const h = Math.max(0, Math.min(1, weight)) * 100;
  const live = segs.filter((x) => x.frac > 0.004);
  if (!live.length || h <= 0.2) return `background:${GWPAL.base}`;
  let acc = 0;
  const layers = [], sizes = [];
  for (const x of live) { acc = Math.min(1, acc + x.frac); layers.push(`linear-gradient(to right,${x.color},${x.color})`); sizes.push(`${(acc * 100).toFixed(2)}% ${h.toFixed(1)}%`); }
  sizes[sizes.length - 1] = `100% ${h.toFixed(1)}%`;
  return `background-color:${GWPAL.base};background-image:${layers.join(",")};background-size:${sizes.join(",")};background-position:${live.map(() => "0 100%").join(",")};background-repeat:no-repeat`;
}
const gtowColor = (label, labels) => gtowColors(labels ?? [label])[(labels ?? [label]).indexOf(label)] ?? GWPAL.raise[0];
const colorFor = (label, i, labels) => labels ? gtowColor(label, labels) : (actKind(label) === "fold" ? GWPAL.fold : actKind(label) === "call" ? GWPAL.call : actKind(label) === "allin" ? GWPAL.allin : GWPAL.raise[Math.min(Math.max(i - 2, 0), GWPAL.raise.length - 1)]);
const RANKS = "AKQJT98765432";
const COMBOS = (k) => k.length === 2 ? 6 : k.endsWith("s") ? 4 : 12;
const classKey = (r, c) => r === c ? RANKS[r] + RANKS[c] : r < c ? RANKS[r] + RANKS[c] + "s" : RANKS[c] + RANKS[r] + "o";
const COMBO_DATA = {};
let comboSeq = 0;
const COMBO_DATA_MAX = 60;
const SUIT_ORDER = ["s", "h", "d", "c"];
function comboRows(cls, weights, acts, board) {
  const dead = new Set((board || "").match(/[2-9TJQKA][shdc]/gi)?.map((c) => c[0].toUpperCase() + c[1].toLowerCase()) ?? []);
  const [a, b] = [cls[0], cls[1]];
  const out = [];

  const facts = `<div class="nv-facts"><div><b>tree path</b><span class="mono">${esc(v.ln || "root")}</span></div><div><b>source</b><span>${esc(v.src || "")}</span></div>${v.pot != null ? `<div><b>pot at node</b><span class="num">${r2(v.pot)} bb</span></div>` : ""}<div><b>took</b><span>${esc(v.tk || "")}</span></div></div>`;
  let actorCard = "";
  const isFull = (arr) => !!arr && arr.every((x) => x >= 0.999);
  const combosIn = (arr) => { let n = 0; arr.forEach((x, k) => { n += x * COMBOS(CLASS_LIST[k]); }); return n; };
  const rangeStat = (arr) => { const n = combosIn(arr), p = (100 * n) / 1326; return `${p >= 0.1 ? p.toFixed(1) : p.toFixed(3)}% · ${n >= 10 ? Math.round(n) : n.toFixed(2)} combos`; };
  const THIN = 1.5;
  if (strat && acts.length) {
    const first = !actorRange || isFull(actorRange);
    const thin = !first && combosIn(actorRange) < THIN;
    actorCard = `<div class="rl-card actor"><h3>${esc(v.a)} <span class="sub">${a.hero ? "hero's" : "villain's"} strategy at this node · ${first ? "every hand (nothing narrowed yet)" : `range so far ${rangeStat(actorRange)}`}</span>${thin ? ` <span class="chip crit">range collapsed</span>` : ""}${lockHere ? "" : rangeTag(v.a)}</h3>` +
      (lockHere ? `<div class="sub" style="max-width:60ch;margin:4px 0"><span class="chip warn">⚑ off-GTO action</span> ${esc(actionText(a, rs))} — GTO plays this ${lockHere.gto == null ? "(share not in the answer's note)" : `<b>${lockHere.gto < 0.01 ? "under 0.01%" : lockHere.gto.toFixed(lockHere.gto < 1 ? 2 : 1) + "%"}</b>`} of his range here. The tree drawn below is the LOCKED one: this node plays the pool's range (${esc(lockHere.b)}); from the next node on his range is the pool's.</div>` : "") +
      (thin ? `<div class="sub" style="max-width:56ch;margin:4px 0">Under ${THIN} combos are left in this range — an earlier action of this seat is one the solver almost never takes. The cells are drawn at full height (not range-weighted) so the mix stays visible; the tree's numbers here rest on almost nothing.</div>` : "") +
      `${classGrid(strategyCls(thin ? actorRange.map((x) => (x > 0 ? 1 : 0)) : actorRange, strat, acts.length), acts, H.heroKey, { board, openHero: !!a.hero, foot: `${thin ? "every class with any weight left, full height" : "fill = share of each class still in range"} · colour = how it acts${a.hero ? " · your class outlined" : " · your class outlined for reference"}` })}</div>`;
  }
  const others = Object.entries(ranges).filter(([p]) => p !== v.a);
  const otherCards = others.map(([p, arr]) => {
    const isHeroSeat = String(H.positions[H.heroSeatId]).toUpperCase() === String(p).toUpperCase();
    const you = isHeroSeat ? ` <span class="chip good">you</span>` : "";
    if (!arr || isFull(arr)) return `<div class="rl-card v"><h3>${esc(p)}${you}${rangeTag(p)}</h3><div class="any">every hand — nothing narrowed yet (has not acted, or only posted)</div></div>`;
    const thin = combosIn(arr) < THIN;
    return `<div class="rl-card v"><h3>${esc(p)}${you} <span class="sub">range now · ${rangeStat(arr)}</span>${thin ? ` <span class="chip crit">collapsed</span>` : ""}${rangeTag(p)}</h3>${classGrid(rangeCls(arr), ["in range"], isHeroSeat ? H.heroKey : null, { single: true, small: true, combosOff: true, board, foot: "range so far" })}</div>`;
  }).join("");
  const dealt = Object.values(H.positions).map(String);
  const outside = dealt.filter((p) => !(p in ranges) && !rs.folded.has(Number(Object.keys(H.positions).find((s) => H.positions[s] === p))));
  const note = outside.length ? `<p class="sub" style="margin:8px 0 0">Not in this tree: ${outside.map(esc).join(", ")} — still in the hand but left out of the model at this node (a collapse ghosts, merges or prices them as dead money)${options.length > 1 ? "; switch trees above to see them" : ", or not yet read"}.</p>` : "";
  const picker = options.length > 1 ? `<div style="margin:8px 0 2px"><div class="sub" style="margin-bottom:4px">This answer blends ${options.length} trees (each holds three seats) — pick one:</div><div class="seg" id="altSeg" role="group" aria-label="Tree" style="flex-wrap:wrap;border-radius:12px">${options.map((o, k) => `<button data-k="${k}" class="${k === sel ? "on" : ""}">${esc(String(o.src || `tree ${k + 1}`).replace(/^tree /, ""))}</button>`).join("")}</div></div>` : "";
  let heroLine = "";
  if (v.hm && v.hm.length) heroLine = `<div class="nv-hero"><span class="big">${cardsHtml(H.heroCards)}</span> — this tree's own mix for your exact combo: ${v.hm.filter((x) => x.p >= 0.05).map((x) => `${esc(x.action)} <b>${x.p.toFixed(1)}%</b>`).join(" · ")}${options.length > 1 ? `<div class="sub" style="margin-top:2px">one of ${options.length} blended trees — the answer below is the blend</div>` : ""}</div>`;
  host.innerHTML = `${head}${picker}${facts}<div class="seats" style="margin-top:10px">${actorCard}${otherCards}</div>${note}${heroLine}`;
  const seg = $("altSeg");
  if (seg) seg.addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; ALT_SEL[STEP] = Number(b.dataset.k); renderNode(replayState(H, STEP)); });
}
/** an action label's kind as the poker-sense checks count it (lint.ts actionKind) */
function kindOf(label) {
  const l = String(label ?? "").trim().toUpperCase();
  return l.startsWith("FOLD") ? "fold" : l.startsWith("CHECK") ? "check" : l.startsWith("CALL") ? "call" : /^(ALL|RAI\b)/.test(l) ? "all-in" : /^(BET|RAISE)/.test(l) ? "bet-raise" : "?";
}
/** the script's action vs our pick, by kind (a raise and an all-in count as the same kind) */
function pickDiffers(d) {
  if (!d || !d.tk || !d.pick) return false;
  const sk = ({ fold: "fold", check: "call", call: "call", bet: "raise", raise: "raise", "all-in": "allin" }[d.tk[0]] ?? "raise");
  const pk = actKind(d.pick);
  return !(pk === sk || (pk === "allin" && sk === "raise") || (pk === "raise" && sk === "allin"));
}
/** our answer's draw: the recorded roll + band (runs since 2026-10-05 evening), else the band rebuilt from the mix the
 *  same way pickWeightedAction lays it out (positive frequencies in the listed order, scaled to 0-100) */
function rollOf(d) {
  if (!d || !d.pick) return null;
  if (d.roll != null && Array.isArray(d.band)) return { roll: d.roll, band: d.band, exact: true };
  const pos = (d.mix || []).filter((m) => m[1] > 0), tot = pos.reduce((a, m) => a + m[1], 0);
  if (!tot) return null;
  let from = 0;
  for (const [l, f] of pos) { if (l === d.pick) return { roll: null, band: [Math.round(from / tot * 1000) / 10, Math.round((from + f) / tot * 1000) / 10], exact: false }; from += f; }
  return null;
}
function renderAnswer() {
  const host = $("answer");
  const d = H.decAt[STEP];
  if (!d) { host.hidden = true; return; }
  host.hidden = false;
  const gk = GRADE_FULL[d.g] ?? "a";
  const kind = d.pick ? actKind(d.pick) : "none";
  const labels = d.mix.map((m) => m[0]);
  const order = gtowOrder(labels), colors = gtowColors(labels);
  const mixbar = d.mix.length ? `<div class="mixbar">${order.map((ai) => { const [l, f] = d.mix[ai]; return f > 0 ? `<span style="width:${f}%;background:${colors[ai]};opacity:${l === d.pick ? 1 : .55}" title="${esc(l)} ${f}%">${f >= 8 ? `${esc(l)} ${Math.round(f)}%` : ""}</span>` : ""; }).join("")}</div>` : "";
  const v = VERDICT[d.pv] || null;
  const scripted = d.tk ? actionText({ type: d.tk[0], amount: d.tk[1] }, replayState(H, STEP)) : null;
  const scriptKind = d.tk ? ({ fold: "fold", check: "call", call: "call", bet: "raise", raise: "raise", "all-in": "allin" }[d.tk[0]] ?? "raise") : null;
  const pickKind = d.pick ? actKind(d.pick) : null;
  const differs = scripted && pickKind && !(pickKind === scriptKind || (pickKind === "allin" && scriptKind === "raise") || (pickKind === "raise" && scriptKind === "allin"));
  const failing =(d.cf || []).map((c) => `<div><span class="chip ${c.s === "fail" ? "crit" : "warn"}">#${c.id} ${esc(c.s)}</span> <span class="sub">${esc(c.st)}</span> ${esc(c.t)}</div>`).join("");
  host.innerHTML = `<div class="nv-head"><h2 style="margin:0">Our answer</h2><span class="chip ${GRADE[gk][0]}">${GRADE[gk][1]}</span>${v ? `<span class="chip ${v[0]}">path: ${esc(v[1])}</span>` : ""}<span class="sub">${esc(d.st)} · ${d.ms != null ? (d.ms / 1000).toFixed(1) + " s" : ""} · ${d.n ?? 0} GTO Wizard requests</span></div>
    ${d.pick ? `<div class="ans-pick ${kind === "fold" ? "fold" : kind === "call" ? "call" : "raise"}">${esc(d.pick)}</div>` : d.why ? `<div class="ans-pick none">No answer</div>` : `<div class="ans-pick none">No action</div>`}
    ${mixbar}
    ${(() => { const r = rollOf(d); if (!r) return ""; const b = `${r.band[0].toFixed(1)}–${r.band[1].toFixed(1)}`;
      return `<div class="roll-line">${r.exact ? `rolled <b class="num">${r.roll.toFixed(1)}</b> → ${esc(d.pick)} (its band ${b} of 0–100)` : `${esc(d.pick)} = any roll in <b class="num">${b}</b> of 0–100 <span class="sub">(this run did not record the exact roll)</span>`}</div>`; })()}
    <div class="kv" style="margin-top:8px">${scripted ? `<b>the script plays</b><span>hero ${esc(scripted)} <span class="sub">(fixed by the hand's script — not rolled)</span>${differs ? ` <span class="chip warn" title="every hand follows its fixed script so the later streets can be tested; our pick is graded at this node only">our pick differs — the hand plays on as scripted</span>` : ""}</span>` : ""}
      <b>answered by</b><span>${esc(d.src || "—")}${d.tier ? ` · ${esc(d.tier)}` : ""}</span>
      ${d.chart ? `<b>chart / tree</b><span class="mono">${esc(d.chart)}</span>` : ""}${(d.tags || []).length ? `<b>trees solved</b><span class="mono sub">${d.tags.map(esc).join(" | ")}</span>` : ""}${d.line ? `<b>line</b><span class="mono">${esc(d.line)}</span>` : ""}
      ${(d.fl || []).length ? `<b>flags</b><span class="chips">${d.fl.map((f) => `<span class="chip ${chipClass(f) === "dim" ? "warn" : chipClass(f)}" title="${esc(FLAG_INFO[f] || "")}">${esc(f)}</span>`).join("")}</span>` : ""}
      ${(d.k || []).length ? `<b>approximations</b><span class="chips">${d.k.map((k) => `<span class="chip dim">${esc(k)}</span>`).join("")}</span>` : ""}
      ${(d.dep || []).length ? `<b>departs from GTO</b><span class="chips">${d.dep.map(([id, kind, badge]) => `<span class="chip ${kind === "pool-overlay" ? "warn" : kind === "policy-experiment" ? "" : "dim"}" title="${esc(kind)} — register entry ${esc(id)} (services/approximations.ts)">${esc(badge)}</span>`).join("")}</span>` : ""}
      ${(d.pcodes || []).length ? `<b>path codes</b><span class="mono sub">${d.pcodes.map(esc).join(" · ")}</span>` : ""}
      ${d.mp ? `<b>mis-press</b><span>${esc(d.mp)}</span>` : ""}
      ${(d.lint || []).length ? `<b>poker sense</b><span>${d.lint.map((t) => { const [f, ...r] = t.split(": "); return `<div><span class="chip ${chipClass(f)}" title="${esc(FLAG_INFO[f] || "")}">${esc(f)}</span> ${esc(r.join(": "))}</div>`; }).join("")}</span>` : ""}
      ${(d.pl || []).length ? `<b>each tree said</b><span>${(() => { const sk = d.pick ? kindOf(d.pick) : null; return d.pl.map(([src, mix, k]) => `<div><span class="mono sub">${esc(String(src).replace(/^tree /, ""))}</span> — ${mix.filter((m) => m[1] >= 1).sort((a, b) => b[1] - a[1]).map(([a, p]) => `${esc(a)} <b>${p.toFixed(0)}%</b>`).join(" · ")}${sk && k === sk ? ` <span class="chip good" title="the served pick's kind">= served</span>` : ""}</div>`).join(""); })()}<span class="sub">hero's exact combo in each tree this answer blends; the served pick ${esc(d.pick || "—")} came from the blend</span></span>` : ""}
      ${(d.thin || []).length ? `<b>thin ranges</b><span>${d.thin.map((t) => `<span class="chip crit">${esc(t)} combos</span>`).join(" ")} <span class="sub">a seat of the tree held under 1.5 combos at this node</span></span>` : ""}</div>
    ${d.why ? `<h2 style="margin-top:12px">Why there is no answer</h2><div class="warn-text">${esc(d.why)}</div>` : ""}
    ${d.w ? `<h2 style="margin-top:12px">The answer's note</h2><div class="warn-text">${esc(d.w)}</div>` : ""}
    ${failing ? `<h2 style="margin-top:12px">Checks failed or flagged</h2><div class="checks">${failing}</div>` : ""}`;
}

// ---- filters ----
$("q").addEventListener("input", (e) => { FILTER.q = e.target.value.trim(); if (VIEW.list) renderList(); });
$("fam").addEventListener("change", (e) => { FILTER.fam = e.target.value; renderList(); });
$("flag").addEventListener("change", (e) => { FILTER.flag = e.target.value; renderList(); });
$("gradeSeg").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; FILTER.g = b.dataset.g; for (const x of $("gradeSeg").querySelectorAll("button")) x.classList.toggle("on", x === b); renderList(); });
document.addEventListener("keydown", (e) => { if (VIEW.list || !H || /INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName || "")) return; if (e.key === "ArrowRight") setStep(STEP + 1); else if (e.key === "ArrowLeft") setStep(STEP - 1); });
window.addEventListener("hashchange", () => { const id = location.hash.slice(1); if (id && INDEX.hands.some((h) => h.id === id)) openHand(id); else if (!id && !VIEW.list) renderList(); });

(async function boot() {
  try { INDEX = await loadIndex(); }
  catch (e) { $("main").innerHTML = `<div class="card">The run's data could not be loaded (${esc(e.message)}).</div>`; return; }
  $("hdr-sub").textContent = `${INDEX.totals.hands} of ${INDEX.planned} hands · ${INDEX.totals.decisions} decisions`;
  const fams = [...new Set(INDEX.hands.map((h) => h.fam))];
  for (const f of fams) $("fam").add(new Option(`${f} (${INDEX.hands.filter((h) => h.fam === f).length})`, f));
  const flags = Object.keys(INDEX.totals.flags).concat(Object.keys(INDEX.totals.kinds)).sort();
  for (const f of flags) $("flag").add(new Option(f, f));
  const id = location.hash.slice(1);
  if (id && INDEX.hands.some((h) => h.id === id)) openHand(id); else renderList();
})();
</script>
